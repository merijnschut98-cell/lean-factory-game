# Installs a pinned Godot (and optionally the export templates CI needs),
# cached per version, and puts `godot` on PATH. Used by every CI job.
name: Setup Godot
description: Cached Godot binary (+ Windows/Linux/web export templates)
inputs:
  version:
    description: Godot version, e.g. 4.7.2
    required: true
  templates:
    description: Also install the export templates
    default: "false"
runs:
  using: composite
  steps:
    - name: Cache Godot
      id: cache
      uses: actions/cache@v4
      with:
        path: |
          ~/godot
          ~/.local/share/godot/export_templates
        key: godot-${{ inputs.version }}-templates-${{ inputs.templates }}
    - name: Download Godot
      if: steps.cache.outputs.cache-hit != 'true'
      shell: bash
      env:
        VERSION: ${{ inputs.version }}
        TEMPLATES: ${{ inputs.templates }}
      run: |
        base="https://github.com/godotengine/godot/releases/download/${VERSION}-stable"
        mkdir -p ~/godot && cd ~/godot
        curl -sSLo godot.zip "$base/Godot_v${VERSION}-stable_linux.x86_64.zip"
        unzip -q godot.zip && rm godot.zip && mv "Godot_v${VERSION}-stable_linux.x86_64" godot
        if [ "$TEMPLATES" = "true" ]; then
          dest=~/.local/share/godot/export_templates/${VERSION}.stable
          mkdir -p "$dest"
          curl -sSLo templates.tpz "$base/Godot_v${VERSION}-stable_export_templates.tpz"
          # Only what our presets use (the full archive is ~1.3 GB).
          unzip -qj templates.tpz templates/version.txt templates/linux_release.x86_64 \
            templates/windows_release_x86_64.exe templates/web_nothreads_release.zip -d "$dest"
          rm templates.tpz
        fi
    - name: Put Godot on PATH
      shell: bash
      run: echo "$HOME/godot" >> "$GITHUB_PATH"
