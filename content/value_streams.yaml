# People pools, stock and value streams of region Zuidmark (Campus Nova).
# Game text (name fields) is Dutch; keys and ids are English.
# Built into game/data/value_streams.json by tools/build_content.py.
#
# Schedules are lists of blocks {days, from, to}: days is a day or a range
# (mon-fri, sat-sun, mon-sun); times are quoted "HH:MM" strings on the
# 10-minute grid (unquoted YAML reads 15:30 as the number 930); "24:00" ends a
# day. A shift through midnight is two blocks.
#
# Units: hours of touch time per order, days for external waits (calendar
# days), arrivals per week spread evenly over their blocks.
#
# Streams: `priority` decides who goes first when streams share people;
# `preempts: true` (outages only) also interrupts lower-priority work in
# progress. Work still in progress at the end of a shift is handed over: it
# goes back to the front of its queue for the next shift.
#
# Levers (optional; countermeasures can also switch them through effects):
#   pool `reserve: {stream, people}`  people held for one stream (outage reserve)
#   work step `interrupt_to` (+ `interrupt_wait_days`)  where an order goes when
#             urgent work interrupts it; without it the order simply resumes
#   work step `stale_after_days` + `stale_to` (+ `stale_wait_days`)  a dossier
#             that waited longer in the queue is out of date when work would
#             start and goes back to an earlier step: what waiting costs
#   stream `wip_limit`  at most this many started orders (CONWIP); new ones
#             wait, not yet started
#   wait step `batch_days`  requests go out in batches (e.g. weekly)
#   wait step `starts_with: <earlier step>`  the wait runs in parallel from there
#
# Step kinds:
#   work      people from `pool` spend `touch_hours`; `pool` may list several
#             pools (the monteurs by day, the on-call crew at night); `ftr` =
#             first-time-right chance; on failure the order returns to
#             `rework_to` (default: the same step), after `rework_wait_days`
#             if given (e.g. waiting for the customer to supply missing details)
#   wait      an external delay of `days` (± `spread` fraction); nobody at
#             Voltana works on it, it can only be managed
#   material  takes `quantity` of `item` from stock; waits if out of stock.
#             Put it before the step rework returns to, or rework takes twice.
# Any step may have `applies` (0–1): the share of orders that need it.
#
# A reasonably healthy base (Merijn, 2026-10-12): no team above ~85% load, so
# the flow is stable. Today's constraints come from the starting problems in
# content/problems_tier*.yaml, switched on as effects (e.g. custom_design
# puts Werkvoorbereiding at ~110%). The monteurs (the obvious suspect) sit
# at about 70%.

pools:
  - id: intake
    name: Intake & aanvraagbeheer
    headcount: 3
    availability: 0.85
    schedule: [{days: mon-fri, from: "07:30", to: "15:30"}]
  - id: grid_analysts
    name: Netstudies
    headcount: 2
    availability: 0.85
    schedule: [{days: mon-fri, from: "08:00", to: "16:00"}]
  - id: work_prep
    name: Werkvoorbereiding
    headcount: 4
    availability: 0.85
    schedule: [{days: mon-fri, from: "07:30", to: "15:30"}]
  - id: planners
    name: Planning
    headcount: 2
    availability: 0.9
    schedule: [{days: mon-fri, from: "07:30", to: "15:30"}]
  - id: monteurs
    name: Monteurs
    headcount: 13           # ~67% busy: the technician shortage leaves little slack
    availability: 0.85
    schedule: [{days: mon-fri, from: "07:00", to: "15:00"}]
  - id: on_call
    name: Storingsdienst (consignatie)
    headcount: 2
    availability: 1.0       # rostered: a sick colleague is replaced
    schedule:
      - {days: mon-fri, from: "00:00", to: "07:00"}
      - {days: mon-fri, from: "15:00", to: "24:00"}
      - {days: sat-sun, from: "00:00", to: "24:00"}
  - id: control_room
    name: Bedrijfsvoeringscentrum
    headcount: 2
    availability: 1.0       # only their outage handling is modelled, not monitoring and switching
    schedule: [{days: mon-sun, from: "00:00", to: "24:00"}]
  - id: gis
    name: Revisie & GIS
    headcount: 2
    availability: 0.85
    schedule: [{days: mon-fri, from: "08:00", to: "16:00"}]
  - id: meter_office
    name: Meetdata & registratie
    headcount: 1
    availability: 0.85
    schedule: [{days: mon-fri, from: "08:00", to: "16:00"}]
  - id: contact_centre
    name: Klantcontactcentrum
    headcount: 4            # ~77% actually busy in the healthy base, so failure demand shows
    availability: 0.85
    schedule: [{days: mon-fri, from: "08:00", to: "17:00"}]
  - id: key_accounts
    name: Grootzakelijke klanten
    headcount: 1
    availability: 0.85
    schedule: [{days: mon-fri, from: "08:00", to: "16:00"}]

stock:
  - id: connection_kit
    name: Aansluitset (kabel, mof, aansluitkast)
    level: 120
    reorder_point: 95       # up to 12 working days in the 15-day lead time × 6 a day ≈ 72, plus ~2.5 sigma
    order_quantity: 120
    lead_days: 15
  - id: cable_joint
    name: Storingsmof (kabelverbinding)
    level: 50
    reorder_point: 25       # ~13 used in the lead time (9 a week) plus ~2.5 sigma safety
    order_quantity: 50
    lead_days: 10
  - id: smart_meter
    name: Slimme meter
    level: 200
    reorder_point: 95       # up to 9 working days in the 10-day lead time × 8 a day ≈ 72, plus ~2.5 sigma
    order_quantity: 200
    lead_days: 10

streams:
  - id: connections
    name: Nieuwe aansluitingen
    arrivals: [{per_week: 30, days: mon-fri, from: "08:00", to: "17:00"}]
    # Voltana's own promise for a standard connection: six weeks, well inside
    # the former legal term of 18 weeks (126 days). Claude's call while Merijn
    # reviews; the healthy base makes about 90% of it.
    norm_days: 42
    priority: 2
    # Failure demand: after three weeks without news, customers call to ask
    # where their connection stands.
    status_calls: {to: customer_contact, after_days: 21, per_week: 1.0}
    steps:
      - id: intake
        name: Aanvraag & intake
        kind: work
        pool: intake
        touch_hours: 1.0
        ftr: 0.75
        rework_wait_days: 5   # asking the customer for missing details
      - id: grid_study
        name: Netstudie
        kind: work
        pool: grid_analysts
        touch_hours: 4.0
        ftr: 0.95
        applies: 0.25         # only requests near the capacity limit
      - id: quote
        name: Offerte
        kind: work
        pool: intake
        touch_hours: 1.5
        ftr: 0.95
      - id: customer_signs
        name: Akkoord klant
        kind: wait
        days: 10
        spread: 0.6
      - id: design
        name: Werkvoorbereiding & ontwerp
        kind: work
        pool: work_prep
        touch_hours: 3.2      # healthy base; the custom_design problem makes it 4.2
        ftr: 0.85
        stale_after_days: 60  # quote and grid data out of date: re-quote, the customer signs again
        stale_to: quote
      - id: permit
        name: Vergunning & KLIC
        kind: wait
        days: 15
        spread: 0.5
        applies: 0.6          # digging in public space
      - id: materials
        name: Materiaal reserveren
        kind: material
        item: connection_kit
        quantity: 1
      - id: planning
        name: Planning
        kind: work
        pool: planners
        touch_hours: 0.5
        ftr: 1.0
      - id: execution
        name: Uitvoering
        kind: work
        pool: monteurs
        touch_hours: 5.0      # including travel
        ftr: 0.85
        fail_hours: 1.5       # a wasted trip: drive there, find the meterkast not ready, drive back
        rework_to: planning   # meterkast niet gereed: replan after the installer is ready
        rework_wait_days: 5
        interrupt_to: planning  # pulled away to an outage: the job needs a new appointment
        interrupt_wait_days: 2
      - id: commissioning
        name: Inbedrijfname & meter
        kind: work
        pool: monteurs
        touch_hours: 1.5
        ftr: 0.95
      - id: revision
        name: Revisie & administratie
        kind: work
        pool: gis
        touch_hours: 1.6
        ftr: 0.95
      - id: close_out_wait
        name: Wachten op administratieve verwerking
        kind: wait
        days: 1
        spread: 0.5
      - id: close_out
        name: Administratieve afhandeling (EAN aanmelden)
        kind: work
        pool: meter_office
        touch_hours: 0.25
        ftr: 0.95

  - id: outages
    name: Storingen
    arrivals:
      - {id: daytime, per_week: 10, days: mon-fri, from: "07:00", to: "17:00"}  # incl. graafschade during working hours
      - {id: around_the_clock, per_week: 8, days: mon-sun, from: "00:00", to: "24:00"}
    norm_hours: 4           # compensation is due for outages longer than 4 hours
    priority: 3
    preempts: true          # a monteur leaves planned work for an outage
    steps:
      - id: report
        name: Melding & schakelen
        kind: work
        pool: control_room
        touch_hours: 0.25
        ftr: 1.0
      - id: joint
        name: Storingsmof meenemen
        kind: material
        item: cable_joint
        quantity: 1
        applies: 0.5          # cable faults (known from the report); the rest are fuses, connections, switchgear
      - id: locate
        name: Uitrukken & lokaliseren
        kind: work
        pool: [monteurs, on_call]
        touch_hours: 1.0      # including travel
        ftr: 0.9              # wrong section: search again
      - id: repair
        name: Herstellen
        kind: work
        pool: [monteurs, on_call]
        touch_hours: 1.5
        ftr: 0.95
        rework_to: locate     # a second fault further along the cable

  - id: meters
    name: Veldservice & slimme meters
    arrivals: [{per_week: 40, days: mon-fri, from: "08:00", to: "17:00"}]
    norm_days: 21           # internal service norm
    priority: 2
    steps:
      - id: reserve_meter
        name: Meter reserveren
        kind: material
        item: smart_meter
        quantity: 1
      - id: appointment
        name: Afspraak plannen
        kind: work
        pool: planners
        touch_hours: 0.25
        ftr: 1.0
      - id: customer_window
        name: Wachten op afspraak
        kind: wait
        days: 7
        spread: 0.5
      - id: visit
        name: Bezoek & meterwissel
        kind: work
        pool: monteurs
        touch_hours: 1.5      # including travel
        ftr: 0.8              # niet thuis or meterkast unreachable
        fail_hours: 0.5       # the trip and a card through the door
        rework_to: appointment
        rework_wait_days: 2
      - id: registration
        name: Registratie meter & EAN
        kind: work
        pool: meter_office
        touch_hours: 0.25
        ftr: 0.9              # a meter that sends no data
        rework_to: appointment  # a silent meter needs a new visit
        rework_wait_days: 2

  - id: congestion
    name: Congestiemanagement
    arrivals: [{per_week: 4, days: mon-fri, from: "08:00", to: "17:00"}]
    norm_days: 126          # indicative: large-consumer requests follow the same 18-week idea
    priority: 1
    steps:
      - id: intake
        name: Aanvraag transportcapaciteit
        kind: work
        pool: key_accounts
        touch_hours: 1.0
        ftr: 0.7              # missing load profile or EAN details
        rework_wait_days: 10
      - id: congestion_study
        name: Congestieonderzoek
        kind: work
        pool: grid_analysts   # shared with the connections grid studies
        touch_hours: 6.0
        ftr: 0.9
      - id: capacity_queue
        name: Wachtrij netcapaciteit
        kind: wait
        days: 90
        spread: 0.8
        applies: 0.7          # the rest fits on the grid straight away
      - id: offer
        name: Aanbod (vast, non-firm of tijdsduurgebonden)
        kind: work
        pool: key_accounts
        touch_hours: 2.0
        ftr: 0.9
      - id: customer_signs
        name: Akkoord klant
        kind: wait
        days: 20
        spread: 0.5
      - id: register
        name: Capaciteit registreren
        kind: work
        pool: key_accounts
        touch_hours: 0.5
        ftr: 1.0

  - id: customer_contact
    name: Klantvragen
    # Value demand: questions about connections, meters, bills and outages.
    # Status calls from late orders (failure demand) come on top.
    arrivals: [{per_week: 380, days: mon-fri, from: "08:00", to: "17:00"}]
    norm_hours: 2           # answered within two hours
    priority: 1
    steps:
      - id: answer
        name: Vraag beantwoorden
        kind: work
        pool: contact_centre
        touch_hours: 0.25
        ftr: 0.9              # unclear answer: the customer calls back
