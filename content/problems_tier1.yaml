# Tier-1 problems of region Zuidmark (GDD, Problem catalogue v1).
# Game text is Dutch; ids and keys are English. Built by tools/build_content.py.
#
# step            where the problem shows ("stream.step"): the gemba place to spot it
# effects         what it does to the simulation while it is active
#                 (property → see game/src/sim/modifiers.gd)
# countermeasures countermeasure id → fit (0–1): several can help, some more
#                 than others; each shapes the process in its own way
# clues           tool, depth (the 5 Whys as an investigation: depth n shows
#                 once a key clue at depth n − 1 is found), key (points at the
#                 real cause) or not (a red herring: true, but not causal),
#                 at (a place upstream or downstream; default: step)
# kpi             what a good prediction names (wip_age: the age of open work,
#                 for problems whose harm hides in orders that have not finished)
# plausible_causes  wrong but believable causes for the A3's cause bank
# tells           what a prop on the floor shows of it (PLAN 2.6): {tell, text}; tell is
#                 a node in the floor's model (build_content.TELLS), text what anyone can
#                 see there. Ambiguous on purpose: a tall stack can be a normal week, and
#                 a text never names the problem. Every problem whose place is on a floor
#                 with tells (the 1e, the 2e, the yard) lists at least one on that floor
#                 (checked).
#
# Quote clue texts: inside {…} an unquoted comma ends the text (the build refuses it).

problems:
  - id: incomplete_application
    tier: 1
    name: De onvolledige aanvraag
    step: connections.intake
    waste: defects
    severity: medium
    visibility: obvious
    # Less rework gives the intake team back time (capacity, the same on every
    # seed). First time right over finished orders lags: a returned
    # application finishes weeks later, so a fresh problem's Check shows it
    # on some seeds only (probe 2026-10-15: −1 to +43 %); lead time hardly
    # moves, since most of it is waiting further down the stream.
    kpi: capacity
    symptoms:
      - Veel aanvragen gaan terug naar de klant met een verzoek om aanvulling.
      - Klanten bellen na weken om te vragen waar hun aansluiting blijft.
    root_cause: Het webformulier accepteert aanvragen zonder vermogen, installateur en meterkastgegevens; niemand voorkomt de fout aan de bron.
    plausible_causes:
      - Klanten lezen de instructies niet.
      - De intakemedewerkers controleren niet zorgvuldig genoeg.
    mismatch_note: Sneller of strenger controleren verandert niets aan wat er binnenkomt. De fout ontstaat in het formulier.
    countermeasures: {poka_yoke_application: 1.0, intake_checklist: 0.7}
    teaches: [quality_at_the_source, poka_yoke]
    # Nine in twenty applications come back (the clues): ftr 0.75 -> 0.55. Each return also
    # costs the chase: the request for completion, the calls with the customer and the
    # installer, logging it. ESTIMATE: about 40 minutes a return, x1.3 on every intake visit.
    # With it the intake clearly fails demand (gate backlog 3, 2026-10-24: with the ftr alone
    # it ran at 1.03, so the fix's flow gain hid in the seed noise): about 26 a week against
    # 30 arriving (Capacity), 35 once fixed. Fixing the monteurs' problem moves none of it.
    effects:
      - {target: connections.intake, property: ftr, value: -0.2}
      - {target: connections.intake, property: touch_time, value: 1.3}
    tells:
      - {tell: intake_stack, text: "Op de kast bij Intake ligt meer dan een dag werk aan dossiers."}
    clues:
      - {tool: documents, key: true, depth: 0, text: "Van de laatste twintig aanvragen missen er negen het aansluitvermogen of de gegevens van de installateur."}
      - {tool: queue_count, key: false, depth: 0, text: "De wachtrij bij Intake is lang, maar hij staat netjes op datum: wie vrij is, pakt de oudste aanvraag."}
      - {tool: data, key: true, depth: 1, text: "Bijna de helft van de aanvragen gaat terug naar de klant voor aanvulling; die wachten gemiddeld een week."}
      - {tool: conversation, key: true, depth: 1, text: "'Het webformulier laat je gewoon doorklikken zonder vermogen of meterkastfoto. Wij zien het pas als we het dossier openen.'"}
      - {tool: listen_in, key: true, depth: 2, text: "Een klant aan de telefoon: 'Ik wist niet dat ik dat moest invullen, het formulier vroeg er niet om.'"}

  - id: installer_not_ready
    tier: 1
    name: Meterkast niet gereed
    step: connections.execution
    waste: waiting
    severity: high
    visibility: subtle
    # A wasted trip is a job not done right the first time: two in five addresses send the
    # job back to planning (first time right falls by a third). Lead time hardly moves, since
    # the median order is not one of them (gate backlog 4, 2026-10-24: the best fix gained
    # +0.1 to +1.4 % lead time on some seeds, inside the Check's 2 % noise).
    kpi: first_time_right
    symptoms:
      - Monteurs rijden terug zonder dat de aansluiting is gemaakt.
      - Klussen worden steeds opnieuw ingepland.
    root_cause: Klussen worden ingepland zonder te controleren of de installateur en de meterkast klaar zijn.
    plausible_causes:
      - De monteurs zijn te laat op locatie.
      - Klanten zeggen hun afspraak af.
    mismatch_note: De monteur doet zijn werk goed; het probleem ontstaat bij het plannen, voordat hij rijdt.
    countermeasures: {readiness_check: 1.0, installer_photo_upload: 0.9, backup_job_per_day: 0.6}
    teaches: [readiness_check, quality_at_the_source]
    effects:
      - {target: connections.execution, property: ftr, value: -0.25}  # 2 of 5 addresses not ready
    tells:
      - {tell: planning_board, text: "Op het weekbord bij de planners hangen rode kaartjes: klussen die verzet zijn."}
      - {tell: van_returns, text: "Op de retourpallet staan aansluitsets die nog in hun folie zitten."}
    clues:
      - {tool: shadow, key: true, depth: 0, text: "Op twee van de vijf adressen is de meterkast niet klaar (geen ruimte, geen aarding, de installateur is nog niet geweest). De monteur rijdt onverrichter zake terug."}
      - {tool: time_study, key: false, depth: 0, text: "Een aansluiting maken kost de monteur ruim vier uur, binnen de norm."}
      - {tool: data, key: true, depth: 1, text: "Van de herplande klussen heeft zeventig procent als reden 'meterkast niet gereed'."}
      - {tool: documents, key: true, depth: 1, at: connections.planning, text: "Planning plant op de datum van het offerte-akkoord. Nergens staat of de installateur klaar is."}
      - {tool: conversation, key: true, depth: 2, at: connections.planning, text: "'We bellen de klant nooit vooraf. We weten pas dat het niet klaar is als de monteur er staat.'"}

  - id: wrong_joint_in_van
    tier: 1
    name: De verkeerde mof in de bus
    step: outages.repair
    waste: transport
    severity: medium
    visibility: subtle
    kpi: on_time
    symptoms:
      - Storingen duren soms ruim langer dan vier uur.
      - Monteurs rijden tijdens een storing naar het magazijn.
    root_cause: Er is geen standaard busvoorraad en geen aanvulsignaal; wat op is, merkt de monteur pas bij de storing.
    plausible_causes:
      - De monteurs pakken de verkeerde mof mee.
      - Het magazijn levert te laat.
    mismatch_note: Het magazijn heeft de moffen wel; ze liggen alleen niet in de bus op het moment dat het nodig is.
    # Act 0/I audit (2026-10-24): the standard stock is refilled at the end of every shift
    # (its description), so it removes most of the cause; only the signal still leans on a
    # routine, which the kanban (tier 3, offered from maturity 2) builds in. At 0.8 every fix
    # Act I offers was a poor fix and even the expert got a repair quest.
    countermeasures: {van_refill_card: 0.65, standard_van_stock: 0.85, two_bin_van_kanban: 1.0}
    teaches: [5s, kanban, standard_work]
    # The waste is mostly the drive back for the right joint (QA 2026-10-24: a touch time
    # x 1.5 alone hid it from the storingsbord). A quarter of the outages takes the trip
    # (the data clue: 'materiaal halen' in a quarter of the logs), each an hour of the
    # monteur while the customer waits (outages.repair trip_hours, an estimate). The rest
    # is motion: no two vans are stocked alike, so every repair starts with a search.
    # ESTIMATE: about 15 minutes of a 1.5-hour repair, x 1.15.
    effects:
      - {target: outages.repair, property: trip_share, value: 0.25}
      - {target: outages.repair, property: touch_time, value: 1.15}
    # Each trip signs a second joint out at the counter and marks the board (Network.
    # material_trips_since): the uitgiftelijst and the storingsbord read it (OfficeTells.THRESHOLDS,
    # probe 2026-10-24). The tell is what anyone at the counter sees (a bus back for material the
    # same day), never the missing standard stock.
    tells:
      - {tell: uitgiftelijst, text: "Op de uitgiftelijst bij de balie staat dezelfde storingsbus soms twee keer op één dag, met een paar uur ertussen."}
      - {tell: storingsbord, text: "Op het storingsbord staat bij een paar kabelstoringen een hersteltijd van ruim vier uur."}
    clues:
      - {tool: shadow, key: true, depth: 0, text: "Bij een kabelstoring ligt de juiste mof niet in de bus. De monteur rijdt veertig minuten heen en terug naar het magazijn."}
      - {tool: time_study, key: false, depth: 0, at: outages.locate, text: "Het lokaliseren van de fout duurt steeds rond het uur."}
      - {tool: material_check, key: true, depth: 1, text: "Geen twee bussen hebben dezelfde voorraad. Er is geen lijst van wat erin hoort."}
      - {tool: data, key: true, depth: 1, text: "In een kwart van de storingslogboeken staat 'materiaal halen'."}
      - {tool: conversation, key: true, depth: 2, text: "'Wat op is, vul ik aan als ik toevallig langs het magazijn kom. Niemand houdt bij wat eruit gaat.'"}

  - id: custom_design
    tier: 1
    name: Maatwerk voor standaardwerk
    step: connections.design
    waste: overprocessing
    severity: high
    visibility: obvious
    kpi: throughput
    symptoms:
      - De stapel ontwerpen bij Werkvoorbereiding groeit elke week.
      - Werkvoorbereiders maken overuren, en toch duurt een aansluiting langer.
    root_cause: Standaardaansluitingen krijgen een volledig maatwerkontwerp met drie goedkeuringen.
    plausible_causes:
      - De werkvoorbereiders werken te langzaam.
      - De ontwerpsoftware is verouderd.
    mismatch_note: Harder werken of betere software verandert niets aan de hoeveelheid werk per standaardaansluiting.
    countermeasures: {standard_designs: 1.0, delegated_approval: 0.65}
    teaches: [standard_work, waste_overprocessing]
    effects:
      - {target: connections.design, property: touch_time, value: 1.3}
    tells:
      - {tell: prep_tray, text: "In het postbakje bij Werkvoorbereiding liggen de dossiers hoger dan het bakje."}
    clues:
      - {tool: time_study, key: true, depth: 0, text: "Een gewone woningaansluiting kost vijf uur ontwerp, net zoveel als een bedrijfsaansluiting."}
      - {tool: queue_count, key: false, depth: 0, text: "In de bak liggen meer dan honderd dossiers te wachten."}
      - {tool: documents, key: true, depth: 1, text: "Elk ontwerp, ook een standaard huisaansluiting, gaat langs drie handtekeningen."}
      - {tool: conversation, key: true, depth: 1, at: connections.intake, text: "'Wij vragen nooit of het een standaardaansluiting is. Alles gaat als maatwerk door.'"}
      - {tool: data, key: true, depth: 2, text: "Driekwart van de ontwerpen is een standaard 3x25A-aansluiting zonder netuitbreiding."}

  - id: not_at_home
    tier: 1
    name: Niet thuis
    step: meters.visit
    waste: transport
    severity: medium
    visibility: obvious
    kpi: first_time_right
    symptoms:
      - Monteurs laten veel kaartjes 'helaas niet thuis' achter.
      - De planning van meterwissels loopt steeds verder uit.
    root_cause: Afspraken hebben een tijdvak van een hele dag en worden niet bevestigd of herinnerd.
    plausible_causes:
      - Klanten zijn onbetrouwbaar.
      - De monteurs komen te laat.
    mismatch_note: De klanten willen wel thuis zijn; ze weten niet wanneer.
    countermeasures: {appointment_reminder: 1.0, two_hour_window: 0.9}
    teaches: [failure_demand, customer_value]
    effects:
      - {target: meters.visit, property: ftr, value: -0.15}
    tells:
      - {tell: van_returns, text: "Op de retourpallet staan meterdozen die nog dicht zijn, elk met een afspraakbon eraan."}
    clues:
      - {tool: shadow, key: true, depth: 0, text: "Bij drie van de acht adressen doet niemand open. De monteur laat een kaartje achter."}
      - {tool: time_study, key: false, depth: 0, text: "Een meterwissel zelf duurt vijfendertig minuten, ruim binnen de planning."}
      - {tool: documents, key: true, depth: 1, at: meters.appointment, text: "Klanten krijgen een tijdvak van 8 tot 17 uur en geen bevestiging of herinnering."}
      - {tool: listen_in, key: true, depth: 1, at: meters.appointment, text: "'Ik heb een halve dag vrij genomen en er kwam niemand.' En: 'Ik wist niet dat het vandaag was.'"}
      - {tool: data, key: true, depth: 2, text: "Van de mislukte bezoeken had tachtig procent geen herinnering ontvangen."}

  - id: permits_in_batches
    tier: 1
    name: Vergunningen in batches
    step: connections.permit
    waste: waiting
    severity: medium
    visibility: subtle
    kpi: lead_time
    symptoms:
      - Dossiers liggen dagen stil tussen ontwerp en vergunning.
      - De doorlooptijd van aansluitingen is lang, terwijl de gemeente haar termijn haalt.
    root_cause: Vergunningen worden per project in één batch aangevraagd, pas als het laatste ontwerp van het project af is.
    plausible_causes:
      - De gemeente werkt te langzaam.
      - Het vergunningsportaal is te ingewikkeld.
    mismatch_note: De gemeente is niet het knelpunt; de aanvraag ligt al stil voordat zij hem krijgt.
    countermeasures: {request_permits_daily: 1.0, parallel_permits: 1.0}
    teaches: [batching, flow]
    effects:
      # Per project (Merijn, 2026-10-13): a street's connections go together once
      # the last design is done; about every two weeks (an estimate).
      - {target: connections.permit, property: batch_days, value: 14}
    tells:
      - {tell: prep_tray, text: "Bij Werkvoorbereiding ligt een stapel dossiers waarvan het ontwerp af lijkt."}
    clues:
      - {tool: data, key: true, depth: 0, text: "Vergunningsaanvragen gaan per project de deur uit. Een dossier dat klaar is, wacht gemiddeld een week op de rest van de straat."}
      - {tool: documents, key: false, depth: 0, text: "De gemeente haalt haar wettelijke termijn bijna altijd."}
      - {tool: conversation, key: true, depth: 1, at: connections.design, text: "'Ik vraag de vergunning aan als het hele project ontworpen is; dan hoeft de gemeente maar één tracé te beoordelen.'"}
      - {tool: documents, key: true, depth: 1, at: connections.design, text: "De vergunning wordt pas aangevraagd als het ontwerp helemaal af is, terwijl de gemeente alleen het tracé nodig heeft."}
      - {tool: time_study, key: true, depth: 2, at: connections.design, text: "Een aanvraag indienen kost tien minuten; het tracé is al na een uur ontwerpen bekend."}

  - id: revision_backlog
    tier: 1
    name: De revisieberg
    step: connections.revision
    waste: inventory
    severity: medium
    visibility: hidden
    # Audit L5 asked for wip_age, but revision comes before the close-out and
    # the stream's open-work age is set by the reinforcement waits (97 → 97
    # days). The daily template gives the GIS team back a fifth of its time
    # (+21 % capacity); throughput only follows once a backlog has built up
    # (probe 2026-10-15: −0 to +16 %).
    kpi: capacity
    symptoms:
      - Bij Revisie & GIS ligt een stapel schetsen van opgeleverde aansluitingen.
      - Aansluitingen zijn technisch klaar maar administratief nog niet af.
    root_cause: Wijzigingen worden na de klus op papier geschetst en weken later door een klein team overgetekend; het werk wordt dubbel gedaan.
    plausible_causes:
      - Het GIS-team is te klein.
      - De monteurs leveren hun schetsen te laat in.
    mismatch_note: Meer mensen bij GIS verwerken de stapel sneller, maar het overtekenen blijft dubbel werk.
    countermeasures: {revision_at_source: 1.0, daily_revision_template: 0.7}
    teaches: [waste_inventory, quality_at_the_source]
    effects:
      - {target: connections.revision, property: touch_time, value: 1.4}
      # Outdated KLIC maps: more cables hit. Estimate: ~60% of digging damage
      # comes from not knowing exactly what lies where (Bouwend Nederland); a
      # four-month backlog leaves a few percent of cables unmapped, mostly in
      # new-build streets where digging happens.
      - {target: outages.daytime, property: demand, value: 1.05}
    cost_per_week: 425  # ~0.5 extra damage a week x EUR 850
    tells:
      - {tell: revision_cabinet, text: "Op de kast bij Revisie & GIS liggen stapels schetsen; op de onderste staat een datum van maanden terug."}
    clues:
      - {tool: data, key: true, depth: 0, text: "Er staan 240 opgeleverde aansluitingen open in GIS; de oudste is vier maanden oud."}
      - {tool: queue_count, key: false, depth: 0, text: "De bak met schetsen is overzichtelijk geordend op datum."}
      - {tool: time_study, key: true, depth: 1, text: "Een schets overtekenen kost anderhalf uur, onder meer door uitzoeken wat er bedoeld is."}
      - {tool: documents, key: true, depth: 1, at: connections.commissioning, text: "De monteur schetst het as-built met de hand op een A4; foto's en maten ontbreken vaak."}
      - {tool: conversation, key: true, depth: 2, at: connections.commissioning, text: "'Ik teken het op de motorkap. Of ze het later kunnen lezen? Ze bellen me wel als het niet klopt.'"}

  - id: digging_damage
    tier: 1
    name: Graafschade
    step: outages.locate
    waste: defects
    severity: high
    visibility: obvious
    # Digging damage adds outages, not longer ones: outage lead time does not
    # move. Fewer damages give the monteurs back time (+6 % capacity, probe
    # 2026-10-15).
    kpi: capacity
    symptoms:
      - Overdag komen veel storingen binnen door kabelschade bij graafwerk.
      - Monteurs worden voor graafschade van gepland werk gehaald.
    root_cause: KLIC-kaarten zijn verouderd (de revisieberg) en proefsleuven worden onder tijdsdruk overgeslagen.
    plausible_causes:
      - Aannemers graven onvoorzichtig.
      - De KLIC-melding wordt niet gedaan.
    mismatch_note: Aannemers doen wel een KLIC-melding; de kaart die ze krijgen klopt niet en de planning laat geen tijd voor proefsleuven.
    countermeasures: {standard_test_trenches: 0.8, contractor_briefing: 0.7, revision_at_source: 0.6}
    teaches: [waste_defects, systems_thinking]
    effects:
      - {target: outages.daytime, property: demand, value: 1.5}  # a third of daytime outages
    # Repairs and claims: ~5 extra damages a week x ~EUR 850 direct repair cost
    # each (Wibon evaluation: EUR 38.8M a year over 46,799 damages, 2022).
    cost_per_week: 4250
    tells:
      - {tell: storingsbord, text: "Op het storingsbord staan overdag storingen achter elkaar, steeds met 'kabel geraakt' en de naam van een aannemer."}
      - {tell: magazijn_rack, text: "Op de stelling met moffen zijn de meeste vakken leeg; op de toonbank ligt een bestelbon voor nog een doos."}
    # "Zeven procent" (estimate): Wibon's 46,799 damages a year (2022) against several
    # hundred thousand KLIC-meldingen a year is a few to seven in a hundred digs; the
    # count of meldingen is Kadaster's, not on an approved domain, so not checked here.
    clues:
      - {tool: data, key: true, depth: 0, text: "Een derde van de storingen overdag is graafschade; zeven procent van de graafwerken raakt een kabel."}
      - {tool: shadow, key: false, depth: 0, text: "De monteurs herstellen graafschade snel en vakkundig."}
      - {tool: documents, key: true, depth: 1, text: "Bij de helft van de schades lag de kabel anders dan op de KLIC-kaart."}
      - {tool: conversation, key: true, depth: 1, text: "'Proefsleuven? Daar is in de planning van de aannemer nooit tijd voor.'"}
      - {tool: data, key: true, depth: 2, at: connections.revision, text: "De kabels die anders lagen dan op de kaart, zijn bijna allemaal nog niet gerevideerd."}

  - id: knowledge_drain
    tier: 1
    name: De laatste kennisdrager
    step: outages.locate
    waste: skills
    severity: high
    visibility: subtle
    kpi: on_time
    symptoms:
      - Storingen in oude wijken duren veel langer dan elders.
      - Bij lastige storingen wordt steeds dezelfde oudere monteur gebeld.
    root_cause: Kennis van oude kabeltypes en schakelingen zit bij een paar monteurs die met pensioen gaan; er is geen skills-matrix en geen overdracht.
    plausible_causes:
      - De jonge monteurs zijn onvoldoende opgeleid.
      - De meetapparatuur is verouderd.
    mismatch_note: Een opleiding alleen leert niet wat alleen in de hoofden van de ervaren monteurs zit.
    # Audit L10: documentation alone transfers less than practice under a master.
    countermeasures: {henks_one_point_lessons: 0.6, work_instruction_videos: 0.7, twi_job_instruction: 0.9, skills_matrix_buddy: 1.0}
    teaches: [waste_skills, respect_for_people]
    effects:
      - {target: outages.locate, property: ftr, value: -0.3}
    tells:
      - {tell: storingsbord, text: "Op het storingsbord staat bij de storingen in Nova-Oud vaak een tweede tijd, en daarachter in hoofdletters: HENK."}
    clues:
      - {tool: shadow, key: true, depth: 0, text: "Een jonge monteur zoekt anderhalf uur naar de fout in een oude papierloodkabel (GPLK) en belt dan een collega."}
      - {tool: time_study, key: false, depth: 0, text: "Het herstel zelf duurt bij iedereen ongeveer even lang."}
      - {tool: data, key: true, depth: 1, text: "Storingen in netten van voor 1970 worden twee keer zo vaak opnieuw gelokaliseerd."}
      - {tool: conversation, key: true, depth: 1, text: "'Als Henk het niet weet, weet niemand het. En Henk gaat over twee maanden met pensioen.'"}
      - {tool: documents, key: true, depth: 2, text: "Er is geen overzicht van wie welke kabeltypes en schakelingen beheerst."}

  - id: status_callers
    tier: 1
    name: De statusbellers
    step: customer_contact.answer
    waste: defects
    severity: high
    visibility: obvious
    kpi: on_time
    symptoms:
      - Het klantcontactcentrum is onbereikbaar; klanten hangen lang in de wacht.
      - Agents beantwoorden steeds dezelfde vraag.
    root_cause: Klanten horen na hun aanvraag niets meer over de voortgang, dus bellen ze; de vragen komen voort uit de wachttijd, niet uit het contactcentrum.
    plausible_causes:
      - Het contactcentrum heeft te weinig agents.
      - Klanten zijn ongeduldig.
    mismatch_note: Meer agents beantwoorden de vragen sneller, maar de vragen blijven komen. Dit is faalvraag.
    # Act 0/I audit (2026-10-24): the hand-made mail at the two moments most calls are about
    # (a week's tally, Pareto) takes away most of the failure demand; it is the patient first
    # step, not a poor fix (0.75 was one), and it fades sooner than the built-in messages.
    countermeasures: {realistic_promise: 0.7, milestone_mail_by_hand: 0.85, proactive_status_updates: 1.0}
    teaches: [failure_demand, value_demand]
    effects:
      - {target: connections, property: call_rate, value: 3.0}
    tells:
      - {tell: terugbelbord, text: "Het bord hangt vol terugbelbriefjes, in verschillende handschriften. Sommige namen hangen er twee of drie keer."}
    clues:
      - {tool: listen_in, key: true, depth: 0, text: "Van de tien gesprekken gaan er vier over één vraag: 'Waar blijft mijn aansluiting?'"}
      - {tool: time_study, key: false, depth: 0, text: "Een gesprek duurt gemiddeld vijftien minuten; de agents zijn vriendelijk en snel."}
      - {tool: data, key: true, depth: 1, text: "Statusvragen komen bijna allemaal van klanten die al meer dan twee maanden wachten; sommigen bellen elke week."}
      - {tool: documents, key: true, depth: 1, at: connections.intake, text: "Na de ontvangstbevestiging hoort de klant niets meer, tot de monteur belt voor een afspraak."}
      - {tool: conversation, key: true, depth: 2, at: connections.design, text: "'Wij weten zelf ook niet wanneer het klaar is. Er is geen planning die we met de klant kunnen delen.'"}

  - id: done_but_not_closed
    tier: 1
    name: Klaar maar niet af
    step: connections.close_out_wait
    waste: inventory
    severity: medium
    visibility: subtle
    kpi: lead_time
    symptoms:
      - Klanten met een nieuwe aansluiting kunnen nog geen energiecontract afsluiten.
      - Aansluitingen staan weken op 'technisch gereed, administratief open'.
    root_cause: De administratieve afhandeling gebeurt één keer per maand in een batch, en het aanmelden van de EAN gaat met de hand.
    plausible_causes:
      - De energieleverancier is traag.
      - Meetdata & registratie heeft te weinig mensen.
    mismatch_note: Het team heeft genoeg tijd; het werk wacht op de maandelijkse batch, niet op mensen.
    countermeasures: {close_out_at_completion: 1.0, automatic_ean_registration: 0.9, mid_month_run: 0.6}
    teaches: [batching, one_piece_flow]
    effects:
      - {target: connections.close_out_wait, property: batch_days, value: 28}
    tells:
      - {tell: close_out_cabinet, text: "Op en naast de kast bij de deur liggen dossiers met 'gereed gemeld' erop, de oudste van weken geleden."}
    clues:
      - {tool: data, key: true, depth: 0, text: "Aansluitingen die technisch klaar zijn, staan gemiddeld twee weken op 'administratief open'."}
      - {tool: queue_count, key: false, depth: 0, at: connections.close_out, text: "Bij Meetdata & registratie ligt weinig werk; het team heeft tijd over."}
      - {tool: documents, key: true, depth: 1, at: connections.close_out, text: "De afhandeling (EAN aanmelden, dossier sluiten) gebeurt één keer per maand, in één keer voor alle dossiers."}
      - {tool: listen_in, key: true, depth: 1, at: customer_contact.answer, text: "'Mijn aansluiting is vorige week aangelegd, maar de leverancier zegt dat mijn EAN niet bestaat.'"}
      - {tool: conversation, key: true, depth: 2, at: connections.close_out, text: "'We doen het maandelijks; dan hoef je maar één keer in te loggen in het registratiesysteem.'"}

  - id: grid_study_queue
    tier: 1
    name: De netstudie-wachtrij
    step: connections.grid_study
    waste: waiting
    severity: high
    visibility: subtle
    # The fast lane frees the grid analysts (+38 % capacity); throughput only
    # follows where demand waits for them (probe 2026-10-15: +0 to +13 %).
    kpi: capacity
    symptoms:
      - Op het bord van Netstrategie staan tientallen netstudies in de wachtrij.
      - Nieuwe aansluitingen wachten weken op een netstudie, omdat congestieonderzoeken voorgaan.
    root_cause: Elke aanvraag boven 3x25A krijgt een volledige netstudie, ook als de aansluiting ruim binnen de vrije capaciteit valt; er is geen triage vooraf.
    plausible_causes:
      - Er zijn te weinig netanalisten.
      - De rekensoftware is te traag.
    mismatch_note: Meer analisten werken de stapel sneller weg, maar een groot deel van de studies is niet nodig.
    countermeasures: {triage_fast_lane: 1.0, calculation_templates: 0.7, study_overtime_sprint: 0.6}
    teaches: [triage, theory_of_constraints, waste_overprocessing]
    effects:
      - {target: connections.grid_study, property: applies, value: 0.15}  # 40% of connections instead of 25%
    tells:
      - {tell: grid_study_tray, text: "Bovenop de stapel in het bakje ligt een studieaanvraag voor een gewone woning met een warmtepomp."}
    clues:
      - {tool: data, key: true, depth: 0, text: "Vier op de tien nieuwe aansluitingen krijgen een netstudie; vorig jaar was dat een kwart."}
      - {tool: shadow, key: false, depth: 0, text: "De analisten maken lange dagen en werken geconcentreerd; niemand zit stil."}
      - {tool: documents, key: true, depth: 1, text: "De werkinstructie zegt: netstudie bij elke aanvraag boven 3x25A. Een grens voor de vrije capaciteit in de wijk staat er niet in."}
      - {tool: conversation, key: true, depth: 1, text: "'Bij de meeste studies weten we na vijf minuten al dat het past. Maar de procedure is de procedure.'"}
      - {tool: time_study, key: true, depth: 2, text: "Een volledige netstudie kost vier uur; een snelle check op de vrije capaciteit van het station kost een kwartier."}

  - id: silent_meter
    tier: 1
    name: De zwijgende meter
    step: meters.registration
    waste: defects
    severity: medium
    visibility: subtle
    kpi: first_time_right
    symptoms:
      - Bij Meetdata & registratie komen nieuwe meters binnen die geen standen sturen.
      - Monteurs moeten terug naar adressen waar ze vorige week al een meter plaatsten.
