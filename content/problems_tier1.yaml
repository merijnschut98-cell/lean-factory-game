    countermeasures: {on_site_comm_test: 1.0, coverage_check_in_planning: 0.8}
    teaches: [jidoka, quality_at_the_source]
    effects:
      # ESTIMATE (audit L7): three in ten meters in concrete basement meter rooms
      # stay silent, one in twenty elsewhere; with about a quarter of new meters
      # in basements that is roughly one in nine overall.
      - {target: meters.registration, property: ftr, value: -0.1}
    tells:
      - {tell: meter_board, text: "Op het whiteboard bij Meetdata staan twee kolommen adressen, elk met een rood streepje erachter."}
    clues:
      - {tool: data, key: true, depth: 0, text: "In de nieuwe flats met een betonnen kelderberging stuurt drie op de tien nieuwe meters de eerste week geen standen; elders één op de twintig."}
      - {tool: queue_count, key: false, depth: 0, text: "Bij Meetdata & registratie ligt weinig werk; de lijst is kort en netjes op volgorde."}
      - {tool: shadow, key: true, depth: 1, at: meters.visit, text: "De monteur plaatst de meter, sluit de kast en rijdt door. Of de meter verbinding maakt, kijkt niemand na."}
      - {tool: documents, key: true, depth: 1, at: meters.appointment, text: "Bij het plannen gaat standaard een GPRS-module mee; de dekkingskaart van het adres wordt niet bekeken."}
      - {tool: conversation, key: true, depth: 2, at: meters.visit, text: "'Testen? Dan sta ik er tien minuten langer. Als hij niet werkt, hoor ik het vanzelf.'"}

  - id: inverters_tripping
    tier: 1
    name: Omvormers die afschakelen
    step: voltage_complaints.measurement
    waste: defects
    severity: medium
    visibility: obvious
    kpi: first_time_right
    # Five complaints a week, most of them in the sunny months: eight weeks hold too few to
    # read first time right (gate backlog 5, 2026-10-24: the best fix gained +0.8 to +17 %
    # over 12 probe runs, 2 of them inside the 2 % noise; +4 to +21 % over the longest
    # horizon). The fix's own standard measures a summer and a winter week, so the Check
    # measures the longest window it has (Region.check_window), not a sunny spell.
    measure_days: 263
    symptoms:
      - Het aantal spanningsklachten is in twee jaar verdrievoudigd, vooral op zonnige middagen.
      - Klanten melden dat hun omvormer uitvalt en hun zonnepanelen niets opleveren.
    root_cause: De aftakkingen van de wijktransformatoren staan nog zoals voor de zonnepanelen, en niemand kijkt naar de spanning in het laagspanningsnet. Elke klacht wordt los opgelost met een meting bij één adres.
    plausible_causes:
      - Goedkope omvormers zijn slecht afgesteld.
      - Klanten hebben te veel panelen voor hun aansluiting.
    mismatch_note: Elke klacht apart meten en oplossen bestrijdt het symptoom. De spanning is te hoog in de hele straat.
    countermeasures: {tap_trial_one_station: 0.6, tap_review_per_neighbourhood: 1.0, smart_meter_voltage_data: 0.8, targeted_reinforcement: 0.7}
    teaches: [root_cause, systems_thinking]
    effects:
      - {target: voltage_complaints, property: demand, value: 3.0}  # complaints tripled (Solar Magazine)
      # A tap set for one address does not hold for the street: three in ten
      # complaints come back after the change (an estimate).
      - {target: voltage_complaints.tap_change, property: ftr, value: -0.3}
    tells:
      - {tell: measurement_tray, text: "De spanningsklachten in het bakje zitten met een paperclip per adres bij elkaar, en op bijna elke klacht staat een tijd rond het middaguur."}
    clues:
      - {tool: data, key: true, depth: 0, text: "Negen van de tien spanningsklachten komen binnen tussen elf en drie uur, op zonnige dagen."}
      - {tool: conversation, key: false, depth: 0, text: "'Het zijn die goedkope omvormers. Met een goed merk heb je hier geen last van.'"}
      - {tool: shadow, key: true, depth: 1, text: "De meting bij het adres laat zien dat de spanning 's middags oploopt tot 254 volt. Boven 253 volt moet een omvormer afschakelen; dat is de norm."}
      - {tool: documents, key: true, depth: 1, at: voltage_complaints.tap_change, text: "De aftakking van de wijktrafo staat sinds 2009 op dezelfde stand. Inmiddels liggen er op de helft van de daken zonnepanelen."}
      - {tool: data, key: true, depth: 2, at: voltage_complaints.analysis, text: "De slimme meters in de straat registreren elk kwartier de spanning. Niemand bij Voltana kijkt ernaar."}

  - id: transformer_wait
    tier: 1
    name: Wachten op de trafo
    step: connections.grid_reinforcement
    waste: waiting
    severity: high
    visibility: subtle
    kpi: wip_age            # finished-order lead time hides the orders still waiting
    symptoms:
      - Aansluitingen in volle straten wachten een half jaar of langer op netverzwaring.
      - Het projectteam netverzwaring zegt dat de fabrikant niet op tijd levert.
    root_cause: Transformatoren worden per project besteld, pas als het ontwerp van de verzwaring is goedgekeurd. De levertijd van de fabrikant komt daardoor na het ontwerp in plaats van ernaast.
    plausible_causes:
      - De fabrikant levert te traag.
      - Er zijn te weinig monteurs voor netverzwaring.
    mismatch_note: De levertijd van de fabrikant kun je niet veranderen. Wanneer je bestelt wel.
    countermeasures: {early_transformer_order: 1.0, framework_contracts: 0.9, strategic_transformer_stock: 0.8}
    teaches: [waste_waiting, flow]
    effects:
      # Estimate: about six months of supplier lead time after the design, where
      # four months is the reinforcement itself.
      - {target: connections.grid_reinforcement, property: wait_time, value: 1.75}
      # Estimate: the station reinforcements that free capacity for large
      # consumers wait for the same late-ordered transformers.
      - {target: congestion.capacity_queue, property: wait_time, value: 1.2}
    tells:
      - {tell: reinforcement_board, text: "Achter de oudste straatnamen op het bord staat in pen: 'trafo nog niet binnen'."}
    clues:
      - {tool: data, key: true, depth: 0, text: "Een netverzwaring duurt gemiddeld zeven maanden. Het werk in de straat zelf duurt twee weken."}
      - {tool: conversation, key: false, depth: 0, at: connections.design, text: "'De fabrikanten hebben het druk. Heel Europa wil transformatoren.'"}
      - {tool: documents, key: true, depth: 1, text: "Het bestelproces: eerst het ontwerp van de verzwaring afronden en laten goedkeuren, dan pas de transformator bestellen. Levertijd: zes maanden."}
      - {tool: conversation, key: true, depth: 2, at: connections.grid_study, text: "'Bij de netstudie weten we al dat er een trafo bij moet. Maar bestellen mag pas met een goedgekeurd ontwerp; zo is het altijd gegaan.'"}

  - id: unused_capacity
    tier: 1
    name: Gereserveerd maar ongebruikt
    step: congestion.capacity_queue
    waste: inventory
    severity: high
    visibility: hidden
    # Released capacity lets more requests through (+9 to +30 % granted a week
    # over 6 seeds, probe 2026-10-15); their lead time is months long and noisy.
    kpi: throughput
    symptoms:
      - De wachtrij voor transportcapaciteit groeit, terwijl de stations op het drukste moment niet vol zitten.
      - Ondernemers op de wachtlijst vragen waarom hun buurman wel capaciteit heeft en die niet gebruikt.
    root_cause: Gecontracteerde transportcapaciteit wordt nooit vergeleken met het werkelijke gebruik, dus ongebruikte capaciteit komt niet terug voor de wachtrij.
    plausible_causes:
      - Het net is gewoon vol; alleen verzwaren helpt.
      - De congestieonderzoeken rekenen te voorzichtig.
    mismatch_note: Op papier is het net vol, in werkelijkheid niet. Wie alleen verzwaart, laat de ongebruikte reserveringen liggen.
    countermeasures: {use_it_or_lose_it: 1.0, capacity_usage_dashboard: 0.7, flexible_contracts: 0.8}
    teaches: [waste_inventory, visual_management]
    effects:
      # Capacity frees up only through reinforcement, so the queue moves slower
      # and fewer requests fit straight away (an estimate).
      - {target: congestion.capacity_queue, property: wait_time, value: 1.4}
      - {target: congestion.capacity_queue, property: applies, value: 0.1}
    tells:
      # The empty hall is the listen-in clue's (depth 1); the tell only shows that someone wondered.
      - {tell: congestion_list, text: "Naast een paar bedrijfsnamen op de lijst staat in de kantlijn een vraagteken in potlood."}
    clues:
      - {tool: data, key: true, depth: 0, text: "Op het drukste kwartier van het jaar gebruiken de grootzakelijke klanten samen 62% van het vermogen dat ze gecontracteerd hebben."}
      - {tool: conversation, key: false, depth: 0, at: congestion.congestion_study, text: "'Het net is vol. Tot de verzwaring klaar is, kunnen we niets doen.'"}
      - {tool: listen_in, key: true, depth: 1, at: congestion.intake, text: "Een ondernemer aan de telefoon: 'Mijn buurman heeft twee megawatt gecontracteerd en zijn hal staat leeg.'"}
      - {tool: documents, key: true, depth: 1, at: congestion.congestion_study, text: "Het congestieonderzoek rekent met het gecontracteerde vermogen van iedereen, niet met wat er werkelijk loopt."}
      - {tool: documents, key: true, depth: 2, at: congestion.offer, text: "In de contracten staat niets over ongebruikte capaciteit, en niemand heeft de taak om contract en meting naast elkaar te leggen."}

  - id: planning_reshuffle
    tier: 1
    name: Storing gooit de planning om
    step: connections.planning
    waste: waiting
    severity: medium
    visibility: subtle
    kpi: first_time_right
    symptoms:
      - Klanten krijgen op de dag zelf te horen dat de monteur niet komt.
      - De planners zijn de halve week bezig met omplannen.
    root_cause: Elke monteur wordt voor 100% ingepland, zonder ruimte voor storingen. Elke storing trekt een monteur weg en zet de rest van zijn dag om, en daarmee die van de klanten.
    plausible_causes:
      - Klanten zijn niet flexibel genoeg.
      - Er zijn te weinig planners.
    mismatch_note: Sneller omplannen bestrijdt het symptoom. Storingen komen elke dag; de planning houdt er geen rekening mee.
    countermeasures: {daytime_outage_crew: 1.0, planning_with_fault_windows: 0.85, heijunka_release: 0.7}
    teaches: [heijunka, capacity_planning]
    effects:
      # Estimates: about ten daytime outages a week each cancel the rest of a
      # monteur's day; the moved appointments often do not hold.
      - {target: connections.execution, property: ftr, value: -0.25}  # a quarter of the planned jobs need a new appointment
      - {target: meters.visit, property: ftr, value: -0.1}
      - {target: connections.planning, property: touch_time, value: 2.0}  # re-planning the week
    tells:
      - {tell: planning_board, text: "Op het weekbord bij de planners hangen veel rode kaartjes tussen de gele."}
    clues:
      - {tool: data, key: true, depth: 0, text: "Een op de drie geplande klussen van vorige week is verschoven, de meeste op de dag zelf."}
      - {tool: conversation, key: false, depth: 0, text: "'Klanten zijn gewoon niet flexibel. Als we een nieuwe afspraak voorstellen, kan het nooit.'"}
      - {tool: shadow, key: true, depth: 1, at: connections.execution, text: "Om tien uur komt een storing binnen. De monteur rijdt weg en zijn klussen van die middag vervallen; de planner belt de klanten af."}
      - {tool: documents, key: true, depth: 1, text: "De weekplanning vult elke monteur voor 100%. Ruimte voor storingen staat er niet in, terwijl die altijd voorgaan."}

  - id: silo_kpis
    tier: 1
    name: KPI's die elkaar bevechten
    step: connections.design
    waste: overproduction
    severity: medium
    visibility: subtle
    kpi: first_time_right   # the harm shows in the share of work that is right the first time
    symptoms:
      - Intake en Werkvoorbereiding halen allebei hun weekdoel, maar de aansluitingen komen niet sneller klaar.
      - Monteurs krijgen ontwerpen die ze ter plekke moeten aanpassen, en aanvragen komen terug voor aanvulling.
    root_cause: Elke afdeling wordt afgerekend op haar eigen aantallen (aanvragen of ontwerpen per week, bezetting), niet op de aansluiting als geheel. Wat een afdeling sneller doorzet, komt als fout of als stapel bij de volgende terug.
    plausible_causes:
      - De afdelingen willen niet samenwerken.
      - De teams werken te snel; ze moeten gewoon rustiger aan doen.
      - Er is te weinig overleg tussen de teamleiders.
    mismatch_note: Meer overleg of rustiger werken verandert niets zolang elk team op eigen aantallen wordt beoordeeld. De mensen doen precies wat hun cijfers vragen.
    countermeasures: {obeya_end_to_end: 1.0, connections_wip_limit: 0.8, shared_team_goals: 0.7}
    teaches: [flow, waste_overproduction, kpi_alignment]
    effects:
      # Two departments steered by volume and utilisation (KPI menus in
      # content/kpis.yaml): they push work in, take the short jobs first and
      # hurry (hasty care). Rushing to hit a weekly number causes errors
      # downstream (Goodhart's law); the care values are estimates.
      - {target: intake, property: kpis, value: [intake_output, intake_utilisation]}
      - {target: work_prep, property: kpis, value: [work_prep_output, work_prep_utilisation]}
    # The clue figures are derived from the content, not measured: first-time-
    # right falls by the hasty care of kpis.yaml (ftr -0.05) from the design
    # step's 0.85 to 80 % and intake's 0.75 to 70 % (value_streams.yaml); a
    # design takes the design touch time of 3.2 h x 0.9 (hasty) = 2.9 h, so
    # "bijna drie uur".
    tells:
      - {tell: intake_stack, text: "Op de kast bij Intake liggen meer dossiers dan het team op een dag wegwerkt."}
      - {tell: prep_tray, text: "Het postbakje bij Werkvoorbereiding ligt vol."}
      - {tell: obeya_board, text: "Onder de kaart van de aansluitingen hangen de weekcijfers van Intake en Werkvoorbereiding, allebei met een groen vinkje."}
    clues:
      - {tool: data, key: true, depth: 0, text: "Intake zette vorige maand een record aan aanvragen door en Werkvoorbereiding leverde een record aan ontwerpen af. Toch gaan er niet meer aansluitingen per week uit, en er komt meer terug."}
      - {tool: time_study, key: false, depth: 0, text: "Een ontwerp maken kost de werkvoorbereider bijna drie uur, binnen de norm."}
      - {tool: data, key: true, depth: 1, text: "Het aandeel ontwerpen dat de monteur zonder aanpassing kan bouwen is in een kwartaal gezakt van 85% naar 80%, en bij Intake van 75% naar 70%."}
      - {tool: documents, key: true, depth: 1, at: connections.intake, text: "Het weekrapport van Intake telt aanvragen per week en bezettingsgraad. Hoeveel er later terugkomt voor aanvulling, staat er niet in."}
      - {tool: conversation, key: true, depth: 1, text: "'Mijn doel is dertig ontwerpen per week. Ik werk ze zo snel mogelijk weg, dan haal ik het. Dat de monteur er later iets aan moet aanpassen, staat niet in mijn cijfers.'"}
      - {tool: listen_in, key: true, depth: 2, at: connections.intake, text: "In het teamoverleg: 'Nog vier aanvragen voor vrijdag, dan halen we het weekdoel. Ontbrekende gegevens vragen we later wel op.'"}
      - {tool: conversation, key: true, depth: 2, at: connections.execution, text: "'Intake en Werkvoorbereiding zijn tevreden, hun cijfers zijn goed. Maar niemand kijkt naar mijn terugrit, of naar de klant die wacht tot de aansluiting echt klaar is.'"}

  # ── Inwerkweek: the practice problem (Thursday and Friday) ──────────────────
  # Invented and harmless (Merijn's decision, 2026-10-14): it exists only to
  # practise the A3, the Check and the Act. Opened only by the training week.
  # It sits at Werkvoorbereiding, the step Wednesday's count shows as the
  # bottleneck this week (the training setup: three of four work preparers on
  # a course), so Thursday's experiment works on the bottleneck.
  - id: training_tray
    tier: 1
    name: Twee bakken voor hetzelfde werk
    step: connections.design
    waste: motion
    severity: low
    visibility: obvious
    # A leading indicator: the three-day Check and Friday's month-ahead
    # forecast can only see one. Lead time lags by about one lead time
    # (months here: the permit wait follows design), so it cannot show this
    # week's fix, nor its fade within a month.
    kpi: capacity
    symptoms:
      - Bij Werkvoorbereiding zoekt de werkvoorbereider eerst in twee bakken voordat ze een dossier oppakt.
    root_cause: Er zijn twee bakken voor hetzelfde werk zonder vaste volgorde; zoeken en omsorteren kost bij elk dossier extra tijd.
    plausible_causes:
      - De werkvoorbereiders werken te traag.
      - Er komen te veel aanvragen tegelijk binnen.
    mismatch_note: Harder of sneller werken haalt het zoeken niet weg. Het zit in hoe het werk binnenkomt, niet in de mensen.
    countermeasures: {one_tray_fifo: 1.0, tray_labels: 0.7}
    teaches: [waste_motion, 5s]
    effects:
      # ESTIMATE (invented for the training week): searching two trays for the
      # oldest dossier, re-sorting, and checking which version of a returned
      # dossier holds, about half an hour on the 3.2 h design touch time
      # (value_streams.yaml): roughly a seventh extra.
      - {target: connections.design, property: touch_time, value: 1.12}
    tells:
      - {tell: prep_tray, text: "Naast het postbakje bij Werkvoorbereiding ligt nog een stapel dossiers."}
    clues:
      - {tool: shadow, key: true, depth: 0, text: "Bij elk dossier kijkt de werkvoorbereider eerst in twee bakken welk dossier het oudst is, en sorteert dan om."}
      - {tool: queue_count, key: false, depth: 0, text: "De stapel is groot nu drie van de vier werkvoorbereiders op cursus zijn. Aan de cursus verander jij deze week niets; aan wat de ene werkvoorbereider met haar tijd doet misschien wel."}
      - {tool: time_study, key: true, depth: 1, text: "Zoeken, omsorteren en uitzoeken welke versie van een dossier geldt kost zo'n half uur per dossier: ongeveer een zevende bovenop ruim drie uur ontwerpwerk."}
      - {tool: conversation, key: true, depth: 1, text: "'De ene bak is voor nieuwe dossiers van de Intake, de andere voor dossiers die terugkomen met aanvullingen van de klant. Zo is het ooit gegroeid; niemand weet meer waarom.'"}

  # ── The way back (QA 2.12 (c), phase-2 design §3.5) ──────────────────────────
  # Two real wastes in the meter round, money lost every week, opened only through
  # their side missions when the budget sits at the debt floor (missions.yaml,
  # fix_double_visits). Fixing them is how the region climbs back; nothing is given.
  - id: double_visits
    tier: 1
    name: Twee keer naar hetzelfde adres
    step: meters.visit
    waste: defects
    severity: medium
    visibility: subtle
    # The return visit is rework at the visit step (ftr). ESTIMATE: about one meter
    # visit in seven ends 'kast niet geschikt' (an old fuse box, no room, a plate that
    # may hold asbestos in a house from before the 1993 ban), so a connection monteur
    # must come first and the meter monteur comes back. Measured where rework shows: the
    # share of meter visits right the first time.
    kpi: first_time_right
    symptoms:
      - Meterwisselaars rijden terug naar adressen waar ze vorige week al waren.
      - Het programma voor de laatste analoge meters loopt achter, terwijl de monteurs volle dagen maken.
    root_cause: Bij het inplannen kijkt niemand naar de meterkast; pas aan de deur blijkt dat eerst een aansluitmonteur moet komen, en dan rijdt de meterwisselaar een tweede keer.
    plausible_causes:
      - De monteurs zijn niet opgeleid voor oude meterkasten.
      - Klanten maken de meterkast niet vrij.
    mismatch_note: Aan de deur valt niets meer te winnen; de kast was al oud voordat de monteur kwam. Wat ontbreekt, is een blik op de kast bij het inplannen.
    # Act 0/I audit (2026-10-24): the build year looks at the cupboard at planning, the root
    # cause, built into the tool; a little less than the photo (a renovated old house reads as
    # old), not a poor fix. The poor_fix debrief is the shortcut's.
    countermeasures: {cupboard_photo_at_booking: 1.0, register_cupboard_check: 0.85, customer_self_report: 0.6}
    teaches: [waste_defects, quality_at_the_source]
    effects:
      - {target: meters.visit, property: ftr, value: -0.15}
    # ESTIMATE: 40 meter visits a week, one in seven back again (about 6), at about
    # EUR 100 a return trip (1.5 h of a monteur at ~EUR 55 an hour, the van ~EUR 20).
    cost_per_week: 600
    tells:
      - {tell: van_returns, text: "Op de retourpallet staan meterdozen die weer terug zijn; op een paar zit een oranje sticker."}
    clues:
      - {tool: shadow, key: true, depth: 0, text: "Op het vierde adres kijkt de monteur in de meterkast en schudt zijn hoofd: een oude stoppenkast, met een plaat die asbest kan bevatten. Hij plakt er een sticker op. Eerst moet er een aansluitmonteur komen; daarna komt hij terug."}
      - {tool: time_study, key: false, depth: 0, text: "Een meterwissel duurt veertig minuten, netjes binnen de norm."}
      - {tool: material_check, key: false, depth: 0, text: "In de bus liggen genoeg meters, ook driefasemeters. Aan materiaal ligt het niet."}
      - {tool: data, key: true, depth: 1, text: "Bij één op de zeven bezoeken staat als uitkomst 'kast niet geschikt'. Bijna allemaal in huizen van voor 1990."}
      - {tool: documents, key: true, depth: 1, at: meters.appointment, text: "De afspraakbrief vraagt de klant de meterkast vrij te maken. Naar de meterkast zelf vraagt niemand, ook niet aan de telefoon."}
      - {tool: listen_in, key: true, depth: 2, at: meters.appointment, text: "Linda plant een meterwissel in Nova-Oud: 'Postcode, dag, klaar.' Het bouwjaar van het huis staat in het register, maar dat scherm heeft ze niet open."}

  - id: overtime_planning
    tier: 1
    name: Overwerk dat in de planning zit
    step: meters.appointment
    waste: transport
    severity: high
    visibility: subtle
    # The zigzag adds driving to every visit (touch_time; ESTIMATE: three of a monteur's
    # eight hours in the van on a day across four districts, against about one and a
    # half when a day stays in one or two, so 5 h of work where 6.5 h fit: x1.3), and the
    # last address of a day that overruns is moved to another day (ftr; ESTIMATE: one
    # visit in ten). The overtime itself is money (cost_per_week); with slack in the
    # monteurs' week the flow shows it in appointments kept on time.
    kpi: on_time
    symptoms:
      - De meterwisselaars schrijven elke week overuren, ook in een rustige week.
      - Een monteur rijdt op één dag naar adressen in drie of vier wijken.
    root_cause: Afspraken worden ingepland op volgorde van binnenkomst, niet per wijk; de monteurs rijden kriskras door de regio, en wat aan het eind van de dag overblijft, wordt overwerk.
    plausible_causes:
      - De monteurs werken te langzaam.
      - Er zijn te weinig meterwisselaars.
    mismatch_note: Meer mensen of harder werken haalt de kilometers er niet uit. De rit tussen de adressen zit in de planning.
    # Act 0/I audit (2026-10-24): fixed district teams take the zigzag out as well (the
    # planning follows the districts); not a poor fix. The poor_fix debrief is the cap's.
    countermeasures: {route_by_area: 1.0, area_teams: 0.85, overtime_cap: 0.6}
    teaches: [waste_transport, heijunka]
    effects:
      - {target: meters.visit, property: touch_time, value: 1.3}
      - {target: meters.visit, property: ftr, value: -0.1}
    # ESTIMATE: six meter monteurs with about three hours of overtime a week each, at
    # ~EUR 60 an hour with the overtime surcharge: about EUR 1,100 a week.
    cost_per_week: 1100
    tells:
      - {tell: planning_board, text: "Op het weekbord bij de planners staat achter de namen van de meterwisselaars bijna elke dag een overuur in rood."}
    clues:
      - {tool: data, key: true, depth: 0, text: "De meterwisselaars schreven de laatste acht weken samen 140 overuren, in rustige weken net zoveel als in drukke."}
      - {tool: shadow, key: true, depth: 0, at: meters.visit, text: "Je rijdt een dag mee: Nova-Oud, De Hofstede, terug naar Nova-Oud, dan de Kanaalzone. Van de acht uur zit de monteur er drie in de bus."}
      - {tool: time_study, key: false, depth: 0, at: meters.visit, text: "Bij de klant werkt de monteur vlot: de wissel zelf zit binnen de norm."}
      - {tool: documents, key: true, depth: 1, text: "De planning zet afspraken op volgorde van aanvraagdatum. Een wijk of postcode komt in de planningsregels niet voor."}
      - {tool: listen_in, key: true, depth: 2, text: "Een klant uit Nova-Oud wil dinsdag. Linda zet hem erin, al werkt die monteur dinsdag verder alleen in de Kanaalzone. 'Wie het eerst belt, krijgt de eerste plek.'"}
