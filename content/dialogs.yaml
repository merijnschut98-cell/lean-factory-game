# Dialogs: conversations with named people (CLAUDE.md §2, "Dialogs are give
# and take"). Design: docs/superpowers/specs/2026-10-15-dialog-system-design.md.
#
# The content says WHO the person is and WHAT they would say; the rules
# (game/src/rules/dialog.gd) decide HOW they respond to each move. No reply is
# marked right: there is no such key. Every number here (trust, morale,
# thresholds, patience) is an ESTIMATE chosen for play, with the reasoning in
# the spec §3–§5.
#
# people:   the recurring cast (id, name, role, place = a work step,
#           team = a pool, archetype, trust and morale 0–100, voice).
# bank:     the shared lines: the player's line per move, the person's
#           fallback reply per move (lands / misses), special replies, outcome
#           texts, and the labels the UI shows (chips, bands, cue, outcomes).
# dialogs:  one entry per conversation. kind persuade (bound to a mission) or
#           checkin (no mission; a trigger opens it). Layers: interest, then
#           concern (hidden until earned; its lead_in carries the cue).
#           A concern's unlocks.clue is appended to the owned problem's clues
#           by the build (tool conversation at the person's place, marked with
#           the dialog so only the conversation reveals it).

people:
  - id: joost
    name: Joost van Dijk
    role: teamleider Werkvoorbereiding
    place: connections.design
    team: work_prep
    archetype: defender
    need: safety   # person-needs spec §2.2: his predecessor moved to Inkoop after one bad quarter
    trust: 50
    morale: 50   # worn down by the conflict between the departments (spec §7)
    voice: "Mijn team haalt het doel."

  - id: frank
    name: Frank Hulshof
    role: manager Aansluitingen & Netverzwaring
    place: connections.design   # he walks the floor at Werkvoorbereiding; his office is the Obeya
    team: work_prep
    archetype: rule_bound
    need: facts   # person-needs spec §2.2: he must 'verantwoorden' every number to the directie and the ACM
    trust: 50
    morale: 60
    voice: "Dat moet ik kunnen uitleggen."   # the voice sheet's line (tier-1 content audit C12); "jaarplan" stays in his position

  - id: sanne
    name: Sanne Bakker
    short: Sanne
    role: teamleider Intake
    place: connections.intake
    team: intake
    archetype: overloaded
    need: recognition   # person-needs spec §2.2: Intake is 'het postkantoor'; nobody asks what she knows
    trust: 50
    morale: 50
    voice: "We zijn een postkantoor geworden."

  - id: ahmed
    name: Ahmed Bouzid
    role: jonge monteur
    place: outages.locate
    team: monteurs
    archetype: quiet
    need: safety   # person-needs spec §2.2: ashamed that he still calls a retiree at night
    trust: 60   # he met the player in Henk's mission
    morale: 42  # since Henk left (spec §8)
    voice: "Gaat wel."

bank:
  labels:
    bands: [Dicht, Op z'n hoede, Luistert, Open, Denkt mee]
    cue: "Er zit meer achter…"
    chips:
      mood: Stemming peilen
      open_question: Open vraag
      reflect: Gevoel benoemen
      empathy: Begrip tonen
      paraphrase: Samenvatten
      inquiry: Doorvragen
      experience: Ervaring delen
      silence: Stilte laten
      perspective: Ander perspectief
      show_data: Data laten zien
      propose_experiment: Experiment voorstellen
      propose: Voorstel doen
      ask_commitment: Afspraak maken
      pressure: Druk zetten
      confront: Aanspreken
      repair: Terugkomen op vorige keer
      close: Afronden
    outcomes:
      commitment: Staat erachter
      partial: Afspraak onder voorwaarde
      heard: Gehoord
      none: Geen uitkomst
      blocked: Geblokkeerd
      compliance: Gaat akkoord onder druk
      ruined: Mislukt
      lifted: Opgebeurd
  player:
    mood: "Hoe gaat het vandaag, echt?"
    open_question: "Hoe ziet jouw week eruit?"
    reflect: "Het klinkt alsof je klem zit."
    empathy: "Dat is ook niet niks, als je zo je best doet."
    paraphrase: "Even kijken of ik je goed begrijp. Wat je zegt, is…"
    inquiry: "Wat maakt dat het zo is?"
    experience: "In mijn eerste weken hier wist ik ook niet waar ik moest beginnen."
    silence: "(je zegt niets en wacht)"
    perspective: "Hoe zou de monteur dit zien, denk je?"
    show_data: "Kijk eens naar deze cijfers."
    propose_experiment: "Zullen we het eerst klein proberen?"
    propose: "Ik heb een voorstel."
    ask_commitment: "Spreken we dit af?"
    pressure: "Het MT wil dat dit verandert. Liever met jou dan zonder jou."
    confront: "Dit ligt toch gewoon aan jouw team?"
    repair: "Vorige keer begon ik met mijn verhaal in plaats van met het jouwe. Dat was niet handig."
    close: "Dank je voor je tijd."
  # No bank reply carries a claim or feeling tag (tier-1 content audit C8):
  # whether a summary or a named feeling lands depends on what THIS person
  # said, in their authored lines, never on a shared fallback.
  replies:
    mood:
      lands: {text: "Eerlijk gezegd? Het is een drukke week."}
      misses: {text: "Gaat wel."}
    open_question:
      lands: {text: "Ach, je kent het. Te veel werk, te weinig tijd."}
      misses: {text: "Dat heb ik je net verteld."}
    reflect:
      lands: {text: "Ja. Zo voelt het wel."}
      misses: {text: "Nee, zo is het niet. Ik ben gewoon moe."}
    empathy:
      lands: {text: "Dank je. Dat hoor ik niet vaak."}
      misses: {text: "Ja, dat zei je al."}
    paraphrase:
      lands: {text: "Precies."}
      misses: {text: "Dat zei ik, ja."}
    inquiry:
      lands: {text: "Goeie vraag. Daar moet ik even over nadenken."}
      misses: {text: "Hoe bedoel je?"}
    experience:
      lands: {text: "Echt? Dan weet je hoe het is."}
      misses: {text: "Het gaat nu even niet over jou."}
    silence:
      lands: {text: "(denkt na) Ik weet het eigenlijk niet.", tags: [doubt]}
      misses: {text: "… Was er nog iets?"}
    perspective:
      lands: {text: "Zo had ik het nog niet bekeken."}
      misses: {text: "Ik ben de monteur niet."}
    show_data:
      lands: {text: "Laat eens zien… Dat had ik niet verwacht."}
      misses: {text: "Dus het ligt aan mijn mensen?"}
    propose_experiment:
      lands: {text: "Proberen kan altijd. Als het klein blijft."}
      misses: {text: "Nu even niet."}
    pressure:
      lands: {text: "Aha."}
    confront:
      lands: {text: "Dat meen je niet."}
    repair:
      lands: {text: "Nee. Dat was het niet. Maar goed dat je het zegt."}
  # Moves that wear out (person-needs spec §3.2, PLAN 1.6c (b)): said once per
  # move in a talk, when a move's force first falls below half (a third use,
  # or a third in a row). ask: questions (mood, open question, inquiry);
  # say: statements. Silence keeps its own reply. A dialog may give the
  # person their own line (replies.<move>.worn).
  wear_out:
    defender:
      ask: "Je vraagt het nu op drie manieren. Het antwoord blijft hetzelfde."
      say: "Ja. Dat zei je al. Ik hoef mezelf niet terug te horen."
    cynic:
      ask: "Staat dat ook zo in de cursus? Drie keer dezelfde vraag?"
      say: "Hm. Dit is de techniek, toch? Herhalen tot ik ja zeg."
    craftsman:
      ask: "Dezelfde vraag, andere woorden. Kom liever kijken, dan zie je het."
      say: "Je zegt het nu voor de derde keer. Ik geloof je wel, hoor."
    overloaded:
      ask: "Sorry, maar dit vroeg je net. Ik heb echt niet veel tijd."
      say: "Ja. Ja. Dat weet ik nou wel. Wat wil je eigenlijk?"
    rule_bound:
      ask: "Die vraag is gesteld, en beantwoord. Wat is het volgende punt?"
      say: "Dit punt hebben we gehad. Laten we verdergaan."
    quiet:
      ask: "… Dat vroeg je al."
      say: "Mm. Ja. Dat zei je."
    customer_upset:
      ask: "Dit heb ik nu twee keer verteld. Mag ik ook eens iets vragen?"
      say: "Dat zei u al. Ik hoef geen begrip, ik wil weten wat er gebeurt."
    expert:
      ask: "Die vraag hadden we. Wil je een andere kant op?"
      say: "Klopt, zo zei ik het. Zullen we verder?"
  special:
    repeat: "Dat vroeg je net ook."
    refusal: "Nee. Nog niet."
    no_proposal: "Waar moet ik precies ja op zeggen?"
    other_data: "En?"
    lucky_guess: "Hm. Misschien."
    no_repair: "Herstellen? Er is niks misgegaan tussen ons."
    patience_low: "Ik heb nog vijf minuten."
    cooling_down: "Niet nu."
  # Ruud after a hard main-mission talk (spec §5.6, Kata): one question, then
  # back to the mission. `after` wins when the talk ended that way (pressure:
  # a yes under pressure); otherwise the questions in turn. {person}: the
  # person's short name. He never names the right move.
  coach:
    questions:
      - "Wat wilde je dat {person} na het gesprek dacht of deed?"
      - "Wat gebeurde er? Waar veranderde het gesprek?"
      - "Wat houdt {person} tegen, denk je? Hoe weet je dat?"
      - "Hoe begin je het volgende gesprek, en wat verwacht je dat er dan gebeurt?"
      - "Wat heb je geleerd over luisteren?"
    after:
      pressure: "{person} zei ja. Wat zei het gezicht erbij?"
      ruined: "Wie was er aan het woord in de eerste minuut?"
      blocked: "Is dit iets wat {person} kan beslissen? Wie wel?"
      commitment: "Wiens idee was het uiteindelijk?"
  outcomes:
    commitment: "Goed. Ik doe mee, en ik sta erachter."
    partial: "Eerst zien, dan geloven."
    heard: "Fijn dat je even luisterde."
    none: "Goed. Tot later."
    blocked: "Dat kan ik niet toezeggen."
    compliance: "Als het moet, dan moet het."
    ruined: "Ik denk dat we klaar zijn."
    lifted: "Fijn dat je even langskwam."

dialogs:
  # ── Joost and the output KPI (Acts 0–II scripts §3.3, the audited rewrite;
  # tier-1 content audit C1, C7, C14) ─────────────────────────────────────────
  - id: joost_output_kpi
    name: Joost en de ontwerpen per week
    person: joost
    kind: persuade
    mission: fix_silo_kpis
    requires_clue: "silo_kpis:4"   # his own words: "Mijn doel is dertig ontwerpen per week."
    owns: silo_kpis
    kpi_team: work_prep
    mood: gespannen                # the MT is tomorrow (first talk only)
    patience: 10
    opening: "Ik heb tien minuten. Morgen is het MT."
    retry_opening: "Jij weer."
    warning: "Hm. Ik heb hier eigenlijk geen tijd voor."
    position: {text: "Mijn team haalt dertig ontwerpen per week. Een record. Als de aansluitingen niet sneller gaan, ligt dat niet aan ons.", tags: [claim]}
    layers:
      - id: interest
        at: 55
        via: [inquiry, open_question, paraphrase]
        text: "Frank. Elke maandag om negen uur. Ontwerpen per week staat bovenaan zijn lijst, dus staat het bovenaan de mijne."
        tags: [claim, feeling]
      - id: concern
        at: 70
        via: [silence, reflect, empathy, inquiry]
        lead_in: {text: "Ja. En…", tags: [hesitation]}
        text: "Mijn voorganger had één slecht kwartaal. Hij werkt nu bij Inkoop. … Als ik op doorlooptijd ga sturen, wordt dat getal eerst slechter. Dat weet ik gewoon. En dan sta ik in het MT met lege handen."
        tags: [admission]
        condition: "Ik doe mee. Maar Frank moet het goedvinden. Het blijft zijn lijst."
        wait_for: "Frank moet het goedvinden."   # the summary card's "Wat nog moet"
        unlocks:
          clue: {key: true, depth: 2, text: "'Werkvoorbereiding stuurt op ontwerpen per week omdat de manager er elke maandag naar vraagt. Een doorlooptijd die pas na maanden beter wordt, voelt als een risico voor wie erop wordt afgerekend.'"}
          facts: [heard:joost_kpi]
          proposals: [present_with_sanne]
    data: ["silo_kpis:0", "silo_kpis:2"]
    proposals:
      - id: lead_and_oldest
        label: Doorlooptijd + oudste dossier
        say: "Wat als je naast de doorlooptijd het oudste dossier meet? Dat beweegt binnen een paar weken, en dat heb jij in de hand."
        kpis: [work_prep_lead_time, work_prep_oldest]
        addresses: [concern]
        reply: "Het oudste dossier… dat zie ik volgende week al zakken."
      - id: ftr_and_oldest
        label: Eerste keer goed + oudste dossier
        say: "Meet wat er bij de monteur goed aankomt, en het oudste dossier in je bak."
        kpis: [work_prep_ftr, work_prep_oldest]
        addresses: [concern]
        reply: "Eerste keer goed, en iets wat ik deze week kan laten zien. Dat is eerlijk."
      - id: output_and_ftr
        label: Ontwerpen per week + eerste keer goed
        say: "Houd je ontwerpen per week, en zet eerste keer goed ernaast."
        kpis: [work_prep_output, work_prep_ftr]
        addresses: [concern]
        reply: "Dat kan ik wel aan Frank verkopen."
      - id: lead_and_ftr
        label: Doorlooptijd + eerste keer goed
        say: "Stuur op de doorlooptijd en op eerste keer goed."
        kpis: [work_prep_lead_time, work_prep_ftr]
        addresses: []
        reply: "Twee getallen die pas na maanden bewegen? Dat is precies wat ik bedoel."
      - id: present_with_sanne   # exists only once the concern unlocked it
        label: Samen met Sanne presenteren
        say: "En als je het niet alleen presenteert, maar samen met Sanne?"
        hidden: true
        addresses: [concern]
        reply: "Samen. Dan sta ik er niet alleen."
    experiments:
      - id: one_quarter_trial
        label: Een kwartaal proberen
        say: "Probeer het een kwartaal, met de oude cijfers er gewoon naast zichtbaar."
        addresses: [concern]
        reply: "Met de oude ernaast. Dan kan ik altijd laten zien wat we deden."
    co_proposal: {id: present_with_sanne, text: "En als Sanne hetzelfde doet, presenteren we het samen. Dan sta ik er niet alleen."}
    condition_needs: {all: [committed:frank_kpi_targets]}   # Frank's okay: it is his list
    # Later (scripts F6, audit C15, not yet in the engine): when Frank commits,
    # "Frank heeft getekend. Nu sta ik er ook echt achter." (PLAN 1.6b, beats_after).
    lines:
      mood: "Hoe ging het MT?"
      inquiry: "Wie vraagt er eigenlijk om die dertig?"
      reflect: "Je zit klem tussen wat Frank vraagt en wat de monteurs nodig hebben."
      confront: "Jouw team zet toch gewoon te snel door?"
      pressure: "Ruud wil dat dit verandert. Het MT ook."
      repair: "Gisteren begon ik met mijn verhaal in plaats van met het jouwe. Dat was niet handig."
    replies:
      mood:
        lands: {text: "Zoals altijd. Dertig ontwerpen, record, applaus. En dan vraagt Marco wie onze fouten nabouwt.", tags: [claim, feeling]}
      paraphrase:
        lands: {text: "Precies. Ik doe wat er gevraagd wordt. En het is nooit goed.", tags: [claim, feeling]}
      experience:
        misses: {text: "Hm. Ander bedrijf."}
      perspective:
        lands: {text: "Vanuit de monteur gezien… die krijgt mijn record als een stapel tekeningen waar hij mee terug moet. Ja. Dat is geen record, dat is een rekening."}
      show_data:
        lands: {text: "Laat eens zien… van 85 naar 80 procent? Dat had ik niet zo gezien."}
        too_early: {text: "Dus mijn mensen werken slordig? Ze halen elke week hun doel. Elke week.", tags: [claim]}
      propose:
        too_early: {text: "Doorlooptijd? Daar gaat de vergunning over, en de monteur, en de klant. Niet ik.", tags: [claim]}
      repair:
        lands: {text: "Nee. Dat was het niet. (stilte) Koffie? Die van de automaat is slecht. Die van mij is erger."}
    outcomes:
      commitment: "Afgesproken. En als het eerst slechter wordt, zeg ik dat zelf in het MT. Voordat Frank het vraagt."
      partial: "Ik doe mee. Maar Frank moet het goedvinden. Het blijft zijn lijst."
      heard: "Fijn dat je het vroeg. Echt."
      compliance: "Prima. Dan meet ik wat jullie willen."
      ruined: "Je kwam binnen met je antwoord al klaar. Dan moet Ruud het maar tegen mij zeggen."

  # ── Sanne and the applications per week (Acts 0–II scripts §7, sanne_kpi):
  # Frank's second block route needs her agreement too (audit C5) ──────────────
  - id: sanne_kpi
    name: Sanne en de aanvragen per week
    person: sanne
    kind: persuade
    mission: fix_silo_kpis
    kpi_team: intake
    patience: 9
    opening: "Als het over het MT gaat: ja, ik had een recordmaand. Nee, ik weet ook niet waarom er niks meer doorkomt."
    retry_opening: "Joh. Weer over het MT?"
    warning: "Joh. Niet nu."
    position: {text: "Ik stuur op aanvragen per week. Dat werkt: we halen het.", tags: [claim]}
    layers:
      - id: interest
        at: 55
        via: [empathy, mood, open_question]
        text: "Elke vrijdag om drie uur tellen we. Nog vier voor het weekdoel? Dan zet je ze door. Ook als de meterkastfoto mist. Dat vraagt Werkvoorbereiding dan maar."
        tags: [claim, feeling]
      - id: concern
        at: 70
        via: [reflect, empathy]
        lead_in: {text: "Ik baal er nu al van, als ik eraan denk. Alleen…", tags: [feeling]}
        text: "Als ik op 'compleet doorgezet' ga sturen, zakt mijn aantal per week. Eerst. En dan is Intake weer het postkantoor dat traag is. Ik heb twee jaar gedaan over dat beeld."
        tags: [admission]
        condition: "Ik doe mee. Als Frank het goedvindt. Het jaarplan is van hem."
        wait_for: "Frank moet het goedvinden."   # the summary card's "Wat nog moet"
        unlocks:
          facts: [heard:sanne_kpi]
          proposals: [present_with_joost]
    data: ["silo_kpis:3", "silo_kpis:5"]
    proposals:
      - id: complete_and_oldest
        label: Compleet doorgezet + oudste aanvraag
        say: "Compleet doorgezet, en de oudste aanvraag in de bak. Allebei getallen die je deze week ziet bewegen."
        kpis: [intake_complete, intake_oldest]
        addresses: [concern]
        reply: "Die oudste aanvraag… die ligt er nu drie weken. Die kan ik morgen pakken."
      - id: lead_and_complete
        label: Doorlooptijd + compleet doorgezet
        say: "De doorlooptijd van de hele stroom, en compleet doorgezet ernaast."
        kpis: [intake_lead_time, intake_complete]
        addresses: [concern]
        reply: "Eentje kijkt ver vooruit, eentje kijkt naar ons. Oké. Dat is eerlijk."
      - id: output_and_complete
        label: Aanvragen per week + compleet doorgezet
        say: "Houd je aantal per week, en zet compleet doorgezet ernaast."
        kpis: [intake_output, intake_complete]
        addresses: [concern]
        reply: "Dan zie ik ze elkaar bevechten. Maar goed. Dan zie ik het tenminste."
      - id: output_and_utilisation
        label: Aanvragen per week + bezettingsgraad
        say: "Je houdt wat je hebt: aanvragen per week en bezettingsgraad."
        kpis: [intake_output, intake_utilisation]
        addresses: []
        reply: "Dat is wat ik nu heb. En dat werkt dus niet, hè."
      - id: present_with_joost   # unlocked by her concern (the script also wanted heard:joost_kpi; not in the engine)
        label: Samen met Joost presenteren
        say: "Joost wil het samen met jou presenteren. Eén stroom, niet twee teams."
        hidden: true
        addresses: [concern]
        reply: "Joost? Samen? … Dan is het geen postkantoor tegen de ingenieurs. Dan is het één stroom."
    co_proposal: {id: present_with_joost, text: "Als Joost en ik dezelfde aansluiting volgen, van aanvraag tot monteur. Eén dossier, op het bord. Dan ziet iedereen waar het blijft."}
    condition_needs: {all: [committed:frank_kpi_targets]}
    # Later (scripts §7, beats_after, not yet in the engine): "Frank heeft getekend.
    # Joost en ik presenteren donderdag. Samen. Ik ben zenuwachtig, en dat is lang geleden."
    lines:
      mood: "Hoe is het nou echt, na zo'n recordmaand?"
      open_question: "Hoe gaat zo'n vrijdagmiddag bij jullie?"
      reflect: "Je klinkt alsof je het nu al ziet aankomen."
    replies:
      open_question:
        lands: {text: "Vrijdag om drie uur tellen we. Iedereen weet dat. Daar plan je je hele week omheen.", tags: [claim]}
      paraphrase:
        lands: {text: "Ja. En dan nog dat gevoel dat het nooit genoeg is.", tags: [feeling]}
      perspective:
        lands: {text: "Vanuit Joost? Die krijgt mijn vrijdagmiddag op maandag op zijn bord. Halve dossiers. Ja. Dat zou ik ook niet leuk vinden."}
      show_data:
        lands: {text: "'Nog vier voor vrijdag.' Ja. Dat zijn wij. Dat klinkt anders als je het zo terughoort."}
        misses: {text: "Mijn cijfers zijn goed. Die van Joost ook. Dat is toch het hele punt?", tags: [claim]}
    outcomes:
      commitment: "Afgesproken. En ik zeg het zelf in het MT: ons getal gaat eerst omlaag. Met reden."
      partial: "Ik doe mee. Als Frank het goedvindt. Het jaarplan is van hem."
      heard: "Zo. Dat had ik nog nooit hardop gezegd."
      compliance: "Prima. Weer een getal."
      ruined: "Dus het ligt weer aan de Intake. Natuurlijk."

  # ── The block behind the team leads' condition (scripts §7; audit C4–C6,
  # C13): Frank ───────────────────────────────────────────────────────────────
  - id: frank_kpi_targets
    name: Frank en het jaarplan
    person: frank
    kind: persuade
    mission: fix_silo_kpis
    requires_clue: "silo_kpis:4"
    owns: silo_kpis               # his clue joins the problem's clues; it is his list the teams steer by
    patience: 8                   # a manager's diary (authored)
    opening: "Ik heb een kwartier. Daarna de regiegroep. Gaat het over het jaarplan, dan weet je dat het vastligt."
    retry_opening: "Weer over die KPI's?"
    warning: "Ik heb een regiegroep. Kom ter zake."
    position: {text: "Ontwerpen en aanvragen per week staan in het jaarplan. Daar stuur ik op.", tags: [claim]}
    layers:
      - id: interest
        at: 52
        via: [inquiry, paraphrase]
        text: "Het jaarplan gaat naar de directie, en het aantal aansluitingen per jaar gaat naar de ACM. Dat moet ik kunnen uitleggen. Elk kwartaal."
        tags: [claim]
      - id: concern
        at: 72
        via: [inquiry, silence, empathy]
        lead_in: {text: "En daar komt bij…", tags: [hesitation]}
        text: "In de najaarsronde wordt het budget voor netverzwaring over de regio's verdeeld. Als onze cijfers een kwartaal slechter worden, gaat dat geld naar het westen. Ik ga niet op gevoel een kwartaal gokken met de verzwaring van Zuidmark."
        tags: [admission]
        unlocks:
          clue: {key: true, depth: 2, text: "'De directie vraagt elk kwartaal naar aantallen. Hoe lang een klant wacht, vraagt alleen de ACM. Eén keer per jaar.'"}
          facts: [heard:frank_budget]   # the interim MT reads it (drie-winters §5.2)
    data: ["silo_kpis:0", "silo_kpis:2"]
    block:
      text: "Ik kan dit niet toezeggen. Laat het me eerst zien."
      routes:
        - needs: {all: [checked:silo_kpis]}
          hint: "Laat het me zien op één stroom."
