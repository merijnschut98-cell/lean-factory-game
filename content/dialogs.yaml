  # ── Act 0, Monday 19:00: Anouk at seven, the first talk of the game (first-five-minutes B7) ─────
  - id: anouk_seven
    name: "Anouk om zeven uur"
    person: anouk
    kind: persuade
    mission: training_mon
    tutorial: true
    teaches: [mood]
    mood: moe
    patience: 12
