      partial: "Ik doe mee. Als het na een maand nog loopt."
      heard: "Hm. Jij luistert tenminste. Dat deed de vorige niet."
      compliance: "Komt op de stapel."
      ruined: "Zie je. Mooie woorden. En wie bouwt dat na?"

  # ── Esra en haar agents (Acts 0–II scripts §6.1) ─────────────
  - id: esra_agents
    name: "Esra en haar agents"
    person: esra
    kind: persuade
    mission: fix_status_callers
    owns: status_callers
    mood: moe
    patience: 9
    opening: "Kijk, ik geef je tien minuten. Dan moet ik de wachtrij weer in."
    warning: "Serieus? Ik heb hier geen tijd voor."
    position: {text: "Ik heb vier agents extra nodig. Een kwartier in de wacht, de hele dag. Dat is niet normaal. En het is niet eerlijk tegenover mijn mensen.", tags: [claim], tell: fairness}
    layers:
      - id: interest
        at: 50
        via: [open_question, inquiry, paraphrase]
        text: "Dat scherm daar staat de hele dag op rood. Mijn mensen krijgen elk uur iemand aan de lijn die al vier keer gebeld heeft en dat op hén afreageert."
        tags: [claim, feeling]
        tell: fairness
      - id: concern
        at: 70
        via: [reflect, empathy]
        lead_in: {text: "En eerlijk gezegd… ik voel me er schuldig over.", tags: [feeling]}
        text: "Saskia zit thuis. Stress. En Kim zat vorige week te huilen in haar auto op de parkeerplaats. Op een team van vier. Ik had het moeten zien. Ik ga er niet nog een kwijtraken."
        tags: [admission]
        unlocks:
          facts: [heard:esra_people]
          proposals: [one_agent_calls_back]
    data: [status_callers:0, status_callers:2]
    proposals:
      - id: four_agents
        label: "Vier agents extra"
        say: "Vier extra agents, tijdelijk."
        addresses: []
        reply: "Vier. Ja. … Al moeten ze dan eerst zes weken worden ingewerkt. Door de mensen die nu al op hun tandvlees lopen."
      - id: status_messages
        label: "Klanten krijgen vanzelf bericht"
        say: "Klanten krijgen bij elke stap vanzelf een bericht waar hun aansluiting is."
        addresses: [interest]
        reply: "Dan bellen ze niet. … Als het bericht klopt. Een bericht dat niet klopt, is een telefoontje extra."
      - id: one_agent_calls_back
        label: "Eén agent belt de wachtenden zelf"
        say: "Eén van je mensen gaat een week uit de wachtrij en belt de klanten die al drie weken wachten. Vóórdat die ons bellen."
        hidden: true
        addresses: [concern]
        reply: "Kim. Die kent de dossiers. En die zit dan een week niet in de vuurlinie."
    experiments:
      - id: listen_and_tally
        label: "Een middag meeluisteren en turven"
        say: "Eén middag samen meeluisteren en turven waarom mensen bellen."
        addresses: [interest]
        reply: "Turven. Ik heb het gevoel al. Maar goed, een getal is sterker dan een gevoel in het MT."
      - id: rotate_off_the_queue
        label: "Om de beurt een uur uit de wachtrij"
        say: "Elke agent een uur per dag uit de wachtrij om wachtende klanten zelf te bellen. Om de beurt."
        addresses: [concern]
        reply: "Om de beurt een uur niet in de vuurlinie. Dat merken ze. Dat merk ik."
    co_proposal: {id: one_agent_calls_back, text: "Laat Kim de wachtenden terugbellen. Een week. Die kent de dossiers, en zij heeft het het hardst nodig."}
    replies:
      show_data:
        lands: {text: "Vier op de tien. Dat zijn… dat zijn mijn rode uren. Allemaal dezelfde vraag."}
        misses: {text: "Ja. En? Dan heb ik nog steeds mensen tekort."}
      perspective:
        lands: {text: "Vanuit de beller? Die heeft een warmtepomp aan de muur en geen stroom. Ik zou ook bellen. Vier keer."}
      open_question:
        lands: {text: "Kijk, Werkvoorbereiding weet zelf niet wanneer iets klaar is, en mijn mensen moeten het uitleggen. Serieus. Gewoon eerlijk is anders.", tags: [claim], tell: fairness}
    outcomes:
      commitment: "Deal. En als het werkt, wil ik niet horen dat ik dus geen agents nodig had. Ik had ze nodig. Alleen niet hiervoor."
      partial: "Ik doe het. Maar mijn aanvraag voor vier agents blijft liggen tot ik de wachtrij groen zie."
      heard: "Oké. Het is eruit. Mijn mensen weten niet dat ik zo over ze praat, hè. Laat dat zo."
      compliance: "Prima. Komt erbij."
      ruined: "Mijn mensen zijn geen stootkussen. En ik ook niet."

  # ── Het vierde telefoontje van mevrouw El Amrani (Acts 0–II scripts §6.1) ─────────────
  - id: el_amrani_fourth_call
    name: "Het vierde telefoontje van mevrouw El Amrani"
    person: el_amrani
    kind: persuade
    # She rings during the status callers, or before the frost if the player never got there (arc S11).
    missions: [fix_status_callers, winter_el_amrani]
    mood: gespannen
    patience: 10
    opening: "{groet}. U spreekt met Fatima El Amrani. Ik bel voor de vierde keer, en ik heb ze allemaal opgeschreven."
    variants:
      # The date she was given has passed without a connection (Missions: promise_broken): she
      # reads it from her notebook (drie winters §3); the talk opens lower (People memory).
      - needs: {all: ["promise_broken:el_amrani_fourth_call"]}
        opening: "{groet}, met Fatima El Amrani. Ik heb mijn schrift voor me. Hier staat: 'Volgens de planning over een week of zes aangesloten.' Met de datum erbij, en uw naam. Die datum is geweest."
    warning: "Ik heb geen behoefte aan een riedeltje."
    position: {text: "Ik wil een datum. Een echte. Anders ga ik naar de Geschillencommissie.", tags: [claim], tell: facts}
    layers:
      - id: interest
        at: 45
        via: [paraphrase, inquiry]
        text: "Drie weken geleden, dinsdag, kwart over tien: 'binnenkort'. Twee weken geleden: 'we zijn ermee bezig'. Vorige week wist niemand het. Ik wil gewoon weten waar ik aan toe ben."
        tags: [claim, feeling]
      - id: concern
        at: 65
        via: [reflect, empathy]
        lead_in: {text: "Het gaat niet eens om mij… Ik ben bang, als ik eerlijk ben.", tags: [feeling]}
        text: "Mijn moeder woont bij ons. Ze is eenentachtig en heeft het altijd koud. De installateur zei: haal die cv-ketel eruit, de warmtepomp is beter. Die hangt nu aan de muur. Zonder stroom. Het wordt elke nacht kouder."
        tags: [admission]
        unlocks:
          facts: [heard:el_amrani]
          proposals: [check_existing_connection]
    proposals:
      - id: name_a_date
        label: "Een datum noemen"
        say: "Volgens de planning bent u over een week of zes aangesloten. Dat wordt dan {promise_date:42}."
        addresses: [interest]
        reply: "Op {promise_date:42}. Ik schrijf het op, met de datum van vandaag erbij."
        # D9 talks audit A4: recorded with the talk's day (People.promises); the date named
        # ({promise_date:42}, GameSession.fill_tokens) is the day the simulation checks (Missions)
        promise: {kind: delivery_date, days: 42}
      - id: honest_window_and_contact
        label: "Eerlijk zijn, en één aanspreekpunt"
        say: "Ik ga u geen datum beloven die ik niet zeker weet. Ik zoek uit waar uw dossier ligt, ik bel u vrijdag terug, en vanaf nu heeft u één aanspreekpunt: mij."
        addresses: [interest, concern]
        reply: "Vrijdag. U. Goed. Ik schrijf uw naam op."
        promise: {kind: callback, days: 3}
      - id: check_existing_connection
        label: "Kan de warmtepomp nu al draaien?"
        say: "Er is misschien iets wat sneller kan. Veel warmtepompen kunnen al op een gewone aansluiting draaien, op een lagere stand. Mag ik een monteur laten kijken of dat bij u kan, voor de winter?"
        hidden: true
        addresses: [concern]
        reply: "Dus… mijn moeder zit misschien volgende week al warm? Waarom heeft niemand dat gezegd?"
    lines:
      confront: "Mevrouw, als u de aanvraag compleet had ingevuld, was het sneller gegaan."
      inquiry: "Wat wilt u het liefst weten, als u één ding mocht vragen?"
    replies:
      confront:
        lands: {text: "Het formulier vroeg er niet om! Ik heb het hier, uitgeprint."}
      mood:
        lands: {text: "Hoe het gaat? Ik ken uw wachtmuziek inmiddels uit mijn hoofd. Vivaldi, toch?"}
      open_question:
        lands: {text: "Aangevraagd op {aanvraag_datum}. Een week later de ontvangstbevestiging, nummer erbij. Sindsdien hoor ik alleen Vivaldi.", tags: [claim], tell: facts}
      paraphrase:
        lands: {text: "Vier keer, ja. Ik heb ze genummerd. Datum, tijd, en de naam van wie ik sprak.", tags: [claim], tell: facts}
      empathy:
        lands: {text: "Begrip heb ik genoeg gehad. Drie keer. Ik heb het opgeschreven, kijk: 'begrip'.", tell: facts}
      inquiry:
        lands: {text: "Waar mijn aanvraag nu ligt. Bij wie. Sinds wanneer. Dat staat toch ergens in een systeem? En… of ik deze winter warm zit.", tags: [claim, hesitation]}
      perspective:
        lands: {text: "Vanuit uw kant? U zit daar met honderd mensen zoals ik. … Goed. Maar ik ben wel deze."}
    outcomes:
      commitment: "Goed. Ik wacht op uw telefoontje. En als u niet belt, bel ik. Dat weet u."
      partial: "Ik schrijf het op. Als het niet klopt, hoort u van me."
      heard: "Dank u dat u luisterde. Dat is de eerste keer."
      compliance: "Ik heb geen keus, hè. Ik schrijf het op."
      ruined: "Dan bel ik de Geschillencommissie. Het nummer staat al in mijn schrift."

