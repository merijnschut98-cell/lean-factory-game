  # ── Petra en de maandrun (Acts 0–II scripts §6.1) ─────────────
  - id: petra_batch
    name: "Petra en de maandrun"
    person: petra
    kind: persuade
    mission: fix_done_but_not_closed
    owns: done_but_not_closed
    patience: 10
    opening: "Als je komt voor de EAN van die familie: die zit in de maandrun. Volgende week dinsdag."
    warning: "Mijn cijfers kloppen. Wat wil je nog meer?"
    position: {text: "Eens per maand registreren is efficiënter. Dan doe ik de hele stapel in één keer, en alles klopt.", tags: [claim], tell: facts}
    layers:
      - id: interest
        at: 55
        via: [inquiry, open_question, paraphrase]
        text: "Je kent de Molen. Een kwartier opstarten, elke keer. Dus doe ik het één keer per maand. Dat is de rekensom, en die klopt. Alleen staat er in die rekensom geen familie die op een EAN wacht."
        tags: [claim, feeling]
      - id: concern
        at: 72
        via: [show_data, paraphrase]
        lead_in: {text: "Het klopt allemaal, hoor. Het staat in mijn map. Alleen…", tags: [hesitation, claim], tell: facts}
        text: "Weet je waarom die maandrun me eigenlijk goed uitkomt? Als ik een week ziek ben, schuift hij gewoon een weekje op. Niemand die het merkt. Doe ik het elke dag en ik ben er niet, dan ziet iedereen het meteen. Dan is Petra het probleem."
        tags: [admission]
        condition: "Ik wil het wel. Maar niet zolang ik de enige ben."
        unlocks:
          facts: [heard:petra_alone]
          proposals: [rachid_backup]
    data: [done_but_not_closed:0, done_but_not_closed:3]
    proposals:
      - id: daily_run
        label: "Elke dag één sessie"
        say: "Wat als je elke dag om vier uur één sessie doet, met wat er die dag klaar is?"
        addresses: [interest]
        reply: "Elke dag een kwartier opstarten. Dat is twintig keer zoveel opstarten."
      - id: same_day
        label: "Registreren op de dag zelf"
        say: "De monteur meldt het af, en jij registreert het dezelfde dag."
        addresses: []
        reply: "Dezelfde dag. En als ik er niet ben?"
      - id: rachid_backup
        label: "Rachid leert het van je"
        say: "Wat als Rachid van Intake het van je leert? Eén middag per week naast je. Dan ben je niet meer de enige."
        hidden: true
        addresses: [concern]
        reply: "Rachid. Die is precies. … Dan kan ik ook eens op vakantie zonder de maandrun in mijn hoofd."
    experiments:
      - id: shorter_login
        label: "De inlog van de Molen korter"
        say: "Ik vraag IT of de inlog korter kan. Eén token in plaats van twee, en de controles automatisch."
        addresses: [interest]
        reply: "Dat vraag ik al vier jaar. Maar goed. Als jij het vraagt…"
      - id: "sick_week_a4"
        label: "Eén A4 voor als Petra er niet is"
        say: "We schrijven samen op wat er moet gebeuren als jij een week weg bent. Eén A4, en iemand oefent het één keer."
        addresses: [concern]
        reply: "Een A4 voor als ik ziek ben. Dan hoef ik niet ziek te zijn met mijn laptop op schoot."
    co_proposal: {id: rachid_backup, text: "Als Rachid het leert, wil ik het wel elke ochtend doen. Dan zie ik het werk ook eens stromen in plaats van stapelen."}
    replies:
      show_data:
        lands: {text: "Twee weken… voor elke aansluiting? Ik dacht altijd: het is maar administratie."}
        misses: {text: "Mijn cijfers kloppen. Tot op de laatste EAN."}
      perspective:
        lands: {text: "Vanuit de klant… die heeft een kabel in de grond en een leverancier die zegt dat hij niet bestaat. Ja. Dat is geen administratie meer. Dat is een koude woonkamer."}
    outcomes:
      commitment: "Afgesproken. Elke ochtend. En jij regelt die token."
      partial: "Ik wil het wel. Maar niet zolang ik de enige ben."
      heard: "Je bent de eerste die naar de Molen vraagt."
      compliance: "Als het moet. Dan doe ik het elke dag. Tot ik ziek ben."
      ruined: "Dus ik doe het al elf jaar fout. Fijn om te horen."

  # ── Henk en de camera (Acts 0–II scripts §6.2) ─────────────
  - id: henk_camera
    name: "Henk en de camera"
    person: henk
