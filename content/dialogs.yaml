      - "Even, bij de koffie. Die vraagt wel door, hoor."
  - id: third_call
    teams: [contact_centre]
    lines:
      - "Die mevrouw van gisteren belde weer. Al voor de derde keer."
      - "En wij kunnen haar weer niks vertellen. Dat is nog het ergste."
  - id: study_board
    teams: [grid_analysts]
    load: busy
    lines:
