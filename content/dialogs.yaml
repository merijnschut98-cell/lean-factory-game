  # ── Het vierde telefoontje van mevrouw El Amrani (Acts 0–II scripts §6.1) ─────────────
  - id: el_amrani_fourth_call
    name: "Het vierde telefoontje van mevrouw El Amrani"
    person: el_amrani
    kind: persuade
    # She rings during the status callers, or before the frost if the player never got there (arc S11).
    missions: [fix_status_callers, winter_el_amrani]
    mood: gespannen
    patience: 10
    opening: "{groet}. U spreekt met Fatima El Amrani. Ik bel voor de vierde keer, en ik heb ze allemaal opgeschreven."
    variants:
      # The date she was given has passed without a connection (Missions: promise_broken): she
      # reads it from her notebook (drie winters §3); the talk opens lower (People memory).
      - needs: {all: ["promise_broken:el_amrani_fourth_call"]}
        opening: "{groet}, met Fatima El Amrani. Ik heb mijn schrift voor me. Hier staat: 'Volgens de planning over een week of zes aangesloten.' Met de datum erbij, en uw naam. Die datum is geweest."
    warning: "Ik heb geen behoefte aan een riedeltje."
    position: {text: "Ik wil een datum. Een echte. Anders ga ik naar de Geschillencommissie.", tags: [claim], tell: facts}
    layers:
      - id: interest
        at: 45
        via: [paraphrase, inquiry]
        text: "Drie weken geleden, dinsdag, kwart over tien: 'binnenkort'. Twee weken geleden: 'we zijn ermee bezig'. Vorige week wist niemand het. Ik wil gewoon weten waar ik aan toe ben."
        tags: [claim, feeling]
      - id: concern
        at: 65
        via: [reflect, empathy]
        lead_in: {text: "Het gaat niet eens om mij… Ik ben bang, als ik eerlijk ben.", tags: [feeling]}
        text: "Mijn moeder woont bij ons. Ze is eenentachtig en heeft het altijd koud. De installateur zei: haal die cv-ketel eruit, de warmtepomp is beter. Die hangt nu aan de muur. Zonder stroom. Het wordt elke nacht kouder."
        tags: [admission]
        unlocks:
          facts: [heard:el_amrani]
          proposals: [check_existing_connection]
    proposals:
      - id: name_a_date
        label: "Een datum noemen"
        say: "Volgens de planning bent u over een week of zes aangesloten. Dat wordt dan {promise_date:42}."
        addresses: [interest]
        reply: "Op {promise_date:42}. Ik schrijf het op, met de datum van vandaag erbij."
        # D9 talks audit A4: recorded with the talk's day (People.promises); the date named
        # ({promise_date:42}, GameSession.fill_tokens) is the day the simulation checks (Missions)
        promise: {kind: delivery_date, days: 42}
      - id: honest_window_and_contact
        label: "Eerlijk zijn, en één aanspreekpunt"
        say: "Ik ga u geen datum beloven die ik niet zeker weet. Ik zoek uit waar uw dossier ligt, ik bel u vrijdag terug, en vanaf nu heeft u één aanspreekpunt: mij."
        addresses: [interest, concern]
        reply: "Vrijdag. U. Goed. Ik schrijf uw naam op."
        promise: {kind: callback, days: 3}
      - id: check_existing_connection
        label: "Kan de warmtepomp nu al draaien?"
        say: "Er is misschien iets wat sneller kan. Veel warmtepompen kunnen al op een gewone aansluiting draaien, op een lagere stand. Mag ik een monteur laten kijken of dat bij u kan, voor de winter?"
        hidden: true
        addresses: [concern]
        reply: "Dus… mijn moeder zit misschien volgende week al warm? Waarom heeft niemand dat gezegd?"
    lines:
      confront: "Mevrouw, als u de aanvraag compleet had ingevuld, was het sneller gegaan."
      inquiry: "Wat wilt u het liefst weten, als u één ding mocht vragen?"
    replies:
      confront:
        lands: {text: "Het formulier vroeg er niet om! Ik heb het hier, uitgeprint."}
      mood:
        lands: {text: "Hoe het gaat? Ik ken uw wachtmuziek inmiddels uit mijn hoofd. Vivaldi, toch?"}
      open_question:
        lands: {text: "Aangevraagd op {aanvraag_datum}. Een week later de ontvangstbevestiging, nummer erbij. Sindsdien hoor ik alleen Vivaldi.", tags: [claim], tell: facts}
      paraphrase:
        lands: {text: "Vier keer, ja. Ik heb ze genummerd. Datum, tijd, en de naam van wie ik sprak.", tags: [claim], tell: facts}
      empathy:
        lands: {text: "Begrip heb ik genoeg gehad. Drie keer. Ik heb het opgeschreven, kijk: 'begrip'.", tell: facts}
      inquiry:
        lands: {text: "Waar mijn aanvraag nu ligt. Bij wie. Sinds wanneer. Dat staat toch ergens in een systeem? En… of ik deze winter warm zit.", tags: [claim, hesitation]}
      perspective:
        lands: {text: "Vanuit uw kant? U zit daar met honderd mensen zoals ik. … Goed. Maar ik ben wel deze."}
    outcomes:
      commitment: "Goed. Ik wacht op uw telefoontje. En als u niet belt, bel ik. Dat weet u."
      partial: "Ik schrijf het op. Als het niet klopt, hoort u van me."
      heard: "Dank u dat u luisterde. Dat is de eerste keer."
      compliance: "Ik heb geen keus, hè. Ik schrijf het op."
      ruined: "Dan bel ik de Geschillencommissie. Het nummer staat al in mijn schrift."

  # ── Petra en de maandrun (Acts 0–II scripts §6.1) ─────────────
  - id: petra_batch
    name: "Petra en de maandrun"
    person: petra
    kind: persuade
    mission: fix_done_but_not_closed
    owns: done_but_not_closed
    patience: 10
    opening: "Als je komt voor de EAN van die familie: die zit in de maandrun. Volgende week dinsdag."
    warning: "Mijn cijfers kloppen. Wat wil je nog meer?"
    position: {text: "Eens per maand registreren is efficiënter. Dan doe ik de hele stapel in één keer, en alles klopt.", tags: [claim], tell: facts}
    layers:
      - id: interest
        at: 55
        via: [inquiry, open_question, paraphrase]
        text: "Je kent de Molen. Een kwartier opstarten, elke keer. Dus doe ik het één keer per maand. Dat is de rekensom, en die klopt. Alleen staat er in die rekensom geen familie die op een EAN wacht."
        tags: [claim, feeling]
      - id: concern
        at: 72
        via: [show_data, paraphrase]
        lead_in: {text: "Het klopt allemaal, hoor. Het staat in mijn map. Alleen…", tags: [hesitation, claim], tell: facts,
                  again: ["Het klopt, hoor. Alleen…", "Nou ja…", "Het punt is…"]}
        text: "Weet je waarom die maandrun me eigenlijk goed uitkomt? Als ik een week ziek ben, schuift hij gewoon een weekje op. Niemand die het merkt. Doe ik het elke dag en ik ben er niet, dan ziet iedereen het meteen. Dan is Petra het probleem."
        tags: [admission]
        condition: "Ik wil het wel. Maar niet zolang ik de enige ben."
        unlocks:
          facts: [heard:petra_alone]
          proposals: [rachid_backup]
    data: [done_but_not_closed:0, done_but_not_closed:3]
    proposals:
      - id: daily_run
        label: "Elke dag één sessie"
        say: "Wat als je elke dag om vier uur één sessie doet, met wat er die dag klaar is?"
        addresses: [interest]
        reply: "Elke dag een kwartier opstarten. Dat is twintig keer zoveel opstarten."
      - id: same_day
        label: "Registreren op de dag zelf"
        say: "De monteur meldt het af, en jij registreert het dezelfde dag."
        addresses: []
        reply: "Dezelfde dag. En als ik er niet ben?"
      - id: rachid_backup
        label: "Rachid leert het van je"
        say: "Wat als Rachid van Intake het van je leert? Eén middag per week naast je. Dan ben je niet meer de enige."
        hidden: true
        addresses: [concern]
        reply: "Rachid. Die is precies. … Dan kan ik ook eens op vakantie zonder de maandrun in mijn hoofd."
    experiments:
      - id: shorter_login
        label: "De inlog van de Molen korter"
        say: "Ik vraag IT of de inlog korter kan. Eén token in plaats van twee, en de controles automatisch."
        addresses: [interest]
        reply: "Dat vraag ik al vier jaar. Maar goed. Als jij het vraagt…"
      - id: "sick_week_a4"
        label: "Eén A4 voor als Petra er niet is"
        say: "We schrijven samen op wat er moet gebeuren als jij een week weg bent. Eén A4, en iemand oefent het één keer."
        addresses: [concern]
        reply: "Een A4 voor als ik ziek ben. Dan hoef ik niet ziek te zijn met mijn laptop op schoot."
    co_proposal: {id: rachid_backup, text: "Als Rachid het leert, wil ik het wel elke ochtend doen. Dan zie ik het werk ook eens stromen in plaats van stapelen.",
                  take: "Goed. Dan vraag ik Rachid of hij een middag per week kan."}
    # Rewritten to the reference standard (docs/qa/dialog-coherence-2026-10-30.md):
    # the player's sentences answer what Petra spoke of last, in the order written;
    # her answers fit the question and never come back word for word.
    lines:
      mood:
        position: ["Hoe gaat het met je, met de maandrun voor de deur?", "En hoe is het met jou, deze week?"]
        lead_in: "Gaat het?"
        _: ["Hoe gaat het nu echt met je, met die maandrun?", "En jij, hoe hou je het bij?", "Hoe is het met je, naast die Molen?"]
      open_question:
        position: ["Hoe ziet zo'n maandrun eruit?", "Wat gebeurt er met een aansluiting tussen afmelden en registreren?", "Wat maakt het efficiënter, één keer per maand?"]
        interest: ["Wat merkt zo'n familie van die paar weken?", "Hoe zou het eruitzien als het elke dag kon?"]
        lead_in: "Alleen wat?"
        concern: ["Wat zou er moeten gebeuren, zodat jij niet de enige bent?", "Wie zou het van je kunnen overnemen?"]
        _: ["Hoe gaat dat hier op een gewone dag?", "Vertel eens, hoe loopt het werk hier?"]
      empathy:
        position: ["Dat je alles tot op de laatste EAN laat kloppen, is veel werk.", "De Molen elke keer opstarten. Dat zou mij ook tegenstaan.", "Je hebt het al die jaren alleen gedaan. Dat is niet niks."]
        interest: ["Dat je zelf aan die familie denkt, zegt veel.", "Een rekensom die klopt, en toch wacht er iemand. Dat is lastig."]
        lead_in: ["Zeg het maar.", "Ik luister."]
        concern: ["Dat lijkt me zwaar: dat het meteen opvalt als jij er niet bent.", "Logisch dat die maandrun dan veilig voelt."]
        _: ["Dat is ook niet niks.", "Dat lijkt me best lastig."]
      reflect:
        position: ["Het klinkt alsof je er zeker van bent dat het zo het beste is.", "Je klinkt alsof je je werk moet verdedigen."]
        interest: ["Het klinkt alsof die familie je toch dwarszit.", "Je klinkt alsof de rekensom voor jou niet meer helemaal klopt."]
        lead_in: ["Er klopt iets niet, merk ik.", "Je aarzelt, zie ik."]
        concern: ["Je bent bang dat jij het probleem wordt, klinkt het.", "Het klinkt alsof je je er alleen in voelt."]
        _: ["Je klinkt een beetje gespannen.", "Het klinkt alsof je ermee zit."]
      paraphrase:
        position: ["Dus één keer per maand, omdat het dan in één keer klopt.", "Dus de EAN van die familie komt pas in de maandrun."]
        interest: ["Dus de rekensom klopt, maar er staat geen familie in die wacht.", "Dus het opstarten van de Molen bepaalt hoe vaak je registreert."]
        lead_in: "Dus het klopt, maar er is iets wat niet in je map staat."
        concern: ["Dus met een maandrun valt het niet op als jij een week weg bent.", "Dus als je het elke dag doet, ben jij straks het probleem als je ziek bent."]
        _: ["Dus het moet vooral kloppen.", "Als ik je goed hoor, gaat het om de Molen."]
      inquiry:
        position: ["Efficiënter voor wie?", "Wie wacht er op die maandrun?"]
        interest: ["Waarom moet de Molen elke keer een kwartier opstarten?", "Wat zou er gebeuren als je het elke dag deed?"]
        lead_in: "Alleen…?"
        concern: ["Wat gebeurt er nu als je ziek bent?", "Heeft iemand ooit gevraagd wie je vervangt?"]
        _: ["Waar komt dat door, denk je?", "Hoe zit dat precies?"]
      experience:
        position: ["Ik herken dat: als je het zelf doet, weet je dat het klopt.", "Ik zag het in mijn eerste week al: jouw map is goud waard."]
        lead_in: "Je hoeft het niet mooi te zeggen, hoor."
        concern: ["Dat herken ik. Als je de enige bent die iets kan, durf je niet weg.", "Bij mijn vorige baan had ik als enige de sleutel. Ziek zijn durfde ik niet."]
        _: ["Dat herken ik wel, dat het moet kloppen.", "Ik ben hier nu een paar weken, maar ik zie het al."]
      silence:
        position: "(je knikt en wacht)"
        _: ["(je wacht even)", "(je wacht rustig af)", "(je kijkt mee naar haar scherm en wacht)"]
      perspective:
        _: ["Hoe kijkt die familie hier tegenaan, denk je?", "Wat merkt de leverancier van die maandrun?"]
      show_data: {_: ["Kijk, dit vond ik: {data}", "Mag ik je iets laten zien? {data}", "Dit kwam ik tegen: {data} Hoe kijk jij daarnaar?"]}
      pressure: {_: ["Het MT wil dat die EAN's sneller gaan. Liever met jou dan zonder jou.", "Dit moet echt anders, Petra.", "Ruud verwacht dat dit opgelost wordt."]}
      confront: {_: ["Ligt het niet gewoon aan die maandrun?", "Eerlijk gezegd lijkt het erop dat het bij jou blijft liggen.", "Waarom blijven die aansluitingen bij jou liggen?"]}
      ask_commitment: {_: ["Zullen we dat zo doen?", "Afgesproken?"]}
      close: ["Dank je, Petra. Ik laat je.", "Ik ga. Tot later."]
    replies:
      show_data:   # each clue its own answer (review 2 #4)
        lands:
