        reply: "Drie maten. Een 400 die we niet nodig hebben, gaat naar het volgende project. Dat is geen kapstok. Dat is voorraad."
      - id: framework_contract
        label: "Een raamcontract met de fabrikant"
        say: "Een raamcontract met de fabrikant: vaste productieplekken, en wij roepen per project af."
        addresses: [interest]
        reply: "Een raamcontract gaat via een aanbesteding. Dat duurt. Maar het is netjes."
    experiments:
      - id: one_project_you_evaluate
        label: "Eén project, Rob beoordeelt"
        say: "Eén project, De Boomgaard: bestellen na de netstudie, in een standaardmaat. U schrijft zelf de evaluatie."
        addresses: [concern]
        reply: "Eén project, en ik schrijf de evaluatie. Daar kan ik mee leven."
    co_proposal: {id: standard_sizes, text: "Als ik die drie maten in de procedure mag zetten. Met mijn naam eronder. Dan staat er een keer iets goeds van mij in een rapport."}
    lines:
      experience: "Ik heb ooit een verkeerde bestelling op mijn naam gehad. Niemand weet het meer, behalve ik."
    replies:
      show_data:
        lands: {text: "Zeven maanden doorlooptijd, waarvan twee weken werk in de straat. Dus de rest is… wachten op ons eigen papier."}
        misses: {text: "Cijfers zonder procedure zijn een mening."}
      experience:
        lands: {text: "Dan weet u het. Zo'n rapport gaat niet weg. Het staat er gewoon, elk jaar weer.", tags: [admission], tell: safety}
      perspective:
        lands: {text: "Vanuit die kopers in De Boomgaard? Die hebben hun huur opgezegd. En wij hebben een regel die zegt: wacht maar. Hm."}
    outcomes:
      commitment: "Conform. Ik pas de procedure aan. En die uitdraai mag u houden; die klopt vanaf maandag niet meer."
      partial: "Ik wil het wel. Maar niet zonder standaardmaten."
      heard: "U bent de eerste die vraagt wáárom die regel er staat."
      compliance: "Als de directie het wil, bestel ik. Op uw naam."
      ruined: "Ik volg de procedure. Als u die wilt veranderen, loopt dat via de directie."

  # ── Thomas en de lege megawatts (Acts 0–II scripts §7) ─────────────
  - id: thomas_reclaim
    name: "Thomas en de lege megawatts"
    person: thomas
    kind: persuade
    mission: fix_unused_capacity
    owns: unused_capacity
    patience: 10
    opening: "Als je komt om mijn klanten capaciteit af te pakken: ik heb om drie uur een lunch op de Kanaalzone."
    warning: "Mijn klanten zijn geen spreadsheet."
    position: {text: "Ik ga mijn klanten niet vragen capaciteit in te leveren. Ze hebben een contract. Dat is hun recht.", tags: [claim], tell: fairness}
    layers:
      - id: interest
        at: 55
        via: [reflect, open_question, paraphrase]
        text: "Logistiek Zuid heeft twee megawatt omdat ze willen uitbreiden. Over twee jaar, misschien. Als ik dat nu afpak en ze groeien, staan zíj in de rij."
        tags: [claim]
      - id: concern
        at: 70
        via: [silence, empathy, inquiry]
        lead_in: {text: "Kijk, het is…", tags: [hesitation]}
        text: "Ik ken die mensen twintig jaar. Ik was bij hun opening, bij de begrafenis van de oude Van Hal. Als ik nu bel om iets af te pakken, ben ik de man die afpakt. Dan bellen ze mij nooit meer als eerste."
        tags: [admission]
        tell: fairness
        unlocks:
          facts: [heard:thomas_relations]
          proposals: [offer_a_cbc]
    data: [unused_capacity:0, unused_capacity:2]
    proposals:
      - id: reclaim_by_the_rules
        label: "Terugvragen, volgens de ACM-regels"
        say: "Wie structureel veel minder gebruikt dan hij gecontracteerd heeft, krijgt het verzoek een deel terug te geven. Volgens de regels van de ACM en het contract."
        addresses: [interest]
        reply: "Volgens de regels. Ja. Maar ík ben degene die belt."
      - id: usage_dashboard
        label: "Klanten zien hun eigen gebruik"
        say: "Laat klanten elk kwartaal zien wat ze gebruiken tegenover wat ze hebben."
        addresses: [interest]
        reply: "Dat zou ik zelf ook weleens willen zien, eerlijk gezegd."
      - id: offer_a_cbc
        label: "Bellen met een aanbod"
        say: "Bel ze niet om iets af te pakken, maar met een aanbod: een capaciteitsbeperkingscontract. Ze houden hun contract, en krijgen betaald als ze op de drukste uren minder afnemen."
        hidden: true
        addresses: [concern]
        reply: "Ik bel om ze geld te bieden. Dat is een heel ander gesprek."
    experiments:
      - id: ask_one_customer
        label: "Eén klant bellen, alleen met een vraag"
        say: "Bel één klant die je goed kent, en vraag alleen hoe ze hun capaciteit gebruiken. Geen verzoek. Een vraag."
        addresses: [concern]
        reply: "Een vraag. Dat kan ik. Dat doe ik al twintig jaar."
    co_proposal: {id: offer_a_cbc, text: "Laat mij de eerste drie bellen. Ik weet wie ruimte heeft en wie niet. Logistiek Zuid niet als eerste; die zitten midden in een herfinanciering."}
    replies:
      open_question:
        lands: {text: "Ik verkoop die mensen al twintig jaar zekerheid. Nu moet ik ze bellen dat die zekerheid tijdelijk was. Dat vind ik niet netjes.", tell: fairness}
      show_data:
        lands: {text: "Tweeënzestig procent. Op het drukste kwartier van het jaar. Dus de rest staat er voor… voor de zekerheid."}
        misses: {text: "Een gemiddelde. Mijn klanten zijn geen gemiddelde."}
      perspective:
        lands: {text: "Vanuit Ilse? Die staat om vier uur 's nachts bij gasovens van 1998, naast een lege hal met twee megawatt. … Ja. Dat zou ik ook niet kunnen uitleggen."}
    outcomes:
      commitment: "Afgesproken. Ik bel. Met een aanbod, niet met een rekening."
      partial: "Ik doe mee. Als het in de taal van een aanbod blijft."
      heard: "Fijn dat je het vroeg. De meeste mensen hier zien alleen megawatts."
      compliance: "Goed. Ik stuur ze de brief. Mijn naam staat er niet onder."
      ruined: "Ik bel mijn klanten niet om ze te bedreigen. Ook niet voor jou."

  # ── Ilse en de wachtrij (Acts 0–II scripts §7) ─────────────
  - id: ilse_queue
    name: "Ilse en de wachtrij"
    person: ilse
    kind: persuade
    mission: fix_unused_capacity
    mood: gespannen
    patience: 10
    opening: "Met Ilse de Graaf. Bakkerij De Graaf. Ik sta hier sinds vier uur, dus maak het kort."
    warning: "Als je me een folder gaat voorlezen, hang ik op."
    position: {text: "Twee jaar. Twee jaar sta ik op jullie lijst. En om vier uur sta ik weer aan de oven.", tags: [claim], tell: time}
    layers:
      - id: interest
        at: 45
        via: [paraphrase, empathy]
        text: "En naast me staat een hal met twee megawatt. Leeg. Leg me eens uit waarom het net vol is."
        tags: [claim, feeling]
      - id: concern
        at: 66
        via: [reflect, empathy]
        lead_in: {text: "Ik slaap er slecht van, weet je dat? Wat ik echt bang voor ben…", tags: [feeling]}
        text: "Mijn ovens zijn van 1998. Gaat er één kapot, dan koop ik een nieuwe gasoven. Want dat kan wél, morgen. En dan zit ik nog twintig jaar aan het gas. Dat wil ik niet. Mijn dochter wil de zaak overnemen."
        tags: [admission]
        tell: time
        unlocks:
          facts: [heard:ilse_lockin]
          proposals: [night_contract, call_before_gas]
    proposals:
      - id: honest_status
        label: "Eerlijk zeggen waar ze staat"
        say: "Ik kan geen datum beloven. Wel eerlijk zeggen waar u staat, en u elk kwartaal bellen."
        addresses: [interest]
        reply: "Elk kwartaal. Nou. Dat is meer dan ik nu krijg."
      - id: night_contract
        label: "Een contract voor de nacht"
        say: "U bakt 's nachts, als het net leeg is. Ik ga met onze accountmanager kijken of er een contract kan voor de daluren, zodat u niet hoeft te wachten tot alles verzwaard is."
        hidden: true
        addresses: [concern]
        reply: "Een contract voor de nacht. Dan bak ik elektrisch voordat de rest wakker is."
      - id: call_before_gas
        label: "Eerst bellen, dan pas een oven kopen"
        say: "Als een oven het begeeft voordat u aangesloten bent: bel mij, voordat u een gasoven koopt. Dan kijken we samen wat er op uw huidige aansluiting kan."
        hidden: true
        addresses: [concern]
        reply: "Bellen voordat ik een gasoven koop. Ja. Dat beloof ik."
    co_proposal: {id: night_contract, text: "Ik bak om vier uur 's nachts. Is jullie net dan ook vol?"}
    replies:
      reflect:
        lands: {text: "Ja. Ik ben moe. Ik bak al dertig jaar op dezelfde plek, en ik wil gewoon verder.", tags: [claim, feeling], tell: time}
      perspective:
        lands: {text: "Vanuit jullie? Ja, ja. Iedereen wil tegelijk. Maar ik bak niet tegelijk. Ik bak als iedereen slaapt."}
    outcomes:
      commitment: "Om vier uur sta ik hier toch. Als het lukt, krijgt die accountmanager van jullie een krentenbol. Twee."
      partial: "Ik wacht. Maar niet nog twee jaar."
      heard: "Fijn dat er eens iemand luistert in plaats van voorleest."
      compliance: "Ik heb geen keus, hè."
      ruined: "Dan ga ik naar de ACM. En naar de krant."

  # ── Petra en de zwijgende meters (Act II side, fix_silent_meter; spec 2026-10-17-act2-side-talks.md) ─────
  # The way in is the record and then a doubt: her interest opens to the data (her own pattern, confirmed)
  # or to the monteur's side; her concern is a doubt, drawn out by Ervaring delen or the numbers.
  - id: petra_silent_meters
    name: "Petra en de zwijgende meters"
    person: petra
    kind: persuade
    mission: fix_silent_meter
    owns: silent_meter
    mood: neutraal
    patience: 10
    opening: "Je komt voor de lijst. Hier. Tweeënveertig meters die niks zeggen. Ik heb ze per straat gesorteerd."
    warning: "Mijn lijst klopt. Daar hoef je niet over te beginnen."
    position: {text: "Iedereen zegt: de meters van de nieuwe leverancier deugen niet. Dat kan. Maar dan zou het overal zijn. Het is niet overal.", tags: [claim], tell: facts}
    layers:
      - id: interest
        at: 52
        via: [show_data, perspective]   # the record or the other side; listening alone does not open her pattern
        text: "De Lindeflats. De Kade. De Hofstede. Allemaal nieuwbouw, allemaal met de meterkast in een betonnen kelderberging. In de rijtjeshuizen heb ik er bijna geen."
        tags: [claim]
      - id: concern
        at: 66
        via: [experience, show_data]    # a doubt: a true story of the player's own, or the numbers in black and white, make it smaller
        lead_in: {text: "Ik weet het alleen niet zeker. En wat ik niet zeker weet, zeg ik liever niet.", tags: [hesitation, doubt]}
        text: "De vorige keer dat er iets bij Meetdata bleef liggen, wist de hele kantine het binnen een week. Als ik nu zeg dat het niet aan de meters ligt maar aan hoe we ze plaatsen, dan zegt Meetdata weer iets over de monteurs. En het staat nog niet in mijn map."
        tags: [admission]
        tell: facts
        unlocks:
          clue: {key: true, depth: 2, text: "'Het lampje op de meter zegt na een paar minuten of hij verbinding heeft. Maar dan is de monteur al weg. Niemand wacht erop.'"}
          facts: [heard:petra_meters]
          proposals: [petra_rides_along]
    data: [silent_meter:0, silent_meter:3]
    proposals:
      - id: supplier_complaint
        label: "Een klacht naar de leverancier"
        say: "We sturen een klacht naar de leverancier, met jouw lijst erbij."
        addresses: []
        reply: "Kan. Dan sturen ze nieuwe meters. Die hangen dan in dezelfde kelders."
      - id: list_by_address
        label: "De lijst per adres naast elkaar"
        say: "Zullen we je lijst naast de adressen leggen? Flat of rijtjeshuis, kelder of gang."
        addresses: [interest]
        reply: "Per adres. Dat kan ik vanmiddag. Dan staat het tenminste in mijn map."
      - id: petra_rides_along
        label: "Petra kijkt één ochtend mee bij het plaatsen"
        say: "Wat als jij één ochtend meegaat naar de Lindeflats? Jij en de monteur kijken samen naar dat lampje. Dan staat het in jouw map én in de zijne."
        hidden: true
        addresses: [concern]
        reply: "Samen kijken. Dan is het geen Meetdata tegen de monteurs. Dan is het gewoon gemeten. … Klopt."
    experiments:
      - id: one_street_two_weeks
        label: "Twee weken, één flat: wachten op het lampje"
        say: "Twee weken, één flat: de monteur wacht tot de meter verbinding heeft voordat hij wegrijdt. Jij houdt bij wat er gebeurt."
        addresses: [interest, concern]
        reply: "Twee weken. Dan heb ik het zwart op wit. Of niet. Dat is ook een uitkomst."
    co_proposal: {id: petra_rides_along, text: "Laat mij één ochtend met een monteur mee naar de Lindeflats. Hij plaatst, ik kijk naar het lampje. Dan zien we het allebei."}
    lines:
      perspective: "Hoe zou de monteur die bij de Lindeflats stond dit zien, denk je?"
      experience: "Mijn eerste week dacht ik dat de stapel bij Werkvoorbereiding aan Anouk lag. Het lag aan hoe de bakken stonden. Ik had het niet gezien als ik het niet had geteld."
    replies:
      show_data:
        lands: {text: "Drie op de tien in de flats. Eén op de twintig elders. … Dat had ik ook. Ik had het alleen nog niet opgeschreven.", tags: [claim], tell: facts}
        misses: {text: "Een gemiddelde over de hele regio. Daar zit het niet in."}
      perspective:
        lands: {text: "De monteur? Die plaatst, sluit de kast en rijdt door. Zo is het hem geleerd. Hij ziet nooit wat ik zie, een week later.", tags: [claim]}
      experience:
        lands: {text: "Geteld. Ja. … Ik heb het eigenlijk al geteld. Ik heb het alleen nog niemand laten zien."}
    outcomes:
      commitment: "Klopt. De eerste ochtend dat er een monteur naar de Lindeflats gaat, ga ik mee. Met de lijst. En mijn map."
      partial: "Ik wil het wel. Als het eerst per adres in de lijst staat."
      heard: "Hm. Je liet me het zelf zeggen. Dat was nodig, geloof ik."
      none: "Ik moet de lijst nog bijwerken."
      compliance: "Als je het zo wilt. Het komt in de map."
      ruined: "Dan vraag je het maar aan de Molen."

  # ── Wim en tabblad drie (Act II side, fix_inverters_tripping; spec 2026-10-17-act2-side-talks.md) ─────
  # The way in is a feeling and then the record: his interest opens when someone names what three years of
  # receipts feel like (or asks how he is); his concern comes out only on our own data, or the monteur's side.
  - id: wim_spreadsheet
    name: "Wim en tabblad drie"
    person: wim
    kind: persuade
    mission: fix_inverters_tripping
    owns: inverters_tripping
    mood: neutraal
    patience: 10
    opening: "Goedemiddag. Kortekaas, Zonnestraat veertien. U kent mij waarschijnlijk van de spreadsheets."
    warning: "Met alle respect: dit zei de vorige meneer ook."
    position: {text: "Elke maand stuur ik u mijn metingen. Elke maand krijg ik een ontvangstbevestiging. Zesendertig ontvangstbevestigingen. Ik heb ze bewaard.", tags: [claim, feeling], tell: recognition}
    layers:
      - id: interest
        at: 50
        via: [reflect, mood]            # a feeling under the irony: name it, or ask how he is
        text: "Het is winter, dus u denkt: nu heeft hij nergens last van. Maar in maart begint het weer. Op een zonnige middag gaat mijn omvormer uit. Tien minuten later aan. Dan weer uit. Bij de buren ook. Twintig adressen inmiddels."
        tags: [claim]
      - id: concern
        at: 66
        via: [show_data, perspective]   # the record: our numbers next to his
        lead_in: {text: "Ik heb het in 2023 al opgeschreven. Tabblad drie. Elke zonnige middag boven de tweehonderddrieënvijftig volt.", tags: [hesitation, claim], tell: recognition}
        text: "Mijn buren noemen me de zeur van de Zonnestraat. Twintig mensen klagen nu, en ze kijken allemaal naar mij. Ik heb veertig jaar in de elektrotechniek gewerkt. Heb ik het mis, dan ben ik een oude man met een spreadsheet. Heb ik het goed, dan heeft niemand drie jaar gekeken."
        tags: [admission]
        tell: recognition
        unlocks:
          clue: {key: true, depth: 2, text: "'Het is niet één huis. Kijk op een zonnige middag naar de hele straat tegelijk. En kijk dan naar de trafo, niet naar mijn omvormer.'"}
          facts: [heard:wim_spreadsheet]
          proposals: [wim_reads_the_data]
    data: [inverters_tripping:2, inverters_tripping:4]
    proposals:
      - id: retune_inverter
        label: "Zijn omvormer later laten afschakelen"
        say: "Wij betalen een monteur die uw omvormer zo instelt dat hij later afschakelt."
        addresses: []
        reply: "Dan gaat de spanning nog hoger, en mag dat niet eens. Dat is de thermometer stukmaken omdat je koorts hebt."
      - id: logger_one_week
        label: "Een week een meter in zijn meterkast"
        say: "We komen nog een keer meten. Een hele week, met een logger in uw meterkast."
        addresses: [interest]
        reply: "Een week. Bij mij. Dan heeft u één adres. Er zijn er twintig."
      - id: wim_reads_the_data
        label: "Zijn spreadsheet naast onze metingen"
        say: "Wilt u met een van onze netbeheerders naar de metingen van de hele straat kijken? Uw spreadsheet naast onze slimme meters."
        hidden: true
        addresses: [concern]
        reply: "Mijn tabblad naast uw metingen. … Daar zit ik al drie jaar op te wachten."
    experiments:
      - id: last_summer_street
        label: "De metingen van afgelopen zomer, de hele straat"
        say: "We halen de metingen van afgelopen zomer op: de hele Zonnestraat, elk kwartier, uit de slimme meters. U krijgt de grafiek."
        addresses: [interest, concern]
        reply: "Elk kwartier. De hele straat. … Dan hoeft u mijn spreadsheet niet eens meer te geloven."
    co_proposal: {id: wim_reads_the_data, text: "Laat me één middag naast iemand zitten die bij de gegevens van de trafo kan. Ik neem mijn laptop mee. En ik beloof dat ik niet zeg dat ik het al wist."}
    lines:
      mood: "Hoe gaat het met u, met al die spreadsheets?"
      reflect: "Het klinkt alsof u het gevoel heeft dat niemand ze leest."
      perspective: "Hoe zou de monteur die bij u kwam meten dit zien, denkt u?"
      paraphrase: "Dus u stuurt al drie jaar uw metingen, en u krijgt alleen een bevestiging terug."
    replies:
      open_question:
        lands: {text: "Wat er gebeurt? Zevenentwintig keer afgeschakeld op 14 juni. Het staat erin, per minuut.", tags: [claim], tell: recognition}
      reflect:
        lands: {text: "Leest. Nou. Ze worden ontvangen. Dat staat er elke keer bij.", tags: [feeling]}
      show_data:
        lands: {text: "Tweehonderdvierenvijftig volt, om kwart over één. … Dat is mijn getal. Dat is precies mijn getal.", tags: [claim]}
        misses: {text: "Een daggemiddelde. Daar zit het niet in. Het zit in de middag."}
      perspective:
        lands: {text: "De monteur? Die meet bij mij om tien uur 's ochtends. Dan is er niks. Hij doet zijn werk goed. Hij kijkt alleen op het verkeerde uur.", tags: [claim]}
    outcomes:
      commitment: "Dan neem ik mijn laptop mee. En een verlengsnoer; die hebben jullie hier vast niet."
      partial: "Ik stuur de spreadsheet nog één keer. Als iemand hem deze keer opent."
      heard: "Dank u. Ik hoef geen gelijk. Ik wil alleen dat iemand kijkt."
      none: "Ik mail u tabblad drie nog even."
      compliance: "Goed. Dan wacht ik weer op de ontvangstbevestiging."
      ruined: "Dan stuur ik volgende maand weer een spreadsheet. En de maand daarna."

  # ── Expert talks (phase 2 design §2.5; game/src/rules/expert_talk.gd) ─────────────
  # Topic by topic, no meters, nothing won or lost: the player asks (at most four open
  # questions at a time), the expert answers in their own voice. A topic may unlock a clue
  # (inline, naming its problem), a fact (heard:<id>) or an explainer; it may wait for a fact
  # (needs) or for trust. An expert talk comes after a person's persuasion and check-in.
  # Numbers are the sector's (NEN-EN 50160 and the Netcode: 230 V ± 10 %, so 253 V; an
  # inverter disconnects above it) or marked as an estimate where they are a person's own.

  # Wim, after he felt heard (wim_spreadsheet's concern): his own measurements, the street.
  # He is a customer: he says u, and is asked with u (style guide §2).
  - id: wim_expert
    name: "Wim en zijn metingen"
    person: wim
    kind: expert
    needs: {all: [heard:wim_spreadsheet]}
    opening: "U wilt meer weten over mijn metingen? Daar maak ik graag tijd voor."
    retry_opening: "Daar bent u weer. Ik heb tabblad drie al openstaan."
    closing: "Graag gedaan. En als er iets niet klopt, hoor ik het graag. Ik meet ook maar met wat ik heb."
    topics:
      - id: logger
        ask: "Hoe meet u dat eigenlijk, die spanning?"
        # Estimate: a home-made logger every five minutes; a plausible hobbyist set-up, not a source.
        answer: "Met een logger in de meterkast. Die schrijft elke vijf minuten de spanning op. Zelf gebouwd, hoor, van een printplaatje en een oude telefoonlader. Elke eerste van de maand haal ik de gegevens eraf."
      - id: limit
        ask: "Waarom is tweehonderddrieënvijftig volt zo'n grens?"
        answer: "Tweehonderddertig volt, plus tien procent. Zit de spanning tien minuten lang daarboven, dan moet een omvormer afschakelen. Zo staat het in de norm. Mijn omvormer doet dus precies wat hij moet doen. Het probleem zit ergens anders."
      - id: tab_three
        ask: "Wat staat er precies op tabblad drie?"
        answer: "Per dag de hoogste spanning, met het weer van het KNMI ernaast. Op een zonnige middag in mei zit ik boven de tweehonderdvijftig, op een grijze dag kom ik niet boven de tweehonderdveertig. En elk voorjaar komen er een paar volt bij. Sinds de halve straat panelen heeft."
        unlocks:
          clue: {problem: inverters_tripping, key: false, depth: 1, text: "'Hoe zonniger de middag, hoe hoger de spanning. En elk voorjaar een paar volt meer, sinds de halve straat panelen heeft.'"}
      - id: the_street
        ask: "Wat zou u doen met de metingen van de hele straat?"
        trust: 50
        answer: "Ik zou ze naast elkaar leggen, per kabel. Dan ziet u dat de spanning het hoogst is aan het eind van de kabel, het verst van de trafo. Dan weet u ook waar u moet kijken. Ik zou het zelf doen, maar ik kan niet bij die gegevens. Terecht, hoor. Privacy."
        unlocks:
          clue: {problem: inverters_tripping, key: false, depth: 2, text: "'Leg de meters van de straat naast elkaar, per kabel. Aan het eind van de kabel, het verst van de trafo, is de spanning het hoogst.'"}
      - id: how_it_began
        ask: "Hoe bent u eigenlijk met die spreadsheet begonnen?"
        answer: "Toen de panelen op het dak kwamen, in 2021. Ik wilde weten wat ze opleverden. Veertig jaar heb ik storingen gezocht in fabrieken, en daar leer je één ding: eerst meten, dan praten. Mijn vrouw noemt het een hobby. Ik noem het een meetreeks."

  # Henk, before he retires: cable joints, the old cable, digging, his practice trench at the
  # opleidingsterrein, and what Ahmed still has to learn. No explainer on cables and joints
  # exists yet, so the joint topic unlocks a clue instead.
  - id: henk_expert
    name: "Henk over het vak"
    person: henk
    kind: expert
    opening: "Vragen over het vak? Daar heb ik altijd tijd voor. Zolang ik hier nog rondloop."
    retry_opening: "Jij weer, {jongen_meid}. Wat wil je nog weten?"
    closing: "Goed. En als je het wilt zien in plaats van horen: je weet me te vinden."
    topics:
      - id: joints
        ask: "Wat is eigenlijk het verschil tussen al die moffen?"
        answer: "Een mof verbindt twee stukken kabel. Welke je pakt, hangt af van wat er aan weerszijden ligt. Twee kunststof kabels: een krimpmof, klaar. Oude papierloodkabel aan kunststof: dan heb je een overgangsmof nodig, en die heeft niet elke bus bij zich. Pak je de verkeerde, dan sta je om twee uur 's nachts met lege handen in de sleuf."
        unlocks:
          clue: {problem: wrong_joint_in_van, key: false, depth: 1, text: "'Een overgangsmof, van papierlood naar kunststof, heeft niet elke bus bij zich. Met de verkeerde sta je met lege handen in de sleuf.'"}
      - id: old_cable
        ask: "Hoe herken je een kabel van voor 1970?"
        answer: "Aan het lood. Papier met olie erin en een loodmantel eromheen, GPLK noemen we dat. Zwaar spul, en het gaat langer mee dan je denkt. Maar je pakt het anders aan dan kunststof: dat lood moet je netjes dicht solderen, anders trekt er vocht in. Mijn eerste mof op zo'n kabel maakte ik in 1979, achter de oude gasfabriek."
        unlocks:
          clue: {problem: knowledge_drain, key: false, depth: 1, text: "'Een GPLK-kabel pak je anders aan dan kunststof. Dat lood moet je netjes dicht solderen, anders trekt er vocht in. Dat staat nergens opgeschreven.'"}
      - id: digging
        ask: "Hoe kan het dat er zo vaak in een kabel wordt gegraven, met al die KLIC-meldingen?"
        answer: "Die melding doen ze heus wel. Maar de kaart klopt niet altijd. Wij hebben in de jaren tachtig kabels verlegd die nooit op tekening zijn gekomen. Een goede aannemer graaft eerst een proefsleuf, met de schop. Maar als de planning krap is, slaan ze die over. En dan zit de graafbak er zo in."
        unlocks:
          clue: {problem: digging_damage, key: false, depth: 1, text: "'De KLIC-kaart klopt niet altijd. Kabels die in de jaren tachtig zijn verlegd, staan er soms nooit op.'"}
      - id: trench
        ask: "Wat heb je eigenlijk liggen in die sleuf op het opleidingsterrein?"
        # Estimate: Henk's own practice length of old cable (six metres, 1968, laid in 2019).
        answer: "Zes meter GPLK uit de Lindenlaan, van 1968. Die heb ik er in 2019 zelf in gelegd. Daar kunnen de jongens een overgangsmof op oefenen zonder dat er een wijk zonder stroom zit. Alleen wordt hij te weinig gebruikt. Iedereen heeft het druk."
        unlocks:
          facts: [heard:henk_trench]
      - id: ahmed
        ask: "Wat moet Ahmed nog leren, volgens jou?"
        needs: {all: [heard:henk_teach]}   # after Henk said what he fears (henk_camera's concern)
        answer: "Uit het boekje weet die jongen alles. Beter dan ik, eerlijk gezegd. Maar hij moet het nog in z'n handen krijgen: voelen of een kabel nat is, ruiken of een mof is doorgeslagen. Dat leer je alleen door het vaak te doen, met iemand naast je die zegt: nog een keer. Zo heeft ouwe Toon het mij geleerd. In 1984."

# ── In passing (Phase 2 design §1.4, §2.4; game/src/rules/reactions.gd) ──────────
# What people say without a talk: no panel, no meter, a subtitle over their head.
# Spoken Dutch by each person's voice sheet (style guide §7). The office shows it at
# any hour, so a greeting never says "goedemorgen" or "goedemiddag".
#
# greetings: once a day, the first time you pass within two metres, by your name.
#   <cast id>: day (an ordinary day, 3+ lines) and optionally a line per fact of the last
#   talk or fix (ruined, pressured, committed, heard, standardised; GameSession.greeting_fact).
#   _all: the shared lines per fact for a person without their own.
# quick: E on someone with nothing to discuss: one line about today. Moods: tired (low
#   morale), busy / calm (their team's queue), else morning, afternoon, late (the hour).
#   _all has every mood; a person may have their own for some.
# chatter: two colleagues at the coffee corner, one line each, once a day per pair.
#   teams: one of the two is in one of these (people's `team`); load: busy | calm.
greetings:
  _all:
    ruined:
      - "Hoi. Over gisteren: dat liep niet lekker, hè. We hebben het er later nog wel over."
      - "Hé {speler}. Ik moest gisteren even afkoelen. Vandaag is een nieuwe dag."
      - "Hoi. Ik heb nog even nagedacht over ons gesprek. Later misschien."
    pressured:
      - "Hoi {speler}. Ik voelde me gisteren een beetje voor het blok gezet, eerlijk gezegd."
      - "Hé. Dat ging gisteren wel erg snel, vond ik. Laten we het rustiger aanpakken."
    committed:
      - "Hoi {speler}! Ik ben er al mee begonnen, met wat we hadden afgesproken."
      - "Hé {speler}. Onze afspraak staat, hoor. Ik hou je op de hoogte."
    heard:
      - "Hoi {speler}. Fijn dat je gisteren even de tijd nam."
      - "Hé {speler}. Ik heb nog nagedacht over ons gesprek. Goed dat je doorvroeg."
    standardised:
      - "Hoi {speler}! Die nieuwe afspraak werkt, hoor. Iedereen doet het nu zo."
      - "Hé {speler}. Het loopt een stuk rustiger sinds we het zo doen."
  joost:
    day:
      - "Hoi {speler}. Alles goed? Wij liggen op schema, even voor de duidelijkheid."
      - "Hé {speler}. Kom je weer even kijken bij Werkvoorbereiding? Prima, hoor."
      - "Hoi {speler}. Eerlijk is eerlijk, het wordt weer een volle week."
    ruined:
      - "Hoi. Even voor de duidelijkheid: dat gesprek van gisteren zit me nog niet lekker."
  anouk:
    day:
      - "Oh, hoi {speler}! Sorry, het is een beetje een rommeltje hier."
      - "Hoi {speler}! Ik zit erbovenop, hoor. Heb je al koffie gehad?"
      - "Hé {speler}. Sorry, ik ben nog even met een tekening bezig. Zeg het maar."
    committed:
      - "Hoi {speler}! Ik heb het geprobeerd zoals we zeiden. Het valt me eigenlijk mee."
  sanne:
    day:
      - "Hoi {speler}! Portaal open, koffie op, telefoon aan. We zijn er klaar voor."
      - "Nou, daar is {speler}. Kom je weer even op het postkantoor kijken?"
      - "Hé {speler}. Joh, het is weer een drukte vandaag, hè."
    ruined:
      - "Hoi. Nou, gisteren was niet ons beste gesprek, hè. Laat maar even."
  rachid:
    day:
      - "Hoi {speler}. Ik had nog een vraag voor je. Of nee, die zoek ik eerst zelf even uit."
      - "Hallo {speler}. Alles goed met je?"
      - "Hoi {speler}. Ik loop de aanvragen van gisteren nog even na."
  petra:
    day:
      - "Hoi {speler}. De Molen draait. Dat is al heel wat."
      - "Dag {speler}. Zoek je iets? Dan staat het waarschijnlijk in mijn map."
      - "Hoi {speler}. Klopt, ik ben er weer. Alles staat klaar."
  ruud:
    day:
      - "Hoi {speler}! Hoe bevalt het tot nu toe?"
      - "Ha {speler}. Wat heb je vandaag al gezien?"
      - "Hoi {speler}. De koffie hier is nog steeds slecht. Of went het al?"
  marco:
    day:
      - "Hé {speler}. Mijn mannen zijn al op pad."
      - "Hoi {speler}. Alles goed? Mooi."
      - "Hoi {speler}. Nog niks gesloopt vandaag. Dat komt vast nog."
    ruined:
      - "Kijk. Gisteren was niks. Laat maar zitten."
  henk:
    day:
      - "Ha {speler}. Kom je weer even kijken? Prima."
      - "Hoi {speler}. Sinds 1987 sta ik hier elke ochtend. Jij bent er ook vroeg bij."
      - "Ha {speler}. Er staat koffie in de keet, als je wilt."
  ahmed:
    day:
      - "Hé {speler}. Gaat wel, man."
      - "Hoi {speler}. Rustig vandaag. Hopelijk blijft het zo."
      - "Hé {speler}. Alles goed?"
  linda:
    day:
      - "Hoi {speler}! Sorry, ik ben aan het omplannen. Zeg het maar."
      - "Hé {speler}. Het kaartenhuis staat nog. Voor nu."
      - "Hoi {speler}. Sorry, drie telefoontjes tegelijk. Loop je zo nog even langs?"
  mieke:
    day:
      - "Hoi {speler}. Ik zit in de revisies van vorige week. Dat moet kloppen, hè."
      - "Hallo {speler}. Alles goed?"
      - "Hoi {speler}. Kom je kijken? Pak gerust een stoel."
    standardised:
      - "Hoi {speler}. Sinds we het zo doen, kloppen de tekeningen veel vaker. Dat merk ik echt."
  frank:
    day:
      - "Goed je te zien, {speler}. Ik zit vandaag vol met overleggen."
      - "Hallo {speler}. Ik moet straks de cijfers verantwoorden bij de directie. Hoe gaat het bij jou?"
      - "Hoi {speler}. Als je iets hebt voor het jaarplan, hoor ik het graag."
  femke:
    day:
      - "Hoi {speler}! Ik rond net een netstudie af. Kort gezegd: het past nét."
      - "Hé {speler}! Kom eens kijken, ik heb een mooie tekening."
      - "Hoi {speler}. Druk, druk. Maar wel leuk druk."
  ingrid:   # assetmanager, head of Netstrategie (company.yaml): calm, weighs; "kans maal gevolg" (four-tier audit §6)
    day:
      - "Hoi {speler}. Ik zit vandaag de hele dag met de onderhoudsplanning. Kans maal gevolg, weet je wel."
      - "Hé {speler}. Als je ooit een eerlijk antwoord wilt over de staat van het net, loop gerust even binnen."
      - "Hoi {speler}. Ik ben de storingen van vorig jaar aan het doorlopen. Er zit een patroon in, denk ik."
  esra:
    day:
      - "Hoi {speler}. Mijn mensen zitten al vanaf acht uur aan de telefoon."
      - "Hé {speler}. Kijk, als je iets wilt weten, vraag het mijn mensen. Die horen alles."
      - "Hoi {speler}. Serieus, heb je die wachtmuziek weleens gehoord? Tien minuten lang."
  kim:
    day:
      - "Hoi {speler}! Momentje, ik heb nog iemand aan de lijn."
      - "Hé {speler}! Alles goed?"
      - "Hoi {speler}. Het is al druk aan de lijn vandaag."
  saskia:
    day:
      - "Hoi {speler}. Ik doe het rustig aan, maar het gaat goed."
      - "Hé {speler}. Fijn je weer te zien."
      - "Hoi {speler}. Ik werk weer halve dagen. Dat bevalt prima."
  rob:
    day:
      - "Dag {speler}. Ik zit in de offertes, maar zegt u het maar."
      - "Dag. Het contract ligt hier, mocht u het zoeken."
      - "Hallo {speler}. Alles volgens afspraak bij u?"
  thomas:
    day:
      - "Hoi {speler}! Drie klanten vandaag die een zwaardere aansluiting willen. Allemaal met haast."
      - "Hé {speler}. Weet jij al iets over de wachtlijst? Mijn klanten vragen het me elke dag."
      - "Hoi {speler}. Druk aan de telefoon, maar dat zijn we gewend."
  dirk:
    day:
      - "Hoi {speler}."
      - "Ja. Hoi."
      - "Hé {speler}. Zoek je wat?"
  gert:
    day:
      - "Hoi {speler}. Mijn ploeg staat al te graven, hoor."
      - "Hé {speler}. Zolang de KLIC-melding klopt, gaat het goed."
      - "Hoi {speler}. Ik kom even langs voor het overleg."
  wim:
    day:
      - "Hallo {speler}! Ik ben weer even binnengewipt."
      - "Dag {speler}. Ik heb mijn aantekeningen meegenomen."
      - "Hoi {speler}. Veertig jaar in het vak, en nog steeds nieuwsgierig."
  yvonne:
    day:
      - "Hoi {speler}! Ruud zit boven, als je hem zoekt."
      - "Kijk, daar is {speler}. Nooit te laat, wel altijd net op tijd."
      - "Hé {speler}! Je pas doet het nog? Mooi zo."
  # The yard's monteurs (PLAN 2.15 S2-Y): they greet you at their vans, morning and afternoon.
  sandra:
    day:
      - "Hoi {speler}. Even de bus inladen, dan ben ik weg."
      - "Hé {speler}. Rijd je mee? Voorin is plek."
      - "Hoi {speler}. Nieuwe meters, nieuwe zegels. Ik ben er klaar voor."
  ricardo:
    day:
      - "Hé {speler}. Bus is vol, ik kan zo weg."
      - "Hoi {speler}. Ik zag je in de appgroep. Welkom, hoor."
      - "Ha {speler}. Druk dagje in Nova-Oud."
  joyce:
    day:
      - "Hoi {speler}. Even mijn kabelschaar zoeken, dan ben ik weg."
      - "Hé {speler}. Jij bent de nieuwe van Aansluitingen, toch?"
      - "Hoi {speler}. Als je ooit mee wilt, zeg het maar. Dan zie je het echte werk."

quick:
  _all:
    tired:
      - "Lange dag, hoor. Ik ben er een beetje doorheen."
      - "Sorry, ik ben moe. Het werd gisteren weer laat."
      - "Ik moet echt even koffie. Het gaat wel."
    busy:
      - "Druk, druk, druk. De stapel wordt alleen maar hoger."
      - "Sorry, ik moet echt door. Het loopt vol vandaag."
      - "Ik weet eerlijk gezegd niet waar ik moet beginnen."
    calm:
      - "Lekker rustig vandaag. Dat mag ook wel eens."
      - "Rustige dag. Ik werk wat achterstallige dingen weg."
      - "Eindelijk een dag zonder brandjes."
    morning:
      - "Ik ben net begonnen. Eerst even mijn mail."
      - "Heb je al koffie gehad? Ik ga zo even."
      - "Even opstarten, hoor."
    afternoon:
      - "Nog een paar uurtjes. Het gaat lekker."
      - "Na de lunch is het altijd even een dipje."
      - "Ik werk dit nog even af."
    late:
      - "Ik ga zo naar huis. Nog even dit afmaken."
      - "Bijna klaar voor vandaag."
      - "Jij bent ook nog laat, zie ik."
  sanne:
    busy:
      - "Joh, de werkbak loopt over. Portaal, mail, telefoon, alles tegelijk."
  anouk:
    busy:
      - "Sorry, de stapel is weer gegroeid. Ik zit erbovenop, hoor."
  joost:
    busy:
      - "Even voor de duidelijkheid: we halen het. Maar het is krap."
  linda:
    busy:
      - "Sorry, ik ben aan het omplannen. Alweer."
  petra:
    calm:
      - "Rustig. Klopt, dat gebeurt soms."
  marco:
    busy:
      - "Mijn mannen rijden zich vandaag het schompes."
    tired:
      - "Lange week. Maar goed, we gaan door."
  esra:
    busy:
      - "Serieus, er staan twintig bellers in de wacht."
  dirk:
    tired: ["Lang dagje."]
    busy: ["Druk."]
    calm: ["Rustig."]
    morning: ["Koffie eerst."]
    afternoon: ["Gaat wel."]
    late: ["Bijna klaar."]

chatter:
  - id: intake_half_requests
    teams: [intake]
    load: busy
    lines:
      - "Heb jij die aanvraag van gisteren nog gezien? Die met die foto van de meterkast?"
      - "Welke? Er zaten er vanochtend vijftig in de werkbak."
  - id: prep_stack
    teams: [work_prep]
    load: busy
    lines:
      - "Hoeveel liggen er nog op jouw stapel?"
      - "Niet vragen. Ik tel ze niet meer."
  - id: portal_asks_too_little
    teams: [work_prep, intake]
    lines:
      - "Waarom komen die aanvragen eigenlijk altijd half binnen?"
      - "Omdat het portaal niet vraagt wat wij nodig hebben. Al jaren niet."
  - id: card_house
    teams: [planners]
    lines:
      - "Heb je het bord gezien? Alles is weer omgegooid."
      - "Ja. Het kaartenhuis, hè. Eén kaart eruit en alles valt om."
  - id: stood_for_nothing
    teams: [monteurs]
    load: busy
    lines:
      - "Weer voor niks gestaan vanochtend. Meterkast niet klaar."
      - "Bij ons ook. Twee keer deze week al."
  - id: revision_lindeveld
    teams: [gis, meter_office]
    lines:
      - "Klopt die revisie van Lindeveld nou of niet?"
      - "Dat moet ik nog uitzoeken. Ik wil het eerst zeker weten."
  - id: dont_say_it
    load: calm
    lines:
      - "Rustig vandaag, hè?"
      - "Niet hardop zeggen. Dan gaat meteen de telefoon."
  - id: lunch_at_desk
    load: busy
    lines:
      - "Ga jij nog lunchen vandaag?"
      - "Ik eet wel aan mijn bureau. Weer."
  - id: weekend
    lines:
      - "Nog plannen voor het weekend?"
      - "Slapen. En de tuin, als het droog blijft."
  - id: the_new_one
    lines:
      - "Heb je de nieuwe van Ruud al gesproken?"
      - "Even, bij de koffie. Die vraagt wel door, hoor."
  - id: third_call
    teams: [contact_centre]
    lines:
      - "Die mevrouw van gisteren belde weer. Al voor de derde keer."
      - "En wij kunnen haar weer niks vertellen. Dat is nog het ergste."
  - id: study_board
    teams: [grid_analysts]
    load: busy
    lines:
      - "Hoeveel netstudies staan er nu op het bord?"
      - "Meer dan vorige week. Kort gezegd: te veel."
  - id: no_date_to_give
    teams: [key_accounts]
    lines:
      - "Belde die ondernemer van het bedrijventerrein weer?"
      - "Twee keer vandaag al. Hij wil een datum, en die heb ik niet."
  - id: charging_plaza
    teams: [key_accounts, grid_analysts]
    lines:
      - "Past dat laadplein nog op het net, denk je?"
      - "Kort gezegd: nee. Niet zonder verzwaring."
