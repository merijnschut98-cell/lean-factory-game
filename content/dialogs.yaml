  # ── Act 0, Wednesday: Mieke and the sketches (tutorial talks §4.2 mieke_tuesday, moved per first-five-minutes §4.2) ─
  - id: mieke_wednesday
    name: "Mieke en de schetsen"
    person: mieke
    kind: persuade
    mission: training_wed
    tutorial: true
    teaches: [paraphrase]
    patience: 12
    opening: "Kom je voor de revisie? Dan ben je hier goed. Pas op voor die doos."
    position: {text: "Dit zijn de schetsen van de monteurs: wat ze in de grond hebben gelegd. Wij verwerken dat in GIS. 'Overtekenen', noemen ze het boven. We doen het zo snel als we kunnen.", tags: [claim], tell: recognition}
    layers:
      - id: interest
        at: 50
        via: [paraphrase, inquiry, open_question]
        text: "Een schets is maar een begin. Er staat een mof op, maar niet hoe diep die ligt. Een kabel, maar niet welke kant hij op buigt. Dat moet ik uitzoeken. Bellen, foto's zoeken, soms zelf gaan kijken."
        tags: [claim]
      - id: concern
        at: 68
        via: [paraphrase, silence, inquiry]
        lead_in: {text: "Alleen, kijk…", tags: [hesitation], again: ["Alleen…", "Kijk, het is gewoon…", "Nou ja…"]}
        text: "Als wij een kabel verkeerd intekenen, graaft er straks iemand doorheen. Dan wijst iedereen naar GIS. Niet naar de schets met de pindakaasvlek."
        tags: [admission]
        unlocks:
          facts: [heard:mieke_wednesday]
          proposals: [show_the_worst_sketch]
    proposals:
      - id: look_at_one
        label: "Eén schets samen bekijken"
        say: "Mag ik er één met je doorlopen, van schets tot tekening?"
        addresses: [concern]
        reply: "Eentje. Dan zie je waarom het geen vijf minuten werk is."
      - id: count_the_box
        label: "De doos tellen"
        say: "Mag ik tellen hoeveel er in de doos zitten, en hoe oud ze zijn?"
        addresses: [interest]
        reply: "Tel maar. Het zijn er meer dan je denkt."
      - id: show_the_worst_sketch
        label: "De slechtste schets"
        say: "Mag ik de slechtste schets zien die je deze maand hebt gehad?"
        hidden: true
        addresses: [concern]
        reply: "De slechtste. … Hier. Op een boterhamzakje. Met een pindakaasvlek precies op de mof."
    co_proposal: {id: show_the_worst_sketch, text: "Wil je de slechtste zien? Dan snap je het meteen.",
                  take: "Graag. Laat die slechtste maar zien."}
