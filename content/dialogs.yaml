  # ── Act 0, Tuesday 08:30: Sanne (tutorial talks §4.1 sanne_monday, re-dated per first-five-minutes §4.2) ─
  - id: sanne_tuesday
    name: "Sanne op dinsdagochtend"
    person: sanne
    kind: persuade
    mission: training_tue
    tutorial: true
    teaches: [open_question]
    mood: neutraal   # a friendly week: busy, not worn out (PLAN 2.13 D)
    patience: 12
    opening: "{groet}! Ik zou gisteren nog langskomen, hè. Sorry. Alles van het weekend ligt er nog."
    position: {text: "Na een weekend ben je hier twee dagen aan het bijwerken. Alles wat zaterdag en zondag binnenkwam, plus wat gisteren bleef liggen. Maar dat ziet boven niemand, hè.", tags: [claim], tell: recognition}
    layers:
      - id: interest
        at: 45
        via: [mood, empathy, open_question]
        text: "Kijk, deze. Aanvraag voor een warmtepomp, maar geen foto van de meterkast. Die stuur ik terug. Over drie weken komt hij weer binnen, met een boze klant aan de telefoon. En iedereen denkt dat Intake een postkantoor is: stempel erop en door."
        tags: [claim, feeling]
      - id: concern
        at: 65
        via: [silence, empathy, reflect]
        lead_in: {text: "En als ik eerlijk ben…", tags: [hesitation], again: ["Nee, maar echt…", "Weet je wat het is…", "Ach. Nou ja…"]}
        text: "Ik werk hier al vijftien jaar. Ik weet precies welke aanvragen terugkomen. Maar niemand die het me vraagt. Ze tellen alleen hoeveel ik er doorzet."
        tags: [admission]
        unlocks:
          facts: [heard:sanne_tuesday]
          proposals: [sanne_shows_the_returns]
    proposals:
      - id: come_back_later
        label: "Later terugkomen"
        say: "Zal ik vanmiddag terugkomen, als het rustiger is aan de telefoon? Dan heb je meer tijd."
        addresses: [concern]
        reply: "Na drieën. Dan is het hier stil. Kom maar."
      - id: sit_and_watch
        label: "Een uur meekijken"
        say: "Mag ik een uurtje naast je komen zitten? Ik wil zien hoe een aanvraag binnenkomt. Niet hoe snel je bent."
        addresses: [concern]
        reply: "Nou, als je niet gaat zitten klokken. Ja, dat mag."
      - id: sanne_shows_the_returns
        label: "Laat zien welke terugkomen"
        say: "Wil je me laten zien welke aanvragen terugkomen? Jij weet dat, ik niet."
        hidden: true
        addresses: [concern]
        reply: "De terugkomers. Ik heb ze op een stapel. Niemand heeft er ooit naar gevraagd. Kom maar kijken."
    co_proposal: {id: sanne_shows_the_returns, text: "Weet je wat? Ik leg de terugkomers van vorige week apart. Dan zie je het zelf.",
                  take: "Graag. Dan kom ik vanmiddag naar die stapel kijken."}
