      commitment: "Dat moet kloppen, dus ja. En het boterhamzakje lijst ik in. Als laatste van zijn soort."
      partial: "Ik wil het proberen. Als de monteurs het ook willen."
      heard: "Hm. Fijn om het eens over het vak te hebben."
      compliance: "Als het moet. Dan teken ik wat er komt."
