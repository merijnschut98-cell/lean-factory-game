  # ── Sanne and the applications per week (Acts 0–II scripts §7, sanne_kpi):
  # Frank's second block route needs her agreement too (audit C5) ──────────────
  - id: sanne_kpi
    name: Sanne en de aanvragen per week
    person: sanne
    kind: persuade
    mission: fix_silo_kpis
    kpi_team: intake
    patience: 9
    opening: "Als het over het MT gaat: ja, ik had een recordmaand. Nee, ik weet ook niet waarom er niks meer doorkomt."
    retry_opening: "Joh. Weer over het MT?"
    warning: "Joh. Niet nu."
    position: {text: "Ik stuur op aanvragen per week. Dat werkt: we halen het.", tags: [claim]}
    layers:
      - id: interest
        at: 55
        via: [empathy, mood, open_question]
        text: "Elke vrijdag om drie uur tellen we. Nog vier voor het weekdoel? Dan zet je ze door. Ook als de meterkastfoto mist. Dat vraagt Werkvoorbereiding dan maar."
        tags: [claim, feeling]
      - id: concern
        at: 70
        via: [reflect, empathy]
        lead_in: {text: "Ik baal er nu al van, als ik eraan denk. Alleen…", tags: [feeling]}
        text: "Als ik op 'compleet doorgezet' ga sturen, zakt mijn aantal per week. Eerst. En dan is Intake weer het postkantoor dat traag is. Ik heb twee jaar gedaan over dat beeld."
        tags: [admission]
        condition: "Ik doe mee. Als Frank het goedvindt. Het jaarplan is van hem."
        wait_for: "Frank moet het goedvinden."   # the summary card's "Wat nog moet"
        unlocks:
          facts: [heard:sanne_kpi]
          proposals: [present_with_joost]
    data: ["silo_kpis:3", "silo_kpis:5"]
    proposals:
      - id: complete_and_oldest
        label: Compleet doorgezet + oudste aanvraag
        say: "Compleet doorgezet, en de oudste aanvraag in de bak. Allebei getallen die je deze week ziet bewegen."
        kpis: [intake_complete, intake_oldest]
        addresses: [concern]
        reply: "Die oudste aanvraag… die ligt er nu drie weken. Die kan ik morgen pakken."
      - id: lead_and_complete
        label: Doorlooptijd + compleet doorgezet
        say: "De doorlooptijd van de hele stroom, en compleet doorgezet ernaast."
        kpis: [intake_lead_time, intake_complete]
        addresses: [concern]
        reply: "Eentje kijkt ver vooruit, eentje kijkt naar ons. Oké. Dat is eerlijk."
      - id: output_and_complete
        label: Aanvragen per week + compleet doorgezet
        say: "Houd je aantal per week, en zet compleet doorgezet ernaast."
        kpis: [intake_output, intake_complete]
        addresses: [concern]
        reply: "Dan zie ik ze elkaar bevechten. Maar goed. Dan zie ik het tenminste."
      - id: output_and_utilisation
        label: Aanvragen per week + bezettingsgraad
        say: "Je houdt wat je hebt: aanvragen per week en bezettingsgraad."
        kpis: [intake_output, intake_utilisation]
        addresses: []
        reply: "Dat is wat ik nu heb. En dat werkt dus niet, hè."
      - id: present_with_joost   # unlocked by her concern (the script also wanted heard:joost_kpi; not in the engine)
        label: Samen met Joost presenteren
        say: "Joost wil het samen met jou presenteren. Eén stroom, niet twee teams."
        hidden: true
        addresses: [concern]
        reply: "Joost? Samen? … Dan is het geen postkantoor tegen de ingenieurs. Dan is het één stroom."
    co_proposal: {id: present_with_joost, text: "Als Joost en ik dezelfde aansluiting volgen, van aanvraag tot monteur. Eén dossier, op het bord. Dan ziet iedereen waar het blijft."}
    condition_needs: {all: [committed:frank_kpi_targets]}
    beats_after:   # scripts §7, audit C15
      - when: committed:frank_kpi_targets
        text: "Frank heeft getekend. Joost en ik presenteren donderdag. Samen. Ik ben zenuwachtig, en dat is lang geleden."
    lines:
      mood: "Hoe is het nou echt, na zo'n recordmaand?"
      open_question: "Hoe gaat zo'n vrijdagmiddag bij jullie?"
      reflect: "Je klinkt alsof je het nu al ziet aankomen."
    replies:
      open_question:
        lands: {text: "Vrijdag om drie uur tellen we. Iedereen weet dat. Daar plan je je hele week omheen.", tags: [claim]}
      paraphrase:
        lands: {text: "Ja. En dan nog dat gevoel dat het nooit genoeg is.", tags: [feeling]}
      perspective:
        lands: {text: "Vanuit Joost? Die krijgt mijn vrijdagmiddag op maandag op zijn bord. Halve dossiers. Ja. Dat zou ik ook niet leuk vinden."}
      show_data:
        lands: {text: "'Nog vier voor vrijdag.' Ja. Dat zijn wij. Dat klinkt anders als je het zo terughoort."}
        misses: {text: "Mijn cijfers zijn goed. Die van Joost ook. Dat is toch het hele punt?", tags: [claim]}
    outcomes:
      commitment: "Afgesproken. En ik zeg het zelf in het MT: ons getal gaat eerst omlaag. Met reden."
      partial: "Ik doe mee. Als Frank het goedvindt. Het jaarplan is van hem."
      heard: "Zo. Dat had ik nog nooit hardop gezegd."
      compliance: "Prima. Weer een getal."
      ruined: "Dus het ligt weer aan de Intake. Natuurlijk."

  # ── The block behind the team leads' condition (scripts §7; audit C4–C6,
  # C13): Frank ───────────────────────────────────────────────────────────────
  - id: frank_kpi_targets
    name: Frank en het jaarplan
    person: frank
    kind: persuade
    mission: fix_silo_kpis
    requires_clue: "silo_kpis:4"
    owns: silo_kpis               # his clue joins the problem's clues; it is his list the teams steer by
    patience: 8                   # a manager's diary (authored)
    opening: "Ik heb een kwartier. Daarna de regiegroep. Gaat het over het jaarplan, dan weet je dat het vastligt."
    retry_opening: "Weer over die KPI's?"
    warning: "Ik heb een regiegroep. Kom ter zake."
    position: {text: "Ontwerpen en aanvragen per week staan in het jaarplan. Daar stuur ik op.", tags: [claim]}
    layers:
      - id: interest
        at: 52
        via: [inquiry, paraphrase]
        text: "Het jaarplan gaat naar de directie, en het aantal aansluitingen per jaar gaat naar de ACM. Dat moet ik kunnen uitleggen. Elk kwartaal."
        tags: [claim]
        tell: facts
      - id: concern
        at: 72
        via: [inquiry, silence, empathy]
        lead_in: {text: "En daar komt bij…", tags: [hesitation]}
        text: "In de najaarsronde wordt het budget voor netverzwaring over de regio's verdeeld. Als onze cijfers een kwartaal slechter worden, gaat dat geld naar het westen. Ik ga niet op gevoel een kwartaal gokken met de verzwaring van Zuidmark."
        tags: [admission]
        tell: facts
        unlocks:
          clue: {key: true, depth: 2, text: "'De directie vraagt elk kwartaal naar aantallen. Hoe lang een klant wacht, vraagt alleen de ACM. Eén keer per jaar.'"}
          facts: [heard:frank_budget]   # the interim MT reads it (drie-winters §5.2)
    data: ["silo_kpis:0", "silo_kpis:2"]
    block:
      text: "Ik kan dit niet toezeggen. Laat het me eerst zien."
      routes:
        - needs: {all: [checked:silo_kpis]}
          hint: "Laat het me zien op één stroom."
        - needs: {all: [partial:joost_output_kpi, partial:sanne_kpi, reputation>=40]}
          hint: "Als Sanne en Joost het zelf komen uitleggen, sta ik er niet alleen voor."
        # Scripts route 3 (audit C5): a quarterly review whose forecast beats the habit.
        - needs: {all: [forecast_positive:kpi_board]}
          hint: "Als het bord laat zien dat volgend kwartaal niet slechter wordt."
    proposals:
      - id: keep_targets
        label: De doelen houden zoals ze zijn
        say: "We houden de doelen zoals ze zijn."
        addresses: []
        reply: "Dat is wat ik heb."
      - id: obeya_one_stream
        label: Eén kwartaal, één stroom, oude cijfers ernaast
        say: "Eén kwartaal, alleen de aansluitingenstroom, met de oude getallen ernaast zichtbaar. Als het eerst zakt, zie je ook waarom."
        addresses: [concern]
        reply: "Met de oude ernaast. Dan kan ik het in de regiegroep altijd uitleggen."
    experiments:
      - id: obeya_trial
        label: Een Obeya op één stroom, zes weken
        say: "Zes weken een Obeya op de aansluitingenstroom. Sanne, Joost en Marco aan één bord. Jij komt elke vrijdag kijken."
        addresses: [concern]
        reply: "Elke vrijdag. Tien minuten. En als ik iets zie wat ik niet kan uitleggen, stoppen we."
    replies:
      open_question:
        lands: {text: "Het jaarplan is vastgesteld. Daar is over nagedacht, door meer mensen dan ik.", tags: [claim]}
      paraphrase:
        lands: {text: "Zo is het. En dat moet ik kunnen uitleggen.", tags: [claim], tell: facts}
      perspective:
        lands: {text: "Vanuit de ACM gezien… die meet de termijn vanaf de aanvraag. Niet het aantal ontwerpen. Hm. Dat is eigenlijk een ander getal dan het mijne."}
      show_data:
        lands: {text: "Twee recordmaanden, en niet één aansluiting meer de deur uit. Dat is geen record. Dat is een rapport.", tags: [claim]}
        misses: {text: "Een kwartaalcijfer is een kwartaalcijfer.", tags: [claim]}
    outcomes:
      commitment: "Goed. Ik zet mijn handtekening eronder. En als het eerst slechter wordt, leg ík het uit. Daar word ik voor betaald."
      partial: "Als het op één stroom blijft, doe ik mee. Verder niet."
      blocked: "Ik kan dit niet toezeggen. Laat het me eerst zien."
      heard: "Interessant. Kom terug als je iets te laten zien hebt."
      compliance: "Als Ruud het zo wil, staat het in het verslag. Op zijn naam."
      ruined: "Ik heb een regiegroep. Plan maar iets in via mijn secretariaat."

