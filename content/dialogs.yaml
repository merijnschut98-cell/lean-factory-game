  - id: revision_lindeveld
    teams: [gis, meter_office]
    lines:
      - "Klopt die revisie van Lindeveld nou of niet?"
      - "Dat moet ik nog uitzoeken. Ik wil het eerst zeker weten."
  - id: dont_say_it
    load: calm
    lines:
      - "Rustig vandaag, hè?"
      - "Niet hardop zeggen. Dan gaat meteen de telefoon."
  - id: lunch_at_desk
    load: busy
    lines:
      - "Ga jij nog lunchen vandaag?"
      - "Ik eet wel aan mijn bureau. Weer."
  - id: weekend
    days: [thu, fri]
    lines:
      - "Nog plannen voor het weekend?"
      - "Slapen. En de tuin, als het droog blijft."
  - id: the_new_one
    lines:
