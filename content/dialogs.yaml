  # why; the ones in between talk shop; the easy ones joke. Estimates of tone, not facts.
  - id: strain_high_tired
    strain: high
    lines:
      - "Ik ben echt moe, hoor. Het is al weken zo druk."
      - "Ik merk het ook. Ik slaap er slechter van."
  - id: strain_high_no_air
    strain: high
    lines:
      - "Ik kom nauwelijks nog aan mijn eigen werk toe."
      - "Nee, ik ook niet. En morgen begint het weer van voren af aan."
  - id: strain_mid_next_week
    strain: mid
    lines:
      - "Heb je al gezien wat er volgende week op het bord staat?"
      - "Ja. Het is te doen, als er niks tussendoor komt."
  - id: strain_mid_meeting
    strain: mid
    lines:
      - "Is het overleg van donderdag nou verzet of niet?"
      - "Volgens mij naar vrijdag. Ik kijk het straks nog even na in de agenda."
  - id: strain_low_coffee
    strain: low
    lines:
      - "Deze koffie is vandaag best te drinken, vind je niet?"
      - "Wacht maar tot de machine hoort dat je dat zegt."
  - id: strain_low_tidy
    strain: low
    lines:
      - "Het is vandaag zo rustig dat ik bijna zin heb om mijn bureau op te ruimen."
      - "Doe maar niet. Straks vind je nog iets wat je kwijt was."
