          - id: concern
            at: 65
            via: [reflect, empathy, silence]
            lead_in: {text: "Alleen…", tags: [hesitation]}
            text: "Ruud vroeg of ik straks de nieuwe jongens wil opleiden. Ik weet niet of ik dat kan. Henk kon het. Ik ben… ik ben gewoon Ahmed."
            tags: [admission, doubt]
            tell: safety
