      - id: interest
        at: 52
        via: [open_question, mood, silence]
        text: "Eerlijk gezegd? In het midden ligt het meeste. Meestal mist er een foto van de meterkast, of klopt het vermogen niet met wat de installateur opgaf. Dan bel ik de installateur na. Soms wel drie keer."
