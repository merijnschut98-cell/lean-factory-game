    patience: 10
    opening: "Goedemiddag. U spreekt met Fatima El Amrani. Ik bel voor de vierde keer, en ik heb ze allemaal opgeschreven."
    warning: "Ik heb geen behoefte aan een riedeltje."
    position: {text: "Ik wil een datum. Een echte. Anders ga ik naar de Geschillencommissie.", tags: [claim], tell: facts}
    layers:
      - id: interest
        at: 45
