  # ── Gert en de KLIC-melding (Acts 0–II scripts §7) ─────────────
  - id: gert_klic
    name: "Gert en de KLIC-melding"
    person: gert
    kind: persuade
    mission: fix_digging_damage
    mood: gespannen
    patience: 10
    opening: "Ik heb mijn verzekeraar al gebeld, als je daarvoor komt."
    warning: "Moet ik mijn advocaat erbij halen?"
    position: {text: "Ik heb gewoon een KLIC-melding gedaan. Volgens de kaart lag hier niks.", tags: [claim], tell: safety}
    layers:
      - id: interest
        at: 55
        via: [open_question, inquiry, paraphrase]
        text: "Kijk. Proefsleuven graven kost tijd, en die tijd staat niet in de planning van mijn opdrachtgever. Die betaalt per meter. Als ik bij elke kabel ga zoeken, ben ik de duurste van de regio."
        tags: [claim, feeling]
      - id: concern
        at: 70
        via: [silence, empathy, reflect]
        lead_in: {text: "Weet je wat het is…", tags: [hesitation], again: ["Het is gewoon…", "Kijk, het punt is…", "Weet je… nou ja."]}
        text: "In 2019 stond ik ernaast toen een jongen van ons een middenspanningskabel raakte. Een flits, en hij lag. Hij leeft nog. Maar ik slaap er slecht van, elke keer dat er een schop de grond in gaat. En dan zegt Voltana dat het mijn schuld is."
        tags: [admission, feeling]
        tell: safety
        unlocks:
          facts: [heard:gert_safety]
          proposals: [stop_and_call_near_ms, first_metre_together]
    data: [digging_damage:2]
    proposals:
      - id: trenches_in_the_order
        label: "Proefsleuven in de opdracht"
        say: "Wat als Voltana bij elke opdracht vooraf aangeeft waar proefsleuven nodig zijn, en jouw opdrachtgever die in de planning moet opnemen?"
        addresses: [interest]
        reply: "Als het in de opdracht staat, betaalt hij het. Dan ben ik niet de duurste."
      - id: stop_and_call_near_ms
        label: "Bij middenspanning: eerst bellen"
        say: "Binnen twee meter van een middenspanningskabel: eerst bellen, en een monteur van ons wijst ter plekke aan. Vanaf morgen."
        hidden: true
        addresses: [concern]
        reply: "Vanaf morgen. … Dan hoeft mijn jongen niet te gokken."
      - id: first_metre_together
        label: "De eerste meter samen"
        say: "Laat onze monteur en jouw uitvoerder bij de eerste meter samen kijken. Vijf minuten."
        hidden: true
        addresses: [concern]
        reply: "Samen. Dan zie jij ook eens hoe het op straat gaat."
    co_proposal: {id: first_metre_together, text: "Laat jullie monteur en mijn uitvoerder bij de eerste meter samen kijken. Vijf minuten. Dan weten we het allebei.",
                  take: "Goed. De eerste meter samen, vijf minuten."}
    # Rewritten to the reference standard (docs/qa/dialog-coherence-2026-10-30.md):
    # the player's sentences answer what Gert spoke of last, in the order written;
    # his answers fit the question and never come back word for word. The first
    # pressure line stays the safety stop (a risk that needs containment now).
    lines:
      mood:
        position: ["Hoe gaat het met je, na die schade?", "En hoe is het met jou, met de verzekeraar erbij?"]
        lead_in: "Gaat het?"
        _: ["Hoe gaat het nu echt met je, Gert?", "En jij, hoe zit je erbij?", "Hoe houden jullie het vol, met die schade?"]
      open_question:
        position: ["Hoe gaat zo'n graafklus, van melding tot schop?", "Wat zou je moeten doen om het zeker te weten?", "Waarom zoek je niet altijd?"]
        interest: ["Hoe vaak zou je eigenlijk moeten zoeken?", "Wat zegt je opdrachtgever als je gaat zoeken?"]
        lead_in: "Wat is het?"
        concern: ["Wat zou je nodig hebben om rustig te slapen?", "Wie zou er naast je moeten staan, bij de eerste meter?"]
        _: ["Hoe gaat dat bij jullie, op een gewone dag?", "Vertel eens, hoe loopt zo'n graafklus?"]
      empathy:
        position: ["Een kabel raken terwijl je alles volgens het boekje deed. Dat is zuur.", "Dat je meteen je verzekeraar belt, snap ik.", "Dertig jaar graven, en dan dit. Dat zit je niet lekker."]
        interest: ["Per meter betaald worden, en dan ook nog zoeken. Dat knelt.", "Logisch dat je niet de duurste wilt zijn."]
        lead_in: ["Zeg het maar.", "Ik luister."]
        concern: ["Dat je dat bij je draagt, sinds 2019. Dat is zwaar.", "Logisch dat je er slecht van slaapt."]
        _: ["Dat is ook niet niks.", "Dat lijkt me best lastig."]
      reflect:
        position: ["Het klinkt alsof je je aangevallen voelt.", "Je klinkt alsof je bang bent dat het op jou terechtkomt."]
        interest: ["Het klinkt alsof je klem zit tussen veilig en goedkoop.", "Je klinkt alsof je eigenlijk wel zou willen zoeken."]
        lead_in: ["Er zit je iets dwars, merk ik.", "Je aarzelt, zie ik."]
        concern: ["Je bent bang dat het weer gebeurt, klinkt het.", "Het klinkt alsof je die dag nog steeds meesleept."]
        _: ["Je klinkt een beetje gespannen.", "Het klinkt alsof je ermee zit."]
      paraphrase:
        position: ["Dus jij hebt een melding gedaan, en volgens de kaart lag er niks.", "Dus volgens jou lag het aan de kaart, niet aan jullie."]
        interest: ["Dus zoeken kost tijd, en die betaalt je opdrachtgever niet.", "Dus als jij gaat zoeken, ben jij de duurste van de regio."]
        lead_in: "Dus er is nog iets?"
        concern: ["Dus je stond ernaast toen het misging, en dat laat je niet los.", "Dus je slaapt er slecht van, en dan krijg jij ook nog de schuld."]
        _: ["Dus het gaat om de kaart.", "Als ik je goed hoor, zit het in de opdracht."]
      inquiry:
        position: ["Wat kost het, om bij elke kabel te zoeken?", "Wie betaalt zo'n proefsleuf nu?"]
        interest: ["Waarom staat een proefsleuf niet in de planning?", "Hoe vaak sta je op zo'n plek te gokken?"]
        lead_in: "Wat dan?"
        concern: ["Hoe gaat het nu met die jongen?", "Wat zou je helpen, bij een middenspanningskabel?"]
        _: ["Waar komt dat door, denk je?", "Hoe zit dat precies?"]
      experience:
        position: ["Ik herken dat: je doet alles volgens de regels, en dan is het toch mis.", "Ik zag het al bij de monteurs: de kaart klopt niet altijd."]
