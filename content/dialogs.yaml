  # ── Act 0, Wednesday: Linda and the house of cards (tutorial talks §4.3) ─────────────────────
  - id: linda_wednesday
    name: "Linda en het kaartenhuis"
    person: linda
    kind: persuade
    mission: training_wed
    tutorial: true
    teaches: [reflect]
    mood: neutraal   # a friendly week: busy, not worn out (PLAN 2.13 D)
    patience: 12
    opening: "Sorry, ik zit midden in het omplannen. Twee monteurs moesten naar een storing. Zeg het maar."
    position: {text: "Dit gebeurt elke dag. Er komt een storing, de monteurs gaan erheen en ik plan alles om. Zo gaat dat. Ik heb even, tot de volgende storing.", tags: [claim, feeling], tell: time}
    layers:
      - id: interest
        at: 45
        via: [reflect, empathy, mood]
        text: "Eerlijk? Mijn planning noem ik het kaartenhuis. Elke ochtend bouw ik het op, en om tien uur waait er een storing doorheen. Dan bel ik twaalf klanten af. Die zijn boos op mij, niet op de kabel."
        tags: [claim, feeling]
      - id: concern
        at: 65
        via: [reflect, empathy]
        lead_in: {text: "Ik word er gewoon zo moe van. Sorry.", tags: [feeling],
                  again: ["Sorry. Ik word er gewoon moe van…", "Het is alleen… nou ja.", "Ik… sorry."]}
        text: "Ik bel elke dag twaalf mensen af. Mensen die een dag vrij hebben genomen. In het begin vond ik dat vreselijk. Nu merk ik dat ik het gewoon doe, tussen twee slokken koffie door. Dat vind ik eigenlijk erger."
        tags: [admission]
        unlocks:
          facts: [heard:linda_wednesday]
          proposals: [watch_one_morning]
    proposals:
      - id: come_back_later
        label: "Later terugkomen"
        say: "Ik zie dat je bezig bent. Mag ik straks terugkomen?"
        addresses: []
        reply: "Straks is alles alweer anders. Maar goed."
      - id: count_the_reshuffles
        label: "Tellen hoe vaak het omvalt"
        say: "Mag ik deze week tellen hoe vaak je moet omplannen, en waarom?"
        addresses: [concern]
        reply: "Tellen. Dan zie je dat het niet aan mij ligt. … Toch?"
      - id: watch_one_morning
        label: "Eén ochtend meekijken"
        say: "Mag ik een keer een ochtend naast je zitten, als je het kaartenhuis bouwt?"
        hidden: true
        addresses: [concern]
        reply: "Een ochtend. Dan zie je het staan voordat het omvalt. Ja, goed."
    co_proposal: {id: watch_one_morning, text: "Kom morgen om zeven uur. Dan zie je hoe het staat, en om tien uur hoe het valt.",
                  take: "Graag. Morgen om zeven uur dan."}
    # Rewritten to the reference standard (docs/qa/dialog-coherence-2026-10-30.md):
