        reply: "Ja. Een proef."
      - id: it_is_the_tray
        label: "Het ligt aan de bakken"
        say: "Als het werkt, zegt dat iets over twee bakken, niet over jou. Jij zocht omdat het werk zo lag."
        hidden: true
        addresses: [concern]
        reply: "Over de bakken. Niet over mij. … Dat had ik zo nog niet bedacht."
      - id: we_present_together
        label: "Samen vertellen"
