    layers:
      - id: interest
        at: 45
        via: [mood, empathy, open_question]
        text: "Eerlijk? Morgen zit ik hier alleen. Joost zit de hele dag in overleg en de anderen zitten op cursus. Als dit vanavond niet af is, ligt het er morgen nog. En achter elke tekening zit iemand die wacht."
        tags: [claim, feeling]
      - id: concern
        at: 65
        via: [silence, empathy, reflect]
        lead_in: {text: "Sorry, mijn telefoon. Mijn vriend appte net…", tags: [hesitation],
                  again: ["Sorry. Mijn vriend weer…", "Ik zit er toch steeds aan te denken…", "Nee, laat maar. Of… nou ja."]}
        text: "Of ik weer laat ben. Ik zou Fenna vandaag van de opvang halen. Dat heeft hij nu weer gedaan. … Ik zeg steeds dat het maar tijdelijk is."
        tags: [admission]
        unlocks:
          facts: [heard:anouk_seven]
          proposals: [come_tomorrow]
    proposals:
      - id: walk_out_together
        label: "Samen naar buiten"
        say: "Zullen we samen naar buiten lopen? De tekeningen zijn er morgen ook nog."
        addresses: [concern]
        reply: "… Ja. Ja, goed. Samen naar buiten."
      - id: leave_one_drawing
        label: "Eén tekening laten liggen"
        say: "En als je er één laat liggen en die morgen als eerste oppakt?"
        addresses: [interest]
        reply: "Eén laten liggen. Hm. Die van de school kan wel een dagje wachten. Die hebben hem pas in januari nodig."
      - id: come_tomorrow
        label: "Morgen even langskomen"
        say: "Mag ik morgen overdag even langskomen? Gewoon kijken hoe het gaat als je hier alleen zit."
        hidden: true
        addresses: [concern]
        reply: "Ja, kom maar. Dan zie je ook eens hoe het hier overdag gaat, niet alleen om zeven uur 's avonds."
    co_proposal: {id: come_tomorrow, text: "Weet je wat? Kom morgen overdag ook even langs. Dan zie je hoe het hier gaat. Al ziet het er overdag niet veel beter uit, hoor.",
                  take: "Graag. Dan kom ik morgen even kijken."}
