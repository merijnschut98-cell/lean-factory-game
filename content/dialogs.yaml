        misses: [{text: "Hm. Misschien."}, {text: "Dat moet ik even zien."}, {text: "Dat zet ik op mijn lijstje."}]
        again: [{text: "Ja, dat zei je. Ik denk erover na."}, {text: "Dat stelde je al voor, ja."}]
      propose_experiment:
