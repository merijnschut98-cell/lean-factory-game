# The campaign of region Zuidmark (CLAUDE.md §2): missions unlock new and
# harder missions as the player progresses. At most one main mission and
# three side missions are active at once. The coach, a senior manager, mostly
# asks questions (Toyota Kata), and only about the main mission.
# Game text is Dutch; ids and keys are English. Built by tools/build_content.py.
#
# requires   missions that must be completed first, and a belt (0 white,
#            1 yellow, 2 green, 3 black, 4 master black)
# goal       walk {stream}: see every work step of a stream at the gemba
#            investigate {problem, clues}: find that many key clues
#            solve {problem}: resolve the problem (Check passed, Act done)
# deadline_days  days to complete from when the mission opens (a real event:
#                the clock runs whether or not it is taken on); then `fail` is told
# fail_closes    countermeasures a missed deadline closes for good (never all
#                of the problem's: it can still be solved another way)
#            observe {places, tool?, uses?}: use a gemba tool (`tool`, or any
#            tool or question) at every place, `uses` different place-tool
#            pairs in all (default 1)
#            check {problem}: the problem's Check passed
# insights   main and training missions only: what the coach shares now and
#            then at a stage (go_see, understand, experiment, reflect)
# teaches    concept ids (content/concepts.yaml) whose glossary card the
#            mission brings when it is accepted
# check_days a shorter Check for this mission's problem (training only; the
#            real Check takes Region.CHECK_DAYS, 14)
# setup      training only: a staged situation for the week's lessons, effects
#            on the simulation from the day it is accepted until the training
#            week ends or is skipped (not real numbers)
#
# Story and path dependence (mission-system spec §2, C1 and C19):
# act, chapter, arc   the act (0 training … 6 IT), the chapter title on the
#            board, a side chain (sector, henk, …)
# fork       {group, role: bottleneck | non_bottleneck}: main missions that open
#            together; debrief_first is the debrief when this branch is done first
# reopen     the briefing when the mission is back because its fix faded
# requires   also maturity (1-4), reputation (0-100), trust {team: n},
#            any_of [missions], facts {all, any, none} (facts such as
#            done:<mission>, chose:<problem>:<cm>, poor_fix:<problem> (a poor
#            fit), wrong_cause:<problem> (the A3's root cause was wrong),
#            flag:<name>, or measures such as maturity>=3)
# rewards    also reputation (default: main 5, side 2) and trust {team: n}
# sets_flags [flag:<name>] facts its completion sets
# debrief_variants {blamed, poor_fix, not_standardised}: debriefs that read
#            the play, in that order before debrief_first and debrief
# questions  main and training: the mission's own coach questions per stage,
#            asked before the general bank; insights may list several per stage
# containment {name, budget, days, effects}: a safety mission's short measure
#            against an acute risk (audit §2.4.1), taken once while the mission
#            is active; its effects fade after `days` (at most 30) and it is
#            not the fix (hidden reward eerst_veilig when the fix follows)
# steps      main and training: the objective line's own words per step (the HUD's one
#            line and the minimap marker, Objective): look (go and see; for an observe
#            goal it may map each place to its text), again (one more look there),
#            dig (find out what is going on), a3, wait (the experiment runs), check,
#            act, talk. Short (at most 60 characters), in-world, the where and with
#            whom: never a tool, a problem, a countermeasure or what is wrong. A step
#            without one gets Objective.DEFAULTS ({team}: the team there; {naam}: the
#            person).
# {dossier_weken} in a briefing: the El Amrani dossier's age in weeks, read
#            from the followed order in the simulation (GameSession.mission_briefing)
#
# Goal names: `sustain {problem}` is the check-in's (a slipping fix back in
# use; the game builds these). Holding a KPI for some weeks (catalogue §2.1)
# will be `hold_kpi`.
#
# kind training: the Inwerkweek (docs/superpowers/specs/2026-10-14-training-arc-design.md),
# five small Starter Kata days before the campaign, in order Monday to Friday
# (the game shows them as "Inwerkweek — ma: <name>"). Each day opens the next;
# they take no side slot, have no deadline, and the coach helps with them.
# A returning player skips the week (GameSession.skip_training): done, without
# rewards, and the campaign opens.

coach:
  name: Ruud Hoekstra
  role: Directeur Netbeheer regio Zuidmark
  # Toyota Kata (Rother): target, actual condition, obstacles, next step,
  # what did you learn; plus a long-term, a respect and an always-improve
  # question per stage (CLAUDE.md §2, the three principles; audit §3A.2).
  stages:
    go_see:
      - "Wat wil je bereiken? Hoe ziet het eruit als het hier goed loopt?"
      - "Wat heb je zelf gezien op de werkvloer, niet in het rapport?"
      - "Waar in de stroom ligt het werk stil?"
      - "Wie doet dit werk elke dag? Wat heb je hem of haar gevraagd?"
      - "Als je over een jaar terugkijkt, welk getal wil je dan veranderd hebben?"
      - "Wat zie je hier dat de mensen zelf al lang niet meer zien?"
    understand:
      - "Hoe is de situatie nu, in cijfers?"
      - "Welke obstakels staan tussen jou en de doelsituatie? Welke pak je nu aan?"
      - "Hoe weet je dat dit de oorzaak is, en niet een symptoom?"
      - "Met wie heb je gesproken die het werk zelf doet?"
      - "Welke 'waarom' heb je nog niet gesteld?"
      - "Wat zou de snelste oplossing zijn, en hoe ziet die er over een half jaar uit?"
    experiment:
      - "Wat is je volgende stap, en wat verwacht je dat er gebeurt?"
      - "Wanneer kunnen we zien wat je van die stap hebt geleerd?"
      - "Welk getal vertelt je of het werkt?"
      - "Hoeveel uren kost dit experiment het team, en wie draagt die?"
      - "Wat moet er gebeuren zodat dit ook werkt als jij er niet bent?"
      - "Wat doe je als het tegenvalt?"
    reflect:
      - "Wat had je verwacht, en wat gebeurde er echt?"
      - "Wat heb je geleerd?"
      - "Hoe zorg je dat de verbetering blijft?"
      - "Wie heeft dit mogelijk gemaakt, en weten ze dat?"
      - "Wat is de volgende kleine stap?"
      - "Wat zou je anders doen als je opnieuw begon?"
  # Asked once per mission when the situation holds (Coach.conditions).
  conditional:
    blamed: "Wat wilde je eigenlijk weten toen je dat vroeg?"
    fading_fix: "Hoe lang verwacht je dat dit blijft werken? En dan?"
  # The coach reads the numbers (phase-2 design §3.6; CoachNumbers): a number as it is now
  # on the main mission's stream, said the way Ruud says it ({value}: the number), put
  # before a question once at go_see (the stream's lead time, or its on-time share: never
  # the problem's own KPI before the A3) and once at reflect (the problem's own KPI).
  numbers:
    kpi_now:
      throughput: "Er komen nu {value} per week klaar"
      lead_time: "De doorlooptijd is nu {value} dagen"
      first_time_right: "Nu gaat {value} procent in één keer goed"
      on_time: "Nu is {value} procent op tijd"
      wip_age: "Het werk dat openstaat, is nu {value} dagen oud"
      capacity: "De stroom kan nu {value} per week aan"
    go_see: "Waar wil je naartoe, en waarom juist dat getal?"
    reflect: "Wat had je voorspeld, en wat zegt het verschil je?"
  # The Kata five (Rother, Toyota Kata: target, actual condition, obstacles, next step,
  # when we go and see), asked in order during an experiment, once an experiment; the
  # first comes after the KPI as it is now.
  kata:
    - "Wat was je doel?"
    - "En hoe is het nu echt, op de werkvloer? Wat zie je daar?"
    - "Wat staat er nog tussen nu en je doel? Aan welk obstakel werk je nu?"
    - "Wat is je volgende stap, en wat verwacht je dat er gebeurt?"
    - "Wanneer kunnen we gaan kijken wat je van die stap hebt geleerd?"

# The principle line (phase-2 design §3.7; game/src/rules/principle_line.gd): one
# sentence after every main mission's debrief, Ruud's note on which of the three
# principles paid or cost (CLAUDE.md §2: long term over short term, respect for people,
# always improve), chosen from what the play left, first that holds: a poor or fading
# fix (long_term_cost), someone blamed (respect_blamed), a talk that ended in compliance
# without anyone committing (respect_complied, {wie}: who complied), the fix not
# standardised (improve_cost), someone who committed (respect_committed, {wie}), a
# failed Check that was learned from (improve_paid), else the patient fix
# (long_term_paid). One line per code is picked per mission, the same each time.
# Observations and questions, never a lesson.
principles:
  long_term_cost:
    - "Snel was het zeker, maar wie staat hier over een half jaar weer met hetzelfde probleem?"
    - "Dit werkt voor nu; de rekening komt later, en meestal bij iemand anders."
  respect_blamed:
    - "Het werk loopt beter, maar wie de schuld kreeg van een fout, vertelt je de volgende keer minder."
    - "De cijfers zijn beter; of de mensen je de volgende keer nog iets vertellen, is een andere vraag."
  respect_complied:
    - "{wie} doet wat er is afgesproken; wat zou er nodig zijn om het ook echt van het team zelf te maken?"
    - "{wie} volgt de nieuwe afspraak keurig, maar een afspraak die je niet zelf bedacht hebt, laat je ook makkelijk weer los."
  improve_cost:
    - "Zonder vaste afspraak gaat het vanzelf weer zoals het was; wie gaat het bijhouden?"
    - "Niemand heeft dit vastgelegd, en wat niemand bijhoudt, zakt langzaam terug."
  respect_committed:
    - "{wie} draagt dit nu zelf; zo'n verandering hoeft niemand te bewaken."
    - "Dat {wie} er zelf achter staat, merk je de komende maanden: het blijft staan, ook als jij er niet bij bent."
  improve_paid:
    - "Je eerste experiment liep anders dan je dacht, en toch ging je door; zo wordt het hier beter."
    - "Je zat er eerst naast, je hebt gekeken waarom en het opnieuw geprobeerd."
  long_term_paid:
    - "Dit kostte meer tijd dan een snelle oplossing, maar het staat er over een jaar nog."
    - "Je koos de langere weg, en die verdient zich elke week terug zonder dat iemand ernaar omkijkt."

missions:
  # ── Inwerkweek: five safe days in the connections office ──────────────────
  - id: training_mon
    name: Rondleiding
    kind: training
    tier: 1
    act: 0
    chapter: Inwerkweek
    briefing: "Welkom bij Voltana Netbeheer. Ik ben Ruud Hoekstra. Deze week oefen je in het klein; als er iets misgaat, raakt niemand iets kwijt. Vanochtend lag er een brief op mijn bureau van de familie El Amrani uit Nova-Oost: ze wachten al {dossier_weken} op een aansluiting voor hun warmtepomp. Zoek met de kaart (M) de Intake en Werkvoorbereiding op en vraag bij elk team hoe het werk binnenkomt. En loop vanavond niet meteen naar huis: wie er dan nog zit, maak je het beste kennis mee."
    debrief: "Je kent nu twee plekken waar een aanvraag langskomt. Het dossier is al weken onderweg: hoeveel uur is er al echt aan gewerkt, denk je? Morgen ga je beter kijken."
    goal: {type: observe, places: [connections.intake, connections.design]}
    grant_tools: [conversation]
    steps:
      look:
        connections.intake: "Kijk bij Intake hoe een aanvraag binnenkomt"
        connections.design: "Vraag bij Werkvoorbereiding hoe het werk binnenkomt"
    # The first talk of the game ends the day (first five minutes B7; D9 talks
    # audit A2): the walk meets the goal in the morning, Anouk at seven closes it.
    ends_with_talk: anouk_seven
    teaches: [netbeheerder, aansluiting, aansluittermijn]
    # TRAINING SETUP (staged, not a real number): this week three of the four
    # work preparers are on a course, so Werkvoorbereiding is clearly the
    # bottleneck all week: Wednesday counts it, Thursday's practice problem
    # sits there. At the base load the intake and design queues are too close
    # to call (a few orders each). It holds Monday to Friday and goes when the
    # week ends or is skipped.
    setup:
      - {target: work_prep, property: availability, value: -0.75}
    rewards: {xp: 50}
    insights:
      go_see: "Een aanvraag doet er maanden over. Hoeveel van die tijd wordt er echt aan gewerkt, denk je? En hoe zou je dat kunnen zien?"

  - id: training_tue
    name: Kijken zonder oordeel
    kind: training
    tier: 1
    act: 0
    chapter: Inwerkweek
    requires: {missions: [training_mon]}
    briefing: "Bij Werkvoorbereiding zit deze week alleen Anouk de Vries; haar drie collega's zitten op cursus. Ga bij haar kijken met twee verschillende gemba-hulpmiddelen. Elk hulpmiddel kost tijd en laat iets anders zien. Oordeel nog niet, ook niet in je hoofd: schrijf op wát je ziet, niet wat je ervan vindt."
    debrief: "Wat liet het ene hulpmiddel zien dat het andere miste? Anouk werkt snel. Toch ligt er veel. Waar zit dan de tijd?"
    goal: {type: observe, places: [connections.design], uses: 2}
    steps:
      look: "Kijk bij Anouk hoe ze werkt"
      again: "Kijk nog eens bij Anouk, op een andere manier"
    grant_tools: [shadow, documents]
    teaches: [gemba, five_whys, eight_wastes]
    rewards: {xp: 50}
    insights:
      go_see: "Wat deed Anouk, en wat deed het werk terwijl zij bezig was?"

  - id: training_wed
    name: Waar zit de stapel?
    kind: training
    tier: 1
    act: 0
    chapter: Inwerkweek
    requires: {missions: [training_tue]}
    # Correctness (audit L3): the constraint is where the most days of work
    # wait, not the most orders; queue_count reports both (Region.queue_at).
    briefing: "Tel vandaag de wachtrij bij Intake en bij Werkvoorbereiding. Let op: twintig dossiers van een kwartier zijn minder werk dan tien dossiers van vier uur. Waar ligt het meeste werk te wachten, in dagen werk? Schrijf het op voordat je het met je gevoel vergelijkt."
    debrief: "Je telde de dossiers én de dagen werk die ze vragen. Een stroom gaat zo snel als de plek waar het meeste werk wacht. Als Intake morgen twee keer zo hard werkt, waar ligt het werk dan overmorgen?"
    goal: {type: observe, places: [connections.intake, connections.design], tool: queue_count}
    steps:
      look:
        connections.intake: "Tel wat er bij Intake ligt te wachten"
        connections.design: "Tel wat er bij Werkvoorbereiding ligt te wachten"
    grant_tools: [queue_count]
    # The week's training setup (on Monday) makes the counts give a clear
    # answer; the debrief adds what the player measured and names the longer queue.
    teaches: [flow, wip, bottleneck_focus, netcongestie]
    rewards: {xp: 50}
    insights:
      go_see: "Welke van de twee getallen vertelt je meer: het aantal dossiers of de dagen werk? Waarom?"

  - id: training_thu
    name: Een klein experiment
    kind: training
    tier: 1
    act: 0
    chapter: Inwerkweek
    requires: {missions: [training_wed]}
    briefing: "Anouk pakt altijd het oudste dossier. Toch ligt het dossier van de familie Koster uit Nova-Oost al negen dagen bij haar. Hoe kan dat? Zoek het uit, schrijf een oefen-A3 met een voorspelling en probeer een tegenmaatregel. Morgen kijken we samen of je voorspelling uitkwam."
    debrief: "Je voorspelling is getoetst aan wat er echt gebeurde. Of het tegenviel of meeviel: je weet nu iets wat je gisteren niet wist. Dat is een experiment."
    goal: {type: check, problem: training_tray}
    steps:
      look: "Kijk bij Anouk waar het dossier van de familie Koster ligt"
      dig: "Zoek uit waarom het dossier van Koster blijft liggen"
      a3: "Schrijf je oefen-A3 aan je bureau"
      wait: "Wacht tot morgen: kijk hoe het bij Anouk gaat"
    grant_tools: [time_study, data, listen_in, material_check]
    check_days: 1
    teaches: [PDCA, A3, leading_lagging]
    rewards: {xp: 50}
    insights:
      go_see: "Gisteren telde je waar het werk wacht. Wat wil je morgen anders zien bij Anouk, in een getal?"
      understand: "Wat doet Anouk voordat het echte werk aan een dossier begint? Hoe lang duurt dat?"
      experiment: "Welk getal laat morgen zien of het werkt, en wat verwacht je dat het dan is?"
      reflect: "Wat had je verwacht, en wat gebeurde er? Wat neem je mee naar maandag?"

  - id: training_fri
    name: Borgen of laten wegzakken
    kind: training
    tier: 1
    act: 0
    chapter: Inwerkweek
    requires: {missions: [training_thu]}
    briefing: "Je experiment werkt: Anouk zoekt niet meer. Maandag komen haar drie collega's terug van hun cursus. Weten zij van de ene bak? Beslis: borg je het als standaard werk (dat kost budget), of laat je het zo? Kijk daarna een maand vooruit: hoe loopt het werk met en zonder borgen?"
    debrief_variants:
      not_standardised: "Een maand later wordt er weer gezocht en omgesorteerd. Niemand deed iets fout; niemand wist het nog. Een verbetering blijft alleen als iemand haar borgt. Je inwerkweek zit erop. Maandag vraagt Joost van Dijk het MT om twee extra werkvoorbereiders; ik heb gezegd dat jij eerst gaat kijken."
    debrief: "Een maand later werkt iedereen nog zoals jullie het hebben afgesproken. Het staat op een A4 bij het postbakje, en Anouk legt het aan nieuwe collega's uit. Je inwerkweek zit erop. Maandag vraagt Joost van Dijk het MT om twee extra werkvoorbereiders; ik heb gezegd dat jij eerst gaat kijken."
    goal: {type: solve, problem: training_tray}
    steps:
      act: "Beslis bij Petra's scherm: borg je het, of laat je het zo?"
    check_days: 1
    teaches: [standard_work, improvement_kata]
    rewards: {xp: 50}
    insights:
      reflect:
        - "Wat gebeurt er met de nieuwe werkwijze als het team het druk krijgt en niemand erop let? Wie zou erop moeten letten?"
        - "Wat kost borgen nu, en wat kost niet borgen over een jaar?"

  # ── Act I: De eerste honderd dagen ─────────────────────────────────────────
  # Correctness (audit M1): the walk is a real action, no longer done for the
  # player. The office has two of the stream's places, so the player counts
  # what lies there; a returning player who skips the training week has done
  # it before (GameSession). It becomes a walk of the whole stream once the
  # campus exists.
  - id: walk_connections
    name: Volg het dossier
    kind: main
    tier: 1
    act: 1
    chapter: De stapel
    requires: {missions: [training_fri]}
    briefing: "Voordat je iets verandert, wil ik dat je de weg van één aansluiting hebt gezien. Het dossier van de familie El Amrani is nu {dossier_weken} onderweg. Volg het: tel bij Intake en bij Werkvoorbereiding hoeveel er ligt en hoeveel dagen werk dat is. Waar zou jij als dossier het liefst niet liggen?"
    # About fifteen hours: the touch hours of value_streams.yaml add up to 14.5 (intake 1,
    # quote 1.5, design 3.2, planning 0.5, execution 5, commissioning 1.5, revision 1.6,
    # close-out 0.25), four more for the quarter that needs a grid study.
    debrief: "Een aansluiting vraagt bij elkaar zo'n vijftien uur werk, verdeeld over een handvol teams, en toch is het dossier weken onderweg. De rest van de tijd ligt het ergens te wachten. Onthoud waar het werk stil lag; daar beginnen we maandag."
    goal: {type: observe, places: [connections.intake, connections.design], tool: queue_count}
    steps:
      look:
        connections.intake: "Tel wat er bij Intake ligt te wachten"
        connections.design: "Tel wat er bij Werkvoorbereiding ligt te wachten"
    teaches: [lead_time, flow]
    rewards: {xp: 300}
    insights:
      go_see: "Waar zou jij als dossier het liefst niet liggen, en waarom ligt het er toch?"

  - id: fix_custom_design
    name: De stapel bij Werkvoorbereiding
    kind: main
    tier: 1
    act: 1
    chapter: De stapel
    requires: {missions: [walk_connections]}
    # The stack's numbers follow the simulation (UX audit #6, measured 2026-10-27, seed 11): a returning
    # player's queue at Werkvoorbereiding over the 30 days after accepting, problem untreated, is 0-16
    # dossiers (0-2.5 days of work; 6 at the start), peaking at 11-16 every week; the expert during its
    # experiment 13-34 (1.7-4.9 days). The briefing, the queue_count clue and Joost say so: the count
    # at the start (about a day of work) and the peak (a few days) both read true.
    briefing: "Werkvoorbereiding maakt al zes weken overuren, en toch loopt de stapel elke week weer op tot een stuk of vijftien dossiers. Joost van Dijk ({functie:joost}) vraagt het MT om twee extra werkvoorbereiders. Anouk de Vries ({functie:anouk}) zat gisteravond om zeven uur nog te tekenen. Wat is hier echt aan de hand?"
    debrief: "Een standaardaansluiting krijgt nu een vast ontwerp (wat) en Anouk tekent het op een vaste manier, met één controle in plaats van drie handtekeningen (hoe). Joost trekt zijn vacatures in, en Anouk is om vier uur thuis. Eén vraag voor je volgende stap: als Werkvoorbereiding nu sneller is, waar gaat het werk dan wachten?"
    debrief_variants:
      poor_fix: "Er zijn minder handtekeningen, maar elk ontwerp wordt nog steeds van nul getekend. De stapel zakt, langzaam. Joost houdt zijn vacatures nog even aan. Wat zou het werk zelf lichter maken?"
    reopen: "De stapel bij Werkvoorbereiding groeit weer en Anouk blijft weer tot zeven uur. Wat er ooit werkte, wordt niet meer gedaan. Waarom niet?"
    goal: {type: solve, problem: custom_design}
    talk_to: [{dialog: joost_vacancies, outcome: partial}]
    steps:
      talk: "Praat met Joost (Werkvoorbereiding)"
      look: "Ga bij Werkvoorbereiding kijken hoe een ontwerp ontstaat"
      dig: "Zoek uit waar de uren van Anouk naartoe gaan"
      a3: "Schrijf je A3 voor Werkvoorbereiding aan je bureau"
      wait: "Kijk bij Werkvoorbereiding hoe het experiment loopt"
      check: "Lees op Petra's scherm af wat je experiment opleverde"
      act: "Beslis bij Petra's scherm hoe Werkvoorbereiding verdergaat"
    rewards: {xp: 600, budget: 10000}
    insights:
      go_see: "Wat is je doel voor Werkvoorbereiding, in een getal? En hoe ziet het er nu uit?"
      understand: "Welk deel van wat Anouk doet, merkt de klant? En welk deel niet?"
      experiment: "Wat verwacht je dat er met de stapel gebeurt: hoeveel, en wanneer kun je het zien?"
      reflect:
        - "Wie in het team wist het antwoord al voordat jij kwam? Wat betekent dat voor hoe je de volgende keer begint?"
        - "Joost vroeg om twee mensen. Wat heeft zijn team nu nodig om dit vast te houden?"

  # The fork (Merijn, 2026-10-13): after the first bottleneck two main missions
  # open. The intake is the next bottleneck; the monteurs are not. Correctness
  # (audit L2): the briefings are symmetric, two team leads with a true
  # number each, and neither names a queue: the player has to count.
  - id: fix_incomplete_application
    name: Aanvragen gaan terug naar de klant
    kind: main
    tier: 1
    act: 1
    chapter: De stapel
    requires: {missions: [fix_custom_design]}
    fork: {group: t1_after_design, role: bottleneck}
    briefing: "Sanne Bakker ({functie:sanne}) heeft een turflijst: van de laatste veertig aanvragen stuurde haar team er negentien terug naar de klant. 'We zijn een postkantoor geworden,' zegt ze. 'Ik heb iemand extra nodig om alles na te lopen.' Marco Peters ({functie:marco}) vraagt ook om je aandacht. Jij kiest wat eerst gaat."
    debrief: "Wat binnenkomt is nu compleet: het formulier voorkomt de fout, niemand hoeft harder te controleren. Sanne heeft niemand extra nodig. Kijk naar de stroom: er gaan nu méér aansluitingen per week door. Waarom hier wel, en waar wacht het werk nu?"
    debrief_first: "Wat binnenkomt is nu compleet: het formulier voorkomt de fout, niemand hoeft harder te controleren. Sanne heeft niemand extra nodig, en er gaan méér aansluitingen per week door: je pakte het knelpunt. Marco wacht nog. Wat verwacht je dat zijn verbetering met de stroom doet?"
