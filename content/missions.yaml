  # ── Act I milestones (phase-2 design §3.2): they open themselves on their day and take
  # no slot; the story's moments, not problems.
  - id: winter_el_amrani
    name: Voor de vorst
    kind: milestone
    tier: 1
    act: 1
    chapter: De telefoon
    arc: winters
    requires: {missions: [walk_connections]}
    # Monday 30 November 2026, day 49: three weeks before the frost (drie winters §3).
    opens_on: {date: "2026-11-30"}
    # estimate: the first frost PERIOD is Monday 21 December 2026 (day 70, the shortest day).
    # Reasoning: KNMI counts frost days from October to April; the first single frost night
    # comes much earlier (national average about 21 October over 1991-2020, De Bilt early
    # November in older tables; in 2024 Eelde froze on 15 October while Beek in Limburg still
    # reached 23 degrees on 26 October), but one frost night leaves no family cold. A run of
    # frost nights, when a house without heating gets cold, is a December-January event in
    # the south. Sources: knmi.nl/kennis-en-datacentrum/uitleg/vorstdagen;
    # knmi.nl/nederland-nu/klimatologie/maand-en-seizoensoverzichten/2024/jaar (search
    # extracts; the 1991-2020 station tables in the KNMI Klimaatviewer can sharpen it).
    deadline_on_day: 70
    goal:
      type: story_order
      story: el_amrani
      by: deadline
      # warm in time: the followed order connected, or the heat pump on the existing
      # connection after a monteur looked (the hidden proposal a listener finds)
      met_if: {any: ["delivered:el_amrani", "agreed:el_amrani_fourth_call:check_existing_connection"]}
      promise: el_amrani_fourth_call   # the date named on the phone is checked on its day
    briefing: "Rond de kortste dag, 21 december, gaat het meestal echt vriezen: een paar nachten achter elkaar onder nul. In Nova-Oost hangt een warmtepomp zonder stroom aan de muur, en de cv-ketel is al weg. Mevrouw El Amrani belt vast nog een keer."
    debrief: "In de eerste vorstnacht draaide de warmtepomp van de familie El Amrani. Haar moeder had het warm. Wie wacht er nog meer op een aansluiting, en weet die waar hij aan toe is?"
    fail: "Tijdens de eerste vorstnachten logeert de moeder van mevrouw El Amrani bij haar andere dochter in Havenzij. 'Het is maar voor even,' zegt mevrouw El Amrani. Ze schrijft het op, en ze stuurt een brief. Aan de directie, met een kopie aan de ACM."
    sets_flags_on_fail: ["flag:el_amrani_complaint", "flag:el_amrani_cold_winter"]   # Act III's ACM visit, Act IV's bakery
    missed: "Het vriest. In Nova-Oost staat een warmtepomp nog steeds uit."   # the toast when the frost comes first
    # Kept: her call on your phone and her letter on your desk (Phase 4: her front door).
    payoff:
      - who: el_amrani
        by: call
        text: "{groet}, u spreekt met Fatima El Amrani. Ik bel alleen even om te zeggen dat mijn moeder het warm heeft. Ze vroeg wie u bent. Ik heb gezegd: iemand die terugbelde. Dat was het. Dag."
      - who: el_amrani
        by: letter
        text: "Beste {speler},\n\nToen het ging vriezen, draaide de warmtepomp. Mijn moeder zit 's avonds weer gewoon in de kamer, en niet meer onder twee dekens. U weet dat ik alles opschrijf. Deze keer schrijf ik iets anders op: dank u wel.\n\nMet vriendelijke groet,\nFatima El Amrani"
    teaches: [lead_time]
    rewards: {xp: 300, reputation: 3}

