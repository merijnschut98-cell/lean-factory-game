      wait: "Kijk bij Sandra hoe het experiment loopt"
      check: "Lees op Petra's scherm af wat je experiment opleverde"
      act: "Beslis bij Petra's scherm hoe de meterwisselaars verdergaan"
    rewards: {xp: 400, budget: 4000}

  - id: fix_silent_meter
    name: De zwijgende meter
    kind: side
    tier: 1
    act: 2
    requires: {missions: [fix_not_at_home]}
    briefing: "Petra Vos heeft een lijst met nieuwe slimme meters die geen standen sturen. Bijna allemaal in dezelfde straten. Monteurs moeten terug naar adressen waar ze vorige week al waren. 'De meters van de nieuwe leverancier deugen niet,' zegt iedereen. Petra twijfelt."
    debrief: "Een meter is pas klaar als hij praat. De monteur ziet het nu voordat hij wegrijdt, niet een week later."
    debrief_variants:
      poor_fix: "Bij het plannen kijkt iemand nu naar de dekkingskaart, en in de kelderflats gaat een andere module mee. Maar of een meter echt praat, ziet nog steeds niemand voordat de monteur wegrijdt; wat de kaart mist, hoor je een week later. Wie kan het als eerste zien?"
    goal: {type: solve, problem: silent_meter}
    rewards: {xp: 400, budget: 4000}

  # Rewrite (audit S6, correctness L1): a batch at a wait step adds no
  # capacity, but every order waits for it: the lesson is lead time.
  - id: fix_permits_in_batches
    name: Dagen stilstand voor de vergunning
    kind: side
    tier: 1
    act: 1
    requires: {missions: [fix_custom_design]}
    briefing: "Het dossier van de familie Bos is al bijna twee weken klaar bij Werkvoorbereiding. Het ligt in een map, bij de dossiers van de andere elf woningen van De Appelgaard. De gemeente haalt haar termijn bijna altijd. Waar wacht het dossier dan op?"
    debrief: "Een vergunningsaanvraag wacht nu niet meer op de rest van de straat: die gaat naar de gemeente zodra het dossier zover is. Er gaan niet méér aansluitingen per week door, want de capaciteit is gelijk gebleven. Maar elke klant is eerder klaar, en de aanvraag van de familie Bos lag niet meer weken op een stapel te wachten. Een knelpunt bepaalt hoeveel er doorgaat; elke wachttijd onderweg bepaalt hoe lang het duurt."
    goal: {type: solve, problem: permits_in_batches}
    steps:
      look: "Kijk bij Werkvoorbereiding waar het dossier van Bos ligt"
      dig: "Zoek uit waar het dossier van de familie Bos op wacht"
      a3: "Schrijf je A3 voor Werkvoorbereiding aan je bureau"
      wait: "Kijk bij Werkvoorbereiding hoe het experiment loopt"
      check: "Lees op Petra's scherm af wat je experiment opleverde"
      act: "Beslis bij Petra's scherm hoe Werkvoorbereiding verdergaat"
    rewards: {xp: 400, budget: 4000}

  - id: look_at_grid_study
    name: Het bord van Femke
    kind: side
    tier: 1
    act: 1
    requires: {missions: [fix_status_callers]}
    briefing: "Bij Netstrategie hangt een bord vol netstudies, met gele briefjes die er al maanden hangen. Femke de Wit heeft vijf minuten voor je. Zoek twee feiten over waarom het zo vol is. Oplossen hoeft nog niet."
    debrief: "Je weet nu twee dingen over dat bord. Femke ook: ze vroeg of je terugkomt."
    goal: {type: investigate, problem: grid_study_queue, clues: 2}
    steps:
      look: "Ga bij Netstrategie naar het bord van Femke kijken"
      dig: "Zoek twee dingen uit over het bord van Femke"
    rewards: {xp: 250}

  - id: fix_inverters_tripping
    name: Omvormers die afschakelen
    kind: side
    tier: 1
    act: 2
    requires: {missions: [fix_silent_meter]}
    briefing: "Wim Kortekaas, gepensioneerd elektrotechnicus in de Zonnestraat, stuurt ons elke maand een spreadsheet: zijn omvormer schakelt op zonnige middagen uit, al drie jaar. Inmiddels klagen er twintig buren. Onze monteurs meten adres na adres en vinden in de woning niets mis. Wat zien ze niet?"
    debrief: "Eén aftakking per wijk lost tientallen klachten op. De slimme meters hadden het al die tijd gezien. Wim stuurt geen spreadsheet meer, alleen een kerstkaart. Eén ding nog: wie de spanning in juli omlaag zet, moet in januari kijken wat de warmtepompen ervan vinden."
    debrief_variants:
      poor_fix: "In de Zonnestraat zijn de klachten minder geworden. Maar in de meeste wijken staat de aftakking nog zoals hij stond, en elders valt op een zonnige middag nog steeds een omvormer uit. Wim is tevreden; zijn buren twee straten verderop nog niet. Waar staat de aftakking nog zoals in 2009?"
    goal: {type: solve, problem: inverters_tripping}
    rewards: {xp: 400, budget: 4000}

  # A real event (Merijn, 2026-10-12): Henk retires 56 days after this mission
  # opens, taken on or not. Miss it and the knowledge transfer is gone (the
  # buddy system and TWI need Henk); the problem can still be solved another way.
  - id: save_henks_knowledge
    name: Henks kennis
    kind: side
    tier: 1
    act: 1
    arc: henk
    requires: {missions: [fix_wrong_joint]}
    briefing: "Henk Verbeek werkt veertig jaar bij Voltana. Als in een oude wijk de stroom uitvalt, belt iedereen Henk. Over acht weken geeft hij zijn afscheidsfeest; de uitnodiging hangt al op het prikbord. Vorige week stond Ahmed Bouzid bij een storing in een oude wijk, en belde toen... Henk. Zorg dat Henks vakmanschap niet met hem de deur uit gaat."
    debrief: "Gisteren vond Ahmed zelf de fout in een papierloodkabel in Nova-Oud. Henk stond ernaast en zei niets. Dat was het compliment. Henk kan met een gerust hart met pensioen."
    debrief_variants:
      poor_fix: "Een deel van wat Henk weet, staat nu vastgelegd. Of dat genoeg is, merk je bij de eerste lastige storing zonder hem. Voelen of een kabel nat is, leer je niet uit een instructie alleen."
    fail: "Henk is met pensioen. Zijn afscheid was mooi, maar zijn kennis van de oude netten is met hem vertrokken. Een buddy die het kan voordoen is er niet meer. Wat er op papier staat, en wat Ahmed zelf leert, moet het nu doen."
    goal: {type: solve, problem: knowledge_drain}
    talk_to: [{dialog: henk_camera, outcome: partial}]
    steps:
      talk: "Praat met Henk (Storingsdienst)"
      look: "Ga bij de storingsdienst kijken hoe Henk werkt"
      dig: "Zoek uit wat er wegvalt als Henk met pensioen gaat"
      a3: "Schrijf je A3 voor de storingsdienst aan je bureau"
      wait: "Kijk bij de storingsdienst hoe het experiment loopt"
      check: "Lees op Petra's scherm af wat je experiment opleverde"
      act: "Beslis bij Petra's scherm hoe de storingsdienst verdergaat"
    deadline_days: 56
    deadline_beat: henk_farewell   # his farewell party is that day, his knowledge saved or not (dated beat)
    fail_closes: [skills_matrix_buddy, twi_job_instruction, henks_one_point_lessons]
    teaches: [monteurstekort]
    rewards: {xp: 600, budget: 6000}

  - id: fix_planning_reshuffle
    name: De planning die nooit klopt
    kind: side
    tier: 1
    act: 1
    requires: {missions: [walk_outages]}
    briefing: "Planner Linda Jansen is de halve week bezig met omplannen. 'Ik werk harder dan ooit,' zegt ze, 'en het wordt alleen maar erger.' Storingen gaan altijd voor. Waar komen al die wijzigingen vandaan?"
    debrief: "Er is nu elke dag ruimte voor storingen, en de rest van de planning blijft staan. Een planning die voor honderd procent vol zit, breekt bij het eerste onverwachte; hoe voller, hoe harder."
    goal: {type: solve, problem: planning_reshuffle}
    talk_to: [{dialog: linda_replanning, outcome: partial}]
