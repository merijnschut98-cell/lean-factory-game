      talk: "Praat met Linda (Planning)"
      look: "Ga bij Planning kijken hoe een week wordt ingepland"
      dig: "Zoek uit waarom de planning steeds wordt omgegooid"
      a3: "Schrijf je A3 voor Planning aan je bureau"
      wait: "Kijk bij Planning hoe het experiment loopt"
      check: "Lees op Petra's scherm af wat je experiment opleverde"
      act: "Beslis bij Petra's scherm hoe Planning verdergaat"
    rewards: {xp: 500, budget: 5000}


  # ── Act I sides from the catalogue (mission-system spec §3.3; phase-2 design §3.2) ──
  # The sector arc's first side: why is the grid full? Femke explains in her expert talk
  # (femke_expert, dialogs.yaml); two of its topics heard meet the goal.
  - id: talk_netplanner
    name: Waarom is het net vol?
    kind: side
    tier: 1
    act: 1
    arc: sector
    requires: {missions: [training_fri]}
    briefing: "Je hoort het overal in dit gebouw: het net is vol. Maar wat betekent dat voor een straat in Nova-Oost? Femke de Wit van Netstrategie weet het beter dan wie ook. Ze heeft het druk, dus neem koffie mee. Vraag haar hoe een netstudie gaat, en hoe ze ziet of een station vol is."
    debrief: "Een wijk krijgt stroom via een middenspanningsruimte, en die is berekend op wat een straat tegelijk vraagt. Een warmtepomp en een laadpaal vragen meer, en vaak op hetzelfde moment. Femke rekent dat elke dag door. Je weet nu waar haar bord vandaan komt."
    goal: {type: talk_to, dialog: femke_expert, topics: 2}
    steps:
      talk: "Vraag Femke (Netstrategie) waarom het net vol is"
    teaches: [netcongestie, middenspanningsruimte, transformator]
    rewards: {xp: 150, trust: {grid_analysts: 1}}

  # Leader standard work (spec §2.9): a weekly round of the stream, to see, not to check.
  # It brings the routine and the audit that hold a fix (Sustain; the place's "vaste
  # routine"). Weekly: XP the first time, after that reputation and the teams' trust.
  - id: lsw_gemba_round
    name: De gemba-ronde
    kind: side
    tier: 1
    act: 1
    requires: {missions: [fix_custom_design]}
    briefing: "Een verbetering die niemand meer ziet, zakt weg. Dat is geen gebrek aan discipline; zo gaat werk als niemand kijkt. Ik loop zelf elke week een vaste ronde. Loop deze week mee: kijk bij Intake, Werkvoorbereiding en Planning hoe het werk gaat, en vraag wat er schuurt. Niet om te controleren. Om te zien."
    # Review S3 #6: no claim that a fix still holds (it may have faded): the round asks.
    debrief: "Drie plekken in één ronde, en je weet hoe het er deze week voor staat. Werken ze bij Werkvoorbereiding nog zoals jullie hadden afgesproken, of sluipt het oude er weer in? Een vaste routine op zo'n plek houdt een verbetering vast, en kost het team maar een paar uur per week."
    recurring: {every_days: 7}
    goal: {type: observe, places: [connections.intake, connections.design, connections.planning]}
    steps:
      look:
        connections.intake: "Kijk bij Intake hoe het werk deze week gaat"
        connections.design: "Kijk bij Werkvoorbereiding of de standaard nog leeft"
        connections.planning: "Vraag bij Planning wat er deze week schuurt"
    teaches: [leader_standard_work, gemba]
    rewards: {xp: 150}

  # ── The way back (QA 2.12 (c), phase-2 design §3.5) ──────────────────────────
  # A region whose budget sat at the debt floor for four weeks (in all) gets a
  # cost-saving side chain: real waste in the meter round that costs money every
  # week. Not a bailout: the region climbs back only through the fixes (their
  # rewards, the Act's grant and the savings of a fix that holds).
  - id: fix_double_visits
    name: Twee keer naar hetzelfde adres
    kind: side
    tier: 1
    act: 1
    arc: way_back
    requires: {missions: [walk_connections], facts: {all: ["floor_days>=28"]}}
    briefing: "Financiën belde. We zitten al weken aan de grens van ons budget; geen verwijt, wel een vraag. Bij de meterwisselaars staan elke week zo'n zes adressen twee keer op de lijst, en elke rit voor niks kost ons zo'n honderd euro. Waarom gaan we twee keer?"
    debrief: "Een oude meterkast zie je nu bij het plannen, niet pas aan de deur. De meterwisselaar komt één keer, samen met de aansluitmonteur als dat moet. Dat scheelt elke week ritten, en Financiën ziet het. Waar rijden we nog meer voor niks?"
    debrief_variants:
      poor_fix: "Een paar klanten bellen nu zelf over hun meterkast. De meeste weten niet waar ze naar moeten kijken, dus de monteurs rijden nog steeds terug. Wie kan die kast wél beoordelen, en wanneer?"
    goal: {type: solve, problem: double_visits}
    steps:
      look: "Rijd mee met een meterwisselaar en kijk bij {team}"
      dig: "Zoek uit waarom de meterwisselaar terug moet"
      a3: "Schrijf je A3 voor de meterwisselaars aan je bureau"
      wait: "Kijk bij de meterwisselaars hoe het experiment loopt"
      check: "Lees op Petra's scherm af wat je experiment opleverde"
      act: "Beslis bij Petra's scherm hoe de meterwisselaars verdergaan"
    teaches: [waste_defects, quality_at_the_source]
    rewards: {xp: 400, budget: 5000}

  - id: fix_overtime_planning
    name: Overuren, ook in een rustige week
    kind: side
    tier: 1
    act: 1
    arc: way_back
    requires: {missions: [fix_double_visits]}
    briefing: "De meterwisselaars schrijven samen zo'n achttien overuren per week, ook als het rustig is. Financiën vraagt om een overwerkstop. Dat kan morgen, maar dan schuift het werk door. Kijk eerst waar die uren naartoe gaan."
    debrief: "De monteurs werken nu per wijk. Minder kilometers, minder overuren, en een monteur rijdt niet meer van de ene kant van de regio naar de andere. Een overwerkstop had de uren weggehaald, niet de kilometers. Wat zie je nog meer in de planning dat niemand een keuze noemt?"
    debrief_variants:
      poor_fix: "De overuren zijn gezakt, want het mag niet meer. De kilometers zijn gebleven, en de klanten wachten langer op hun afspraak. Waar zitten die uren nu?"
    goal: {type: solve, problem: overtime_planning}
    steps:
      look: "Kijk bij Planning hoe de meterwissels worden ingepland"
      dig: "Zoek uit waar de overuren van de monteurs vandaan komen"
      a3: "Schrijf je A3 voor Planning aan je bureau"
      wait: "Kijk bij Planning hoe het experiment loopt"
      check: "Lees op Petra's scherm af wat je experiment opleverde"
      act: "Beslis bij Petra's scherm hoe Planning verdergaat"
    teaches: [waste_transport, heijunka]
    rewards: {xp: 400, budget: 5000}
