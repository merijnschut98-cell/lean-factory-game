  # ── Act II: Wat onder de grond zit ─────────────────────────────────────────
  - id: fix_digging_damage
    name: Graafschade
    kind: main
    tier: 1
    act: 2
    chapter: De kaart klopt niet
    requires: {missions: [fix_done_but_not_closed]}
    # "De vijfde deze week" (estimate): the problem adds 5 daytime outages a week to the
    # stream's 10 (a third of them, the depth-0 clue). Nationally Wibon counted 46,799
    # digging damages in 2022, about 900 a week over every utility; electricity's share
    # and Zuidmark's ~2 % of the country (company.yaml) put a region at a few a week.
    # The compensation after four hours: the compensatieregeling (concepts.yaml).
    #
    # Act II's one deadline (Merijn, 2026-10-27, M1): fixed in time, or the cheap contractor
    # briefing is gone. It counts from when the mission opens (deadline_days, as Henk's 56 does),
    # so every pace gets the same window: a fixed day was either toothless (the next winter's
    # frost, day 435) or failed a slow player on opening (winter 1's, day 70, is past by the time
    # Act II opens).
    # estimate: 63 days = nine weeks. Autoplay (2026-10-27, seeds 11 and 13): the average persona
    # needed 28.4 and 42.5 days from opening to solving, the expert 14.2; 42.5 x 1.5 = 63.8, to
    # whole weeks. A typical opening (the expert's, day 76 = 14 December 2026) puts the
    # deadline on day 139, Sunday 28 February 2027, the end of winter; the briefing says nine
    # weeks because the opening date moves with the player.
    # estimate (story): the aannemers write their bestekken for the next building round then
    # (graafwerk stands still in a spell of frost, vorstverlet), and a briefing after it changes
    # nothing for a while. The briefing is the shortcut (decay 30 days, a poor fix), so the
    # door that closes is the cheap one, never the problem: standard_test_trenches (fit 0.8)
    # and revision_at_source (too early at maturity 2) still list. No Act II fork.
    deadline_days: 63
    fail_closes: [contractor_briefing]
    fail: "De aannemers hebben hun bestekken geschreven, op de kaart van nu. Gert: 'Daar kan ik nu niks meer aan veranderen. Voorlopig graven ze zoals ze gewend zijn.' De snelle weg is dicht."
    briefing: "Dinsdag 10.12 uur: een graafmachine raakt een middenspanningskabel. Driehonderd huizen en zorgcentrum De Linde zitten zonder stroom; De Linde draait op het noodaggregaat. Gert Peeters ({functie:gert}) laat zijn KLIC-melding zien: 'Volgens deze kaart lag hier niks.' Het is de vijfde graafschade deze week. Elke schade kost ons geld, en na vier uur krijgt elke getroffen klant een vergoeding. Gert kijkt in zijn agenda: 'Over negen weken schrijven de aannemers hun bestekken voor de volgende bouwronde. Wat daar dan niet in staat, verandert voorlopig niet meer.'"
    debrief: "Er zijn minder graafschades. Bij de Check konden de monteurs zonder je aanpak {kpi_before} storingen per week aan, met je aanpak {kpi_after}. Gert deed alles volgens het boekje; de oorzaak zat in ons proces. Maar de kaart klopt nog steeds niet overal. Wie houdt de kaart eigenlijk bij?"
    debrief_variants:
      blamed: "De schades zijn minder. Gert werkt mee, maar hij vertelt je niets meer dan nodig. Wie houdt de kaart eigenlijk bij?"
      # The designed failed Check (2026-10-16 spec §2): revision at the source is tier 3,
      # at maturity 1-2 it works at 0.15-0.30. The cause is right, the order is not.
      too_early: "Je verwachtte minder graafschade, omdat de kaart beter zou worden. De Check laat zien: nauwelijks minder. Over de kaart had je wel gelijk. Wat Revisie vanaf nu intekent, klopt. Maar de oude afwijkingen liggen er nog allemaal, en de aannemer die volgende week graaft, graaft op de kaart van vorig jaar. Wat maakt het graven deze week al veiliger, terwijl de kaart wordt rechtgezet?\n\nGert: \"Een goede kaart is mooi. Maar volgende week staat mijn ploeg weer te graven. Waar kijken we dan op?\""
    reopen: "Er komen weer graafschades binnen. Gert belt: 'We graven zoals afgesproken. Klopt jullie kaart nog?'"
    goal: {type: solve, problem: digging_damage}
    talk_to: [{dialog: gert_klic, outcome: partial}]
    steps:
      talk: "Praat met Gert (Grondwerk Peeters)"
      look: "Ga bij de storingsdienst kijken wat er dinsdag gebeurde"
      dig: "Zoek uit wat Gert van ons kreeg voordat hij ging graven"
      a3: "Schrijf je A3 voor de storingsdienst aan je bureau"
      wait: "Kijk bij de storingsdienst hoe het experiment loopt"
      check: "Lees op Petra's scherm af wat je experiment opleverde"
      act: "Beslis bij Petra's scherm hoe de storingsdienst verdergaat"
    # Containment (audit §2.4.1): until the cause is fixed, contractors stop
    # and call the storingsdienst before digging within a metre of a
    # middenspanningskabel, and a monteur points out the cable on site. All
    # estimates: about one in ten daytime outages avoided (the MS strikes
    # caught by the call; graafschade is about a third of daytime outages
    # here), EUR 500 for the call line and site visits for two weeks, and two
    # weeks because it leans on goodwill and overtime, not on a fixed process.
    containment:
      name: "Stop en bel: niet graven bij MS-kabels zonder monteur"
      budget: 500
      days: 14
      effects:
        - {target: outages.daytime, property: demand, value: 0.9}
    teaches: [klic_melding, compensatieregeling]
    rewards: {xp: 1000, budget: 12000}
    insights:
      go_see: "Wat moet er vandaag gebeuren zodat er deze week niemand gewond raakt? En wat pas daarna?"
      understand: "Gert deed een KLIC-melding. Wat kreeg hij terug, en klopte dat?"
      experiment: "Hoeveel schades per week verwacht je over een maand? Waar meet je dat?"
      reflect:
        - "Zocht je de oorzaak bij Gert, of in het proces? Wat leverde dat je op?"
        - "Waar in ons eigen huis begint deze schade?"

  - id: fix_revision_backlog
    name: De revisieberg
    kind: main
    tier: 1
    act: 2
    chapter: De kaart klopt niet
    requires: {missions: [fix_digging_damage]}
    # The problem's KPI is the stream's capacity (problems_tier1.yaml: GIS is the
    # constraint while the box grows). The numbers hold by Little's law (estimate): 30
    # connections a week come in, 240 sketches open and the oldest four months old means
    # GIS draws about 15 a week, so the box grew by about 15 a week for four months.
    # The oldest sketch is "van maanden terug", never a month name: Act II starts on a
    # different date in every play.
    briefing: "De kabel die Gert Peeters raakte, lag twee meter naast de plek op de kaart; hij was vier maanden eerder verlegd. Bij Revisie & GIS staat een doos met 240 schetsen van opgeleverde aansluitingen. Onderop liggen er van maanden terug; één is getekend op een boterhamzakje. 'We tekenen ze over zo snel als we kunnen,' zegt Mieke van der Veen ({functie:mieke}). Het GIS-team vraagt om versterking. Hoe oud wordt een schets voordat hij op de kaart staat, en waarom?"
    debrief: "Een nieuwe kabel staat nu eerder op de kaart, en de doos bij Revisie & GIS wordt kleiner. Volgens de Check kan de stroom met je aanpak {kpi_after} aansluitingen per week aan; zonder was dat {kpi_before}. Wie merkt het als dit over een jaar wegzakt, en hoe snel?"
    debrief_variants:
      # A poor fix here is the daily template: drawn sooner, but still drawn twice.
      poor_fix: "De doos wordt kleiner: er wordt nu elke dag getekend. Volgens de Check kan de stroom met je aanpak {kpi_after} aansluitingen per week aan; zonder was dat {kpi_before}. Maar Mieke tekent nog steeds over wat een monteur op de motorkap schetste. Het dubbele werk is er nog; het gaat alleen sneller. Wat gebeurt er met de doos in de eerste drukke maand?"
    reopen: "De doos bij Revisie & GIS vult zich weer. Mieke tekent weer over. Wat werd er niet meer gedaan?"
    goal: {type: solve, problem: revision_backlog}
    talk_to: [{dialog: mieke_redraw, outcome: partial}]
    steps:
      talk: "Praat met Mieke (Revisie & GIS)"
      look: "Ga bij Revisie & GIS kijken naar de doos met schetsen"
      dig: "Zoek uit hoe een schets op de kaart komt"
      a3: "Schrijf je A3 voor Revisie & GIS aan je bureau"
      wait: "Kijk bij Revisie & GIS hoe het experiment loopt"
      check: "Lees op Petra's scherm af wat je experiment opleverde"
      act: "Beslis bij Petra's scherm hoe Revisie & GIS verdergaat"
    rewards: {xp: 900, budget: 10000}
    insights:
      go_see: "Hoe oud is de oudste schets in de doos? Wat betekent dat voor wie morgen gaat graven?"
      understand: "Hoe vaak wordt dezelfde kabel getekend voordat hij op de kaart staat? Door wie?"
      experiment: "Welk getal laat zien dat de kaart bijblijft: de stapel, of de leeftijd van de oudste schets?"
      reflect: "Wie merkt het als dit over een jaar wegzakt, en hoe snel? Wat houdt het vast?"

  - id: fix_grid_study_queue
    name: De netstudie-wachtrij
    kind: main
    tier: 1
    act: 2
    chapter: Het net is vol
    requires: {missions: [fix_revision_backlog], belt: 2}
    # Femke's "five minutes" is a key clue (her conversation, depth 1): the briefing gives
    # her struggle, not the answer. 38 studies at four hours is two weeks for the two
    # analysts (value_streams.yaml, grid_analysts), yet the school waits nine: congestion
    # studies go first and more come in than go out (estimate).
    briefing: "Femke de Wit ({functie:femke}) en haar collega maken lange dagen: er staan 38 netstudies op het bord. De uitbreiding van de basisschool in Nova-Oost wacht al negen weken op een studie. 'Er komen er elke week meer bij dan we af krijgen,' zegt Femke. 'Ik kom niet eens toe aan de studies die er echt toe doen.' Netstrategie vraagt om twee extra analisten, en die zijn in heel Nederland schaars. Wat kan er nog meer?"
    debrief: "Niet elke aanvraag heeft een volledige studie nodig. Bij de Check kon de stroom zonder je aanpak {kpi_before} aansluitingen per week aan, met je aanpak {kpi_after}. Femke rekent weer aan de studies die ertoe doen, en de school had binnen een week antwoord. Je hebt het knelpunt eerst beter benut voordat je het groter maakte. Wanneer is extra analisten aannemen wél de goede stap?"
    debrief_variants:
      # A poor fix: the overtime sprint or the templates. Faster or longer, still every study.
      poor_fix: "Het bord is korter. Bij de Check kon de stroom zonder je aanpak {kpi_before} aansluitingen per week aan, met je aanpak {kpi_after}. Maar nog steeds krijgt elke aanvraag boven 3x25A de volle studie, ook de warmtepomp in een straat waar ruimte genoeg is. Femke rekent sneller of langer, niet minder. Hoeveel van die studies hadden eigenlijk gehoeven?"
    reopen: "Op Femke's bord staan weer bijna veertig studies. Elke aanvraag krijgt weer de volle studie. Wie besliste dat, en wanneer?"
    goal: {type: solve, problem: grid_study_queue}
    talk_to: [{dialog: femke_triage, outcome: partial}]
    steps:
      talk: "Praat met Femke (Netstrategie)"
      look: "Ga bij Femke kijken naar het bord met netstudies"
      dig: "Zoek uit wat Femke op een dag allemaal doet"
      a3: "Schrijf je A3 voor Netstrategie aan je bureau"
      wait: "Kijk bij Netstrategie hoe het experiment loopt"
      check: "Lees op Petra's scherm af wat je experiment opleverde"
      act: "Beslis bij Petra's scherm hoe Netstrategie verdergaat"
    teaches: [netcongestie]
    rewards: {xp: 1200, budget: 12000}
    insights:
      go_see: "Wat doet Femke in een uur? Welk deel daarvan kan alleen zij?"
      understand: "Hoeveel van de studies leveren een ander antwoord op dan 'het past'?"
      experiment: "Als je dit knelpunt beter benut, hoeveel studies per week verwacht je? Wanneer zie je dat?"
      reflect:
        - "Wanneer is extra analisten aannemen wél de goede stap? Wat moet er dan eerst kloppen?"
        - "Femke maakte lange dagen. Hoe zie je of dat nu anders is?"

  - id: fix_transformer_wait
    name: Een half jaar wachten in volle straten
    kind: main
    tier: 1
    act: 2
    chapter: Het net is vol
    requires: {missions: [fix_grid_study_queue]}
    # Rob is the talk this mission needs (rob_order_rule): the briefing names him. The
    # plain debrief holds for the early order and the framework contract alike; the
    # stock is a poor fix (fit 0.8 against 1.0): it hides the late order, at a price.
    briefing: "Projectontwikkelaar Hermans Bouw levert over vijf maanden 48 woningen op in De Boomgaard. Volgens onze planning hebben die dan nog geen stroom: de trafo voor het nieuwe station heeft zes maanden levertijd. 'Heel Europa wil trafo's,' zegt Rob Verhagen ({functie:rob}). Dat klopt. Wat kunnen wíj dan nog doen?"
    debrief: "De fabrikant is niet sneller geworden; wij hebben veranderd wanneer en hoe we bestellen. Bij de Check waren de oudste openstaande aansluitingen zonder je aanpak {kpi_before} dagen oud, met je aanpak {kpi_after}. De oudste wachtende verzwaring is jonger geworden, en De Boomgaard krijgt eerder stroom. Welke andere wachttijd leggen we bij een ander neer, terwijl hij bij ons begint?"
    debrief_variants:
      poor_fix: "De Boomgaard krijgt eerder stroom: er staan nu trafo's op voorraad. Bij de Check waren de oudste openstaande aansluitingen zonder je aanpak {kpi_before} dagen oud, met je aanpak {kpi_after}. Maar we bestellen nog steeds pas als het ontwerp is goedgekeurd. De voorraad vangt dat op, maar die kost geld: opslag, verzekering en het geld dat erin vastzit. Wat gebeurt er als drie projecten tegelijk een trafo uit die voorraad willen?"
    reopen: "De trafo's worden weer pas besteld als het ontwerp klaar is. Hermans Bouw belt opnieuw. Wat is er in de bestelroute teruggeslopen?"
    goal: {type: solve, problem: transformer_wait}
    talk_to: [{dialog: rob_order_rule, outcome: partial}]
    steps:
      talk: "Praat met Rob (Inkoop)"
      look: "Ga bij Netstrategie kijken waar De Boomgaard op wacht"
      dig: "Zoek uit wat er gebeurt tussen netstudie en trafo"
      a3: "Schrijf je A3 voor Netstrategie aan je bureau"
      wait: "Kijk bij Netstrategie hoe het experiment loopt"
      check: "Lees op Petra's scherm af wat je experiment opleverde"
      act: "Beslis bij Petra's scherm hoe Netstrategie verdergaat"
    teaches: [transformator]
    rewards: {xp: 1300, budget: 12000}
    insights:
      go_see: "Op welk moment weten we dat er een trafo nodig is? En op welk moment bestellen we hem?"
      understand: "Welke wachttijden lopen nu na elkaar die naast elkaar zouden kunnen?"
      experiment: "Wat is het risico als je bestelt vóór het ontwerp is goedgekeurd? Hoe maak je dat risico klein?"
      reflect: "Wat kon je niet veranderen, en wat wel? Waar geldt dat nog meer?"

  - id: fix_unused_capacity
    # The name and the briefing never say the capacity is unused: the empty hall next door
    # is the listen-in clue's to find (depth 1), so the briefing has no dark or empty halls. The ACM's rule is GOTORK (company.yaml
    # numbers: twelve months at most half used, or 1 MW or more unused).
    name: Twee jaar op de wachtlijst
    kind: main
    tier: 1
    act: 2
    chapter: Het net is vol
    requires: {missions: [fix_transformer_wait]}
    briefing: "Ilse de Graaf ({functie:ilse}) wil haar gasovens vervangen door elektrische. Ze staat al twee jaar op de wachtlijst voor transportcapaciteit, en zolang ze wacht, stookt ze op gas dat elk jaar duurder wordt. 'Leg me eens uit waarom het net vol is,' zei ze tegen Thomas Visser ({functie:thomas}). 'Anders zoek ik een plek waar ik wél stroom krijg, en ik stap naar de ACM.' Volgens Netstrategie is het net vol. Is het dat ook?"
    debrief: "Op het drukste kwartier van het jaar gebruikten de grote klanten maar een deel van wat ze gecontracteerd hadden. Bij de Check kregen zonder je aanpak {kpi_before} aanvragen per week capaciteit, met je aanpak {kpi_after}. Een deel daarvan komt, volgens de regels van de ACM, terug in de wachtrij. Welke andere voorraad houden wij aan die op papier vol lijkt?"
    debrief_variants:
      # A poor fix: the dashboard (it shows, nobody hands back) or flexible contracts for
      # newcomers (they fit beside the old contracts, which stay as they are).
      poor_fix: "Er past weer wat meer op het net. Bij de Check kregen zonder je aanpak {kpi_before} aanvragen per week capaciteit, met je aanpak {kpi_after}. Maar de capaciteit die al jaren gecontracteerd is en niet gebruikt wordt, staat nog steeds op naam van wie hem niet gebruikt. Ilse wacht daar nog steeds naast. Wie gaat met die klanten in gesprek?"
    reopen: "De wachtlijst groeit weer, terwijl het gebruik niemand meer bijhoudt. Thomas krijgt weer boze telefoontjes. Wie keek er naar de cijfers, en waarom nu niet meer?"
    goal: {type: solve, problem: unused_capacity}
    talk_to: [{dialog: thomas_reclaim, outcome: partial}]
    steps:
      talk: "Praat met Thomas (Grootzakelijke klanten)"
      look: "Ga bij de congestiedesk kijken wie er op de wachtlijst staat"
      dig: "Zoek uit hoeveel gecontracteerd vermogen echt wordt gebruikt"
      a3: "Schrijf je A3 voor de congestiedesk aan je bureau"
      wait: "Kijk bij de congestiedesk hoe het experiment loopt"
      check: "Lees op Petra's scherm af wat je experiment opleverde"
      act: "Beslis bij Petra's scherm hoe de congestiedesk verdergaat"
    teaches: [netcongestie, acm]
    rewards: {xp: 1400, budget: 12000}
    insights:
      go_see: "Wat wil je weten over het drukste moment van het jaar? Waar zou je dat kunnen zien?"
      understand: "Is het net vol, of zijn de contracten vol?"
      experiment: "Hoeveel megawatt verwacht je terug te krijgen, en hoeveel bedrijven op de wachtlijst helpt dat?"
      reflect:
        - "Welke andere voorraad houden wij aan die op papier vol lijkt?"
        - "Hoe heb je de klanten behandeld die capaciteit teruggaven? Komen ze bij ons terug als ze groeien?"

  - id: fix_silo_kpis
    # The name and the briefing show the symptom (two records, no more connections); that
    # the KPIs pull against each other is for the player to find.
    name: Twee recordmaanden
    kind: main
    tier: 1
    act: 2
    chapter: Wat je meet
    requires: {missions: [fix_unused_capacity]}
    # The record month (ESTIMATE, the stream's 30 requests a week): 132 requests through,
    # 128 designs done; their local counts, not the stream's.
    briefing: "In het MT presenteerden Sanne Bakker ({functie:sanne}) en Joost van Dijk ({functie:joost}) allebei een recordmaand: 132 aanvragen door bij Intake, 128 ontwerpen af bij Werkvoorbereiding. Marco Peters ({functie:marco}) zei niets, tot het einde: 'Mooi. En wie bouwt jullie fouten na?' Hoe kunnen twee teams allebei een record halen, terwijl de klant niets merkt?"
    debrief: "Intake en Werkvoorbereiding kijken nu naar dezelfde aansluiting en hetzelfde getal. Bij de Check was zonder je aanpak {kpi_before} procent van de aansluitingen in één keer goed, met je aanpak {kpi_after} procent. Wat je meet, bepaalt wat mensen doen; en wat je níet meet, bepaalt wat ze laten liggen. Wie heeft last gehad van de oude cijfers, en weten ze dat het niet aan hen lag?"
    debrief_variants:
      # A poor fix: the WIP limit (the counts still steer) or shared goals without one
      # board (each team still sees its own part).
      poor_fix: "Er komt minder terug bij de monteurs. Bij de Check was zonder je aanpak {kpi_before} procent van de aansluitingen in één keer goed, met je aanpak {kpi_after} procent. Maar de aansluiting van aanvraag tot meter staat nog nergens op één plek; elk team ziet vooral zijn eigen stuk. Waar zou Marco moeten kijken om te zien of het beter gaat?"
    reopen: "In het MT liggen weer twee recordmaanden op tafel en de aansluitingen gaan niet sneller. Waar kijken de teams nu weer naar?"
    goal: {type: solve, problem: silo_kpis}
    talk_to: [{dialog: sanne_kpi, outcome: partial}]
    steps:
      talk: "Praat met Sanne (Intake)"
      look: "Ga bij Intake en Werkvoorbereiding naar hun borden kijken"
      dig: "Zoek uit waarop beide teams worden afgerekend"
      a3: "Schrijf je A3 voor beide teams aan je bureau"
      wait: "Kijk bij beide teams hoe het experiment loopt"
      check: "Lees op Petra's scherm af wat je experiment opleverde"
      act: "Beslis bij Petra's scherm hoe beide teams verdergaan"
    rewards: {xp: 1500, budget: 12000}
    insights:
      go_see: "Vraag eens aan twee teams waar ze op worden beoordeeld. Passen die doelen bij elkaar?"
      understand: "Wat doe jij als je op aantallen wordt afgerekend en het werk is bijna niet te halen?"
      experiment: "Welk getal zou beide teams naar hetzelfde doel laten kijken?"
      reflect:
        - "Wat gebeurt er als je een team op één getal afrekent: wat verbetert, en wat gaat er stilletjes mis?"
        - "Wie heeft last gehad van de oude cijfers, en weten ze dat het niet aan hen lag?"

  # The KPI board's birth (catalogue: first_kpi_review; PLAN 2.4c and 2.5): the first
  # quarterly review, a scene at Directie & Obeya with Ruud and Frank that reads what the
  # silo fix left (holds, Frank committed or only complied) and ends at the KPI board,
  # where the player hangs the teams' KPIs; what is said after reads the choice
  # (steers:<focus>) and the analysts' forecast. A board no fix hung is hung here.
  - id: first_kpi_review
    name: Het eerste kwartaal
    kind: milestone
    tier: 1
    act: 2
    chapter: Wat je meet
    requires: {missions: [fix_silo_kpis]}
    goal: {type: scene}
    scene: first_kpi_review
    steps: {go: "Ga naar Directie & Obeya op de 2e"}
    briefing: "Elk kwartaal kijken Frank Hulshof ({functie:frank}) en ik samen naar de getallen waar de teams op sturen. Deze keer wil ik dat jij erbij bent. Directie & Obeya, op de 2e."
    debrief: "Het bord hangt. Over een kwartaal zien we of de getallen deden wat we ervan verwachtten. Welk getal ga jij zelf in de gaten houden?"
    teaches: [kpi, leading_lagging]
    rewards: {xp: 800, budget: 8000, reputation: 5}

  # ── Side missions: small, without the coach ────────────────────────────────
  - id: walk_outages
    name: Een nacht met de storingsdienst
    kind: side
    tier: 1
    act: 1
    requires: {missions: [walk_connections]}
    # Compensation (ACM, "Vergoeding stroomstoring en gasstoring", acm.nl): up to 3x25A,
    # EUR 35 for an outage of 4 to 8 hours, EUR 20 for every 4 hours more; paid unasked.
    briefing: "De storingsdienst werkt als de rest slaapt. Loop een dienst mee met monteur Ahmed Bouzid, van melding tot herstel. Let op de klok: na vier uur zonder stroom krijgt elke klant een vergoeding. Waar gaat de tijd naartoe?"
    debrief: "Je zag een storing van melding tot herstel. Halverwege reed Ahmed naar het magazijn voor een mof. Dat onthoud je."
    goal: {type: walk, stream: outages}
    steps:
      look: "Loop met Ahmed mee en kijk bij {team}"
    teaches: [compensatieregeling]
    rewards: {xp: 200}

  # Rewrite (audit S2): a walk with a question to answer by looking.
  - id: walk_meters
    name: Acht adressen
    kind: side
    tier: 1
    act: 1
    requires: {missions: [walk_connections]}
    briefing: "Loop een dag mee met meterwisselaar Sandra Vermeulen. Er staan acht adressen op haar lijst; de laatste analoge meters in Nova moeten eruit. Tel hoe vaak de deur opengaat."
    debrief: "Niet elke deur ging open. Sandra liet weer een kaartje achter: 'helaas niet thuis'. Ze heeft er een dikke stapel van in de bus."
    goal: {type: walk, stream: meters}
    steps:
      look: "Rijd met Sandra mee en kijk bij {team}"
    rewards: {xp: 200}

  - id: fix_wrong_joint
    name: Een storing duurt langer dan vier uur
    kind: side
    tier: 1
    act: 1
    requires: {missions: [walk_outages]}
    briefing: "Bij de storing in de Lindelaan was de stroom vijf uur weg; 140 huishoudens krijgen elk 35 euro vergoeding. Ahmed moest halverwege de reparatie terug naar het magazijn, voor een mof. 'Het magazijn levert te laat,' zeggen de monteurs. Dirk Smits van het magazijn: 'Ik heb ze gewoon liggen.' Ze hebben allebei gelijk. Hoe kan dat?"
    debrief: "Wat in de bus hoort, ligt er nu ook, en wat eruit gaat, wordt aangevuld voordat de bus weer uitrukt. De volgende lange storing kostte geen rit naar het magazijn."
    debrief_variants:
      poor_fix: "Bij de schuifdeur hangt nu een kaart, en Dirk vult 's ochtends aan wat is aangestreept. Na een drukke nacht vergeet de monteur weleens een streepje, en dan is bij de volgende storing precies dat vak leeg. Hoe weet Dirk wat er op is, als niemand iets aanstreept?"
    goal: {type: solve, problem: wrong_joint_in_van}
    talk_to: [{dialog: dirk_shelf, outcome: partial}]
    steps:
      talk: "Praat met Dirk (magazijn)"
      look: "Ga bij de storingsdienst kijken hoe een herstel loopt"
      dig: "Zoek uit waarom Ahmed halverwege naar het magazijn reed"
      a3: "Schrijf je A3 voor de storingsdienst aan je bureau"
      wait: "Kijk bij de storingsdienst hoe het experiment loopt"
      check: "Lees op Petra's scherm af wat je experiment opleverde"
      act: "Beslis bij Petra's scherm hoe de storingsdienst verdergaat"
    rewards: {xp: 400, budget: 4000}

  - id: fix_not_at_home
    name: Niet thuis
    kind: side
    tier: 1
    act: 1
    requires: {missions: [walk_meters]}
    briefing: "Sandra Vermeulen laat elke dag drie kaartjes achter: 'helaas niet thuis'. Het programma om de laatste analoge meters te vervangen loopt achter. Meneer De Jong belde boos: hij had de hele ochtend thuis gezeten, en er kwam niemand. Wie is hier eigenlijk niet thuis?"
