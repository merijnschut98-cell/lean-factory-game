    basis: "Zo'n vier aanvragen per week, en wie op de lijst staat, wacht gemiddeld anderhalf jaar."
  - id: wachtlijst_afname_mw_zuidmark
    label: "Gevraagd transportvermogen op de wachtlijst in Zuidmark"
    value: 200
    unit: MW
