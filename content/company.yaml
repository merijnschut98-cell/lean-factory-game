    value: 30000
    unit: technici
    source:
      url: "https://www.netbeheernederland.nl/artikelen/persbericht/netbeheerders-en-aannemers-zetten-samen-op-5000-extra-technici-voor"
      title: "Netbeheer Nederland: Netbeheerders en aannemers zetten samen in op 5.000 extra technici voor uitbreiden elektriciteitsnet"
      date: "2025-11-14"
  - id: gecontracteerd_benut_zuidmark
    label: "Deel van het gecontracteerd vermogen dat de grootzakelijke klanten in Zuidmark op het drukste kwartier van het jaar gebruiken"
    value: 62
    unit: procent
    # unused_capacity's key data clue (problems_tier1.yaml): shown only once the player found it.
    revealed_by: ["unused_capacity:0"]
    estimate: "The same estimate as the clue: large customers contract with room to grow and stay well under their contract at the peak."
    basis: "Uit de meetdata van de congestiedesk, naast de contracten gelegd."
  - id: technici_zuidmark
    label: "Monteurs die Zuidmark tot 2030 extra nodig heeft"
    value: 25
    unit: monteurs
    estimate: "Landelijk 30.000 extra technici bij netbeheerders en aannemers (Netbeheer Nederland, 2025); naar rato van Zuidmarks 2 % van de wachtlijst zo'n 600, waarvan het grootste deel bij aannemers. Voor Voltana's eigen werf (dertien monteurs, value_streams.yaml) is 25 erbij bijna een verdubbeling: een schatting van de orde van grootte."
    basis: "Het landelijke tekort naar rato van de regio, voor een eigen werf van dertien monteurs: de orde van grootte."
