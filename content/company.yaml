    value: 30
    unit: per week
    estimate: "Het getal waarmee de simulatie rekent (value_streams.yaml, connections). Landelijk kwamen er in een halfjaar 53.245 nieuwe aansluitingen bij (Netbeheer Nederland); 30 per week is zo'n 1,5 % daarvan, voor één kantoor met één team Werkvoorbereiding."
    basis: "Zo'n 1,5 % van wat er landelijk bijkomt, voor één kantoor met één team Werkvoorbereiding."
  - id: gotork_drempel_benut
    label: "ACM-regel GOTORK: transportvermogen dat een grote klant twaalf maanden lang voor ten hoogste de helft benut, geldt als niet gebruikt"
