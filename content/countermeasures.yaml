  # The ACM's GOTORK code decision (ACM/UIT/612014, acm.nl; company.yaml numbers): a large
  # customer who uses at most half of the contracted capacity for twelve months, or leaves
  # 1 MW or more unused, can be asked to hand the rest back.
  - id: use_it_or_lose_it
    name: Use-it-or-lose-it-gesprekken
    tier: 2
    category: flow
    description: Klanten die twaalf maanden lang hooguit de helft gebruiken van wat ze gecontracteerd hebben, of 1 MW of meer laten liggen, krijgen een gesprek en een voorstel om capaciteit terug te geven, zoals de regels van de ACM het toestaan. Wat vrijkomt, gaat naar de wachtrij.
    budget: 5000
    team_hours: {key_accounts: 30, grid_analysts: 10}
    decay_days: null
    multipliers: {full: 0.9, reduced: 0.5, minimal: 0.25}
    effects: []

  - id: flexible_contracts
    name: Flexibele en tijdsduurgebonden contracten
    tier: 3
    category: flow
    description: Nieuwe klanten krijgen naast vaste capaciteit ook non-firm en tijdsduurgebonden contracten aangeboden. Meer aanvragen passen meteen, buiten de drukste uren.
    budget: 8000
    team_hours: {key_accounts: 40}
    decay_days: null
    multipliers: {full: 0.9, reduced: 0.5, minimal: 0.25}
    effects:
      - {target: congestion.capacity_queue, property: applies, value: -0.1}

  # ── Planning en storingen ─────────────────────────────────────────────────
  - id: daytime_outage_crew
    name: Vaste storingsploeg overdag
    tier: 1
    category: flow
    description: Elke dag staan twee monteurs ingeroosterd voor storingen. Is er geen storing, dan doen ze klein onderhoud dat kan wachten. De rest van de planning blijft staan.
    budget: 2000
    team_hours: {planners: 10, monteurs: 10}
    decay_days: 45
    multipliers: {full: 0.9, reduced: 0.5, minimal: 0.25}
    effects:
      - {target: monteurs, property: reserve, value: {stream: outages, people: 2}}

  - id: planning_with_fault_windows
    name: Planning met dagvensters voor storingen
    tier: 2
    category: standard_work
    description: De planners vullen een monteur voor ongeveer 85%. Het vrije venster vangt storingen op, zodat een storing de dag niet meer omgooit.
    budget: 3000
    team_hours: {planners: 30}
    multipliers: {full: 0.9, reduced: 0.5, minimal: 0.25}
    effects: []

  - id: heijunka_release
    name: Heijunka-planning
    tier: 3
    category: flow
    description: Gepland werk wordt gelijkmatig over de week vrijgegeven, met een vaste mix van aansluitingen en meterwissels per dag. Pieken en gaten verdwijnen, en er blijft ruimte voor het onverwachte.
    budget: 6000
    team_hours: {planners: 40}
    multipliers: {full: 0.9, reduced: 0.5, minimal: 0.25}
    effects:
      - {target: connections.planning, property: touch_time, value: 0.9}

  # ── Afdelingsdoelen ───────────────────────────────────────────────────────
  - id: obeya_end_to_end
    name: Obeya aansluitingen van begin tot eind
    tier: 1
    category: visual_management
    description: Intake, Werkvoorbereiding, Planning en Uitvoering hangen één bord op met de aansluitingen van begin tot eind. De teams worden samen beoordeeld op doorlooptijd en op de oudste aanvraag in plaats van op hun eigen aantallen, en starten nieuw werk pas als het volgende team er ruimte voor heeft.
    budget: 4000
    team_hours: {intake: 10, work_prep: 10, planners: 5}
    decay_days: 45
    multipliers: {full: 0.9, reduced: 0.5, minimal: 0.25}
    unlocks: kpi_board
    sustains: true
    effects:
      - {target: intake, property: kpis, value: [intake_lead_time, intake_oldest]}
      - {target: work_prep, property: kpis, value: [work_prep_lead_time, work_prep_oldest]}

  - id: connections_wip_limit
    name: Maximum aantal aansluitingen in uitvoering
    tier: 2
    category: flow
    description: Er mogen niet meer aansluitingen tegelijk in behandeling zijn dan het team aankan. Nieuwe aanvragen wachten aan de poort tot er een klaar is, zodat afdelingen niet meer kunnen opstapelen.
    budget: 1000
    team_hours: {intake: 5, planners: 5}
    decay_days: 45
    multipliers: {full: 0.9, reduced: 0.5, minimal: 0.25}
    effects:
      # ESTIMATE: about the base backlog. The healthy base holds 230-270
      # started connections (measured, 3 seeds, 150 days), so the limit only
      # bites when work piles up.
      - {target: connections, property: wip_limit, value: 300}

  - id: shared_team_goals
    name: Gezamenlijke teamdoelen
    shortcut: true   # tempting, costs later: a shared goal on top of the old counts: a poor fix that fades
    tier: 2
    category: standard_work
    description: Intake en Werkvoorbereiding krijgen als doel de doorlooptijd van een aansluiting en een complete overdracht (compleet doorgezet, eerste keer goed bij uitvoering). Aantallen per week blijven zichtbaar, maar sturen niet meer.
    budget: 2000
    team_hours: {intake: 10, work_prep: 10}
    decay_days: 45
    multipliers: {full: 0.9, reduced: 0.5, minimal: 0.25}
    effects:
      - {target: intake, property: kpis, value: [intake_lead_time, intake_complete]}
      - {target: work_prep, property: kpis, value: [work_prep_lead_time, work_prep_ftr]}

  # ── Shortcuts (phase-2 design §3.4: face, number, choice) ────────────────
  # Tempting ways out that cost later (a poor fix: Missions.POOR_FIT_GAP; and they fade
  # sooner than the patient fix). Numbers are estimates with their reasoning.
  - id: backup_job_per_day
    name: Een reserveklus per monteur
    shortcut: true   # the trip is no longer lost, the customer whose cupboard was not ready still waits
    tier: 1
    category: flow
    description: Planning geeft elke monteur een reserveklus mee. Staat hij voor een meterkast die niet klaar is, dan rijdt hij door naar de reserve. De rit is niet verloren, maar de klant van wie de kast niet klaar was, wacht nog steeds.
    # ESTIMATE: a planner's afternoon to set it up (EUR 500, 8 h); it leans on the
    # planners remembering it on busy days, so it fades in a month.
    budget: 500
    team_hours: {planners: 8}
    decay_days: 30
    multipliers: {full: 0.9, reduced: 0.5, minimal: 0.25}
    effects: []
  - id: mid_month_run
    name: Een tweede maandrun halverwege
    shortcut: true   # half the wait, still a batch
    tier: 1
    category: flow
    description: Meetdata draait de afhandeling voortaan twee keer per maand in plaats van één keer. Een aansluiting wacht gemiddeld half zo lang, maar het blijft een batch, en wie net na de run klaar is, wacht nog twee weken.
    # ESTIMATE: one extra login session a month (4 h); without a trigger in the
    # process the second run is the first to go when it gets busy.
    budget: 500
    team_hours: {meter_office: 4}
    decay_days: 30
    multipliers: {full: 0.9, reduced: 0.5, minimal: 0.25}
    effects: []
  - id: study_overtime_sprint
    name: Inhaalslag in overwerk
    shortcut: true   # the board gets shorter, every request still gets the full study; tired analysts later
    tier: 1
    category: people
    description: Zes weken lang werken de netplanners twee avonden per week over om het bord leeg te krijgen. Het bord wordt korter, maar elke aanvraag krijgt nog steeds de volle studie, en de vermoeidheid komt later.
    # ESTIMATE: 2 analysts x 2 evenings x 3 h x 6 weeks = 72 h at about EUR 70 an hour
    # with the overtime surcharge: EUR 5,000; overtime is no daily work taken away.
    budget: 5000
    team_hours: {}
    decay_days: 21
    multipliers: {full: 0.9, reduced: 0.5, minimal: 0.25}
    effects: []
    # The later cost (ESTIMATE): three weeks after the Act the tiredness shows for a
    # month, a tenth of the analysts' time lost to sickness and recovery.
    aftermath:
      after_days: 21
      days: 28
      effects:
        - {target: grid_analysts, property: availability, value: -0.1}

  # ── The way back (QA 2.12 (c)): the meter round's double visits and overtime ──
  - id: cupboard_photo_at_booking
    name: Foto van de meterkast bij de afspraak
    tier: 1
    category: quality
    description: Bij het maken van de afspraak vraagt planning de klant om een foto van de meterkast. Is de kast niet geschikt, dan komen de aansluitmonteur en de meterwisselaar samen, in één bezoek.
    # ESTIMATE: the booking form and the letter changed, about a week of the planners' time.
    budget: 2500
    team_hours: {planners: 15}
    decay_days: 60
    multipliers: {full: 0.9, reduced: 0.5, minimal: 0.25}
    effects: []
  - id: register_cupboard_check
    name: Bouwjaar uit het register bij het plannen
    tier: 1
    category: standard_work
    description: Het planningsscherm toont het bouwjaar en het kasttype uit het aansluitregister. Bij een oude kast plant planning de aansluitmonteur en de meterwissel op dezelfde dag.
