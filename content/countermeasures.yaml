# Countermeasures: what a player can try in the A3, in a grid-operator setting.
# Game text is Dutch; ids and keys are English. Built by tools/build_content.py.
#
# tier         1 Stabiel · 2 Zichtbaar · 3 Flow · 4 Systeem (GDD, Countermeasures).
#              Above the region's maturity a countermeasure only partly works.
# budget       improvement budget in euros
# team_hours   hours the team spends on the improvement: taken from daily
#              work while the experiment runs
# decay_days   days until the gain fades if it is not standardised (null: it stays)
# multipliers  effectiveness at a maturity gap of 0, 1 and 2
# effects      what it changes in the simulation once it works (on top of
#              removing the problem): its own shape of a healthier process

countermeasures:
  # ── Nieuwe aansluitingen ──────────────────────────────────────────────────
  - id: poka_yoke_application
    name: Poka-yoke aanvraagformulier
    tier: 1
    category: quality
    description: Het webformulier gaat pas verder als vermogen, installateur en een foto van de meterkast zijn ingevuld. Fouten worden aan de bron voorkomen in plaats van later gevonden.
    budget: 6000
    team_hours: {intake: 30}
    decay_days: null
    multipliers: {full: 0.9, reduced: 0.5, minimal: 0.25}
    effects:
      - {target: connections.intake, property: ftr, value: 0.05}
  - id: intake_checklist
    name: Checklist bij de intake
    tier: 1
    category: standard_work
    description: De intakemedewerker loopt elke aanvraag na met een checklist en vraagt ontbrekende gegevens direct op.
    budget: 1000
    team_hours: {intake: 10}
    decay_days: 30
    multipliers: {full: 0.8, reduced: 0.45, minimal: 0.2}
    effects: []
  - id: readiness_check
    name: Gereedheidscheck 48 uur vooraf
    tier: 1
    category: standard_work
    description: Planning belt of mailt de klant twee dagen voor de uitvoering met een korte checklist. Is de meterkast niet klaar, dan wordt de klus verplaatst voordat de monteur rijdt.
    budget: 2000
    team_hours: {planners: 20}
    decay_days: 45
    multipliers: {full: 0.9, reduced: 0.5, minimal: 0.25}
    effects: []
  - id: installer_photo_upload
    name: Foto-upload door de installateur
    tier: 2
    category: quality
    description: De installateur meldt de meterkast gereed met een foto in het portaal; pas dan kan de klus worden ingepland.
    budget: 9000
    team_hours: {planners: 30, intake: 20}
    decay_days: null
    multipliers: {full: 0.9, reduced: 0.5, minimal: 0.25}
    effects:
      - {target: connections.execution, property: ftr, value: 0.03}
  - id: standard_designs
    name: Standaardontwerpen voor standaardwerk
    tier: 1
    category: standard_work
    description: Een vast ontwerp voor standaard woningaansluitingen (tot 3x25A, zonder netuitbreiding), zonder extra goedkeuringen.
    budget: 8000
    team_hours: {work_prep: 60}
    decay_days: 60
    multipliers: {full: 0.9, reduced: 0.5, minimal: 0.25}
    effects:
      - {target: connections.design, property: touch_time, value: 0.85}
  - id: delegated_approval
    name: Gedelegeerde goedkeuring
    tier: 1
    category: flow
    description: De werkvoorbereider keurt standaardontwerpen zelf goed; alleen afwijkingen gaan naar de teamleider.
    budget: 1500
    team_hours: {work_prep: 10}
    decay_days: 30
    multipliers: {full: 0.85, reduced: 0.45, minimal: 0.2}
    effects: []
  - id: request_permits_daily
    name: Vergunning direct aanvragen
    tier: 1
    category: flow
    description: Een vergunningsaanvraag gaat de deur uit zodra het dossier klaar is, niet meer verzameld op maandag.
    budget: 500
    team_hours: {work_prep: 5}
    decay_days: 30
    multipliers: {full: 0.9, reduced: 0.5, minimal: 0.25}
    effects: []
  - id: parallel_permits
    name: Vergunning parallel aan het ontwerp
    tier: 3
    category: flow
    description: Zodra het tracé bekend is, gaat de vergunningsaanvraag eruit; het ontwerp wordt intussen afgemaakt. Wachten en werken lopen naast elkaar.
    budget: 12000
    team_hours: {work_prep: 40}
    decay_days: null
    multipliers: {full: 0.9, reduced: 0.5, minimal: 0.25}
    effects:
      - {target: connections.permit, property: starts_with, value: design}

  # ── Storingen ─────────────────────────────────────────────────────────────
  - id: standard_van_stock
    name: Standaard busvoorraad
    tier: 1
    category: workplace_organization
    description: Elke storingsbus heeft dezelfde vaste lijst materialen, op een vaste plek. Wat eruit gaat, wordt aan het eind van de dienst aangevuld.
    budget: 4000
    team_hours: {monteurs: 40}
    decay_days: 45
    multipliers: {full: 0.9, reduced: 0.5, minimal: 0.25}
    effects:
      - {target: outages.repair, property: touch_time, value: 0.95}
  - id: two_bin_van_kanban
    name: Two-bin kanban in de bus
    tier: 3
    category: flow
    description: Twee bakken per artikel; een lege bak is het bestelsignaal voor het magazijn. Aanvullen hangt niet meer van het geheugen af.
    budget: 10000
    team_hours: {monteurs: 30}
    decay_days: null
    multipliers: {full: 0.9, reduced: 0.5, minimal: 0.25}
    effects:
      - {target: outages.repair, property: touch_time, value: 0.9}

  # ── Veldservice & slimme meters ───────────────────────────────────────────
  - id: appointment_reminder
    name: Bevestiging en herinnering van de afspraak
    tier: 1
    category: quality
    description: De klant krijgt een bevestiging bij het plannen en de dag ervoor een herinnering, met een knop om te verzetten.
    budget: 3000
    team_hours: {planners: 15}
    decay_days: null
    multipliers: {full: 0.9, reduced: 0.5, minimal: 0.25}
    effects: []
  - id: two_hour_window
    name: Tijdvak van twee uur en een onderweg-bericht
    tier: 2
    category: flow
    description: Een afspraak in een tijdvak van twee uur, en een bericht als de monteur onderweg is.
    budget: 8000
    team_hours: {planners: 30}
    decay_days: null
    multipliers: {full: 0.9, reduced: 0.5, minimal: 0.25}
    effects:
      - {target: meters.visit, property: ftr, value: 0.05}

  # ── Revisie & GIS, graafschade ────────────────────────────────────────────
  - id: revision_at_source
    name: Revisie aan de bron
    tier: 3
    category: flow
    description: De monteur legt het as-built direct bij oplevering vast op een tablet; geen papieren schets die weken later wordt overgetekend.
    budget: 18000
    team_hours: {gis: 40, monteurs: 30}
    decay_days: null
    multipliers: {full: 0.9, reduced: 0.5, minimal: 0.25}
    effects:
      - {target: connections.revision, property: touch_time, value: 0.8}
  - id: daily_revision_template
    name: Standaard revisieschets en dagelijks verwerken
    tier: 1
    category: standard_work
    description: Eén vaste schets per standaardaansluiting, elke dag verwerkt in plaats van per maand opgespaard.
    budget: 2500
    team_hours: {gis: 15, monteurs: 10}
    decay_days: 45
    multipliers: {full: 0.9, reduced: 0.5, minimal: 0.25}
    effects: []
  - id: standard_test_trenches
    name: Proefsleuven als standaard
    tier: 1
    category: safety
    description: Bij graven in de buurt van kabels altijd eerst een proefsleuf; de opdrachtgever plant er tijd voor in.
    budget: 3000
    team_hours: {key_accounts: 10}
    decay_days: 60
    multipliers: {full: 0.9, reduced: 0.5, minimal: 0.25}
    effects: []
  - id: contractor_briefing
    name: Briefing van graafaannemers
    tier: 1
    category: people
    description: Aannemers krijgen voor de start een briefing met actuele kaarten en de afspraak over proefsleuven.
    budget: 1500
    team_hours: {key_accounts: 8}
    decay_days: 30
    multipliers: {full: 0.8, reduced: 0.4, minimal: 0.2}
    effects: []

  # ── Kennis en vakmanschap ─────────────────────────────────────────────────
  - id: work_instruction_videos
    name: Werkinstructies met video
    tier: 1
    category: standard_work
    description: De ervaren monteurs leggen het lokaliseren in oude kabelnetten vast in korte video's en werkinstructies.
    budget: 5000
    team_hours: {monteurs: 40}
    decay_days: null
    multipliers: {full: 0.9, reduced: 0.5, minimal: 0.25}
    effects: []
  - id: skills_matrix_buddy
    name: Skills-matrix en buddysysteem
    tier: 2
    category: people
    description: Zichtbaar wie wat kan; elke jonge monteur draait mee met een ervaren buddy op storingen in oude netten.
    budget: 7000
    team_hours: {monteurs: 80}
    decay_days: null
    multipliers: {full: 0.9, reduced: 0.5, minimal: 0.25}
    effects:
      - {target: outages.locate, property: ftr, value: 0.03}

  # ── Klantcontact ─────────────────────────────────────────────────────────
  - id: realistic_promise
    name: Realistische toezegging en statuspagina
    tier: 1
    category: visual_management
    description: De klant krijgt bij de aanvraag een realistische datum en kan de stand van zijn aanvraag online volgen.
    budget: 6000
    team_hours: {contact_centre: 20, intake: 10}
    decay_days: 60
    multipliers: {full: 0.9, reduced: 0.5, minimal: 0.25}
    effects: []
  - id: proactive_status_updates
    name: Proactieve statusberichten
    tier: 2
    category: flow
    description: Bij elke stap in het proces krijgt de klant uit zichzelf een bericht, ook als het langer duurt. Faalvraag meten naast waardevraag.
    budget: 12000
    team_hours: {contact_centre: 30, planners: 20}
    decay_days: null
    multipliers: {full: 0.9, reduced: 0.5, minimal: 0.25}
    effects:
      - {target: connections, property: call_rate, value: 0.5}

  # ── Administratie ────────────────────────────────────────────────────────
  - id: close_out_at_completion
    name: Afhandelen bij oplevering
    tier: 1
    category: flow
    description: Elk dossier wordt afgehandeld op de dag dat het klaar is, met een korte checklist; geen maandelijkse batch meer (one-piece flow).
    budget: 1500
    team_hours: {meter_office: 10}
    decay_days: 45
    multipliers: {full: 0.9, reduced: 0.5, minimal: 0.25}
    effects: []
  - id: automatic_ean_registration
    name: Automatische EAN-aanmelding
    tier: 3
    category: flow
    description: Bij gereedmelding wordt de EAN automatisch aangemeld in het centraal aansluitregister; handwerk alleen bij afwijkingen.
    budget: 25000
    team_hours: {meter_office: 30}
    decay_days: null
    multipliers: {full: 0.9, reduced: 0.5, minimal: 0.25}
    effects:
      - {target: connections.close_out, property: touch_time, value: 0.4}

  - id: triage_fast_lane
    name: Triage met snelle baan
    tier: 1
    category: flow
    description: Bij de intake bepaalt een korte checklist of een aanvraag ruim binnen de vrije capaciteit van het station valt. Alleen twijfelgevallen krijgen een volledige netstudie.
    budget: 3000
    team_hours: {grid_analysts: 20, intake: 10}
    decay_days: 45
    multipliers: {full: 0.9, reduced: 0.5, minimal: 0.25}
    effects: []

  - id: calculation_templates
    name: Standaard rekentemplates
    tier: 2
    category: standard_work
    description: Vaste rekentemplates per type aansluiting en station. Een studie is invullen en controleren in plaats van opnieuw modelleren, ook voor congestieonderzoek.
    budget: 9000
    team_hours: {grid_analysts: 40}
    decay_days: null
    multipliers: {full: 0.9, reduced: 0.5, minimal: 0.25}
    effects:
      - {target: connections.grid_study, property: touch_time, value: 0.8}
      - {target: congestion.congestion_study, property: touch_time, value: 0.85}

  - id: on_site_comm_test
    name: Communicatietest voor vertrek
    tier: 1
    category: quality
    description: De monteur vertrekt pas als de meter zijn eerste stand heeft verstuurd. Werkt de verbinding niet, dan wisselt hij de module ter plekke (jidoka).
    budget: 2500
    team_hours: {monteurs: 20}
    decay_days: 45
    multipliers: {full: 0.9, reduced: 0.5, minimal: 0.25}
    effects:
      - {target: meters.visit, property: touch_time, value: 1.05}   # ten minutes for the test
      - {target: meters.registration, property: ftr, value: 0.05}   # also catches the base's silent meters

  - id: coverage_check_in_planning
    name: Dekkingscheck bij het plannen
    tier: 2
    category: standard_work
    description: Planning kiest de communicatiemodule op basis van de dekkingskaart van het adres, zodat de juiste module meegaat.
    budget: 6000
    team_hours: {planners: 20}
    decay_days: null
    multipliers: {full: 0.9, reduced: 0.5, minimal: 0.25}
    effects: []
