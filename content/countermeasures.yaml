    category: quality
    description: In de afspraakbrief komt te staan dat de klant moet bellen als de meterkast oud is. Het kost bijna niets, maar een klant weet zelden of zijn kast geschikt is.
    budget: 300
    team_hours: {planners: 2}
    decay_days: 30
    multipliers: {full: 0.9, reduced: 0.5, minimal: 0.25}
    effects: []
  - id: route_by_area
    name: Plannen per wijk
    tier: 1
    category: flow
    description: Planning bundelt de meterwissels per wijk. Een monteur werkt op een dag in één of twee wijken, en de klant kiest uit de dagen waarop de monteur toch in de buurt is.
    # ESTIMATE: the planning rules and the letter changed, two weeks of a planner.
    budget: 3000
    team_hours: {planners: 20}
    decay_days: 60
    multipliers: {full: 0.9, reduced: 0.5, minimal: 0.25}
    effects: []
  - id: area_teams
    name: Vaste wijkploegen
    tier: 1
    category: flow
    description: Elke meterwisselaar krijgt een vaste wijk. Hij kent de straten, de parkeerplekken en de oude kasten, en de planning volgt de wijken vanzelf.
    budget: 2000
    team_hours: {planners: 10, monteurs: 10}
    decay_days: null
    multipliers: {full: 0.9, reduced: 0.5, minimal: 0.25}
    effects: []
  - id: overtime_cap
    name: Een plafond op het overwerk
    shortcut: true   # the hours drop at once, the kilometres stay and the work waits: a poor fix with an aftermath
    tier: 1
    category: flow
    description: Vanaf nu hooguit twee uur overwerk per monteur per week. Wat niet past, schuift door naar een andere dag. De overuren dalen meteen; de kilometers blijven, en het werk wacht langer.
    budget: 0
    team_hours: {}
    decay_days: 30
    multipliers: {full: 0.9, reduced: 0.5, minimal: 0.25}
    effects: []
    # The later cost (ESTIMATE): two weeks after the Act the pushed work shows, and for
    # six weeks a customer waits about a third longer for the meter appointment.
