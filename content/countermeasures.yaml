# Countermeasures: what a player can try in the A3, in a grid-operator setting.
# Game text is Dutch; ids and keys are English. Built by tools/build_content.py.
#
# tier         1 Stabiel · 2 Zichtbaar · 3 Flow · 4 Systeem (GDD, Countermeasures).
#              Above the region's maturity a countermeasure only partly works.
# budget       improvement budget in euros
# team_hours   hours the team spends on the improvement: taken from daily
#              work while the experiment runs
# decay_days   days an improvement lasts with no sustaining habit (null: built
#              into a system or contract; it still erodes, over about a year).
#              Habits slow the wear: standard work at the Act, a board on the
#              stream (sustains), KPIs the team steers by (game/src/rules/sustain.gd)
# sustains     true: a board the teams look at daily; while it holds, it helps
#              sustain the other fixes in its value stream
# multipliers  effectiveness at a maturity gap of 0, 1 and 2
# effects      what it changes in the simulation once it works (on top of
#              removing the problem): its own shape of a healthier process

countermeasures:
  # ── Inwerkweek: the practice problem (training_tray) ──────────────────────
  # Invented for the training week (no source): small, cheap, and with a short
  # decay so the Friday time-lapse shows a fix fading when it is not standardised.
  - id: one_tray_fifo
    name: Eén bak, op volgorde van binnenkomst
    tier: 1
    category: flow
    description: Alle dossiers voor Werkvoorbereiding gaan in één bak; wie een dossier pakt, neemt het oudste. Niemand hoeft meer te zoeken of om te sorteren.
    budget: 200
    team_hours: {work_prep: 2}
    decay_days: 10
    multipliers: {full: 0.9, reduced: 0.5, minimal: 0.25}
    effects: []
  - id: tray_labels
    name: Vaste plek en labels voor de bakken
    tier: 1
    category: visual_management
    description: Elke bak krijgt een vaste plek en een duidelijk label (5S), zodat iedereen ziet waar welk dossier ligt.
    budget: 100
    team_hours: {work_prep: 1}
    decay_days: 7
    multipliers: {full: 0.9, reduced: 0.5, minimal: 0.25}
    effects: []

