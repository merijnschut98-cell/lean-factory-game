# "Hoe werkt het?" explainers (PLAN 2.7c). Game text is Dutch; keys and ids are English.
# Built into game/data/explainers.json by tools/build_content.py.
#
# The first one is designed in docs/superpowers/specs/2026-10-16-explainer-spanning-stroom-weerstand.md
# (the teaching layer §1, the script §4, "the how, never the answer" §5). The figure is drawn with the
# anatomy skill in tools/explainers/spanning/ and exported as SVG layers to game/assets/<assets>/.
#
# Rules the build checks:
#   - beats, hint, caption, analogy and labels hold no digit and no formula (numbers are readouts,
#     formulas only under `reveal`): spec §1.5, test T9;
#   - no explainer string names the answer to a mission (spec §5, test T7);
#   - every beat id the beat machine knows is here, every `wait_for`, `when` and `then` is known;
#   - every mapping pair names a tuin layer and a meterkast layer of the manifest;
#   - every model parameter has a source or an estimate.
#
# Beats: `main` beats play in list order. A beat with `alt_of` replaces that main beat when its
# `when` holds as the beat starts; when it ends it goes to `then` (the main beat, played as is) or
# else past the main beat. `skip_when` drops a main beat. `wait_for` names what ends a beat
# early-or-late: the beat waits for it, and moves on by itself after `timeout_s` (always skippable
# with Spatie). `silence_after` lists the lines after which Ruud is quiet for two seconds.

explainers:
  - id: spanning_stroom_weerstand
    name: Spanning, stroom, weerstand
    number: 1
    place: ruud.office.whiteboard
    assets: explainers/spanning
    model: ohm_cable
    speaker: Ruud
    one_idea: Hoe meer stroom er door dezelfde kabel moet, hoe warmer die kabel wordt.
    skins:
      analogy: tuin
      real: meterkast
      tabs: {tuin: De tuin, meterkast: De meterkast}
    # The cross-fade turns these pair groups one after another (spec §6.3).
    groups: [source, cable, switches, meter_flow, meter_end, loads, reels]
    # Explainer #1 never names the transformer: its wait is a mission's (transformer_wait).
    never: [trafo, transformator]

    analogy:
      skin: tuin
      mapping:
        - {analogy: de buitenkraan aan de muur, real: de groep in de meterkast, pair: [wall_tap, panel]}
        - {analogy: de drukmeter bij de kraan, real: de kWh-meter, pair: [tap_gauge, kwh_meter]}
        - {analogy: de tuinslang op de haspel, real: de kabel op de haspel, pair: [hose_thin, cable_thin]}
        - {analogy: een dikke slang, real: een dikke kabel, pair: [hose_thick, cable_thick]}
        - {analogy: de drie kraantjes op het verdeelstuk, real: de drie knoppen op de stekkerdoos, pair: [verdeelstuk, stekkerdoos]}
        - {analogy: "de druppelaar, de grote sproeier en de tuinsproeier", real: "de lamp, de waterkoker en de kachel", pair: [outlets, appliances]}
        - {analogy: de doorstroommeter, real: de stroomtang, pair: [flowmeter, stroomtang]}
        - {analogy: de drukmeter aan het eind, real: de multimeter, pair: [end_gauge, multimeter]}
        - {analogy: de slang wordt warm, real: de kabel wordt warm, pair: [heat_tint_hose_thin, heat_tint_cable_thin]}
      limit_line: "Eén verschil met de tuin: water loopt de slang uit. Stroom niet. Die loopt rond: heen door de ene draad, terug door de andere."

    controls:
      - {id: lamp, tuin: tap_dripper, meterkast: switch_lamp, key: "1"}
      - {id: kettle, tuin: tap_big, meterkast: switch_kettle, key: "2"}
      - {id: heater, tuin: tap_small, meterkast: switch_heater, key: "3"}
      - {id: haspel, key: H}

    hint:
      tuin: Draai een kraantje open.
      meterkast: Zet een apparaat aan.
      haspel: Zet een apparaat aan. Pak de andere haspel.

    labels:
      current: Stroom
      u_end: Spanning aan het eind
      t_cable: Kabel

    # Ruud's marker tags during the cross-fade (spec §4, X).
    tags: [druk, stroom, tegenhouden]

    caption:
      - Spanning is de druk. Stroom is wat er echt loopt. Weerstand houdt het tegen.
      - Een kabel houdt ook een beetje tegen. Gaat er veel stroom door, dan wordt hij warm, en veel sneller dan je denkt.
      - Hoe langer of dunner de kabel, hoe minder spanning er aan het eind overblijft.
      - "De tuinslang is een vergelijking. Water loopt eruit; stroom gaat heen en weer terug. En een echte tuinslang merk je nauwelijks warm worden; een kabel wel. In het echt duurt opwarmen minuten; hier gaat het sneller."

    # The only field that may hold a formula (spec §1.6). `live` is filled from the model:
    # {u_n} {r_total} {current} {r_cable} {p_cable} {du} {u_end} {p_app}.
    reveal:
      label: Laat de rekensom zien
      lines:
        - {words: "Stroom = spanning ÷ weerstand.", formula: "I = U / R", live: "{u_n} V ÷ {r_total} Ω = {current} A"}
        - {words: "Warmte in de kabel = stroom × stroom × weerstand van de kabel.", formula: "P = I² · R", live: "{current} × {current} × {r_cable} Ω = {p_cable} W"}
        - {words: Twee keer zoveel stroom geeft vier keer zoveel warmte.}
        - {words: "Spanning die de kabel kost = stroom × weerstand van de kabel.", formula: "ΔU = I · R", live: "{current} A × {r_cable} Ω = {du} V"}
        - {words: "Wat de apparaten krijgen (vermogen, in watt) = spanning × stroom.", formula: "P = U · I", live: "{u_end} V × {current} A = {p_app} W"}
        - {words: "De slang was een vergelijking: in een kabel zakt de spanning door de weerstand van de kabel, niet doordat er iets schuurt."}

    beats:
      - id: a1
        phase: tuin
        idea: druk
        lines:
          - Stroom kun je niet zien. Daarom begin ik altijd met een tuinslang.
          - De kraan duwt het water de slang in. Dat duwen noemen we druk.
          - Draai eens een kraantje open. Wat denk je dat er gebeurt?
        wait_for: any_on
        timeout_s: 10
        pulse: kettle
      - id: a2
        phase: tuin
        idea: stroom
        lines:
          - Nu loopt er water. Hoeveel water er per seconde doorheen gaat, dat is de stroom.
          - Zie je dat wieltje op de slang draaien? Draai er nog maar een open.
        wait_for: two_on
        timeout_s: 10
      - id: a2_dripper
        alt_of: a2
        when: only_lamp
        phase: tuin
        idea: stroom
        lines:
          - Nu loopt er water. Hoeveel water er per seconde doorheen gaat, dat is de stroom.
          - "Dat is maar een druppelaar. Kijk naar het wieltje: dat draait amper. Probeer de grote sproeier eens."
        wait_for: kettle_on
        timeout_s: 10
      - id: a3
        phase: tuin
        idea: weerstand
        lines:
          - Meer kraantjes open, dus meer water door dezelfde slang.
          - Kijk eens naar de drukmeter aan het eind. Waarom zakt die, denk je?
          - De slang houdt het water een beetje tegen. Dat noemen we weerstand.
        silence_after: [1]
      - id: a4
        phase: tuin
        idea: warm
        lines:
          - En als je heel veel water door een dunne slang perst?
          - Dan wordt hij warm. Voel maar eens.
        silence_after: [0]
      - id: x
        phase: cross
        idea: ""
        lines:
          - Goed. Nu hetzelfde, maar dan in de meterkast.
      - id: r1
        phase: meterkast
        idea: hetzelfde
        lines:
          - De kraan is nu de meterkast, de slang is de kabel en de kraantjes zijn de knoppen.
      - id: r2
        phase: meterkast
        idea: namen
        lines:
          - Die druk heet hier spanning. Die meten we in volt.
          - Stroom meten we in ampère. Dat zie je op de stroomtang.
        shows: [readout, reveal]
      - id: r3
        phase: meterkast
        idea: grens
        lines:
          - "Eén verschil met de tuin: water loopt de slang uit."
          - "Stroom niet. Die loopt rond: heen door de ene draad, terug door de andere."
      - id: r4
        phase: meterkast
        idea: aan
        lines:
          - Zet de waterkoker eens aan. Wat doet de stroomtang?
        wait_for: kettle_on
        timeout_s: 10
        pulse: kettle
      - id: r4_already_on
        alt_of: r4
        when: kettle_on
        phase: meterkast
        idea: aan
        lines:
          - De waterkoker staat al aan. Kijk eens naar de stroomtang.
      - id: r5
        phase: meterkast
        idea: kabel_warm
        lines:
          - Dat getal op de tang, dat is de stroom.
          - Kijk nu naar de meter aan het eind. Daar komt wat minder spanning aan. Waar is die gebleven?
          - In de kabel. Die wordt er warm van, net als de slang.
        silence_after: [1]
      - id: r5_lamp
        alt_of: r5
        when: only_lamp
        then: r5
        phase: meterkast
        idea: kabel_warm
        lines:
          - Een lampje vraagt bijna niks. Probeer de waterkoker eens.
        wait_for: kettle_on
        timeout_s: 10
      - id: r6
        phase: meterkast
        idea: ""
        lines:
          - Zet de kachel er eens bij. Hoe warm wordt de kabel nu, denk je?
        wait_for: heater_on
        timeout_s: 10
        skip_when: heater_on
        pulse: heater
      - id: r7
        phase: meterkast
        idea: veel_warmer
        lines:
          - Meer stroom, en de kabel wordt meteen veel warmer dan je zou verwachten.
          - Dat heb ik op de MTS geleerd. Toen had ik nog haar.
      - id: r7_never_alone
        alt_of: r7
        when: never_kettle_alone
        then: r7
        phase: meterkast
        idea: veel_warmer
        lines:
          - Zet de kachel eens uit en weer aan. Let op de kabel.
        wait_for: heater_again
        timeout_s: 10
      - id: r8a
        phase: meterkast
        idea: dik
        lines:
          - Pak de haspel met de dikke kabel eens. Wat zie je nu?
        wait_for: haspel
        timeout_s: 10
        unlocks: [haspel]
      - id: r8b
        phase: meterkast
        idea: lang
        lines:
          - "Een dikke kabel werkt net als een dikke slang: er kan meer doorheen."
          - Met de kabels onder de straat is het precies zo. Alleen zijn die soms heel lang. Hoeveel spanning is er dan nog over aan het eind?

    # The model's parameters (game/src/rules/explainers/ohm_cable.gd) with their evidence (spec §3.5).
    parameters:
      - {name: u_nominal, value: 230, unit: V, source: netbeheer_spanningskwaliteit}
      - {name: band, value: "±10 %", unit: "", source: netbeheer_achtergrond_2024}
      - {name: rho, value: 0.0175, unit: "Ω·mm²/m", estimate: "The installers' rounded value for copper at 20 °C; annealed copper is 1/58 ≈ 0,0172. The ~1,5 % difference moves no rounded readout by more than 0,1 V."}
      - {name: length, value: 25, unit: m, estimate: "A common verlengkabel length in Dutch DIY stores; long enough to show the effect, still realistic."}
      - {name: cross_sections, value: "1,5 / 2,5", unit: "mm²", estimate: "The two usual cross-sections of household extension cables; to verify against NEN 1010 (paywalled)."}
      - {name: group, value: 16, unit: A, estimate: "The usual rating of a Dutch household group (B16); to verify against NEN 1010."}
      - {name: rating, value: "16 / 25", unit: A, estimate: "Current rating I_z of an H05VV-F cord in free air from common manufacturer tables; to verify against NEN 1010 / IEC 60364-5-52."}
      - {name: rise_max, value: 40, unit: K, estimate: "PVC's 70 °C conductor limit at a 30 °C reference ambient (IEC 60364-5-52, recalled); applied from a 20 °C room, so the hot case reads slightly cool, the safe side."}
      - {name: heat_square, value: "∝ I²", unit: "", estimate: "Steady state from P = I²R with constant cooling; ignores copper's +0,4 %/K, so the hot case is about 13 % understated."}
      - {name: kettle, value: 2000, unit: W, estimate: "A common kettle rating; resistive, so R = U²/P holds."}
      - {name: heater, value: 1500, unit: W, estimate: "A common small heater rating; resistive."}
      - {name: lamp, value: 8, unit: W, estimate: "A typical LED bulb; not resistive, but at 0,03 A the error is invisible."}
      - {name: source_impedance, value: 0, unit: "Ω", estimate: "Ignored: an ideal socket. The real socket voltage moves within the Netcode band during the day."}
      - {name: tau, value: 4, unit: s, estimate: "A design choice so the player sees the cable warm after the switch; a real cord takes minutes, and the codex caption says so."}
      - {name: end_gauge_band, value: "210–230", unit: V, estimate: "The end gauge's needle spans 210–230 V so a 2–4 % drop is visible on a dial without units."}

    sources:
      - {id: netbeheer_spanningskwaliteit, fact: "230 V, 50 Hz in het laagspanningsnet", title: "Netbeheer Nederland, Spanningskwaliteit", url: "https://www.netbeheernederland.nl/veiligheid-en-infrastructuur/spanningskwaliteit"}
      - {id: netbeheer_achtergrond_2024, fact: "Un ± 10 % voor 95 % van de 10-minutengemiddelden (Netcode)", title: "Netbeheer Nederland, Achtergronddocument Spanningskwaliteit in Nederland, resultaten 2024", url: "https://www.netbeheernederland.nl/sites/default/files/2025-04/04.03._achtergronddocument_spanningskwaliteit_2024_0.pdf"}
