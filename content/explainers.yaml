# "Hoe werkt het?" explainers (PLAN 2.7c). Game text is Dutch; keys and ids are English.
# Built into game/data/explainers.json by tools/build_content.py.
#
# The first one is designed in docs/superpowers/specs/2026-10-16-explainer-spanning-stroom-weerstand.md
# (the teaching layer §1, the script §4, "the how, never the answer" §5). The figure is drawn with the
# anatomy skill in tools/explainers/spanning/ and exported as SVG layers to game/assets/<assets>/.
#
# Rules the build checks:
#   - beats, hint, caption, analogy and labels hold no digit and no formula (numbers are readouts,
#     formulas only under `reveal`): spec §1.5, test T9;
#   - no explainer string names the answer to a mission (spec §5, test T7);
#   - every beat id the beat machine knows is here, every `wait_for`, `when` and `then` is known;
#   - every mapping pair names a tuin layer and a meterkast layer of the manifest;
#   - every model parameter has a source or an estimate.
#
# Beats: `main` beats play in list order. A beat with `alt_of` replaces that main beat when its
# `when` holds as the beat starts; when it ends it goes to `then` (the main beat, played as is) or
# else past the main beat. `skip_when` drops a main beat. `wait_for` names what ends a beat
# early-or-late: the beat waits for it, and moves on by itself after `timeout_s` (always skippable
# with Spatie). `silence_after` lists the lines after which Ruud is quiet for two seconds.

explainers:
  - id: spanning_stroom_weerstand
    name: Spanning, stroom, weerstand
    number: 1
    place: ruud.office.whiteboard
    assets: explainers/spanning
    model: ohm_cable
    speaker: Ruud
    one_idea: Hoe meer stroom er door dezelfde kabel moet, hoe warmer die kabel wordt.
    skins:
      analogy: tuin
      real: meterkast
      tabs: {tuin: De tuin, meterkast: De meterkast}
    # The cross-fade turns these pair groups one after another (spec §6.3).
    groups: [source, cable, switches, meter_flow, meter_end, loads, reels]
    # Explainer #1 never names the transformer: its wait is a mission's (transformer_wait).
    never: [trafo, transformator]

    analogy:
      skin: tuin
      mapping:
        - {analogy: de buitenkraan aan de muur, real: de groep in de meterkast, pair: [wall_tap, panel]}
        - {analogy: de drukmeter bij de kraan, real: de kWh-meter, pair: [tap_gauge, kwh_meter]}
        - {analogy: de tuinslang op de haspel, real: de kabel op de haspel, pair: [hose_thin, cable_thin]}
        - {analogy: een dikke slang, real: een dikke kabel, pair: [hose_thick, cable_thick]}
        - {analogy: de drie kraantjes op het verdeelstuk, real: de drie knoppen op de stekkerdoos, pair: [verdeelstuk, stekkerdoos]}
        - {analogy: "de druppelaar, de grote sproeier en de tuinsproeier", real: "de lamp, de waterkoker en de kachel", pair: [outlets, appliances]}
        - {analogy: de doorstroommeter, real: de stroomtang, pair: [flowmeter, stroomtang]}
        - {analogy: de drukmeter aan het eind, real: de multimeter, pair: [end_gauge, multimeter]}
        - {analogy: de slang wordt warm, real: de kabel wordt warm, pair: [heat_tint_hose_thin, heat_tint_cable_thin]}
      limit_line: "Eén verschil met de tuin: water loopt de slang uit. Stroom niet. Die loopt rond: heen door de ene draad, terug door de andere."

    controls:
      - {id: lamp, tuin: tap_dripper, meterkast: switch_lamp, key: "1"}
      - {id: kettle, tuin: tap_big, meterkast: switch_kettle, key: "2"}
      - {id: heater, tuin: tap_small, meterkast: switch_heater, key: "3"}
      - {id: haspel, key: H}

    hint:
      tuin: Draai een kraantje open.
      meterkast: Zet een apparaat aan.
      haspel: Zet een apparaat aan. Pak de andere haspel.

    labels:
      current: Stroom
      u_end: Spanning aan het eind
      t_cable: Kabel

    # Ruud's marker tags during the cross-fade (spec §4, X).
    tags: [druk, stroom, tegenhouden]

    caption:
      - Spanning is de druk. Stroom is wat er echt loopt. Weerstand houdt het tegen.
      - Een kabel houdt ook een beetje tegen. Gaat er veel stroom door, dan wordt hij warm, en veel sneller dan je denkt.
      - Hoe langer of dunner de kabel, hoe minder spanning er aan het eind overblijft.
      - "De tuinslang is een vergelijking. Water loopt eruit; stroom gaat heen en weer terug. En een echte tuinslang merk je nauwelijks warm worden; een kabel wel. In het echt duurt opwarmen minuten; hier gaat het sneller."

    # The only field that may hold a formula (spec §1.6). `live` is filled from the model:
    # {u_n} {r_total} {current} {r_cable} {p_cable} {du} {u_end} {p_app}.
    reveal:
      label: Laat de rekensom zien
      lines:
        - {words: "Stroom = spanning ÷ weerstand.", formula: "I = U / R", live: "{u_n} V ÷ {r_total} Ω = {current} A"}
        - {words: "Warmte in de kabel = stroom × stroom × weerstand van de kabel.", formula: "P = I² · R", live: "{current} × {current} × {r_cable} Ω = {p_cable} W"}
        - {words: Twee keer zoveel stroom geeft vier keer zoveel warmte.}
        - {words: "Spanning die de kabel kost = stroom × weerstand van de kabel.", formula: "ΔU = I · R", live: "{current} A × {r_cable} Ω = {du} V"}
        - {words: "Wat de apparaten krijgen (vermogen, in watt) = spanning × stroom.", formula: "P = U · I", live: "{u_end} V × {current} A = {p_app} W"}
        - {words: "De slang was een vergelijking: in een kabel zakt de spanning door de weerstand van de kabel, niet doordat er iets schuurt."}

    beats:
      - id: a1
        phase: tuin
        idea: druk
        lines:
          - Stroom kun je niet zien. Daarom begin ik altijd met een tuinslang.
          - De kraan duwt het water de slang in. Dat duwen noemen we druk.
          - Draai eens een kraantje open. Wat denk je dat er gebeurt?
        wait_for: any_on
        timeout_s: 10
        pulse: kettle
      - id: a2
        phase: tuin
        idea: stroom
        lines:
          - Nu loopt er water. Hoeveel water er per seconde doorheen gaat, dat is de stroom.
          - Zie je dat wieltje op de slang draaien? Draai er nog maar een open.
        wait_for: two_on
        timeout_s: 10
      - id: a2_dripper
        alt_of: a2
        when: only_lamp
        phase: tuin
        idea: stroom
        lines:
          - Nu loopt er water. Hoeveel water er per seconde doorheen gaat, dat is de stroom.
          - "Dat is maar een druppelaar. Kijk naar het wieltje: dat draait amper. Probeer de grote sproeier eens."
        wait_for: kettle_on
        timeout_s: 10
      - id: a3
        phase: tuin
        idea: weerstand
        lines:
          - Meer kraantjes open, dus meer water door dezelfde slang.
          - Kijk eens naar de drukmeter aan het eind. Waarom zakt die, denk je?
          - De slang houdt het water een beetje tegen. Dat noemen we weerstand.
        silence_after: [1]
      - id: a4
        phase: tuin
        idea: warm
        lines:
          - En als je heel veel water door een dunne slang perst?
          - Dan wordt hij warm. Voel maar eens.
        silence_after: [0]
      - id: x
        phase: cross
        idea: ""
        lines:
          - Goed. Nu hetzelfde, maar dan in de meterkast.
      - id: r1
        phase: meterkast
        idea: hetzelfde
        lines:
          - De kraan is nu de meterkast, de slang is de kabel en de kraantjes zijn de knoppen.
      - id: r2
        phase: meterkast
        idea: namen
        lines:
          - Die druk heet hier spanning. Die meten we in volt.
          - Stroom meten we in ampère. Dat zie je op de stroomtang.
        shows: [readout, reveal]
      - id: r3
        phase: meterkast
        idea: grens
        lines:
          - "Eén verschil met de tuin: water loopt de slang uit."
          - "Stroom niet. Die loopt rond: heen door de ene draad, terug door de andere."
      - id: r4
        phase: meterkast
        idea: aan
        lines:
          - Zet de waterkoker eens aan. Wat doet de stroomtang?
        wait_for: kettle_on
        timeout_s: 10
        pulse: kettle
      - id: r4_already_on
        alt_of: r4
        when: kettle_on
        phase: meterkast
        idea: aan
        lines:
          - De waterkoker staat al aan. Kijk eens naar de stroomtang.
      - id: r5
        phase: meterkast
        idea: kabel_warm
        lines:
          - Dat getal op de tang, dat is de stroom.
          - Kijk nu naar de meter aan het eind. Daar komt wat minder spanning aan. Waar is die gebleven?
          - In de kabel. Die wordt er warm van, net als de slang.
        silence_after: [1]
      - id: r5_lamp
        alt_of: r5
        when: only_lamp
        then: r5
        phase: meterkast
        idea: kabel_warm
        lines:
          - Een lampje vraagt bijna niks. Probeer de waterkoker eens.
        wait_for: kettle_on
        timeout_s: 10
      - id: r6
        phase: meterkast
        idea: ""
        lines:
          - Zet de kachel er eens bij. Hoe warm wordt de kabel nu, denk je?
        wait_for: heater_on
        timeout_s: 10
        skip_when: heater_on
        pulse: heater
      - id: r7
        phase: meterkast
        idea: veel_warmer
        lines:
          - Meer stroom, en de kabel wordt meteen veel warmer dan je zou verwachten.
          - Dat heb ik op de MTS geleerd. Toen had ik nog haar.
      - id: r7_never_alone
        alt_of: r7
        when: never_kettle_alone
        then: r7
        phase: meterkast
        idea: veel_warmer
        lines:
          - Zet de kachel eens uit en weer aan. Let op de kabel.
        wait_for: heater_again
        timeout_s: 10
      - id: r8a
        phase: meterkast
        idea: dik
        lines:
          - Pak de haspel met de dikke kabel eens. Wat zie je nu?
        wait_for: haspel
        timeout_s: 10
        unlocks: [haspel]
      - id: r8b
        phase: meterkast
        idea: lang
        lines:
          - "Een dikke kabel werkt net als een dikke slang: er kan meer doorheen."
          - Met de kabels onder de straat is het precies zo. Alleen zijn die soms heel lang. Hoeveel spanning is er dan nog over aan het eind?

    # The model's parameters (game/src/rules/explainers/ohm_cable.gd) with their evidence (spec §3.5).
    parameters:
      - {name: u_nominal, value: 230, unit: V, source: netbeheer_spanningskwaliteit}
      - {name: band, value: "±10 %", unit: "", source: netbeheer_achtergrond_2024}
      - {name: rho, value: 0.0175, unit: "Ω·mm²/m", estimate: "The installers' rounded value for copper at 20 °C; annealed copper is 1/58 ≈ 0,0172. The ~1,5 % difference moves no rounded readout by more than 0,1 V."}
      - {name: length, value: 25, unit: m, estimate: "A common verlengkabel length in Dutch DIY stores; long enough to show the effect, still realistic."}
      - {name: cross_sections, value: "1,5 / 2,5", unit: "mm²", estimate: "The two usual cross-sections of household extension cables; to verify against NEN 1010 (paywalled)."}
      - {name: group, value: 16, unit: A, estimate: "The usual rating of a Dutch household group (B16); to verify against NEN 1010."}
      - {name: rating, value: "16 / 25", unit: A, estimate: "Current rating I_z of an H05VV-F cord in free air from common manufacturer tables; to verify against NEN 1010 / IEC 60364-5-52."}
      - {name: rise_max, value: 40, unit: K, estimate: "PVC's 70 °C conductor limit at a 30 °C reference ambient (IEC 60364-5-52, recalled); applied from a 20 °C room, so the hot case reads slightly cool, the safe side."}
      - {name: heat_square, value: "∝ I²", unit: "", estimate: "Steady state from P = I²R with constant cooling; ignores copper's +0,4 %/K, so the hot case is about 13 % understated."}
      - {name: kettle, value: 2000, unit: W, estimate: "A common kettle rating; resistive, so R = U²/P holds."}
      - {name: heater, value: 1500, unit: W, estimate: "A common small heater rating; resistive."}
      - {name: lamp, value: 8, unit: W, estimate: "A typical LED bulb; not resistive, but at 0,03 A the error is invisible."}
      - {name: source_impedance, value: 0, unit: "Ω", estimate: "Ignored: an ideal socket. The real socket voltage moves within the Netcode band during the day."}
      - {name: tau, value: 4, unit: s, estimate: "A design choice so the player sees the cable warm after the switch; a real cord takes minutes, and the codex caption says so."}
      - {name: end_gauge_band, value: "210–230", unit: V, estimate: "The end gauge's needle spans 210–230 V so a 2–4 % drop is visible on a dial without units."}

    sources:
      - {id: netbeheer_spanningskwaliteit, fact: "230 V, 50 Hz in het laagspanningsnet", title: "Netbeheer Nederland, Spanningskwaliteit", url: "https://www.netbeheernederland.nl/veiligheid-en-infrastructuur/spanningskwaliteit"}
      - {id: netbeheer_achtergrond_2024, fact: "Un ± 10 % voor 95 % van de 10-minutengemiddelden (Netcode)", title: "Netbeheer Nederland, Achtergronddocument Spanningskwaliteit in Nederland, resultaten 2024", url: "https://www.netbeheernederland.nl/sites/default/files/2025-04/04.03._achtergronddocument_spanningskwaliteit_2024_0.pdf"}

  # Hoe werkt het? 2 (spec docs/superpowers/specs/2026-10-24-explainer-transformator.md): the
  # bicycle's gears first, then a 10 kV → 400 V trafo with its tank cut open. Drawn in
  # tools/explainers/trafo/, model TrafoThermal (game/src/rules/explainers/trafo_thermal.gd).
  # Opened at the trafohuisje on the opleidingsterrein (OfficeTrafohuisje) and from Femke's
  # topic msr; needed in Act II.
  - id: transformator
    name: De transformator
    number: 2
    place: yard.opleidingsterrein.trafohuisje
    assets: explainers/trafo
    model: transformer
    speaker: Ruud
    one_idea: Een trafo ruilt spanning in voor stroom, en hoe meer stroom de straat vraagt, hoe warmer hij wordt.
    skins:
      analogy: fiets
      real: trafo
      tabs: {fiets: De fiets, trafo: De trafo}
    groups: [source, core, tank, out, street, meter_in, meter_out]
    # Spec §5: the answers of transformer_wait (ordering, lead times) and unused_capacity
    # (contracted against used capacity), and the places and people of those missions.
    never: [bestel, levertijd, fabrikant, voorraad, raamcontract, contract, reserver, ongebruikt, boomgaard,
            hermans, bakkerij, ilse, "net is vol", "net vol", zwaarder belasten, gotork]

    analogy:
      skin: fiets
      mapping:
        - {analogy: de trapper met het kleine voorblad, real: de middenspanningskabel en de hoge doorvoeren, pair: [crank, hv_side]}
        - {analogy: de ketting tussen de bladen, real: de ijzeren kern met de wikkelingen, pair: [chain, core_inside]}
        - {analogy: het grote achterblad en het wiel, real: de lage doorvoeren en het laagspanningsrek, pair: [wheel, lv_side]}
        - {analogy: de rol van de trainer met zijn rem, real: de straat, pair: [resistance, street]}
        - {analogy: de krachtmeter bij de trapper, real: de stroommeter aan de hoge kant, pair: [gauge_pedal, mv_meter]}
        - {analogy: de krachtmeter bij het wiel, real: de stroommeter aan de lage kant, pair: [gauge_wheel, lv_meter]}
        - {analogy: de ketting wordt warm, real: de wikkelingen worden warm, pair: [heat_chain, heat_coils]}
        - {analogy: de standaard van de trainer, real: de ketel met olie en koelribben, pair: [trainer_frame, tank_front]}
      limit_line: "Eén verschil: in een trafo beweegt niks. Het ijzer geeft het door, zonder dat de draden elkaar raken."

    controls:
      - {id: load, key: Up, down_key: Down, layer: control_box}
      - {id: ambient, key: T, layer: backboard}

    hint:
      fiets: Draai aan de knop.
      trafo: "Draai aan de knop: dat is de straat."
      ambient: Draai aan de knop. Tik op de thermometer.

    labels:
      current_in: Stroom erin
      current_out: Stroom eruit
      hotspot: Wikkeling
      outside: Buiten
      holds: Kan dit blijven dragen
      hours: "Houdt dit zo'n {hours} uur vol"
      under_an_hour: Houdt dit nog geen uur vol

    tags: [snel en licht, ketting, langzaam en sterk]

    caption:
      - Een trafo ruilt spanning in voor stroom. Erin gaat hoge spanning met weinig stroom, eruit komt lage spanning met veel stroom.
      - Hoe meer de straat vraagt, hoe warmer de wikkelingen. De olie brengt die warmte naar de koelribben.
      - Even meer dan het typeplaatje kan, na een gewone dag op half vermogen. Op een hete dag korter, en elk uur te heet slijt hij sneller.
      - "De fiets is een vergelijking. In een trafo draait niks, en hij ruilt veel sterker dan een fietsversnelling. Een echte ketting wordt nauwelijks warm; een trafo wel. Opwarmen duurt in het echt uren; hier gaat het sneller."

    # {rated} {load} {s} {i1} {i2} {oil} {hot} {ambient} {ageing}: TrafoRig.reveal_values.
    reveal:
      label: Laat de rekensom zien
      lines:
        - {words: "Wat erin gaat, komt er (bijna) helemaal weer uit: vermogen erin = vermogen eruit.", formula: "S = √3 · U · I", live: "{rated} kVA × {load} % = {s} kVA"}
        - {words: "Stroom erin = vermogen ÷ (√3 × hoge spanning).", formula: "I = S / (√3 · U)", live: "{s} kVA ÷ (1,73 × 10.000 V) = {i1} A"}
        - {words: "Stroom eruit = vermogen ÷ (√3 × lage spanning).", live: "{s} kVA ÷ (1,73 × 400 V) = {i2} A"}
        - {words: "10.000 V ÷ 400 V = 25: eruit komt vijfentwintig keer zoveel stroom als erin. Daarom heeft de hoge kant vijfentwintig keer zoveel windingen."}
        - {words: "De warmte groeit met de stroom in het kwadraat. De olie volgt in uren, de wikkeling in minuten.", formula: "Δθ = 55 K · ((1 + 5K²) / 6)^0,8 + 23 K · K^1,6", live: "{oil} °C olie, {hot} °C wikkeling, buiten {ambient} °C"}
        - {words: "Boven de 98 °C slijt het papier om de wikkeling sneller: elke 6 graden twee keer zo snel.", formula: "V = 2^((θ − 98) / 6)", live: "{ageing} × zo snel"}
        - {words: "De fiets was een vergelijking: in een trafo draait niks. Wisselstroom in de ene wikkeling maakt een wisselend veld in het ijzer, en dat drijft de stroom in de andere."}

    beats:
      - id: f1
        phase: fiets
        idea: snel_licht
        lines:
          - Een trafo leg ik altijd uit met een fiets.
          - In een lichte versnelling trap je snel, en je hoeft bijna geen kracht te zetten.
          - Het wiel draait langzamer, maar met veel meer kracht.
      - id: f2
        phase: fiets
        idea: zwaarder
        lines:
          - Draai de knop van de trainer eens verder open. Dan is het alsof je een berg op fietst.
          - Let op de twee meters.
        wait_for: load_up
        timeout_s: 10
        pulse: load
      - id: f2_already
        alt_of: f2
        when: load_half
        phase: fiets
        idea: zwaarder
        lines:
          - Je hebt hem al zwaarder gezet. Let dan eens op de twee meters.
      - id: f3
        phase: fiets
        idea: kracht
        lines:
          - Bij het wiel gaat de kracht flink omhoog, bij de trapper maar een klein beetje.
          - Het tempo blijft gewoon hetzelfde.
          - Zet hem nu eens helemaal zwaar. Wat doet de ketting?
        wait_for: load_full
        timeout_s: 10
        pulse: load
      - id: f3_full
        alt_of: f3
        when: load_full
        phase: fiets
        idea: kracht
        lines:
          - Bij het wiel gaat de kracht flink omhoog, bij de trapper maar een klein beetje.
          - Het tempo blijft gewoon hetzelfde.
      - id: f4
        phase: fiets
        idea: warm
        lines:
          - Kijk eens naar de ketting. Die wordt warm.
          - Hoe zwaarder je trapt, hoe warmer hij wordt.
      - id: x
        phase: cross
        idea: ""
        lines:
          - Goed. Nu hetzelfde, maar dan met een echte trafo.
      - id: t1
        phase: trafo
        idea: hetzelfde
        lines:
          - De trapper is nu de kabel met de hoge spanning. Het wiel is de kant van de straat, en de ketting is de ijzeren kern met de wikkelingen.
          - "Eén verschil: in een trafo beweegt niks. Het ijzer geeft het door, zonder dat de draden elkaar raken."
      - id: t2
        phase: trafo
        idea: namen
        lines:
          - Er gaat hoge spanning in, met weinig stroom. Er komt lage spanning uit, met heel veel stroom.
          - Kijk maar eens op de twee stroommeters.
        shows: [readout, reveal]
      - id: t3
        phase: trafo
        idea: vraag
        lines:
          - "Draai de knop eens verder open: dan vraagt de straat meer, alsof iedereen tegelijk gaat koken."
        wait_for: load_full
        timeout_s: 10
        pulse: load
      - id: t3_already
        alt_of: t3
        when: load_full
        phase: trafo
        idea: vraag
        lines:
          - De straat vraagt nu al veel. Kijk maar hoe de huizen aan staan.
      - id: t4
        phase: trafo
        idea: olie
        lines:
          - De wikkelingen worden warm. De olie neemt die warmte mee naar de koelribben.
          - Kijk eens naar de thermometer op de ketel. Dat gaat langzamer dan je denkt.
          - Draai nu eens verder, boven wat er op het typeplaatje staat.
        wait_for: over_rated
        timeout_s: 10
        pulse: load
      - id: t4_over
        alt_of: t4
        when: over_rated
        phase: trafo
        idea: olie
        lines:
          - De wikkelingen worden warm. De olie neemt die warmte mee naar de koelribben.
          - Hij staat nu al boven wat er op het typeplaatje staat. Kijk eens naar de thermometer op de ketel.
      - id: t5
        phase: trafo
        idea: poosje
        lines:
          - Dat houdt hij een poosje vol. Hoe lang, dat staat onderaan het blad.
          - Tik eens op de thermometer aan de muur. Wat doet een hete zomerdag daarmee?
        wait_for: ambient
        timeout_s: 10
        unlocks: [ambient]
        pulse: ambient
      - id: t6
        phase: trafo
        idea: slijten
        lines:
          - Op een warme dag houdt hij het korter vol. Net als ik op de fiets, tegenwoordig.
          - Met rust koelt hij weer af. Maar elke dag te zwaar, dan slijt hij hard.

    # The model's parameters (game/src/rules/explainers/trafo_thermal.gd) with their evidence (spec §3.5).
    parameters:
      - {name: u_primary, value: 10000, unit: V, source: netbeheer_betrouwbaarheid_2017}
      - {name: u_secondary, value: 400, unit: V, source: netbeheer_betrouwbaarheid_2017}
      - {name: loading_guide, value: "IEC 60076-7", unit: "", source: nen_iec_60076_7}
      - {name: rated, value: 630, unit: kVA, estimate: "A common size of a distribution transformer in a Dutch MSR (400 and 630 kVA are the usual steps); the ratio and the thermal shape do not depend on it."}
      - {name: oil_rise_rated, value: 55, unit: K, estimate: "The IEC 60076-7 default top-oil rise for ONAN distribution transformers, recalled (the standard is paywalled); with the gradient it gives the classic 98 °C hot spot at rated load in 20 °C air."}
      - {name: gradient_rated, value: 23, unit: K, estimate: "The IEC 60076-7 default hot-spot-to-top-oil gradient (H·gr) for distribution transformers, recalled."}
      - {name: loss_ratio, value: 5, unit: "", estimate: "The IEC 60076-7 default ratio of load losses to no-load losses for distribution transformers, recalled; it sets how warm the oil is at no load."}
      - {name: exponents, value: "x 0,8 · y 1,6", unit: "", estimate: "The IEC 60076-7 oil and winding exponents for ONAN, recalled."}
      - {name: tau_oil, value: 180, unit: min, estimate: "The IEC 60076-7 default top-oil time constant for distribution transformers, recalled; the view speeds it up."}
      - {name: hotspot_limit, value: 120, unit: "°C", estimate: "The IEC 60076-7 hot-spot limit for normal cyclic loading, recalled."}
      - {name: ageing, value: "1 at 98 °C, ×2 per 6 K", unit: "", estimate: "IEC 60076-7 relative ageing for non-thermally-upgraded paper, recalled."}
      - {name: load_max, value: 150, unit: "%", estimate: "IEC 60076-7's current limit for distribution transformers, recalled; beyond it the model does not hold."}
      - {name: before, value: 50, unit: "%", estimate: "The overload's hours start after a long day at half load: a design choice so the hours mean something; a trafo that was already hot holds shorter (the caption says so)."}
      - {name: tropical, value: 30, unit: "°C", source: knmi_hittegolf}
      - {name: ambient_steps, value: "0 / 10 / 20", unit: "°C", estimate: "A winter evening, spring, and the loading guide's reference ambient of 20 °C (recalled)."}
      - {name: enclosure, value: 0, unit: K, estimate: "Ignored: the air round the trafo is taken as the outside air; a trafohuisje adds a few kelvin (IEC 60076-7 has a correction for it)."}
      - {name: tau_view, value: 6, unit: s, estimate: "A design choice so the player sees the oil climb; the codex caption says the real one is hours."}
      - {name: gear_ratio, value: 3, unit: "", estimate: "A light bicycle gear, so both force gauges move visibly; the real trafo trades twenty-five times (the reveal says so)."}

