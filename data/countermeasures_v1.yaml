    maturity_requirement:
      tier: 1
      prerequisites: []
    effectiveness:
      full: "Zone maturity >= Tier 1"
      reduced: "Routines defined but not consistently followed"
      minimal: "Routines posted but no training or enforcement"
      no_effect: null
      harmful: null
      multipliers:
        full: 0.85
        reduced: 0.40
        minimal: 0.20
    decay:
      enabled: true
      days: 21
      condition: >
        Decays without active Psychological Safety Routines
        and regular audit. Near-miss reporting atrophies
        if reports are seen to produce no action.
      side_effect_ref: null
    applicable_to: [all]
    notes: >
      The only Tier 1 tool with no harmful tier. Applying to
      an immature zone always produces some effect, even if minimal.

  - id: CM-T1-004
    name: "Basic Quality Gates"
    tier: 1
    category: quality
    description: >
      Go/no-go checks at critical points, basic incoming inspection.
      Prevents defects from advancing downstream.
    maturity_requirement:
      tier: 1
      prerequisites: []
    effectiveness:
      full: "Zone maturity >= Tier 1"
      reduced: "Gates exist but criteria are inconsistently applied"
      minimal: "Gates defined but operators have no training"
      no_effect: null
      harmful: null
      multipliers:
        full: 0.82
        reduced: 0.42
        minimal: 0.20
    decay:
      enabled: false
      days: null
      condition: null
      side_effect_ref: null
    applicable_to: [all]
    notes: >
      Prerequisite for Poka-Yoke and Jidoka. Basic quality gates
      establish the detection points that more advanced tools
      then automate or error-proof.
    implementation_quiz:
      - question: >
          You're installing quality gates on a line that has defects
          reaching the customer. Where does the first gate belong?
        npc: "Quality Lead"
        choices:
          - text: "Immediately after the process step that creates the most common defect"
            outcome: CORRECT
            feedback: >
              Catching the defect next to its source means you still
              know what caused it. Every station the defect travels
              through before detection adds noise to the investigation.
              Close to the source is close to the answer.
            teaches: [quality_gate, FTR, root_cause_analysis]
          - text: "At the end of the line, where all defects can be caught together"
            outcome: PLAUSIBLE
            feedback: >
              End-of-line catches everything, but by then the unit has
              had 15 stations' worth of value added. Rework is
              expensive. And the cause is buried under 15 steps of
              variation. This is detection, not prevention.
            teaches: [quality_gate, rework_waste]
          - text: "Before the process step, so incoming material can be checked"
            outcome: WRONG
            feedback: >
              Incoming inspection is useful — but it can't catch defects
              the process itself creates. If the station is introducing
              the defect, no amount of incoming check will find it.
              The gate needs to be downstream of the cause.
            teaches: [quality_gate, inspection]
      - question: >
          An operator detects a defect at a quality gate. What's the
          right immediate response?
        npc: "Quality Lead"
        choices:
          - text: "Stop the flow, contain the batch since the last good check, and investigate upstream"
            outcome: CORRECT
            feedback: >
              Stop-and-contain is the Jidoka principle. You don't know
              how long the defect has been occurring, so everything
              since the last good check is suspect. Investigate before
              resuming — the cause might still be producing defects
              right now.
            teaches: [jidoka, quality_gate, containment]
          - text: "Reroute the defective unit for rework and keep the line running"
            outcome: PLAUSIBLE
            feedback: >
              Keeping the line running feels right — but if the defect's
              cause is still active, you're making more rework every
              minute. Short-term throughput, long-term cost. A quick
              investigation beats rework volume.
            teaches: [quality_gate, rework_waste]
          - text: "Log the defect and pass the unit along for the next shift to handle"
            outcome: WRONG
            feedback: >
              A logged-but-unactioned defect becomes background noise.
              By the next shift, the cause has drifted and the context
              is lost. A quality gate that doesn't stop the line is
              just a counter.
            teaches: [quality_gate, jidoka]

  - id: CM-T1-005
    name: "Workplace Organization"
    tier: 1
    category: workplace_organization
    description: >
      Shadow boards, labeling, color coding, floor marking.
      Defines where things belong. Prerequisite for flow tools
      that depend on visual clarity.
    maturity_requirement:
      tier: 1
      prerequisites: []
    effectiveness:
      full: "Zone maturity >= Tier 1"
      reduced: "Partial organization — some areas labeled, others not"
      minimal: "Organization attempted but no standards applied"
      no_effect: null
      harmful: null
      multipliers:
        full: 0.75
        reduced: 0.35
        minimal: 0.15
    decay:
      enabled: true
      days: 45
      condition: >
        Decays without 5S System active. Floor markings fade,
        labels become outdated, shadow boards stop reflecting
        current tool inventory.
      side_effect_ref: null
    applicable_to: [all]

  - id: CM-T1-006
    name: "Visual Labels and Signs"
    tier: 1
    category: visual_management
    description: >
      Clear naming of areas, equipment, bins, routes.
      Foundation for visual factory — everything has a name and a place.
    maturity_requirement:
      tier: 1
      prerequisites: []
    effectiveness:
      full: "Zone maturity >= Tier 1"
      reduced: "Labels exist but inconsistent format or outdated"
      minimal: "Ad-hoc labels only"
      no_effect: null
      harmful: null
      multipliers:
        full: 0.72
        reduced: 0.33
        minimal: 0.15
    decay:
      enabled: false
      days: null
      condition: null
      side_effect_ref: null
    applicable_to: [all]
    implementation_quiz:
      - question: >
          You're labelling storage bins and routes in the zone.
          What makes a visual label actually effective on the floor?
        npc: "Team Leader"
        choices:
          - text: "It communicates status at a glance — colour, shape, or position alone carries the meaning"
            outcome: CORRECT
            feedback: >
              A visual label should be readable at walking speed from
              across the floor. Colour and position carry meaning
              without reading. This is why good visual management
              works even for operators who don't share a first language.
            teaches: [visual_management, workplace_organization]
          - text: "It uses clear language and fonts large enough to read from a few metres away"
            outcome: PLAUSIBLE
            feedback: >
              Readable labels help — but reading takes a second or two
              per label. Multiplied across a shift, that's real waste.
              Visual management aims for zero-second comprehension.
            teaches: [visual_management]
          - text: "It includes detailed instructions for every possible scenario"
            outcome: WRONG
            feedback: >
              Detailed instructions belong in standard work documents,
              not on labels. A label crammed with instructions gets
              ignored after the first week. Less text, more signal.
            teaches: [visual_management, standard_work]
      - question: >
          Six weeks after installation, labels have started being
          ignored. What's typically the root cause?
        npc: "Team Leader"
        choices:
          - text: "No daily routine references the labels — they're not part of how work gets done"
            outcome: CORRECT
            feedback: >
              Visual management lives when it's embedded in routines —
              shift handovers, audits, replenishment triggers. Without
              a routine that uses them, labels become decoration.
              Labels + routine = system; labels alone = wallpaper.
            teaches: [visual_management, management_system, sustain]
          - text: "The labels are too small or poorly positioned"
            outcome: PLAUSIBLE
            feedback: >
              Position matters — but well-placed labels still decay
              when no routine refers to them. If the routine is right,
              the labels can be imperfect and still work. If the
              routine is absent, perfect labels still fade.
            teaches: [visual_management]
          - text: "Operators don't understand what the labels mean"
            outcome: WRONG
            feedback: >
              The labels were installed six weeks ago — if operators
              don't understand them by now, the labels themselves
              failed the comprehension test. The drift is usually not
              understanding, it's relevance.
            teaches: [visual_management]

  - id: CM-T1-007
    name: "Tool Location Systems"
    tier: 1
    category: workplace_organization
    description: >
      Foam cutouts, dedicated tool holders, tool tethering.
      Eliminates search time for tools between tasks.
    maturity_requirement:
      tier: 1
      prerequisites: []
    effectiveness:
      full: "Zone maturity >= Tier 1"
      reduced: "Locations defined but not all tools have homes"
      minimal: "Some tools stored deliberately, most ad-hoc"
      no_effect: null
      harmful: null
      multipliers:
        full: 0.80
        reduced: 0.38
        minimal: 0.18
    decay:
      enabled: true
      days: 30
      condition: >
        Decays without 5S System active. Tool locations drift
        as operators find personal preferences.
      side_effect_ref: null
    applicable_to: [all]
    implementation_quiz:
      - question: >
          You're about to build shadow boards for a station. What's
          the first step that avoids rework later?
        npc: "Team Leader"
        choices:
          - text: "Observe which tools the operator actually uses during real work — count frequency and sequence"
            outcome: CORRECT
            feedback: >
              Shadow boards are only useful if they match the actual
              work. Observation first — then the board reflects reality
              instead of assumptions. Operators keep using boards that
              match how they work.
            teaches: [workplace_organization, gemba, standard_work]
          - text: "Ask operators which tools they want closest to hand"
            outcome: PLAUSIBLE
            feedback: >
              Operator input matters — but self-reported preferences
              often don't match actual usage. Observation shows what
              people do; asking shows what they think they do. Use both,
              starting with observation.
            teaches: [workplace_organization, gemba]
          - text: "Buy the shadow boards and arrange tools alphabetically or by size"
            outcome: WRONG
            feedback: >
              An alphabetical tool layout ignores how work actually
              flows. Operators will either stop using the board or
              adapt it informally. The order has to match the work.
            teaches: [workplace_organization]
      - question: >
          A week after installation, tools aren't being returned to
          their shadow positions. What's typically the root cause?
        npc: "Team Leader"
        choices:
          - text: "The shadow positions don't match the actual sequence of work — returning tools interrupts flow"
            outcome: CORRECT
            feedback: >
              If returning a tool costs a detour, operators won't do
              it. The shadow layout must align with the work flow —
              where you last used a tool should be close to where it
              goes. Observation first would have prevented this.
            teaches: [workplace_organization, flow, motion_waste]
          - text: "Operators are too rushed to return tools properly"
            outcome: PLAUSIBLE
            feedback: >
              'Rushed' usually means 'the system punishes returning tools.'
              If return is low-friction, it happens. If it costs a
              15-second walk, it doesn't. The issue is rarely
              motivation — it's design.
            teaches: [workplace_organization, motion_waste]
          - text: "Operators don't know where the tools are supposed to go"
            outcome: WRONG
            feedback: >
              Shadow boards make location self-evident — every tool has
              a visible outline of its home. 'Not knowing' isn't usually
              the problem with a well-designed shadow board. The drift
              points to friction, not knowledge.
            teaches: [workplace_organization, visual_management]

