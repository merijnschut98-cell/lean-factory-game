# ============================================================
# Lean Factory — Countermeasure Catalog v1.0 (MERGED)
# 79 total: 10 Tier 1, 16 Tier 2, 24 Tier 3, 18 Tier 4, 11 Diagnostic
#
# SCHEMA per countermeasure:
#   id, name, tier, category, description
#   maturity_requirement: {tier, prerequisites: [CM-IDs]}
#   effectiveness:
#     full / reduced / minimal / no_effect: narrative string | null
#     harmful: {condition, side_effect_ref} | null
#     multipliers: {full, reduced, minimal}  ← numeric game values
#   decay:
#     enabled: bool
#     days: int | null   ← simulated days until decay begins
#     condition: narrative | null
#     side_effect_ref: problem-ID | null
#   applicable_to: [station-type, ...] | [all]
#   notes: optional design note
#
# EFFECTIVENESS TIERS (narrative):
#   full:     100% effect. Factory maturity meets or exceeds requirement.
#   reduced:  ~50% effect. One tier below requirement.
#   minimal:  ~20% effect. Two tiers below requirement.
#   no_effect: ~5% effect. Three+ tiers below. No side-effect triggered.
#   harmful:  Applies countermeasure but triggers a side-effect problem.
#
# DIAGNOSTIC TOOLS: maturity_requirement: none. effectiveness: always_full.
#   cost_credits: 0 unless specified. Reveal problems, do not fix them.
# ============================================================

countermeasures:

  # ==========================================================
  # TIER 1 — STABLE FOUNDATION
  # ==========================================================

  - id: CM-T1-001
    name: "5S System"
    tier: 1
    category: workplace_organization
    description: >
      Sort, Set in order, Shine, Standardize, Sustain.
      Applied per zone. Decays without active Standardize
      and Sustain measures.
    maturity_requirement:
      tier: 1
      prerequisites: []
    effectiveness:
      full: "Zone maturity >= Tier 1"
      reduced: "Zone maturity below Tier 1 but Sort/Set have been applied"
      minimal: "No prior workplace organization in zone"
      no_effect: null
      harmful: null
      multipliers:
        full: 0.80
        reduced: 0.35
        minimal: 0.15
    decay:
      enabled: true
      days: 30
      condition: >
        Decays if Standard Work Definition and Basic Documentation Control
        are not active in the same zone. 5S Sort and Set phases hold,
        but Shine and Sustain phases regress within 30 simulated days.
      side_effect_ref: null
    applicable_to: [all]
    notes: >
      The most commonly misapplied Tier 1 tool. Players who apply 5S
      without sustain mechanisms will see the zone deteriorate and the
      problem resurface. This is intentional — it teaches that 5S is a
      system, not a one-time event.
    implementation_quiz:
      - question: >
          You're ready to implement 5S in the zone. What's the first
          action for the Sort phase specifically?
        npc: "Team Leader"
        choices:
          - text: "Walk the area and red-tag everything that isn't needed for the current work"
            outcome: CORRECT
            feedback: >
              That's Sort — the first S. Every item in the workspace
              gets a decision: keep, relocate, or remove. The red tags
              make the decision visible and auditable.
            teaches: [5S_sort, workplace_organization]
          - text: "Organize the tools that are staying into shadow-board positions"
            outcome: PLAUSIBLE
            feedback: >
              That's Set in order — the second S. Valuable, but it's
              wasted effort if you Set tools you'll red-tag an hour later.
              Always Sort before you Set.
            teaches: [5S, workplace_organization]
          - text: "Deep-clean the whole area first to see what you're working with"
            outcome: WRONG
            feedback: >
              That's Shine — the third S. Cleaning first means scrubbing
              around items that shouldn't even be there. Sort first,
              then you'll have less to clean.
            teaches: [5S]
      - question: >
          Sort and Set in order are done. What prevents the zone from
          drifting back to its previous state within a month?
        npc: "Team Leader"
        choices:
          - text: "Schedule recurring 5S audits with a named owner and visible scorecard"
            outcome: CORRECT
            feedback: >
              Sustain — the fifth S — is a management system, not a
              poster. Audits, owners, and visibility are the three
              structural elements that hold 5S in place.
            teaches: [sustain, management_system, accountability]
          - text: "Run a 5S training workshop for all operators in the zone"
            outcome: PLAUSIBLE
            feedback: >
              Training helps — but untrained operators can sustain a
              well-audited zone, and trained operators can't sustain
              an unaudited one. The audit routine does the work.
            teaches: [sustain, training]
          - text: "Take a photograph of the organized state as a reference"
            outcome: WRONG
            feedback: >
              Photos help with Set in order (showing where things go)
              but do nothing for Sustain. A photo doesn't notice when
              drift happens — only an audit does.
            teaches: [sustain, visual_management]

  - id: CM-T1-002
    name: "Standard Work Definition"
    tier: 1
    category: process_standardization
    description: >
      Documented work sequence, takt time, and WIP target for each station.
      Foundation for most Tier 2+ tools.
    maturity_requirement:
      tier: 1
      prerequisites: []
    effectiveness:
      full: "Zone maturity >= Tier 1"
      reduced: "Partial documentation exists but not at station"
      minimal: "No documentation infrastructure in zone"
      no_effect: null
      harmful: null
      multipliers:
        full: 0.85
        reduced: 0.40
        minimal: 0.20
    decay:
      enabled: true
      days: null
      condition: >
        Decays if Basic Documentation Control is not active.
        Standard work documents become outdated as process changes
        occur without update procedures.
      side_effect_ref: null
    applicable_to: [all]
    notes: >
      Prerequisite for SMED, Line Balancing, TPM, and most
      Tier 3+ countermeasures. Without it, advanced tools
      operate without a baseline.
    implementation_quiz:
      - question: >
          You're about to write the standard work for a station. What
          should you capture first?
        npc: "Team Leader"
        choices:
          - text: "Time each step of the current best-known method with a stopwatch, then document the sequence"
            outcome: CORRECT
            feedback: >
              Standard work starts from observation, not from theory.
              The best-known method — timed and verified — becomes the
              baseline that everyone can improve against.
            teaches: [standard_work, time_study, gemba]
          - text: "Write down what the most experienced operator describes doing"
            outcome: PLAUSIBLE
            feedback: >
              An operator's description is tacit knowledge — useful,
              but incomplete. They often omit the hundreds of small
              decisions they make without thinking. Observation
              captures what words miss.
            teaches: [standard_work, tacit_knowledge]
          - text: "Draft the procedure based on the engineering specification"
            outcome: WRONG
            feedback: >
              The spec describes intent, not execution. Standard work
              documents what actually works on the floor — which is
              often different from what engineering designed. Observe
              first, reconcile with the spec later.
            teaches: [standard_work, gemba]
      - question: >
          A new operator reaches a consistently lower cycle time than
          the documented standard, using a slightly different method.
          What's the right response?
        npc: "Team Leader"
        choices:
          - text: "Observe carefully, verify quality holds, then update the standard to the new method"
            outcome: CORRECT
            feedback: >
              Standard work is the best-known method — until a better
              one is discovered. A faster, equally-high-quality method
              becomes the new baseline. Standard work is living, not
              frozen.
            teaches: [standard_work, kaizen, continuous_improvement]
          - text: "Retrain the operator to follow the documented standard exactly"
            outcome: PLAUSIBLE
            feedback: >
              Consistency matters — but locking in a suboptimal method
              when a better one is visible teaches everyone that the
              document matters more than the outcome. The standard
              should chase the best method, not the other way around.
            teaches: [standard_work]
          - text: "Let each operator develop their own method as long as output is acceptable"
            outcome: WRONG
            feedback: >
              Now you have N methods and N cycle times. Variation is
              the enemy of quality data and improvement targets.
              Standard work exists to converge on one best method —
              updated when a better one is found.
            teaches: [standard_work, operator_variation]

  - id: CM-T1-003
    name: "Safety Routines"
    tier: 1
    category: safety
    description: >
      PPE checks, LOTO procedures, near-miss reporting.
      Non-negotiable foundation. No harmful tier — safety
      routines applied at any maturity level produce at
