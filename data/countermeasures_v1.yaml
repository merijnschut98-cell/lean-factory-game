      available. Richer output as data density increases.
    maturity_requirement: none
    effectiveness: always_full
    scales_with_maturity: >
      At Tier 1, categories populated by observation. At Tier 3+, populated
      by measurement data. Both are valid — output quality differs.
    cost_credits: 0
    decay:
      enabled: false

