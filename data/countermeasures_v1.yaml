  - id: CM-DX-001
    name: "5 Whys Analysis"
    tier: diagnostic
    category: problem_solving
    description: >
      Root cause drilling through causal questioning. Always available.
      Quality of output scales with quality of data available in the zone.
    maturity_requirement: none
    effectiveness: always_full
    scales_with_maturity: >
      At Tier 1, produces a shallow causal chain limited by data availability.
      At Tier 3+, produces validated root causes traceable to measurement data.
    cost_credits: 0
    decay:
      enabled: false

  - id: CM-DX-002
    name: "Ishikawa / Fishbone Diagrams"
