  - id: T1-019
    name: "The Forgotten Near-Miss"
    category: Safety / Behavior
    severity: high
    visibility: subtle
    zone_id: z2
    station_id: deck_cutting
    symptoms:
      - "Operators occasionally bypass blade guard on non-standard deck profiles"
      - "Workaround not documented, not reported, not visible without direct observation"
      - "Near-miss log not updated in four months"
    root_cause: >
      Safety procedure designed for standard deck profiles only. When non-standard
      profiles introduced, no procedure update occurred. Operators developed a
      workaround and normalized it. Near-miss reporting atrophied.
    effective_countermeasures:
      - Safety Routines
      - Basic Documentation Control
      - Standard Work Definition
    maturity_prerequisite: >
      Player must observe the Deck Cutting station during a non-standard cut
      cycle — only occurs during certain production mix conditions.
    mismatch_note: >
      Applying Psychological Safety Routines (Tier 2) without first fixing the
      underlying procedure gap produces a culture initiative built on a broken
      foundation. Operators will not report near-misses on a workaround they
      depend on to do their job.
    side_effect_ref: T1-019
    effect_modifiers:
      quality_delta: -0.02
    teaches:
      - safety
      - standard_work
      - documentation
      - near_miss_reporting
    dialogue:
      investigation:
        npc: "Maintenance Lead"
        prompt: >
          Operators bypass the blade guard on non-standard deck cuts. The
          near-miss log has not been updated in four months. Where do we start?
        choices:
          - text: "Observe a non-standard cut cycle and understand exactly why the guard gets bypassed"
            outcome: CORRECT
            evidence: >
              When lowered, the guard contacts the non-standard deck edge and
              deflects the cut by 2 to 3 mm. Operators discovered this months
              ago. Removing the guard gives accurate cuts. The guard geometry
              does not accommodate non-standard profiles.
            hint: >
              The bypass has a reason — operators are not reckless, they are
              solving a real problem. Understanding why reveals the fix: a
              guard design that works for all profiles.
            teaches: [safety, standard_work, poka_yoke, gemba]
            score_feed: RCA
          - text: "Retrain operators on the safety procedure and reinforce the guard rule"
            outcome: PLAUSIBLE
            evidence: null
            hint: >
              Retraining treats the behaviour, not the cause. If the guard
              prevents accurate cuts, operators will bypass it again as soon
              as the trainer leaves.
            teaches: [safety, standard_work]
          - text: "Remove non-standard deck profiles from the production schedule"
            outcome: WRONG
            evidence: null
            hint: >
              Eliminating the profile removes the immediate trigger — but does
              not fix the guard design or the near-miss reporting culture.
              Non-standard profiles may return.
            teaches: []

  - id: T1-020
    name: "The Ghost Inventory"
    category: Waste / Information
    severity: medium
    visibility: subtle
    zone_id: z1
    station_id: incoming_qa
    symptoms:
