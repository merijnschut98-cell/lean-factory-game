            outcome: PLAUSIBLE
            evidence: null
            hint: >
              ERP reconciliation helps — but it only covers receiving events.
              The gap also includes scrap, rework, and informal borrowing that
              never touched the GRN process.
            teaches: [data_accuracy, digitalization]
          - text: "Switch to a manual spreadsheet until the system is trusted"
            outcome: WRONG
            evidence: null
            hint: >
              A parallel manual system creates two sources of truth, both of
              which become unreliable over time. The system needs to be fixed,
              not bypassed.
            teaches: [digitalization, information_flow]

