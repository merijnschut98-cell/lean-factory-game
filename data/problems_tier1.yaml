          - text: "Double the bin size so operators run out less often"
            outcome: WRONG
            evidence: null
            hint: >
              Bigger bins delay the problem — they do not eliminate it. Larger
              bins also increase WIP and make the replenishment cycle less
              predictable.
            teaches: [WIP, waste_muda]

  - id: T1-017
    name: "The Approval Bottleneck"
    category: Flow / Behavior
    severity: high
    visibility: obvious
    zone_id: z5
    station_id: flight_test
    symptoms:
      - "Every flight test failure requires supervisor sign-off before rework"
      - "Supervisor covers three zones; frequently unavailable"
      - "Failed units wait 30–60 min for approval; operators idle during wait"
    root_cause: >
      The approval requirement was a temporary measure after a quality escape 18
      months ago. Never revisited. No standard for when operator-level decisions
      are acceptable. All failures, regardless of severity, follow the same path.
    effective_countermeasures:
      - Basic Documentation Control
      - Standard Work Definition
      - Basic Quality Gates
    maturity_prerequisite: null
    mismatch_note: >
      Applying Problem Escalation Protocols (Tier 2) without first defining
      operator decision authority creates a more structured escalation path for
      a problem that should not be escalated at all in most cases.
    side_effect_ref: null
    effect_modifiers:
      avail_delta: -0.15
    teaches:
      - standard_work
      - decision_authority
      - flow
      - waste_muda
    dialogue:
      investigation:
        npc: "Scheduler"
        prompt: >
          Every flight test failure waits 30 to 60 minutes for supervisor
          sign-off. The supervisor covers three zones. What is the right
          question to ask first?
        choices:
          - text: "Understand what the supervisor actually decides when approving and whether an operator could decide instead"
            outcome: CORRECT
            evidence: >
              In 40 observed approvals: 35 were rework-and-retry decisions an
