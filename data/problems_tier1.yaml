      - Basic Documentation Control
      - Workplace Organization
      - Standard Work Definition
    maturity_prerequisite: >
      Player must have attempted to analyze a production shortage and discovered
      the system record was incorrect.
    mismatch_note: >
      Applying Process Mining (Tier 3) generates a detailed audit of a problem
