  - id: T1-014
    name: "The Missing Measurement"
    category: Quality / Information
    severity: medium
    visibility: subtle
    zone_id: z5
    station_id: burn_in
    symptoms:
      - "Burn-in station reports pass/fail but records nothing else"
      - "No duration data, no temperature readings, no failure codes"
      - "Quality investigations start from scratch every time"
    root_cause: >
      Burn-in test was designed as a binary gate — pass or fail — with no data
      capture infrastructure. No one specified what data was needed or why.
    effective_countermeasures:
      - Basic Documentation Control
      - Basic Quality Gates
      - Standard Work Definition
    maturity_prerequisite: >
      Player must have inspected the Testing zone at least once and observed
      elevated reject rates.
    mismatch_note: >
      Applying Advanced Analytics Dashboards (Tier 4) to a station with no data
      capture produces a dashboard connected to a binary input — same information
      already visible on the floor.
    side_effect_ref: null
    effect_modifiers:
      quality_delta: -0.03
    teaches:
      - data_capture
      - MSA
      - digitalization
      - measurement_system
    dialogue:
      investigation:
        npc: "IT Engineer"
        prompt: >
          Burn-in records only pass or fail — nothing else. Before we think
          about capturing more data, how do we know what data we actually need?
        choices:
          - text: "Talk to the engineers who designed the burn-in test and ask what failure modes it detects"
            outcome: CORRECT
            evidence: >
              The burn-in was designed to catch thermal stress failures. The
              critical variables are temperature, duration, and load cycling.
              None of these are currently recorded.
            hint: >
              Before digitizing, understand the physics. The data you need
              flows from the failure mode you are trying to detect — not from
              what is easy to capture.
            teaches: [data_capture, measurement_system, digitalization, MSA]
            score_feed: RCA
          - text: "Review the last 100 failure records to find patterns"
            outcome: PLAUSIBLE
            evidence: null
            hint: >
              Good instinct — but the records are just pass/fail checkboxes.
              There is no pattern to find in binary data. You need to define
              what to capture first.
            teaches: [data_capture, MSA]
          - text: "Install sensors to capture everything — temperature, vibration, current, voltage"
            outcome: WRONG
            evidence: null
            hint: >
              Capturing everything sounds thorough but produces noise. Data
              without a question is storage, not insight. Define the failure
              mode first, then choose the measurement.
            teaches: [digitalization]

  - id: T1-015
    name: "Nobody Told Receiving"
    category: Information / Flow
    severity: medium
    visibility: subtle
    zone_id: z1
    station_id: incoming_qa
    symptoms:
      - "Incoming QA passes components flagged for known supplier quality issue"
      - "Dimensional variance on propulsion core housing known to Engineering and Final Assembly"
      - "Informal workaround at Final Assembly adds 4–7 min per unit"
    root_cause: >
