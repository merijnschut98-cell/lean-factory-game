    effective_countermeasures:
      - Basic Documentation Control
      - Basic Quality Gates
      - Visual Labels & Signs
    maturity_prerequisite: >
      Player must have inspected Final Assembly and observed the informal
      workaround behavior.
    mismatch_note: >
      Applying Process Mining (Tier 3) correctly maps the gap but the fix is a
      one-page documented alert at Incoming QA — a Tier 1 countermeasure.
    side_effect_ref: null
    effect_modifiers:
      quality_delta: -0.05
    teaches:
      - information_flow
      - quality_gate
      - documentation
      - supplier_quality
    dialogue:
      investigation:
        npc: "Quality Lead"
        prompt: >
          Incoming QA is passing components with a known supplier defect that
          Final Assembly has been working around for weeks. How did this happen?
        choices:
          - text: "Map how quality alerts currently travel from Final Assembly to Incoming QA"
            outcome: CORRECT
            evidence: >
              There is no formal channel. Final Assembly sends a Slack message
