# Tier 1 Problem Catalog — 25 hand-designed problems
# Translated from "Problem Catalog - Tier 1.docx"
#
# Fields:
#   id, name, category, severity, visibility, zone_id, station_id
#   symptoms (list), root_cause, effective_countermeasures (list)
#   maturity_prerequisite, mismatch_note
#   effect_modifiers: dict of simulation adjustments while problem is active
#     keys: avail_delta, perf_delta, quality_delta (applied to station)

problems:

  - id: T1-001
    name: "The Graveyard Shelf"
    category: Waste
    severity: medium
    visibility: obvious
    zone_id: z2
    station_id: coil_winding
    symptoms:
      - "Unlabeled shelf of partially-wound coils beside Coil Winding station"
      - "WIP metric for Component Prep elevated"
      - "Cycle time at Coil Winding inconsistent"
    root_cause: >
      No standard WIP definition at this station. Operators self-manage
      work-in-progress, masking rework, lost components, and idle time.
    effective_countermeasures:
      - Standard WIP Definition
      - 5S System
      - Standard Work Definition
    maturity_prerequisite: null
    mismatch_note: >
      Applying Kanban (Tier 3) without first defining standard WIP produces
      a pull signal attached to an undefined quantity. Kanban loop oscillates
      and triggers a new problem.
    side_effect_ref: null
    effect_modifiers:
      perf_delta: -0.08
      quality_delta: -0.04
    teaches:
      - 5S
      - standard_work
      - WIP
      - waste_muda
    dialogue:
      investigation:
        npc: "Team Leader"
        prompt: >
          The Graveyard Shelf has been here forever. Let's figure out why before
          we touch it. What should we check first?
        choices:
          - text: "Count and categorize what's actually on the shelf"
            outcome: CORRECT
            evidence: >
              You count 23 partially-wound coils — 20% to 95% complete. No
              labels, no dates, no owner. Someone was interrupted 23 times
              and never came back.
            hint: >
              Making waste visible is always step one. You now have a number,
              a question, and proof. This is the 5S Sort phase in practice.
            teaches: [gemba, 5S_sort, waste_muda]
            score_feed: RCA
          - text: "Check whether a WIP standard was ever defined for this station"
            outcome: PLAUSIBLE
            evidence: >
              HR records show no WIP standard has been documented for Coil
              Winding — ever.
            hint: >
              This is the root cause direction, but without first counting the
              pile you can't quantify the scale. Measure the problem before
              diagnosing it.
            teaches: [standard_work, WIP]
          - text: "Ask the operators to clear the shelf immediately"
            outcome: WRONG
            evidence: null
            hint: >
              Moving the pile is not the same as solving the problem. It will
              return — probably within a week — unless you understand why it
              formed.
            teaches: []

  - id: T1-002
    name: "Nobody Knows Where Anything Is"
    category: Waste
    severity: medium
    visibility: obvious
    zone_id: z3
    station_id: deck_assembly
    symptoms:
      - "Operators visibly searching for tools between tasks (45–90 s per cycle)"
      - "Cycle time at Deck Assembly consistently above takt"
      - "Shadow boards absent; tools shared informally"
    root_cause: >
      No tool location system in place. Tools are shared without structure,
      returned inconsistently, and their absence is only discovered when needed.
    effective_countermeasures:
      - Tool Location Systems
      - 5S System
      - Workplace Organization
    maturity_prerequisite: null
    mismatch_note: >
      Applying Standard Work Definition (Tier 1) without establishing tool
      locations produces a documented procedure referencing tools frequently
      unavailable. Operators deviate to compensate.
    side_effect_ref: null
    effect_modifiers:
      perf_delta: -0.12
    teaches:
      - 5S
      - workplace_organization
      - visual_management
      - waste_muda
    dialogue:
      investigation:
        npc: "Team Leader"
        prompt: >
          Operators are losing 45–90 seconds per cycle searching for tools.
          What's the right first move?
        choices:
          - text: "Do a time study — time every tool search across one full shift"
            outcome: CORRECT
            evidence: >
              34 search events in one shift. Average 67 s each. 15 events over
              2 minutes. Total: 47 minutes of lost production time in a single
              shift.
            hint: >
              Measure before you fix. These numbers convince everyone — and
              give you a baseline to prove improvement against.
            teaches: [time_study, gemba, waste_muda]
            score_feed: RCA
          - text: "Order shadow boards and tool holders immediately"
            outcome: PLAUSIBLE
            evidence: null
            hint: >
              Right direction — but without measuring first, you don't know
              which tools to shadow or how many. You'll likely buy the wrong
              things.
            teaches: [5S, visual_management]
          - text: "Send operators to a 5S training course"
            outcome: WRONG
            evidence: null
            hint: >
              Training without changing the workplace doesn't change the
              workplace. The problem is the environment, not the operators.
            teaches: []

  - id: T1-003
    name: "The Rework Corner"
    category: Quality
    severity: high
    visibility: obvious
    zone_id: z4
    station_id: integration_4
    symptoms:
      - "Pile of finished hoverboards awaiting rework beside Integration 4"
      - "FTR drops visibly when this station is active"
      - "Operators at Integration 4 appear rushed"
    root_cause: >
      No quality gate between Integration 3 and 4. Defects from Integration 3
      (incorrect torque on propulsion mount) are not caught until final function
      check at Integration 4, at which point rework is significant.
    effective_countermeasures:
      - Basic Quality Gates
      - Poka-Yoke
      - Standard Work Definition
    maturity_prerequisite: null
    mismatch_note: >
      Applying SPC (Tier 4) produces control charts on a process with no
      standard work. Charts show variation but cannot distinguish operator
      deviation, tooling variation, and upstream defects.
    side_effect_ref: null
    effect_modifiers:
      quality_delta: -0.10
      perf_delta: -0.05
    teaches:
      - quality_gate
      - poka_yoke
      - FTR
      - rework_waste
    dialogue:
      investigation:
        npc: "Quality Lead"
        prompt: >
          The rework pile at Integration 4 keeps growing. FTR is dropping.
          Where do we start?
        choices:
          - text: "Go to Integration 4 and inspect the rework pile right now"
            outcome: CORRECT
            evidence: >
              57% of rework units have the same defect: propulsion mount torque
              applied at wrong angle. Every single one traces back to Integration 3.
            hint: >
              The pile is evidence — it just needed to be read. Gemba first,
              always. Now you know exactly where the defect originates.
            teaches: [gemba, FTR, rework_waste, quality_gate]
            score_feed: RCA
          - text: "Walk back to Integration 3 and observe what's happening"
            outcome: PLAUSIBLE
            evidence: >
              Operators at Integration 3 apply the mount by feel, without a
              fixture. Torque angle varies visibly between operators.
            hint: >
              Good instinct to look upstream — but reading the rework pile
              first would have told you exactly where to look, faster.
            teaches: [gemba, poka_yoke, standard_work]
          - text: "Set up a digital tracking system to log each rework type"
            outcome: WRONG
            evidence: null
            hint: >
              A tracking system captures data about a problem that still exists.
              Fix the root cause first — then track to confirm it's gone.
              Digitalization accelerates learning; it doesn't replace it.
            teaches: [digitalization]

  - id: T1-004
    name: "The Invisible Handover"
    category: Behavior
    severity: medium
    visibility: obvious
    zone_id: z4
    station_id: integration_1
    symptoms:
      - "Production drops 20–35 min at every shift change in Final Assembly"
      - "Operators arriving on new shift spend time locating materials"
      - "Some in-progress units restarted because their status is unclear"
    root_cause: >
      No shift handover protocol exists. Status of in-progress work lives in the
      heads of departing operators; incoming operators have no structured receive.
    effective_countermeasures:
      - Team Leader Routines
      - Standard Work Definition
      - Basic Documentation Control
    maturity_prerequisite: null
    mismatch_note: >
      Applying Daily Management System (Tier 2) without handover protocols
      produces a daily meeting that identifies the symptom every day without
      resolving the root cause.
    side_effect_ref: null
    effect_modifiers:
      avail_delta: -0.08
    teaches:
      - standard_work
      - shift_handover
      - leader_standard_work
      - variation
    dialogue:
      investigation:
        npc: "Scheduler"
        prompt: >
          Output drops 20–35 minutes at every shift change. I've tracked it
          for weeks. What do we verify first?
        choices:
          - text: "Observe a shift change live — time exactly what happens during the handover"
            outcome: CORRECT
            evidence: >
              Departing operator leaves 4 in-progress units unlabeled. Incoming
              operator spends 8 min locating materials and 12 min checking unit
              status by asking colleagues. No information is ever written down.
            hint: >
              Direct observation turns a vague complaint into a specific,
              actionable problem definition. Now you know the exact 20 minutes
              being lost and why.
            teaches: [gemba, shift_handover, standard_work, waste_muda]
            score_feed: RCA
          - text: "Ask the supervisor to document the current handover procedure"
            outcome: PLAUSIBLE
            evidence: >
              The supervisor confirms there is no written procedure. Each team
              leader runs handover differently.
            hint: >
              This confirms the problem — but you still need to observe actual
              behavior to understand what specifically needs to be standardized.
            teaches: [standard_work, documentation]
          - text: "Add a WIP buffer before Integration 1 so the new shift has material to work with"
            outcome: WRONG
            evidence: null
            hint: >
              The buffer hides the symptom. The problem isn't a shortage of
              material — it's the knowledge gap at handover. More WIP doesn't
              fix missing information.
            teaches: [WIP]

  - id: T1-005
    name: "The Overqualified Packager"
    category: Waste
    severity: low
    visibility: obvious
    zone_id: z6
    station_id: packaging
    symptoms:
      - "Most experienced operator permanently assigned to Packaging"
      - "Packaging cycle time well below takt; operator idle 30–40% of time"
      - "Downstream stations stall waiting for operator's informal guidance"
    root_cause: >
      No skill matrix exists. Operator assignment is historical and informal.
      The most skilled operator was placed at Packaging years ago and no one
      has revisited the decision.
    effective_countermeasures:
      - Skill Matrix
      - Operator Rebalancing
      - Cross-Training Programs
    maturity_prerequisite: null
    mismatch_note: >
      Applying Line Balancing (Tier 3) without a skill matrix rebalances
      workload while ignoring operator capability. New imbalances emerge
      immediately.
    side_effect_ref: T1-005_linebuild_variant
    effect_modifiers:
      perf_delta: 0.0   # waste, not a perf hit at this station
    teaches:
      - skill_matrix
      - line_balancing
      - waste_mura
    dialogue:
      investigation:
        npc: "HR Manager"
        prompt: >
          Your best operator is running a station that doesn't need them.
          Where do we start?
        choices:
          - text: "Map all operator skills against all station requirements"
            outcome: CORRECT
            evidence: >
              You build a 4×24 skill matrix. Your best operator has 4 advanced
              skills needed only at Integration 5 — a station running below
              capacity. Packaging needs zero of those skills.
            hint: >
              The skill matrix makes the mismatch visible to everyone, not just
              you. That's how you build consensus to make a difficult move.
            teaches: [skill_matrix, waste_mura, line_balancing]
            score_feed: RCA
          - text: "Time the workload at each station to see who's idle and who's stretched"
            outcome: PLAUSIBLE
            evidence: >
              Integration 5 runs at 62% capacity; Coil Winding at 110%. The
              imbalance is clear — but workload data alone doesn't show which
              operator skills are needed where.
            hint: >
              Time study reveals the workload imbalance but not the skill gap.
              Without a skill matrix, moving operators blindly can create new
              problems.
            teaches: [time_study, line_balancing, waste_mura]
          - text: "Move the skilled operator to Integration 5 immediately"
            outcome: WRONG
            evidence: null
            hint: >
              Without a skill matrix, you're guessing. The move might fix
              Integration 5 and quietly break Coil Winding or Battery Assembly.
              Measure first.
            teaches: []

  - id: T1-006
    name: "The Flood Before the Drought"
    category: Flow
    severity: high
    visibility: obvious
    zone_id: z1
    station_id: dock
    symptoms:
      - "Twice weekly large component deliveries overflow the Staging area"
      - "Between deliveries Staging is nearly empty; Component Prep starves"
      - "Incoming QA overwhelmed; clears backlog over two days"
    root_cause: >
      Delivery schedule driven by supplier convenience and PO batching.
      No leveled receiving schedule. Factory absorbs all variation.
    effective_countermeasures:
      - Workplace Organization
      - Basic Documentation Control
      - Standard WIP Definition
    maturity_prerequisite: null
    mismatch_note: >
      Applying Heijunka (Tier 3) to the production schedule without first
      stabilizing incoming material flow produces a leveled internal schedule
      disrupted by flood/drought delivery patterns.
    side_effect_ref: null
    effect_modifiers:
      avail_delta: -0.10
    teaches:
      - heijunka
      - leveled_production
      - waste_muri
      - flow
    dialogue:
      investigation:
        npc: "Scheduler"
        prompt: >
          The dock floods twice a week then starves for days.
          Component Prep can't plan around it. What's the right first step?
        choices:
          - text: "Map the actual delivery schedule against daily takt requirements"
            outcome: CORRECT
            evidence: >
              The supplier delivers 60% of weekly volume on Monday and 35% on
              Thursday. Takt requires roughly equal daily input. The factory
              absorbs all variation with no buffer plan.
            hint: >
              Understanding the current delivery pattern vs. required flow is
              the first step in Heijunka — you can't level what you haven't
              measured.
            teaches: [heijunka, takt_time, leveled_production, gemba]
            score_feed: RCA
          - text: "Expand the staging area to buffer the Monday floods"
            outcome: PLAUSIBLE
            evidence: null
            hint: >
              A bigger buffer hides the variation — it doesn't eliminate it.
              You'd need a much larger area, and the drought period wouldn't
              improve.
            teaches: [waste_muri, flow]
          - text: "Call the supplier and ask them to deliver daily starting next week"
            outcome: WRONG
            evidence: null
            hint: >
              Good instinct but premature. Without delivery data, you can't
              build a business case — and the supplier will need contract terms
              reviewed before changing cadence.
            teaches: []

  - id: T1-007
    name: "Instructions? What Instructions?"
    category: Quality / Behavior
    severity: high
    visibility: obvious
    zone_id: z3
    station_id: battery_assembly
    symptoms:
      - "Three operators assemble battery pack in three different sequences"
      - "One skips connector check; one applies thermal paste differently"
      - "FTR at Battery Assembly varies significantly by operator and shift"
      - "No work instructions visible at station"
    root_cause: >
      Work instructions exist on a shared drive no one accesses. Station has
      never had posted instructions. Each operator learned from their trainer,
      inheriting personal variation.
    effective_countermeasures:
      - Basic Documentation Control
      - Standard Work Definition
      - Safety Routines
    maturity_prerequisite: null
    mismatch_note: >
      Applying DMAIC (Tier 4) before standard work is established produces a
      project that correctly identifies operator variation as root cause but
      recommends advanced statistical controls on a process with no baseline.
    side_effect_ref: null
    effect_modifiers:
      quality_delta: -0.08
      perf_delta: -0.06
    teaches:
      - standard_work
      - documentation
      - operator_variation
      - quality_gate
    dialogue:
      investigation:
        npc: "Quality Lead"
        prompt: >
          Three operators at Battery Assembly each assemble the pack in a
          different sequence. FTR varies by operator and shift. Where do we start?
        choices:
          - text: "Observe all three operators in one shift and document every difference"
            outcome: CORRECT
            evidence: >
              Operator A applies thermal paste before connectors. Operator B
              reverses this. Operator C skips the paste on 30% of units. The
              differences are subtle, consistent, and only visible by watching.
            hint: >
              Standard work always starts with documenting actual current
              practice — all variants — before writing a standard. You can't
              standardize what you haven't observed.
            teaches: [standard_work, gemba, operator_variation]
            score_feed: RCA
          - text: "Pull the existing work instruction and compare it to what operators do"
            outcome: PLAUSIBLE
            evidence: null
            hint: >
              Smart — but the instruction lives on a drive nobody accesses.
              Checking a document tells you the gap, not why each operator
              diverged.
            teaches: [standard_work, documentation]
          - text: "Identify the operator with the best FTR and have them train the others"
            outcome: WRONG
            evidence: null
            hint: >
              Training from one operator embeds their personal variation, not a
              true standard. It also doesn't address why the work instruction
              was never used.
            teaches: []

  - id: T1-008
    name: "The Phantom Defect"
    category: Quality
    severity: medium
    visibility: obvious
    zone_id: z5
    station_id: final_qa
    symptoms:
      - "Final QA rejects ~12% for 'flight instability'"
      - "~Half pass when re-tested minutes later with no modification"
      - "Re-test pass rate varies by inspector; defect rate higher on certain shifts"
      - "Scrap cost elevated"
    root_cause: >
      No measurement system validation. Flight test procedure inconsistently
      applied — inspector technique, test duration, and pass/fail criteria vary.
      The measurement system itself is the source of variation.
    effective_countermeasures:
      - Basic Quality Gates
      - Standard Work Definition
      - Basic Documentation Control
    maturity_prerequisite: null
    mismatch_note: >
      Applying MSA/Gage R&R (Tier 4) is correct but premature. The MSA will
      confirm the measurement system is unreliable — which observation already
      shows — but the fix is simply a standardized test procedure.
    side_effect_ref: null
    effect_modifiers:
      quality_delta: -0.12
    teaches:
      - MSA
      - standard_work
      - quality_gate
      - measurement_system
    dialogue:
      investigation:
        npc: "Quality Lead"
        prompt: >
          Final QA rejects 12% for flight instability — but half of those pass
          immediately on retest without modification. What is happening?
        choices:
          - text: "Run the test yourself three times on the same unit and record every variable"
            outcome: CORRECT
            evidence: >
              Three tests on the same board: fail, pass, pass. Test duration
              varied from 45 to 80 seconds. No standard for how long to hold the
              board or at what angle.
            hint: >
              When the same unit produces different results on repeat test, the
              measurement system is the variable — not the product. That is the
              root cause.
            teaches: [MSA, measurement_system, standard_work, quality_gate]
            score_feed: RCA
          - text: "Interview inspectors about how they conduct the test"
            outcome: PLAUSIBLE
            evidence: null
            hint: >
              Good direction — but talking about a procedure is not the same
              as watching it. Inspectors often cannot articulate their own
              technique differences.
            teaches: [standard_work, operator_variation]
          - text: "Implement a mandatory second test for all failed units"
            outcome: WRONG
            evidence: null
            hint: >
              Re-testing a broken measurement system generates more unreliable
              data. You would double inspection time and still not know which
              result to trust.
            teaches: [waste_muda]

  - id: T1-009
    name: "The Island Station"
    category: Flow
    severity: medium
    visibility: obvious
    zone_id: z3
    station_id: propulsion_build
    symptoms:
      - "Propulsion Build physically isolated from stations it feeds"
      - "Material arrives in large batches pushed by Component Prep"
      - "Finished propulsion cores queue in trolley; operator has no downstream visibility"
      - "WIP between Propulsion Build and Final Assembly consistently high"
    root_cause: >
      Station layout designed around equipment footprint, not flow. Push
      scheduling and physical isolation combine to create a local island with
      no connection to downstream pull signals.
    effective_countermeasures:
      - Workplace Organization
      - Standard WIP Definition
      - Visual Labels & Signs
    maturity_prerequisite: null
    mismatch_note: >
      Applying a Kanban system (Tier 3) without first establishing standard WIP
      creates a pull system attached to an island. Kanban cards accumulate
      unanswered because the operator has no context for the signal.
    side_effect_ref: null
    effect_modifiers:
      perf_delta: -0.07
    teaches:
      - flow
      - kanban
      - push_vs_pull
      - WIP
    dialogue:
      investigation:
        npc: "Team Leader"
        prompt: >
          WIP between Propulsion Build and Final Assembly is always high. The
          station seems to run fine in isolation. What do we check first?
        choices:
          - text: "Walk the material path and count WIP at every handoff point"
            outcome: CORRECT
            evidence: >
              Propulsion Build output queue: 0 units waiting. Trolley between
              stations: 23 units. Final Assembly input queue: 3 units. The
              buildup is entirely in the handoff — not at the station itself.
            hint: >
              High WIP between stations reveals a push system with no
              connection to downstream pull. Walking the flow makes the
              disconnect visible.
            teaches: [flow, push_vs_pull, WIP, gemba]
            score_feed: RCA
          - text: "Review Propulsion Build cycle time data to see if it is overproducing"
            outcome: PLAUSIBLE
            evidence: null
            hint: >
              Cycle time analysis is useful — but a spreadsheet will not show
              you that the trolley between stations holds 23 units. Walk the
              floor first.
            teaches: [flow, OEE]
          - text: "Speed up Final Assembly to consume the WIP backlog"
            outcome: WRONG
            evidence: null
            hint: >
              Consuming the backlog faster does not fix the push dynamic that
              created it. The trolley will fill again immediately.
            teaches: [waste_muda]

  - id: T1-010
    name: "The Dirty Machine"
    category: Maintenance / Quality
    severity: medium
    visibility: obvious
    zone_id: z2
    station_id: pcb_prep
    symptoms:
      - "Visible contamination buildup around PCB Prep soldering heads"
      - "Reject rate at PCB Prep climbing slowly over six weeks"
      - "Handwritten note taped to machine: 'needs cleaning — maintenance called' (3 weeks old)"
    root_cause: >
      No operator-led cleaning routine exists. Maintenance is reactive and
      overloaded. Machine degrades gradually between emergency interventions.
    effective_countermeasures:
      - Cleanliness Standards
      - Safety Routines
      - Basic Documentation Control
    maturity_prerequisite: null
    mismatch_note: >
      Applying TPM (Tier 4) without first establishing basic cleaning standards
      attempts to build a full planned maintenance program on a foundation
      where operators don't yet own basic machine care.
    side_effect_ref: null
    effect_modifiers:
      avail_delta: -0.12
      quality_delta: -0.06
    teaches:
      - TPM
      - autonomous_maintenance
      - 5S
      - OEE
    dialogue:
      investigation:
        npc: "Maintenance Lead"
        prompt: >
          PCB Prep reject rate has climbed for six weeks. There is a maintenance
          note on the machine that has been there for three weeks. What do we do
          first?
        choices:
          - text: "Inspect the machine closely and measure contamination at the soldering heads"
            outcome: CORRECT
            evidence: >
              Flux residue covers 40% of the soldering head surface, worse on
              the right side. Two joints on that side show cold-solder defects
              that match the reject pattern.
            hint: >
              Before planning a cleaning program, understand the scale and
              pattern. Measurement before action — this is the TPM principle
              of understanding machine condition before prescribing the fix.
            teaches: [TPM, autonomous_maintenance, gemba, OEE]
            score_feed: RCA
          - text: "Schedule a full machine overhaul with maintenance"
            outcome: PLAUSIBLE
            evidence: null
            hint: >
              An overhaul may be needed — but scheduling it without inspecting
              first risks over-specifying the work. It also does not address
              why basic cleaning was never done.
            teaches: [TPM, maintenance]
          - text: "Move the handwritten note to the maintenance backlog system"
            outcome: WRONG
            evidence: null
            hint: >
              Moving a note to a backlog delays action without improving
              visibility. The note is evidence the informal system failed —
              it needs a formal response, not a filing.
            teaches: []

  - id: T1-011
    name: "The Unofficial Queue"
    category: Flow / Waste
    severity: medium
    visibility: obvious
    zone_id: z4
    station_id: integration_3
    symptoms:
      - "8–25 units of WIP permanently accumulate between Integration 2 and 3"
      - "Operators at Integration 3 pull from queue; Integration 2 pushes regardless of readiness"
      - "Aisle space partially obstructed; nobody manages the queue"
    root_cause: >
      Integration 2 cycle time is shorter than Integration 3 and no WIP limit
      exists between them. Overproduction at Integration 2 is default behavior
      because stopping feels wrong to the operator.
    effective_countermeasures:
      - Standard WIP Definition
      - Visual Labels & Signs
      - Workplace Organization
    maturity_prerequisite: null
    mismatch_note: >
      Applying FIFO Lanes (Tier 3) without first defining a WIP limit organizes
      waste without eliminating it. The queue now has structure but still grows
      unchecked.
    side_effect_ref: null
    effect_modifiers:
      perf_delta: -0.06
    teaches:
      - WIP
      - flow
      - overproduction
      - FIFO
    dialogue:
      investigation:
        npc: "Team Leader"
        prompt: >
          There are always 8 to 25 units between Integration 2 and 3. Operators
          call it normal. Is it?
        choices:
          - text: "Time how long a unit waits in the queue before Integration 3 picks it up"
            outcome: CORRECT
            evidence: >
              Average queue wait: 47 minutes. Longest observed: 2 hours 20
              minutes. Integration 2 cycle time is 320 s; Integration 3 is
              360 s. The 40-second gap compounds into hours of waiting WIP.
            hint: >
              Timing the queue makes waste visible and quantifiable. The
              40-second CT gap explains exactly why the queue grows. Now
              you have a number to improve against.
            teaches: [WIP, flow, overproduction, takt_time, time_study]
            score_feed: RCA
          - text: "Ask Integration 2 operators to slow down slightly to match Integration 3"
            outcome: PLAUSIBLE
            evidence: null
            hint: >
              Asking operators to slow down is a workaround, not a fix. There
              is no standard for slightly slower and it creates a different
              waste — underutilized operator capacity.
            teaches: [standard_work, waste_mura]
          - text: "Add floor markings to organize the queue area"
            outcome: WRONG
            evidence: null
            hint: >
              Organizing waste makes it look acceptable. Marked floor space
              for a queue signals the queue is expected — and therefore
              permanent.
            teaches: [visual_management]

