              Information flow failures are often invisible until you map them.
              The fix is not a tool — it is a defined channel with a defined
              owner.
            teaches: [information_flow, quality_gate, documentation, supplier_quality]
            score_feed: RCA
          - text: "Hold a meeting between Final Assembly and Incoming QA to share the alert"
            outcome: PLAUSIBLE
            evidence: null
            hint: >
              One meeting transmits one alert. Without a repeatable channel,
              the next alert will follow the same broken path.
            teaches: [information_flow]
          - text: "Reject the current batch and return it to the supplier"
            outcome: WRONG
            evidence: null
            hint: >
              Rejection addresses this batch — but Incoming QA will pass the
              next batch the same way because they still have no inspection
              criteria for this defect.
            teaches: [supplier_quality]

  - id: T1-016
    name: "The Shrinking Bin"
