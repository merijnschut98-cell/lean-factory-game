        npc: "Quality Lead"
        prompt: >
          Incoming QA marks every delivery inspected — but only counts boxes.
          Defective components reach the floor. What is the root issue?
        choices:
          - text: "Pull the Incoming QA procedure and check what it actually specifies"
            outcome: CORRECT
            evidence: >
              The procedure states: Verify quantity against PO. That is all.
              There is no sampling plan, no dimensional check, no visual
              inspection criteria. The process was designed to confirm
              delivery quantity, not quality.
            hint: >
              When a process gives the wrong output, check the procedure
              first. If the procedure specifies the wrong output, the operators
              are not the problem — the specification is.
            teaches: [quality_gate, inspection, standard_work, documentation]
            score_feed: RCA
          - text: "Observe Incoming QA operators and see if they follow the procedure"
            outcome: PLAUSIBLE
            evidence: null
            hint: >
              Observation is valuable — but here the procedure itself is wrong.
              Operators correctly following a bad procedure is not the root
              cause.
            teaches: [gemba, standard_work]
          - text: "Add a quality engineer to Incoming QA to catch defects"
            outcome: WRONG
            evidence: null
            hint: >
              Adding a person to a broken process makes it slightly less
              broken, not fixed. The engineer would have no defined criteria
              to inspect against.
            teaches: [waste_muri, quality_gate]

  - id: T1-023
    name: "The Workaround That Became the Process"
    category: Behavior / Quality
    severity: high
    visibility: subtle
    zone_id: z3
    station_id: propulsion_build
    symptoms:
      - "Experienced operators insert an undocumented adjustment step at Propulsion Build"
      - "New operators skip it; produce higher defect rate"
      - "Experienced operators cannot explain why the step is necessary"
    root_cause: >
      A component tolerance issue two years ago causes propulsion housings to fit
      inconsistently. A skilled operator discovered an adjustment that compensates.
      The fix was passed on informally and became embedded practice without
      anyone investigating the root cause.
    effective_countermeasures:
      - Standard Work Definition
      - Basic Documentation Control
      - Basic Quality Gates
    maturity_prerequisite: >
      Player must have observed both experienced and new operators at Propulsion
      Build and noticed the performance gap.
    mismatch_note: >
      Applying 5 Whys (Tier 2) without first documenting current actual practice
      — including the workaround — produces a root cause investigation built on
      an incomplete process description.
    side_effect_ref: null
    effect_modifiers:
      quality_delta: -0.07
    teaches:
      - standard_work
      - documentation
      - tacit_knowledge
      - quality_gate
    dialogue:
      investigation:
        npc: "Quality Lead"
        prompt: >
          Experienced operators at Propulsion Build perform an undocumented
          adjustment step. New operators skip it and produce more defects.
          Nobody can explain why the step exists. What do we do?
        choices:
          - text: "Film an experienced operator performing the full process and identify the exact adjustment"
            outcome: CORRECT
            evidence: >
              The adjustment is a 3 to 4 mm repositioning of the housing
              before torquing the rear mount. It happens when the housing
              feels slightly too tight. An experienced operator does this
              in under 5 seconds without conscious thought.
            hint: >
              Tacit knowledge becomes explicit only when made visible. Filming
              the actual behaviour reveals what the operator does, not what
              they say they do.
            teaches: [tacit_knowledge, standard_work, gemba, quality_gate]
            score_feed: RCA
          - text: "Interview experienced operators to document what they do differently"
            outcome: PLAUSIBLE
            evidence: null
            hint: >
              Interviews capture intent, not behaviour. The experienced
              operator likely cannot fully articulate the micro-adjustment —
              it is below conscious awareness. Observation is more reliable.
            teaches: [tacit_knowledge, standard_work, documentation]
          - text: "Promote the experienced operator to trainer and have them pass on the technique"
            outcome: WRONG
            evidence: null
            hint: >
              Training from a tacit-knowledge holder transfers the knowledge
              but not the understanding of why it is needed. The next operator
              still will not know when to apply it.
            teaches: [tacit_knowledge, knowledge_management]

  - id: T1-024
    name: "The Shifting Standard"
    category: Variation / Behavior
    severity: medium
    visibility: subtle
    zone_id: z5
    station_id: final_qa
    symptoms:
      - "Final QA pass rates vary significantly between day and night shifts on identical product"
      - "Both shifts believe they are applying the correct standard"
      - "Defect escapes occur predominantly from one shift but not consistently"
    root_cause: >
      Final QA acceptance criteria revised three times in the past year. Not all
      operators received each revision. Different operators working from different
      versions of the standard. No version control or controlled distribution.
    effective_countermeasures:
      - Basic Documentation Control
      - Standard Work Definition
      - Basic Quality Gates
    maturity_prerequisite: >
      Player must have observed Final QA across both shifts and noticed the
      pass rate discrepancy.
    mismatch_note: >
      Applying SPC (Tier 4) correctly identifies shift-to-shift variation as
      special cause but cannot explain it because the measurement system itself
      is inconsistent.
    side_effect_ref: null
    effect_modifiers:
      quality_delta: -0.05
    teaches:
      - documentation
      - version_control
      - standard_work
      - variation
    dialogue:
      investigation:
        npc: "Quality Lead"
        prompt: >
          Final QA pass rates differ significantly between day and night shift
          on identical product. Both shifts believe they are applying the
          correct standard. What is the root cause?
        choices:
          - text: "Collect the acceptance criteria document used by both shifts and compare version dates"
            outcome: CORRECT
            evidence: >
              Day shift uses v3 of the acceptance spec, revised 4 months ago.
              Night shift uses v1, the original from 18 months ago. Version 3
              tightened two dimensional tolerances and added a new visual
              defect category. Night shift never received it.
            hint: >
              When two groups apply the same process differently and both
              believe they are correct, the first question is whether they
              are working from the same document.
            teaches: [documentation, version_control, standard_work, variation]
            score_feed: RCA
          - text: "Have both shifts test the same set of borderline units and compare results"
            outcome: PLAUSIBLE
            evidence: null
            hint: >
              A cross-shift comparison confirms measurement variation — but
              it will not tell you why they differ. Document version first.
            teaches: [MSA, variation]
          - text: "Instruct both shift supervisors to align and reach a consensus standard"
            outcome: WRONG
            evidence: null
            hint: >
              Asking two groups with different documents to reach consensus
              produces a negotiated compromise, not the correct standard. The
              spec owner needs to confirm the right version.
            teaches: [standard_work, documentation]

  - id: T1-025
    name: "The Number Nobody Believes"
    category: Information / Behavior
    severity: high
    visibility: hidden
    zone_id: z1
    station_id: dock
    symptoms:
      - "None visible initially — daily output report shows consistently strong numbers"
      - "As factory improves, actual measured output begins to diverge from reported output"
      - "Gap widens: report systematically overstates output by counting Integration 4 as 'completed'"
    root_cause: >
      The reporting definition of 'completed unit' was set years ago to include
      units at Integration 4 rather than units passing Final QA. A deliberate
      decision to make numbers look better. Operators and team leaders know the
      definition is wrong but have never been empowered to change it.
    effective_countermeasures:
      - Basic Documentation Control
      - Performance Management Boards
      - Standard Work Definition
    maturity_prerequisite: >
      Player must have improved overall factory output measurably and installed
      at least one Performance Management Board — the ghost only appears when
      real performance data becomes visible enough to contradict the report.
    mismatch_note: >
      Applying Daily Management System (Tier 2) structures a management cadence
      around the existing report before the reporting definition is corrected.
      The system amplifies a lie. Fix the metric before you build a management
      system around it.
    side_effect_ref: T1-025_dms_variant
    effect_modifiers: {}
    teaches:
      - performance_reporting
      - data_integrity
      - management_system
      - OEE
    dialogue:
      investigation:
        npc: "Controller"
        prompt: >
          Your daily output report looks better than what you observe on the
          floor — and the gap is growing as you make improvements. What is
          happening?
        choices:
          - text: "Trace exactly how the completed unit number in the report is calculated"
            outcome: CORRECT
            evidence: >
              The report counts units that reach Integration 4 as completed.
              Units that fail Final QA or sit in rework at Integration 5 are
              not subtracted. As FTR improves, more units reach Integration 4
              — inflating reported output even when actual shipped output
              stays flat.
            hint: >
              When a metric looks better than reality, the metric definition
              is wrong. Tracing the calculation is more reliable than trusting
              the number.
            teaches: [performance_reporting, data_integrity, OEE, management_system]
            score_feed: RCA
          - text: "Compare the report against physical shipment records from Dispatch"
            outcome: PLAUSIBLE
            evidence: null
            hint: >
              Good cross-check — and it will confirm the gap exists. But it
              will not explain why or where the over-count happens.
            teaches: [data_integrity, performance_reporting]
          - text: "Accept the report numbers since they show progress and the team needs motivation"
            outcome: WRONG
            evidence: null
            hint: >
              Managing to a wrong metric amplifies the distortion. If the
              system rewards Integration 4 throughput rather than shipped
              quality, that is where effort will concentrate.
            teaches: [management_system, data_integrity]
