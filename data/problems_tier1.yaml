            outcome: PLAUSIBLE
            evidence: null
            hint: >
              Delegation is likely the solution — but delegating without clear
              criteria means the senior operator inherits ambiguity. Define the
              decision rules first.
            teaches: [standard_work, leader_standard_work]
          - text: "Hire a second supervisor to cover flight test specifically"
            outcome: WRONG
            evidence: null
            hint: >
              A second supervisor doubles the cost of an approval process that
              should not require approval at all for 87% of cases.
            teaches: [waste_muda]

