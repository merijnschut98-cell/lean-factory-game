              response time commitment, and visible action rate, it will
              feel like a different way to be ignored.
            teaches: [suggestion_system, kaizen_mindset]
          - text: "Implement the layout improvement the operator suggested without analysis"
            outcome: WRONG
            evidence: null
            hint: >
              One idea needs investigation before implementation — and
              four other ideas are waiting too. Ad-hoc implementation
              of a single idea does not solve the system gap.
            teaches: [suggestion_system, structured_improvement]

  - id: T2-010
    name: "The Fishbone in the Drawer"
    category: Quality
    waste: defects
    severity: medium
    visibility: subtle
    zone_id: z5
    station_id: burn_in
    symptoms:
      - "Root cause investigation reports consistently conclude with 'operator error' or 'material issue'"
      - "The same failure mode reappears in a new variant within weeks of being 'resolved'"
      - "No structured analysis tool has been used in any investigation in the past quarter"
    root_cause: >
      Problem investigations are conducted verbally and informally.
      Without a structured tool like Ishikawa analysis, investigations
      stop at the first plausible cause — usually 'operator error' or
      'bad material' — and miss systemic 4M contributors. The fix
      addresses a symptom, not the cause.
    effective_countermeasures:
      - Ishikawa / Fishbone Diagrams
      - 5 Whys Analysis
    maturity_prerequisite: null
    mismatch_note: >
      Using a Fishbone as a post-hoc documentation exercise after the
      root cause has been decided produces a diagram that confirms
      existing assumptions rather than challenging them.
    side_effect_ref: null
    effect_modifiers:
      quality_delta: -0.07
    teaches:
      - fishbone
      - root_cause_analysis
      - 4M_6M
      - structured_analysis
      - beyond_operator_error
      - confirmation_bias
    dialogue:
      investigation:
        npc: "Quality Lead"
        prompt: >
          I've pulled a folder of investigation reports from this
          quarter. Every single one concludes with 'operator error'.
          Does that seem right to you?
        choices:
          - text: "Take the most recent recurring defect and map all possible contributing factors across Man, Machine, Method, and Material"
            outcome: CORRECT
            tool: data
            evidence: >
              4M analysis on the burn-in thermal cycling failure:
              Man (one operator trains all others — variation source),
              Machine (thermal probe calibrated 8 months ago),
              Method (no hold-time specified for partial cycles),
              Material (supplier batch variation with no incoming test).
              Four real contributors. None are 'operator error'.
            hint: >
              When every investigation concludes the same way, the
              conclusion is telling you about the investigation method,
              not the problem. A structured tool forces you out of
              the obvious answer.
            teaches: [fishbone, 4M_6M, root_cause_analysis, structured_analysis, beyond_operator_error]
            score_feed: RCA
          - text: "Ask the team leader to write a more detailed investigation report"
            outcome: PLAUSIBLE
            tool: ask
            evidence: null
            hint: >
              More detail in the same informal format still produces an
              informal conclusion. You need a different analysis method,
              not a longer version of the current one.
            teaches: [structured_analysis, fishbone]
          - text: "Send the Quality Lead to a root cause analysis training course"
            outcome: WRONG
            evidence: null
            hint: >
              Training helps — but the root cause analysis tool needs
              to be applied now, on this problem. The Quality Lead is
              asking the right question — the problem is the method,
              not the person.
            teaches: [structured_analysis, gemba, just_do_it]

  - id: T2-011
    name: "The Manager's Ghost"
    category: Management
    waste: waiting
    severity: high
    visibility: hidden
    zone_id: z1
    station_id: dock
    symptoms:
      - "Team leaders are making decisions that belong one level above their authority"
      - "Supervisor spends over 80% of each shift at their desk according to time observation"
      - "Floor problems without management escalation wait an average of 3 days for resolution"
    root_cause: >
      The supervisor has no defined standard work for floor time. All
      available time is consumed by email, reporting, and scheduled
      meetings. No floor visit routine exists — without one, management
      presence is reactive (crises only) rather than proactive.
    effective_countermeasures:
      - Leader Standard Work
      - Gemba Walks
    maturity_prerequisite: null
    mismatch_note: >
      Defining leader standard work without protected time blocks
      produces a document that is immediately displaced by the meeting
      culture it was meant to complement.
    side_effect_ref: null
    effect_modifiers:
      perf_delta: -0.08
      avail_delta: -0.05
    teaches:
      - leader_standard_work
      - gemba
      - management_presence
      - tiered_accountability
      - time_allocation
    dialogue:
      investigation:
        npc: "Team Leader"
        prompt: >
          I keep making calls I shouldn't have to make. Nobody else
          is here. What's really going on?
        choices:
          - text: "Track exactly how the supervisor spends their time across one full shift — in 30-minute blocks"
            outcome: CORRECT
            tool: docs
            evidence: >
              Time observation over one shift: 6.2 hours at desk
              (email, reporting, meetings). 1.8 hours on floor
              (one crisis response, one visitor tour). Zero proactive
              floor observation.
            hint: >
              Time data doesn't lie. The supervisor is not neglecting
              the floor deliberately — the system of demands fills all
              available time. Standard work for leadership time is the fix.
            teaches: [leader_standard_work, time_allocation, gemba, management_presence]
            score_feed: RCA
          - text: "Talk to the supervisor about spending more time on the floor"
            outcome: PLAUSIBLE
            tool: ask
            evidence: null
            hint: >
              The conversation might raise awareness — but without data
              on where time is going, the supervisor cannot make a
              structured case for protecting floor time in their schedule.
            teaches: [leader_standard_work, gemba, direct_observation]
          - text: "Promote the Team Leader to Supervisor level to close the authority gap"
            outcome: WRONG
            evidence: null
            hint: >
              Promoting someone to fill a gap created by another person's
              absence does not fix the absence. It creates a new gap
              one level down.
            teaches: [leader_standard_work, structural_fix, escalation]

  - id: T2-012
    name: "The Kaizen That Never Happened"
    category: Management
    waste: skills
    severity: medium
    visibility: obvious
    zone_id: z6
    station_id: packaging
    symptoms:
      - "Packaging efficiency improvement has been on the weekly meeting agenda for 11 weeks in a row"
      - "No structured improvement activity has been initiated at this station"
      - "Team is cynical about improvement discussion — 'we've talked about it a dozen times'"
    root_cause: >
      There is no structured framework for running a focused improvement
      event. Improvement ideas surface in meetings but die there because
      no one knows how to convert a discussion into a bounded,
      time-limited workshop with defined outputs.
    effective_countermeasures:
      - Kaizen Events
      - PDCA Cycles
    maturity_prerequisite: null
    mismatch_note: >
      Running a kaizen event without a stable baseline (5S, standard
      work) produces improvement activity that cannot be sustained —
      the kaizen improves a moving target.
    side_effect_ref: null
    effect_modifiers:
      perf_delta: -0.07
    teaches:
      - kaizen
      - improvement_event
      - waste_elimination
      - workshop_structure
      - just_do_it
    dialogue:
      investigation:
        npc: "HR Manager"
        prompt: >
          The packaging team keeps raising the same efficiency issue
          in every meeting. Why isn't anything changing?
        choices:
          - text: "Interview the team members who raised the packaging issue — what happened after they raised it each time?"
            outcome: CORRECT
            tool: ask
            evidence: >
              Three team members interviewed. Consistent account: issue
              raised, acknowledged, added to next meeting agenda, repeated.
              No one was ever assigned to lead an improvement. No output
              was ever expected from the discussion.
            hint: >
              Meetings are for decisions and accountability — not for
              doing the improvement. A kaizen event takes the improvement
              offline and gives it time, space, and a scope.
            teaches: [kaizen, workshop_structure, improvement_ownership, just_do_it]
            score_feed: RCA
          - text: "Schedule a dedicated meeting to resolve the packaging issue"
            outcome: PLAUSIBLE
            tool: docs
            evidence: null
            hint: >
              Another meeting is the pattern that isn't working. The
              issue has been discussed in eleven meetings already. What's
              needed is an event that produces a change, not a
              conversation that produces another agenda item.
            teaches: [kaizen, just_do_it, improvement_event]
          - text: "Implement the packaging change immediately during the next shift"
            outcome: WRONG
            evidence: null
            hint: >
              Immediate implementation without structured analysis can
              make things worse. The kaizen event process exists precisely
              because unstructured change in production creates new
              problems faster than it solves old ones.
            teaches: [kaizen, structured_improvement, waste_elimination]

  - id: T2-013
    name: "Misaligned Targets"
    category: Management
    waste: overproduction
    severity: medium
    visibility: hidden
    zone_id: z2
    station_id: deck_cutting
    symptoms:
      - "Deck Cutting cycle count is up 15% this month — team leader reports it as good news"
      - "Plant FTR has dropped 8% over the same period, correlated with the throughput increase"
      - "The team leader and the Quality Lead have different views on whether things are improving"
    root_cause: >
      Team leader targets were set locally and never cascaded from
      plant-level objectives. The team leader is optimising for their
      declared metric (cycle count) while the plant KPI (FTR) suffers
      because downstream quality from the accelerated throughput
      is declining.
    effective_countermeasures:
      - Catchball / Hoshin Kanri Light
      - Daily Management System
      - Performance Management Boards
    maturity_prerequisite: null
    mismatch_note: >
      Setting aligned targets without a regular review cadence allows
      the environment to change while targets stay the same — alignment
      at the start does not guarantee alignment over time.
    side_effect_ref: null
    effect_modifiers:
      quality_delta: -0.08
      perf_delta: -0.05
    teaches:
      - hoshin_kanri
      - target_cascading
      - local_vs_global_optimization
      - policy_deployment
      - systems_thinking
    dialogue:
      investigation:
        npc: "Scheduler"
        prompt: >
          Deck Cutting throughput is up but FTR is down. The team
          leader thinks they're winning. What's actually happening?
        choices:
          - text: "Compare the team leader's declared daily target against the plant-level KPI report side by side"
            outcome: CORRECT
            tool: data
            evidence: >
              Team leader target: 'achieve 220 cut decks per shift'.
              Plant KPI: FTR ≥ 92%. The team leader's target has no
              FTR component. Cutting faster introduces micro-burrs that
              cause downstream defects — not visible at Deck Cutting
              but counted at Final QA.
            hint: >
              Both the team leader and the Quality Lead are correct —
              within their own frame of reference. The problem is that
              the frames were never connected. Target cascading closes
              that gap.
            teaches: [hoshin_kanri, target_cascading, local_vs_global_optimization, systems_thinking]
            score_feed: RCA
          - text: "Ask the team leader to explain why their metrics are improving while FTR drops"
            outcome: PLAUSIBLE
            tool: ask
            evidence: >
              Team leader is surprised: 'I didn't know my throughput
              was causing the FTR issue — I've never seen those numbers
              together.'
            hint: >
              The team leader's honest response shows the problem: they
              have never seen the connected picture. That is an information
              and goal-setting failure, not a performance failure.
            teaches: [hoshin_kanri, target_cascading, daily_management]
          - text: "Change the team leader's performance bonus metric from cycle count to FTR"
            outcome: WRONG
            evidence: null
            hint: >
              Changing the metric for one person does not change the
              target-setting process for the organisation. Next year a
              different team leader will get the same misaligned targets
              unless the cascading process changes.
            teaches: [hoshin_kanri, policy_deployment, systems_thinking]

  - id: T2-014
    name: "Silent Shift Change"
    category: Management
    waste: defects
    severity: medium
    visibility: subtle
    zone_id: z5
    station_id: final_qa
    symptoms:
      - "Quality escapes cluster in the first 30 minutes after each shift change at Final QA"
      - "Team leaders hand over verbally in the corridor — escalated issues often not transferred"
      - "The incoming team leader re-discovers open investigations the outgoing leader knew about"
    root_cause: >
      Team leaders have no standard work for shift handover at the
      leadership level. The T1 operator handover protocol was improved,
      but the team leader to team leader exchange remains verbal and
      informal — escalated problems and open investigations are not
      reliably transferred.
    effective_countermeasures:
      - Team Leader Routines
      - Leader Standard Work
    maturity_prerequisite: null
    mismatch_note: >
      Standardising team leader handover without connecting it to the
      daily management system produces a handover document that is not
      referenced in daily meetings and decays within weeks.
    side_effect_ref: null
    effect_modifiers:
      avail_delta: -0.06
      quality_delta: -0.05
    teaches:
      - leader_standard_work
      - shift_handover
      - information_transfer
      - escalation
      - management_rituals
    dialogue:
      investigation:
        npc: "Quality Lead"
        prompt: >
          Defect escapes cluster right after shift change. We fixed
          operator handover in Tier 1 — but this pattern is at the
          leadership level. What should we check?
        choices:
          - text: "Observe two consecutive shift changes from the team leader perspective — what information is transferred and how?"
            outcome: CORRECT
            tool: observe
            evidence: >
              Observed three handovers. Average duration: 90 seconds in
              the corridor. Outgoing team leader mentions one or two
              operational items. Three open quality investigations — none
              mentioned. Incoming team leader unaware of all three.
            hint: >
              The handover captures operational continuity but drops
              management continuity. Escalated issues and open investigations
              require a structured format with a physical or digital record.
            teaches: [leader_standard_work, shift_handover, information_transfer, escalation]
            score_feed: RCA
          - text: "Check whether the operator handover protocol from Tier 1 is being followed"
            outcome: PLAUSIBLE
            tool: observe
            evidence: null
            hint: >
              The operator handover improvement is working — the quality
              cluster occurs at the team leader level, not the operator
              level. The gap is one tier up.
            teaches: [leader_standard_work, tiered_accountability]
          - text: "Add a quality check step at the start of each shift to catch the escape pattern"
            outcome: WRONG
            evidence: null
            hint: >
              Adding an inspection step treats the symptom. The escapes
              are caused by information not transferring — that information
              needs to reach the incoming team leader before the shift
              starts, not be caught after the fact.
            teaches: [leader_standard_work, root_cause_analysis]

  - id: T2-015
    name: "The Unfinished Root Cause"
    category: Quality
    waste: defects
    severity: medium
    visibility: subtle
    zone_id: z2
    station_id: coil_winding
    symptoms:
      - "5 Whys worksheets are on file — but most stop at Why 2 or Why 3"
      - "Root cause conclusions are superficial: 'material inconsistency', 'operator inattention'"
      - "Problems that were 'root-cause resolved' reappear in a new form within 4 weeks"
    root_cause: >
      5 Whys analysis is practiced but poorly executed. Without
      facilitation or training, investigations stop at the first
      plausible cause and never reach systemic contributors. The
      technique is present in name only — its purpose (a systemic
      root cause) is not being fulfilled.
    effective_countermeasures:
      - 5 Whys Analysis
      - Ishikawa / Fishbone Diagrams
      - A3 Thinking / A3 Reporting
    maturity_prerequisite: null
    mismatch_note: >
      Mandating 5 Whys without training on what a systemic root cause
      looks like produces worksheets with five questions where Why 3
      repeats Why 2 in different words.
    side_effect_ref: null
    effect_modifiers:
      quality_delta: -0.07
      perf_delta: -0.05
    teaches:
      - 5_whys
      - root_cause_depth
      - structured_problem_solving
      - systemic_vs_symptomatic
      - countermeasure_quality
    dialogue:
      investigation:
        npc: "Quality Lead"
        prompt: >
          We've been doing 5 Whys at this station for six months.
          But the same problems keep coming back. What's wrong
          with the analysis?
        choices:
          - text: "Take the most recently 'resolved' problem and check whether the stated root cause actually changed anything in the process"
            outcome: CORRECT
            tool: docs
            evidence: >
              Pulled the last three 5 Whys sheets. Problem A concluded
              'operator inattention' — standard work unchanged after the
              investigation. Problem B concluded 'material batch variation'
              — supplier qualification unchanged. Both problems reappeared
              within 3 weeks.
            hint: >
              A root cause is only a root cause if removing it prevents
              recurrence. If nothing in the process changed, the root
              cause was not real — it was a plausible answer that stopped
              the questioning.
            teaches: [5_whys, root_cause_depth, countermeasure_quality, structured_problem_solving]
            score_feed: RCA
          - text: "Review the last 5 Whys document and count whether it has five questions"
            outcome: PLAUSIBLE
            tool: count
            evidence: >
              The latest worksheet has five questions. Why 4 and Why 5
              are: 'Because of material variation (again)' and 'Because
              material quality is inconsistent'. Circular.
            hint: >
              Five whys on the form does not mean five whys in practice.
              Circular answers reveal the analysis stopped thinking at
              Why 2 and filled in remaining lines to satisfy the format.
            teaches: [5_whys, root_cause_depth, analysis_quality]
          - text: "Purchase a 5 Whys software tool to guide the team through the process"
            outcome: WRONG
            evidence: null
            hint: >
              A software template produces the same answers in a different
              box. The constraint is the thinking, not the format.
            teaches: [5_whys, structured_problem_solving, tool_vs_thinking]
      five_whys:
        - why: >
            The last three 5 Whys analyses stopped before reaching a
            systemic root cause. Why do investigations stop at a
            symptomatic answer?
          choices:
            - text: "Investigators accept the first answer that feels complete — there is no criterion for when to keep asking"
              outcome: CORRECT
              tool: ask
              evidence: >
                Spoke with two facilitators. Both described stopping when
                'it felt like we found the cause'. Neither had been trained
                on what a systemic root cause looks like vs a symptomatic one.
              hint: >
                'It feels like the cause' is not a stopping criterion. A
                real criterion is: 'Would removing this cause prevent all
                future occurrences?' Until that test passes, keep asking.
              teaches: [5_whys, root_cause_depth, systemic_vs_symptomatic, analysis_quality]
              score_feed: RCA
            - text: "The investigation is stopped by a manager who wants a quick resolution"
              outcome: PLAUSIBLE
              tool: observe
              evidence: null
              hint: >
