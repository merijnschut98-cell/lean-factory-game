          - text: "Speak directly with 3–5 operators: 'Have you ever had an idea for improvement that wasn't implemented?'"
            outcome: CORRECT
            tool: machine
            evidence: >
              Five operators. Five separate improvement ideas — layout,
              tool positioning, material sequence, temperature check
              sequence, and a safety improvement. All raised informally.
              None progressed. None received a response.
            hint: >
              The ideas exist. The engagement exists. What's missing is
