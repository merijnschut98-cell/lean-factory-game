# Tier 2 Problem Catalog — 15 hand-designed problems
#
# Tier 2 problems surface management-layer and cultural gaps that become
# visible after Tier 1 foundations (5S, Standard Work, Quality Gates) are
# established. They are systemic rather than acute — harder to see, harder
# to fix, and harder to sustain once fixed.
#
# Schema: identical to problems_tier1.yaml
# Fields: id, name, category, severity, visibility, zone_id, station_id
#         symptoms, root_cause, effective_countermeasures, maturity_prerequisite
#         mismatch_note, side_effect_ref, effect_modifiers
#         teaches (list), dialogue (investigation fork + optional five_whys)

problems:

  - id: T2-001
    name: "The Invisible Andon"
    category: Quality
    waste: waiting
    severity: high
    visibility: subtle
    zone_id: z4
    station_id: integration_3
    symptoms:
      - "Quality stoppages last 15–25 minutes before the team leader notices"
      - "Operators wait silently when a defect appears — no alert mechanism exists"
      - "Availability at Integration 3 is lower than cycle time data alone explains"
    root_cause: >
      No Andon signal system exists at Integration 3. When an operator
      detects a quality issue they stop work and wait for a team leader
      to notice — there is no alert. Response lag accumulates directly
      as lost availability.
    effective_countermeasures:
      - Andon Systems
      - Daily Management System
      - Visual Labels and Signs
    maturity_prerequisite: null
    mismatch_note: >
      Installing an Andon light without a defined response protocol
      (who responds, in what timeframe, with what authority) creates
      alert fatigue within days. The light gets ignored.
    side_effect_ref: null
    effect_modifiers:
      avail_delta: -0.08
      quality_delta: -0.05
    teaches:
      - andon
      - jidoka
      - quick_response
      - visual_management
      - alert_fatigue
    dialogue:
      investigation:
        npc: "Quality Lead"
        prompt: >
          Availability at Integration 3 is lower than I can explain from
          cycle time data alone. What should we look at first?
        choices:
          - text: "Time how long it takes for a quality stop to be noticed and responded to"
            outcome: CORRECT
            tool: time
            evidence: >
              Observed three stoppages. Average time from operator stopping
              to team leader arriving: 18 minutes. No signal was ever
              triggered — the operator simply waited.
            hint: >
              Measuring the response gap gives you an undeniable number.
              18 minutes of silent waiting per quality event is waste you
              can see and fix. This is the availability loss made visible.
            teaches: [andon, quick_response, availability, gemba]
            score_feed: RCA
          - text: "Check if there is a documented quality stop procedure at this station"
            outcome: PLAUSIBLE
            tool: docs
            evidence: >
              The station file has a general 'stop and report' instruction
              from product launch — but no contact, no signal, no response
              time expectation.
            hint: >
              The procedure exists — but without a signal mechanism,
              operators have no way to call for help without leaving their
              station. The how is missing, not just the what.
            teaches: [standard_work, andon]
          - text: "Increase quality inspection frequency at the station"
            outcome: WRONG
            evidence: null
            hint: >
              More inspections catch defects — but they don't reduce the
              response lag when the operator stops. The waste is the
              waiting time, not the detection gap.
            teaches: [quality_gate]
      five_whys:
        - why: >
            Quality stoppages last an average of 18 minutes before any
            response. Why does it take 18 minutes for a team leader to arrive?
          choices:
            - text: "There is no signal mechanism — the operator has no way to alert anyone without leaving their post"
              outcome: CORRECT
              tool: observe
              evidence: >
                Operator confirmed: 'I stop the line and wait. There's no
                light, no button, nothing. I just hope someone walks by.'
              hint: >
                The operator is not passive — they simply have no tool.
                This is a systems failure, not a behaviour problem.
              teaches: [andon, jidoka, operator_support]
              score_feed: RCA
            - text: "The team leader is usually occupied with another station during this time"
              outcome: PLAUSIBLE
              tool: observe
              evidence: null
              hint: >
                Team leader occupancy contributes — but even with a better
                schedule, an 18-minute wait is only explained by the absence
                of an alert mechanism.
              teaches: [leader_standard_work, quick_response]
            - text: "Operators don't want to draw attention to problems on their station"
              outcome: WRONG
              evidence: null
              hint: >
                Cultural factors matter — but this operator actively wants
                help and has no way to get it. The barrier is structural,
                not psychological.
              teaches: [psychological_safety]
        - why: >
            There is no signal mechanism at Integration 3.
            Why has no Andon system been installed here?
          choices:
            - text: "The station was skipped during the Visual Management rollout and the deferral was never revisited"
              outcome: CORRECT
              tool: docs
              evidence: >
                Visual management rollout records show Integration 3 was
                deferred 'pending workload assessment' two years ago.
                The assessment never happened.
              hint: >
                A deferred rollout that is never revisited becomes a
                permanent gap. The correct follow-up action is the one
                that never came.
              teaches: [visual_management, change_management, PDCA]
              score_feed: RCA
            - text: "The team leader decided an Andon system was not needed at this station"
              outcome: PLAUSIBLE
              tool: observe
              evidence: null
              hint: >
                A team leader may have made that judgment — but without
                a formal decision record, it is not a policy, it is an
                omission.
              teaches: [leader_standard_work, visual_management]
            - text: "Andon systems are expensive and require specialist installation"
              outcome: WRONG
              evidence: null
              hint: >
                Modern Andon systems range from a pull-cord to a tablet
                app. Cost is not the barrier — visibility of the gap is.
              teaches: [andon, cost_vs_value]

  - id: T2-002
    name: "The Missing Huddle"
    category: Management
    waste: waiting
    severity: medium
    visibility: subtle
    zone_id: z5
    station_id: burn_in
    symptoms:
      - "Shift starts with 20–30 minutes of self-directed coordination overhead"
      - "Priorities vary between operators on the same station in the same shift"
      - "Defects from the previous shift are re-discovered mid-shift rather than at handover"
    root_cause: >
      No daily start-of-shift team meeting exists. Information about
      the previous shift's issues, today's targets, and ongoing quality
      concerns is passed ad-hoc or not at all. Each shift re-discovers
      context the previous shift already knew.
    effective_countermeasures:
      - Daily Management System
      - Team Leader Routines
    maturity_prerequisite: null
    mismatch_note: >
      Installing performance boards without a daily review cadence
      creates boards that are updated but never actioned — decoration
      rather than a management tool.
    side_effect_ref: null
    effect_modifiers:
      perf_delta: -0.06
      quality_delta: -0.04
    teaches:
      - daily_management
      - huddle
      - tier_meetings
      - information_flow
      - shift_coordination
    dialogue:
      investigation:
        npc: "Team Leader"
        prompt: >
          Burn-in output is uneven between shifts — same station, same
          operators, different results. What's driving the variation?
        choices:
          - text: "Observe the first 20 minutes of two consecutive shifts back to back"
            outcome: CORRECT
            tool: observe
            evidence: >
              Morning shift: team leader briefs the crew for 4 minutes,
              priorities are clear, first unit enters burn-in within
              10 minutes. Night shift: team leader arrives at their desk,
              operators debate which units to run, start 26 minutes late.
            hint: >
              The delta is in the start. One shift has a ritual that aligns
              the team; the other doesn't. The fix is not technical —
              it is behavioural and structural.
            teaches: [daily_management, huddle, leader_standard_work, gemba]
            score_feed: RCA
          - text: "Compare the technical skill levels of operators across shifts"
            outcome: PLAUSIBLE
            tool: observe
            evidence: null
            hint: >
              Skill differences exist — but the same operators on the
              structured shift outperform the same operators on the
              unstructured one. The method is the variable, not the people.
            teaches: [cross_training, standard_work]
          - text: "Check whether the burn-in equipment is calibrated consistently"
            outcome: WRONG
            evidence: null
            hint: >
              Equipment calibration matters — but it would show up as a
              systematic bias, not a shift-dependent variation. The pattern
              points to the management layer.
            teaches: [equipment_management, TPM]

  - id: T2-003
    name: "The Lone Expert"
    category: People
    waste: skills
    severity: high
    visibility: subtle
    zone_id: z5
    station_id: flight_test
    symptoms:
      - "Flight test output drops sharply on certain shifts"
      - "Units queue at flight test when one specific operator is absent"
      - "Other operators decline or cannot perform the calibration steps alone"
    root_cause: >
      Flight test calibration knowledge is held by a single operator.
      No documentation of the calibration procedure exists; no other
      operator has been trained. When this person is absent, the station
      loses most of its capacity.
    effective_countermeasures:
      - Cross-Training Programs
      - Standard Work Definition
    maturity_prerequisite: null
    mismatch_note: >
      Cross-training without a documented standard to train against
      produces inconsistent results — each trainee learns a slightly
      different version, reintroducing the variation the training
      was meant to eliminate.
    side_effect_ref: null
    effect_modifiers:
      avail_delta: -0.15
    teaches:
      - cross_training
      - knowledge_transfer
      - single_point_failure
      - operator_flexibility
      - tacit_knowledge
    dialogue:
      investigation:
        npc: "HR Manager"
        prompt: >
          Flight test has a coverage risk I want to understand better.
          Where should we start?
        choices:
          - text: "Map which tasks at flight test only one person can currently perform"
            outcome: CORRECT
            tool: data
            evidence: >
              Skill matrix for flight test: calibration setup can only be
              performed by one operator. Seven others are rated 'untrained'
              or 'not assessed' for that task.
            hint: >
              The skill matrix makes the exposure visible. One task, one
              person, zero backup — a single-point-failure waiting to
              activate. Based on the attendance data, it already has.
            teaches: [cross_training, skill_matrix, single_point_failure, knowledge_transfer]
            score_feed: RCA
          - text: "Ask the expert operator to write down their calibration process"
            outcome: PLAUSIBLE
            tool: ask
            evidence: null
            hint: >
              A written process helps — but asking one person to self-document
              without structure often produces an incomplete result. Map the
              gap first, then build the documentation.
            teaches: [standard_work, tacit_knowledge, documentation]
          - text: "Hire a second flight test specialist from outside"
            outcome: WRONG
            evidence: null
            hint: >
              External hire takes months and is expensive. The knowledge
              already exists in your plant — it just isn't shared yet.
            teaches: [cross_training, make_vs_buy]
      five_whys:
        - why: >
            Only one operator can perform flight test calibration.
            Why has no one else been trained in this task?
          choices:
            - text: "There is no documented calibration procedure — nothing to train against"
              outcome: CORRECT
              tool: machine
              evidence: >
                Checked the station file and training records. No calibration
                procedure document exists. The expert learned by doing and
                has never written it down.
              hint: >
                You cannot train to an undocumented standard. The knowledge
                exists as tacit expertise — it cannot be transferred until
                it is made explicit.
              teaches: [tacit_knowledge, standard_work, documentation]
              score_feed: RCA
            - text: "Cross-training has been planned but not scheduled due to production pressure"
              outcome: PLAUSIBLE
              tool: docs
              evidence: null
              hint: >
                Production pressure is real — but even if training time
                existed, there is no procedure to train against. The
                constraint is documentation, not time.
              teaches: [cross_training, production_vs_improvement]
            - text: "Other operators are not interested in learning calibration"
              outcome: WRONG
              evidence: null
              hint: >
                Three operators said they would train if material existed.
                Motivation is not the constraint.
              teaches: [cross_training, psychological_safety]
        - why: >
            No calibration procedure document exists.
            Why has this task never been documented?
          choices:
            - text: >
                The calibration was developed by the founding technician and
                passed down verbally — it was never treated as a formal work
                instruction
              outcome: CORRECT
              tool: machine
              evidence: >
                HR record confirms: the current expert was trained by the
                original technician through side-by-side working. That
                technician retired three years ago.
              hint: >
                Tacit knowledge handed down through direct apprenticeship
                disappears when the chain breaks. Standard work converts
                personal technique into organisational knowledge.
              teaches: [tacit_knowledge, standard_work, knowledge_transfer, operator_variation]
              score_feed: RCA
            - text: "The calibration procedure is in a system that only one engineer can access"
              outcome: PLAUSIBLE
              tool: machine
              evidence: null
              hint: >
                Access restrictions matter — but no document was found in
                any system. The issue is creation, not access.
              teaches: [documentation, version_control]
            - text: "The process is too complex to document without specialist support"
              outcome: WRONG
              evidence: null
              hint: >
                Complexity is a reason to document carefully, not a reason
                to skip it. If it is too complex to document, it is too
                complex to rely on a single person for.
              teaches: [standard_work, documentation]
  
  - id: T2-004
    name: "Blind Management"
    category: Management
    waste: waiting
    severity: medium
    visibility: hidden
    zone_id: z1
    station_id: incoming_qa
    symptoms:
      - "Management decisions reference week-old report data while floor state has changed"
      - "Problems raised on the floor this week first appear in management conversation next week"
      - "Team leaders improvise on decisions that should involve engineering or management"
    root_cause: >
      No scheduled gemba walk routine exists for supervisors or managers.
      Leadership operates from reports and second-hand information rather
      than direct observation, creating a lag between floor reality and
      decision-making.
    effective_countermeasures:
      - Gemba Walks
      - Leader Standard Work
    maturity_prerequisite: null
    mismatch_note: >
      Conducting gemba walks without standard observation criteria
      produces tours rather than improvement activity — the same walk
      every week that confirms existing assumptions without challenging them.
    side_effect_ref: null
    effect_modifiers:
      perf_delta: -0.05
      quality_delta: -0.05
    teaches:
      - gemba
      - direct_observation
      - leader_standard_work
      - management_information_lag
      - go_see
    dialogue:
      investigation:
        npc: "Team Leader"
        prompt: >
          I keep getting pulled into decisions I shouldn't be making.
          What's the underlying issue?
        choices:
          - text: "Track when management last physically visited the production floor and what they observed"
            outcome: CORRECT
            tool: ask
            evidence: >
              Asked four team leaders and two supervisors. Last documented
              floor visit by any supervisor: 11 days ago, unplanned, for
              a visitor tour. No structured observation in the past month.
            hint: >
              The data shows management is absent from the floor as a
              routine. Decisions are being made from a distance with
              information that is already stale.
            teaches: [gemba, leader_standard_work, direct_observation, go_see]
            score_feed: RCA
          - text: "Review the weekly KPI report to find where the decision lag is worst"
            outcome: PLAUSIBLE
            tool: docs
            evidence: null
            hint: >
              The KPI report is the system that's creating the lag. You
              can't discover the floor reality gap by reading the document
              that is causing it.
            teaches: [gemba, direct_observation]
          - text: "Add a daily management summary email to keep leadership informed"
            outcome: WRONG
            evidence: null
            hint: >
              More reports create more reading, not more insight. The gap
              is between floor reality and what reports describe — only
              physical presence closes that gap.
            teaches: [gemba, go_see, information_vs_knowledge]

  - id: T2-005
    name: "The Blame Game"
    category: People
    waste: skills
    severity: high
    visibility: hidden
    zone_id: z4
    station_id: integration_5
    symptoms:
      - "Formal defect log has not received an operator-submitted entry in three weeks"
      - "Quality Lead believes the defect rate is understated — rework pile does not match the official log"
      - "Operators are evasive when asked about problems they have noticed"
    root_cause: >
      A blame culture has developed. Operators who report problems have
      experienced negative consequences — questioning, implicit blame,
      extra scrutiny. Near-misses and small defects go unreported to
      avoid this. The defect rate in formal systems is significantly
      understated.
    effective_countermeasures:
      - Psychological Safety Routines
      - Daily Management System
      - Problem Escalation Protocols
    maturity_prerequisite: null
    mismatch_note: >
      Launching a 'report problems' campaign without addressing the blame
      dynamic first produces a brief spike in reports followed by a return
      to silence. Trust cannot be mandated.
    side_effect_ref: null
    effect_modifiers:
      quality_delta: -0.10
    teaches:
      - psychological_safety
      - blameless_culture
      - near_miss_reporting
      - quality_culture
      - hidden_factory
    dialogue:
      investigation:
        npc: "Quality Lead"
        prompt: >
          The rework pile at Integration 5 does not match the official
          defect log. Someone is not reporting. What's the right approach?
        choices:
          - text: "Have private, informal conversations with 2–3 operators about what happens when they notice a problem"
            outcome: CORRECT
            tool: ask
            evidence: >
              Three separate operators, independently, described being
              questioned and blamed after their last report. One said:
              'I stopped writing things down. It's not worth it.'
            hint: >
              Direct, private conversation reveals what no report ever
              will. The operators are telling you there is a trust problem
              — and that is more important than any individual defect count.
            teaches: [psychological_safety, blameless_culture, near_miss_reporting, hidden_factory]
            score_feed: RCA
          - text: "Review the formal defect log and compare it to the rework record"
            outcome: PLAUSIBLE
            tool: defects
            evidence: >
              The discrepancy is confirmed: 47 rework events in the
              physical record vs 12 in the formal log over the same period.
            hint: >
              The numbers confirm something is wrong — but they don't
              explain why. You need to speak with the people involved to
              understand what is preventing reporting.
            teaches: [hidden_factory, quality_data]
          - text: "Launch an anonymous reporting system so operators can report without being identified"
            outcome: WRONG
            evidence: null
            hint: >
              Anonymous systems treat the symptom. Operators know who
              is near each defect — anonymity rarely feels truly safe in
              a small team. The fix is cultural, not technical.
            teaches: [psychological_safety, trust]
      five_whys:
        - why: >
            Operators are not reporting near-misses and small defects.
            Why are operators choosing not to report?
          choices:
            - text: "They have experienced blame or negative consequences when reporting in the past"
              outcome: CORRECT
              tool: docs
              evidence: >
                All three operators described an incident where a report
                led to an escalation that felt punitive rather than
                exploratory.
              hint: >
                Behaviour follows consequence. If the last time someone
                reported a problem they got scrutinised, they will stop
                reporting. This is rational behaviour in a broken system.
              teaches: [psychological_safety, blameless_culture, feedback_loops]
              score_feed: RCA
            - text: "Operators do not understand that small defects need to be reported"
              outcome: PLAUSIBLE
              tool: defects
              evidence: null
              hint: >
                Operators clearly understand — they described the specific
                defects they decided not to report. Knowledge is not the
                constraint.
              teaches: [near_miss_reporting, quality_culture]
            - text: "The reporting system is too time-consuming to use"
              outcome: WRONG
              evidence: null
              hint: >
                Process friction reduces reporting — but operators described
                skipping the system entirely, not struggling with it.
                The barrier is trust, not usability.
              teaches: [process_design, psychological_safety]
        - why: >
            Past reporting has led to blame and negative consequences.
            Why do problems get handled punitively rather than analytically?
          choices:
            - text: "There is no formal blameless investigation process — each incident is handled differently by whoever is nearby"
              outcome: CORRECT
              tool: defects
              evidence: >
                Reviewed five past incident records. No structured format.
                Operator names appear prominently next to defect descriptions
                in four of the five.
              hint: >
                Without a blameless investigation protocol, the response
                to a problem is whoever's instinct is active that day.
                Consistency requires a structured process.
              teaches: [blameless_culture, investigation_process, psychological_safety]
              score_feed: RCA
            - text: "Management has explicitly told supervisors to identify who made the mistake"
              outcome: PLAUSIBLE
              tool: observe
              evidence: null
              hint: >
                Management tone matters — but the records show inconsistency,
                not a uniform directive. The absence of a standard process
                is what creates the problem.
              teaches: [leader_standard_work, blameless_culture]
            - text: "Operators in this zone have a difficult interpersonal history"
              outcome: WRONG
              evidence: null
              hint: >
                Team dynamics affect culture — but the investigators in
                these incidents were supervisors, not peers. The structure
                of the response process is the root cause.
              teaches: [psychological_safety, blameless_culture]
  
  - id: T2-006
    name: "The KPI Graveyard Board"
    category: Management
    waste: overprocessing
    severity: medium
    visibility: obvious
    zone_id: z3
    station_id: propulsion_build
    symptoms:
      - "Performance board on the wall shows data that is 18 days old"
      - "The action log on the board has the same three items that have been there for weeks"
      - "No one references the board during team conversations"
    root_cause: >
      The performance board was installed without establishing ownership
      or an update routine. No one is accountable for keeping it current
      and no daily review ritual exists. The board is decoration rather
      than a management tool.
    effective_countermeasures:
      - Performance Management Boards
      - Daily Management System
    maturity_prerequisite: null
    mismatch_note: >
      Installing a digital KPI dashboard before establishing a daily
      review habit produces a more expensive version of the same
      ignored board.
    side_effect_ref: null
    effect_modifiers:
      perf_delta: -0.05
    teaches:
      - visual_management
      - KPI_ownership
      - daily_management
      - accountability
      - management_systems
    dialogue:
      investigation:
        npc: "Team Leader"
        prompt: >
          That performance board has been on the wall for eight months.
          But I don't think it's actually helping anyone. What's wrong
          with it?
        choices:
          - text: "Find out when the board was last updated and who is responsible for updating it"
            outcome: CORRECT
            tool: ask
            evidence: >
              Last update: 18 days ago by a visiting quality engineer
              during audit preparation. There is no designated owner.
              The team leader thought it was 'a quality department thing'.
            hint: >
              A tool with no owner has no future. The board is not failing
              because of the data — it is failing because no one's job
              it is. Ownership and cadence come before content.
            teaches: [visual_management, accountability, KPI_ownership, daily_management]
            score_feed: RCA
          - text: "Update the board right now with today's numbers"
            outcome: PLAUSIBLE
            tool: machine
            evidence: null
            hint: >
              Updating it solves today's problem — but in three days it
              will be stale again without a routine. A one-time update
              is a symptom treatment.
            teaches: [daily_management, accountability]
          - text: "Replace the physical board with a digital screen connected to the MES"
            outcome: WRONG
            evidence: null
            hint: >
              Technology can automate the data — but the management ritual
              of reviewing and acting on it is a human behaviour. A digital
              screen of ignored data is still ignored data.
            teaches: [digitalization, daily_management, tool_vs_system]

  - id: T2-007
    name: "The Escalation Vacuum"
    category: Management
    waste: defects
    severity: medium
    visibility: subtle
    zone_id: z2
    station_id: pcb_prep
    symptoms:
      - "The same solder mask defect type has appeared in the problem log 9 times in 12 weeks"
      - "Each entry is marked 'handled' with no detail and no recurrence prevention"
      - "Process engineers are unaware of the recurring issue"
    root_cause: >
      No escalation protocol defines when a problem moves beyond the
      team leader tier. Problems that exceed team leader authority to
      fix are marked 'handled' locally and recur. There is no trigger
      that moves a recurring issue to a higher problem-solving tier.
    effective_countermeasures:
      - Problem Escalation Protocols
      - Daily Management System
    maturity_prerequisite: null
    mismatch_note: >
      Creating an escalation path without training team leaders on when
      to use it produces under-escalation for complex technical issues
      and over-escalation for trivial ones.
    side_effect_ref: null
    effect_modifiers:
      quality_delta: -0.07
      perf_delta: -0.06
    teaches:
      - escalation
      - tiered_accountability
      - problem_ownership
      - chronic_vs_acute
      - daily_management
    dialogue:
      investigation:
        npc: "Quality Lead"
        prompt: >
          This solder mask issue keeps coming back. Nine times in 12
          weeks — each marked 'handled'. What's actually happening?
        choices:
          - text: "Trace the full history of the solder mask defect — what was done each of the nine times?"
            outcome: CORRECT
            tool: ask
            evidence: >
              Reviewed all nine entries. Six were 'sort and rework'.
              Two were 'spoke to operator'. One was 'checked material
              batch'. None of the actions changed the underlying process.
              No entry was ever escalated above team leader level.
            hint: >
              Nine treatments, zero root cause investigations. The pattern
              reveals a structural problem: team leaders have no rule
              telling them when this becomes someone else's problem too.
            teaches: [escalation, tiered_accountability, PDCA, chronic_vs_acute, problem_ownership]
            score_feed: RCA
          - text: "Ask the team leader what they tried each time"
            outcome: PLAUSIBLE
            tool: ask
            evidence: >
              Team leader described each action accurately. 'I just didn't
              know I was supposed to get someone else involved.'
            hint: >
              The team leader is being honest and competent within their
              understanding of their role. The gap is in the rules,
              not the person.
            teaches: [escalation, leader_standard_work]
          - text: "Escalate directly to the Plant Manager to resolve the solder mask defect"
            outcome: WRONG
            evidence: null
            hint: >
              Bypassing the escalation tiers creates a different problem:
              if every team leader issue reaches the top, the Plant Manager
              becomes the only person who can resolve things. Structured
              escalation — not top-down escalation — is the fix.
            teaches: [escalation, tiered_accountability]

  - id: T2-008
    name: "The Reactive Loop"
    category: Quality
    waste: defects
    severity: high
    visibility: subtle
    zone_id: z4
    station_id: integration_3
    symptoms:
      - "OEE at Integration 3 improves after each countermeasure, then regresses within 2 weeks"
      - "The same defect type re-emerges in a slightly different form each cycle"
      - "Previous countermeasures are on record as 'applied' but no follow-up exists"
    root_cause: >
      Countermeasures are applied (Plan, Do) but never verified or
      standardized (Check, Act). Without a defined check phase, teams
      cannot confirm whether a fix held — and without standardization,
      improvements degrade over time. The improvement loop has only
      two phases running.
    effective_countermeasures:
      - PDCA Cycles
      - A3 Thinking / A3 Reporting
    maturity_prerequisite: null
    mismatch_note: >
      Applying A3 as a documentation exercise after the fact rather
      than as a thinking discipline produces reports that describe what
      happened rather than driving what happens next.
    side_effect_ref: null
    effect_modifiers:
      quality_delta: -0.09
      perf_delta: -0.07
    teaches:
      - PDCA
      - check_act
      - A3
      - structured_problem_solving
      - sustain
      - standardize
    dialogue:
      investigation:
        npc: "Quality Lead"
        prompt: >
          Look at this trend chart — Integration 3 quality improves,
          holds for two weeks, then falls back. Every time. What is
          the pattern telling us?
        choices:
          - text: "Find the most recent countermeasure that fixed the problem and trace what happened in the two weeks after it was applied"
            outcome: CORRECT
            tool: count
            evidence: >
              Last applied CM: Basic Quality Gates, Day 47. Review of
              the following 14 days shows no inspection records, no
              follow-up conversation, no updated standard work. The CM
              was applied and then forgotten.
            hint: >
              The improvement is real — but without a defined Check phase,
              you will never know if the fix is holding or degrading.
              The two-week drop is unmonitored decay showing up.
            teaches: [PDCA, check_act, follow_up, standardize, A3]
            score_feed: RCA
          - text: "Identify which countermeasure is causing the regression"
            outcome: PLAUSIBLE
            tool: data
            evidence: null
            hint: >
              A CM causing regression is possible — but the pattern here
              is improvement followed by slow decay, not a step-change
              drop. That pattern points to sustain failure, not CM
              side-effects.
            teaches: [PDCA, CM_decay, sustain]
          - text: "Apply a stronger countermeasure with a higher effectiveness multiplier"
            outcome: WRONG
            evidence: null
            hint: >
              A stronger CM applied to an un-maintained process decays
              at the same rate. You are trying to outrun a structural gap
              with increasing force — it will not hold.
            teaches: [PDCA, root_cause_analysis, standardize]
      five_whys:
        - why: >
            The most recent countermeasure showed no follow-up activity
            in the 14 days after application. Why is the Check phase
            not happening?
          choices:
            - text: "There is no defined follow-up step in the countermeasure process — once applied, it is considered done"
              outcome: CORRECT
              tool: docs
              evidence: >
                Reviewed 12 CM application records. None have a scheduled
                review date. The apply action has a timestamp; the outcome
                field is empty in all 12 cases.
              hint: >
                The system has a gap at the Check step. It is not that
                people forget to check — the check was never designed in.
                PDCA without Check is just PD.
              teaches: [PDCA, check_act, process_design, structured_problem_solving]
              score_feed: RCA
            - text: "Team leaders are too busy to schedule follow-up reviews"
              outcome: PLAUSIBLE
              tool: docs
              evidence: null
              hint: >
                Capacity is a real constraint — but no one designed a check
                step. Even if time existed, no one would know what to check
                or when.
              teaches: [PDCA, leader_standard_work, process_design]
            - text: "The applied CMs have already solved the root cause — the regression is coincidence"
              outcome: WRONG
              evidence: null
              hint: >
                Six consecutive regressions in the same station with the
                same pattern is not coincidence. The hypothesis needs a
                Check phase to test it.
              teaches: [PDCA, data_driven, hypothesis_testing]
        - why: >
            No follow-up step was ever designed into the countermeasure
            process. Why was the Check phase never built in?
          choices:
            - text: >
                The CM process was designed for speed — Plan and Do were
                prioritised because they show visible action; Check and
                Act were seen as overhead
              outcome: CORRECT
              tool: machine
              evidence: >
                Reviewed the original CM rollout documentation. Explicitly
                states: 'apply and observe'. No review cadence defined.
                The observation step was intended but never specified.
              hint: >
                'Apply and observe' is not Check. Observation without a
                standard, a frequency, and an owner is not a process —
                it is wishful thinking.
              teaches: [PDCA, structured_problem_solving, process_design, check_act]
              score_feed: RCA
            - text: "The team responsible was not trained in PDCA"
              outcome: PLAUSIBLE
              tool: docs
              evidence: null
              hint: >
                Training gaps contribute — but the documentation shows
                intent to observe without the structure to do so. The gap
                is in execution design, not awareness.
              teaches: [PDCA, training, process_design]
            - text: "PDCA Check phases require specialist quality engineer time that was not budgeted"
              outcome: WRONG
              evidence: null
              hint: >
                PDCA Check is a team leader and operator activity — not
                specialist work. A structured 5-minute review after 3 days
                is sufficient and requires no external resource.
              teaches: [PDCA, leader_standard_work, check_act]
  
  - id: T2-009
    name: "Nobody Asked Us"
    category: People
    waste: skills
    severity: medium
    visibility: hidden
    zone_id: z3
    station_id: propulsion_build
    symptoms:
