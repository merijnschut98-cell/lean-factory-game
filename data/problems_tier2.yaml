      - "Team engagement surveys show low scores on 'my ideas are heard'"
      - "Improvement ideas raised to team leaders are absorbed without action or feedback"
    root_cause: >
      No formal suggestion system exists. Operator improvement ideas
      are absorbed by the team leader tier with no tracking, no
      evaluation process, and no feedback loop. Ideas disappear —
      and after a few attempts, operators stop offering them.
    effective_countermeasures:
      - Suggestion Systems
      - Psychological Safety Routines
    maturity_prerequisite: null
    mismatch_note: >
      Launching a suggestion system with no commitment to response
      time or implementation rate produces a suggestion box that fills
      with paper and teaches operators their ideas are still ignored.
    side_effect_ref: null
    effect_modifiers:
      perf_delta: -0.04
    teaches:
      - suggestion_system
      - operator_involvement
      - improvement_ownership
      - kaizen_mindset
      - employee_engagement
    dialogue:
